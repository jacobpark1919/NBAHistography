  {date:'1996-03-18',imp:2,cat:'milestone',desc:`Chicago’s Michael Jordan scores 38 points and becomes the 10th NBA player to reach 24,000 career points, as the visiting Bulls defeat Philadelphia 98-94.`,source:'nba.com/history'},
  {date:'1998-03-18',imp:2,cat:'milestone',desc:`Clyde Drexler announced that he will retire following the conclusion of the 1997-98 season after agreeing to become the men’s head basketball coach at the University of Houston.`,source:'nba.com/history'},
  {date:'2001-03-18',imp:2,cat:'milestone',desc:`Reggie Miller of the Indiana Pacers became the first NBA player to convert 2,000 3-point field goals when he sank a trey in the third quarter of Indiana’s 101-95 victory over the Sacramento Kings. The 3-point field goal was introduced into the NBA for the 1979-80 season.`,source:'nba.com/history'},
  {date:'2001-03-18',imp:2,cat:'milestone',desc:`Jerry Sloan of the Utah Jazz coached his 1,000th game as head coach of the Jazz, becoming only the sixth coach in NBA history to coach 1,000 games with the same team. Sloan joined Hall of Famers Red Auerbach and Red Holzman as well as Gene Shue, John MacLeod and Al Attles.`,source:'nba.com/history'},
  {date:'2019-03-18',imp:2,cat:'milestone',desc:`Dirk Nowitzki sinks one of his trademark fadeaway jumpers in the first quarter, allowing him to pass Wilt Chamberlain for sixth on the NBA’s all-time scoring list. At the time, Nowitzki’s 31,424 career points trailed only Kareem Abdul-Jabbar, Karl Malone, Kobe Bryant, LeBron James and Michael Jordan.`,source:'nba.com/history'},
  {date:'2021-03-18',imp:2,cat:'milestone',desc:`Timberwolves rookie Anthony Edwards scores 42 points in a 123-119 win against the Phoenix Suns. At 19 years and 226 days old, Edwards becomes the third-youngest player in NBA history to score 40 or more in a game, trailing only LeBron James and Kevin Durant.`,source:'nba.com/history'},
  {date:'1950-03-19',imp:2,cat:'milestone',desc:`The Rochester Royals closed out the 1949-50 season with their 15th consecutive win, 97-66 over the Baltimore Bullets, setting an NBA record for the most consecutive games won at the end of a season. The record lasted nearly 70 years until the Philadelphia 76ers broke the mark with 16 straight wins (March 15 to April 11, 2018) to end the 2017-18 season.`,source:'nba.com/history'},
  {date:'1956-03-19',imp:2,cat:'milestone',desc:`The Minneapolis Lakers beat the St. Louis Hawks 133-75 in Game 2 of the Western Division Finals, the largest margin of victory (58 points) in NBA Playoff history.`,source:'nba.com/history'},
  {date:'1967-03-19',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the Philadelphia 76ers made all 16 of his field goal attempts against Baltimore. It followed by less than one month Chamberlain’s NBA record 18-for-18 performance against Baltimore on February 24.`,source:'nba.com/history'},
  {date:'1967-03-19',imp:2,cat:'milestone',desc:`The Chicago Bulls defeated the Los Angeles Lakers 122-109 for their 33rd win of the season, the most ever by an NBA expansion team. Chicago coach Johnny “Red” Kerr was later named NBA Coach of the Year in recognition of the Bulls’ achievement.`,source:'nba.com/history'},
  {date:'1969-03-19',imp:2,cat:'milestone',desc:`NBA Commissioner Walter Kennedy flipped a coin, Phoenix called ‘heads’ and it turned up ‘tails’. Thus, Milwaukee chose first in the NBA Draft, selecting Lew Alcindor (now Kareem Abdul-Jabbar) while Phoenix picked Neal Walk.`,source:'nba.com/history'},
  {date:'1972-03-19',imp:2,cat:'milestone',desc:`The Los Angeles Lakers defeated Golden State in what was then the most lopsided victory in NBA history, 162-99, at the Forum. That 63-point margin lasted as a record for nearly 19 years, until Cleveland beat Miami by 68 points, 148-80, on December 17, 1991.`,source:'nba.com/history'},
  {date:'1991-03-19',imp:2,cat:'milestone',desc:`New York guard Maurice Cheeks handed out six assists in the Knicks’ 97-79 win over Charlotte to become only the fifth guard in NBA history to reach the 7,000 assist mark for his career, joining Magic Johnson, Oscar Robertson, Lenny Wilkens and Isiah Thomas.`,source:'nba.com/history'},
  {date:'1994-03-19',imp:2,cat:'milestone',desc:`Dale Ellis of San Antonio connected on a pair of 3-point field goals during the Spurs’ 107-100 win over visiting Sacramento, becoming the first player in NBA history to reach 1,000 career 3-pointers made.`,source:'nba.com/history'},
  {date:'1995-03-19',imp:2,cat:'milestone',desc:`Michael Jordan came out of his 17-month retirement and played in his first NBA game for Chicago since Game 6 of the 1993 Finals against Phoenix. In front of a charged up crowd at Indiana’s Market Square Arena, Jordan scored 19 points in 43 minutes but the host Pacers downed the Bulls in overtime 103-96. The game was televised on NBC and drew a 10.9 national rating and an estimated 35 million viewers, making it the most watched regular season game in NBA history.`,source:'nba.com/history'},
  {date:'1996-03-19',imp:2,cat:'milestone',desc:`Orlando’s Dennis Scott set a then-single-season record for 3-pointers made when he sank his 218th, breaking John Starks’ record. He finished the season hitting 267 3-point field goals.`,source:'nba.com/history'},
  {date:'1997-03-19',imp:2,cat:'milestone',desc:`Utah’s John Stockton has one steal in the Jazz’ 113-100 win over the Celtics, becoming the first player in NBA history to record 2,500 career steals.`,source:'nba.com/history'},
  {date:'1998-03-19',imp:2,cat:'milestone',desc:`Indiana’s Mark Jackson moved past Maurice Cheeks (7,392) for fifth place on the all-time assist list in a 95-91 win at Washington.`,source:'nba.com/history'},
  {date:'2002-03-19',imp:2,cat:'milestone',desc:`Karl Malone of the Utah Jazz became the third player in NBA history to log 50,000 career minutes, passing Elvin Hayes (50,000), and behind only Kareem Abdul-Jabbar (57,446).`,source:'nba.com/history'},
  {date:'2015-03-19',imp:2,cat:'milestone',desc:`James Harden of the Houston Rockets scores 50 points in a 118-108 win over the Denver Nuggets.`,source:'nba.com/history'},
  {date:'2022-03-19',imp:2,cat:'milestone',desc:`LeBron James scores off a backdoor cut with 5:20 left in the second quarter against Washington. In doing so, James scores the 36,929th point of his career and pass Karl Malone for No. 2 on the NBA’s all-time scoring list.`,source:'nba.com/history'},
  {date:'1968-03-20',imp:2,cat:'milestone',desc:`Dave Bing of the Detroit Pistons finished the season with a league leading 27.1 ppg average, becoming the first guard in 20 years to lead the NBA in scoring.`,source:'nba.com/history'},
  {date:'1968-03-20',imp:2,cat:'milestone',desc:`Wilt Chamberlain of Philadelphia became the first center in NBA history to lead the league in assists with a total of 702 for an average of 8.6 apg. Chamberlain called leading the league in assists one of the top achievements of his career.`,source:'nba.com/history'},
  {date:'1976-03-20',imp:2,cat:'milestone',desc:`John Havlicek of the Boston Celtics became the first NBA player to score more than 1,000 points per season for 14 consecutive years.`,source:'nba.com/history'},
  {date:'1984-03-20',imp:2,cat:'milestone',desc:`Indiana’s Butch Carter set an NBA record by scoring 14 points in an overtime period as the Pacers beat Boston 123-121.`,source:'nba.com/history'},
  {date:'1990-03-20',imp:2,cat:'milestone',desc:`The Los Angeles Lakers retired Kareem Abdul-Jabbar’s No. 33 in honor of the NBA’s all-time leading scorer.`,source:'nba.com/history'},
  {date:'1997-03-20',imp:2,cat:'milestone',desc:`The Denver Nuggets (16) and Seattle SuperSonics (13) combine to make 29 3-point field goals, a record for two teams in one game. Seattle posted a 123-97 victory.`,source:'nba.com/history'},
  {date:'1998-03-20',imp:2,cat:'milestone',desc:`Karl Malone moved past Elvin Hayes (27,313) for fifth place on the NBA’s all-time scoring list.`,source:'nba.com/history'},
  {date:'2020-03-20',imp:2,cat:'milestone',desc:`Jerry Sloan, the coach who took the Utah Jazz to the NBA Finals in 1997 and 1998 on his way to a spot in the Hall of Fame, dies at 78. Sloan spent 23 seasons coaching the Jazz and they finished below .500 in only one of those years. Sloan won 1,221 games in his career, which was the fourth-highest total in NBA history at the time of his passing. Sloan was a former player for the Chicago Bulls from 1966-76 and his jersey hangs in the rafters of the United Center.`,source:'nba.com/history'},
  {date:'1953-03-21',imp:2,cat:'milestone',desc:`Bob Cousy scored 50 points (25 of which were in overtime play) as the Celtics outlasted Syracuse 111-105 in four overtimes to eliminate the Nationals in the Eastern Division Semifinals. Cousy’s 30 free throws made was an NBA playoff record.`,source:'nba.com/history'},
  {date:'1999-03-21',imp:2,cat:'milestone',desc:`Utah’s Karl Malone reaches 40,771 career minutes played and passes Bill Russell (40,726) for ninth place on the NBA’s all-time charts.`,source:'nba.com/history'},
  {date:'2014-03-21',imp:2,cat:'milestone',desc:`Kevin Durant of the Oklahoma City Thunder scores 51 points in a 119-118 win over the Toronto Raptors.`,source:'nba.com/history'},
  {date:'2021-03-21',imp:2,cat:'milestone',desc:`Suns guard Chris Paul throws a perfect alley-oop pass to Deandre Ayton for his 10,000th career assist, becoming the sixth player in NBA history to reach that feat. The other players to do so: John Stockton, Jason Kidd, Steve Nash, Mark Jackson and Magic Johnson — all of whom, save for Jackson — are Hall of Famers.`,source:'nba.com/history'},
  {date:'1960-03-22',imp:2,cat:'milestone',desc:`The Philadelphia Warriors defeated the Celtics in Boston 128-107 in Game 5 of the Eastern Division Finals, a game which featured an NBA Playoff record 169 rebounds by both teams.`,source:'nba.com/history'},
  {date:'1991-03-22',imp:2,cat:'milestone',desc:`Phoenix guard Kevin Johnson was honored by President George Bush as the 411th “Daily Point of Light” in recognition of Johnson’s work in helping the youth of his hometown of Sacramento, CA.`,source:'nba.com/history'},
  {date:'1994-03-22',imp:2,cat:'milestone',desc:`Philadelphia’s Moses Malone moved past Elvin Hayes into third place on the NBA’s all-time scoring list with 27,314 points, after hitting a third-quarter foul shot in the 76ers’ 125-91 loss at Charlotte.`,source:'nba.com/history'},
  {date:'1995-03-22',imp:2,cat:'milestone',desc:`During Atlanta’s 98-84 home loss to Miami, Hawks coach Lenny Wilkens participated in his 2,737th career NBA game as a player or coach (both regular season and playoff games), passing Don Nelson as the all-time leader in game appearances. Wilkens concluded the 1994-95 season with 2,756 career NBA games as a player or coach.`,source:'nba.com/history'},
  {date:'2000-03-22',imp:2,cat:'milestone',desc:`The Phoenix Suns’ Jason Kidd is lost for the remainder of the regular season after breaking his ankle in a 114-93 triumph over Sacramento at America West Arena. The following day the Suns announced that Kevin Johnson was coming out of retirement to help his former team in its time of need. Johnson, 34, whose career average of 9.2 apg ranks fourth in NBA history, had not played since the 1997-98 season.`,source:'nba.com/history'},
  {date:'2021-03-22',imp:2,cat:'milestone',desc:`Elgin Baylor, the Lakers’ 11-time NBA All-Star who soared through the 1960s with a high-scoring style of basketball that became the model for the modern player, died at 86. Baylor played a major role in revolutionizing basketball from a ground-bound sport into an aerial show. He spent parts of 14 seasons with the Lakers in Minneapolis and Los Angeles during his Hall of Fame career, teaming with Jerry West throughout the ’60s in one of the most potent tandems in basketball history.`,source:'nba.com/history'},
  {date:'2019-03-22',imp:2,cat:'milestone',desc:`Rockets star James Harden scores 61 points to help Houston rally from a 19-point deficit in a 111-105 win against the San Antonio Spurs. Harden scored 27 points in the first quarter, passed the 30-point mark in the second quarter, the 40-point mark with 9 minutes left in the third en route to his monster game. His 61-point game was his second of 2018-19 and he joined Michael Jordan, Kobe Bryant and Wilt Chamberlain as the only players with multiple 60-point games in a season.`,source:'nba.com/history'},
  {date:'1955-03-23',imp:2,cat:'milestone',desc:`Moses Malone is born in Petersburg, Virginia.`,source:'nba.com/history'},
  {date:'1979-03-23',imp:2,cat:'milestone',desc:`The Philadelphia 76ers and the New Jersey Nets replayed the final 17:50 of their contest that was originally played on November 8, 1978. Harvey Catchings and Ralph Simpson played for the 76ers and Eric Money and Al Skinner played for the Nets when the game began, but were traded to the opposing teams by the time the game was resumed. It’s the only time in the history of professional sports that any player played for both teams in the same game.`,source:'nba.com/history'},
  {date:'1992-03-23',imp:2,cat:'milestone',desc:`Atlanta rookie Stacey Augmon scored 32 points to lead the Hawks to a 126-125 overtime win over Golden State at the Omni, and his layup at 7:41 of the second quarter accounted for the 6,000,000th point in NBA history.`,source:'nba.com/history'},
  {date:'1994-03-23',imp:2,cat:'milestone',desc:`Isiah Thomas of Detroit became the fourth guard in NBA history to collect 9,000 career assists, after dishing off for six during the Pistons’ 111-107 home win over the Los Angeles Clippers.`,source:'nba.com/history'},
  {date:'1999-03-23',imp:2,cat:'milestone',desc:`Dick Enroth, the voice of the Minneapolis Lakers, died of cancer at the age of 80. Dubbed the “fastest-talking sportscaster in the Twin Cities,” Enroth captured the success of George Mikan’s Lakers who won NBA championships in 1950, 1952, 1953 and 1954.`,source:'nba.com/history'},
  {date:'1999-03-23',imp:2,cat:'milestone',desc:`The Miami Heat, in an 84-81 loss at the Utah Jazz, connect on at least one 3-pointer for the 400th consecutive game.`,source:'nba.com/history'},
  {date:'2001-03-23',imp:2,cat:'milestone',desc:`The Toronto Raptors recorded an NBA-record 23 blocked shots in a 112-86 win over the Atlanta Hawks, surpassing the 22 blocks achieved by New Jersey against Denver on December 12, 1991. Raptors’ forward Keon Clark had a team-high 12 blocked shots.`,source:'nba.com/history'},
  {date:'2012-03-23',imp:2,cat:'milestone',desc:`Kevin Love of the Minnesota Timberwolves scores 51 points in a 149-140 loss to the Oklahoma City Thunder.`,source:'nba.com/history'},
  {date:'2020-03-23',imp:2,cat:'milestone',desc:`The International Olympic Committee postpones the 2020 Olympics in Tokyo for a year.`,source:'nba.com/history'},
  {date:'1969-03-24',imp:2,cat:'milestone',desc:`Baltimore’s Wes Unseld became only the second rookie ever — Wilt Chamberlain was the other in 1960 — to be named the season’s MVP. Unseld, also named NBA Rookie of the Year, led the Bullets into the playoffs, averaging 13.8 ppg and 18.2 rpg.`,source:'nba.com/history'},
  {date:'1969-03-24',imp:2,cat:'milestone',desc:`Elvin Hayes of San Diego became the first rookie since Wilt Chamberlain in 1959-60 to lead the league in scoring, with 2,327 points for a 28.4 average.`,source:'nba.com/history'},
  {date:'1970-03-24',imp:2,cat:'milestone',desc:`Jerry West of the Los Angeles Lakers won his first and only scoring title, accumulating 2,309 points in 74 games for a 31.2 ppg average.`,source:'nba.com/history'},
  {date:'1973-03-24',imp:2,cat:'milestone',desc:`Kansas City-Omaha’s Nate “Tiny” Archibald became the only player in NBA history to lead the league in scoring (34.0 ppg) and assists (11.4 apg) in the same season.`,source:'nba.com/history'},
  {date:'1979-03-24',imp:2,cat:'milestone',desc:`Lloyd Neal’s No. 36 becomes the first uniform retired by the Portland Trail Blazers.`,source:'nba.com/history'},
  {date:'1981-03-24',imp:2,cat:'milestone',desc:`New York Knicks great Dave DeBusschere’s No. 22 was retired in ceremonies at Madison Square Garden.`,source:'nba.com/history'},
  {date:'1996-03-24',imp:2,cat:'milestone',desc:`Toronto’s Damon Stoudamire sets a then NBA rookie record for 3-pointers made in a season with 126 (breaking Dennis Scott’s record of 125), after sinking six shots from behind the arc against Chicago during the Raptors’ 109-108 victory in front of 36,131 fans at SkyDome. Stoudamire finished the season with 133.`,source:'nba.com/history'},
  {date:'1999-03-24',imp:2,cat:'milestone',desc:`The Seattle SuperSonics retired the No. 10 jersey of Nate McMillan in ceremonies at KeyArena.`,source:'nba.com/history'},
  {date:'2001-03-24',imp:2,cat:'milestone',desc:`Karl Malone of the Utah Jazz swished a free throw with 10:48 remaining in the third quarter of Utah’s 119-93 win over the Washington Wizards at the Delta Center in Salt Lake City. The free throw enabled Karl Malone to pass Moses Malone and become the NBA’s all-time leader in free throws made with 8,532.`,source:'nba.com/history'},
  {date:'2002-03-24',imp:2,cat:'milestone',desc:`The 2002 NBA D-League Playoffs began when the North Charleston Lowgators hosted the Mobile Revelers at the North Charleston Coliseum. Mobile won the first D-League Playoff game 78-75.`,source:'nba.com/history'},
  {date:'2017-03-24',imp:2,cat:'milestone',desc:`Devin Booker of the Phoenix Suns scores 70 points in a 130-120 loss to the Boston Celtics. He shot 21-for-40 overall and was 24-for-26 on free throws and he scored 51 points in the second half as Phoenix tried to rally from a 26-point hole.`,source:'nba.com/history'},
  {date:'1973-03-25',imp:2,cat:'milestone',desc:`The Philadelphia 76ers posted the worst mark in NBA history at 9-73 with Roy Rubin (4-47) and Kevin Loughery (5-26) splitting the coaching chores.`,source:'nba.com/history'},
  {date:'1975-03-25',imp:2,cat:'milestone',desc:`Golden State collected a then NBA record 25 steals in a 139-122 win over the Los Angeles Lakers at the Oakland Coliseum. The Warriors would tie their own record in a game against San Antonio February 15, 1989. Both Warriors teams were supplanted in the record book when Seattle garnered 27 steals against Toronto on January 15, 1997.`,source:'nba.com/history'},
  {date:'1978-03-25',imp:2,cat:'milestone',desc:`After defeating Buffalo 112-106 at home, the Phoenix Suns set an NBA record for steals in a season with 1,059.`,source:'nba.com/history'},
  {date:'2012-03-25',imp:2,cat:'milestone',desc:`The Atlanta Hawks defeat the Utah Jazz 139-133 in the first quadruple-overtime game in the NBA since the Phoenix Suns 140-139 win over the Portland Trail Blazers in 1997.`,source:'nba.com/history'},
  {date:'1972-03-26',imp:2,cat:'milestone',desc:`The Los Angeles Lakers beat Seattle 124-98 to finish the season at 69-13 (.841), at the time the best record in NBA history. More than 24 years later, the Chicago Bulls posted a 72-10 season (.878) in the 1995-96 season to break the record. That mark was then supplanted by the Golden State Warriors in 2015-16 when they went 73-9 (.890).`,source:'nba.com/history'},
  {date:'1974-03-26',imp:2,cat:'milestone',desc:`Rick Barry of the Golden State Warriors scored 64 points in a 143-120 victory over Portland at home. At the time only Wilt Chamberlain and Elgin Baylor had ever scored more points in an NBA game.`,source:'nba.com/history'},
  {date:'1993-03-26',imp:2,cat:'milestone',desc:`A group of 22 investors purchased the San Antonio Spurs from Red McCombs for $75 million.`,source:'nba.com/history'},
  {date:'1994-03-26',imp:2,cat:'milestone',desc:`After notching a pair of steals during Utah’s 98-83 setback at Houston, John Stockton became just the second player in NBA history (along with Maurice Cheeks) to collect 2,000 career steals.`,source:'nba.com/history'},
  {date:'1996-03-26',imp:2,cat:'milestone',desc:`Phoenix’s A.C. Green plays in his 800th consecutive NBA game — the third-longest streak in NBA history — scoring seven points and grabbing nine rebounds during the Suns’ 102-98 win over visiting Sacramento.`,source:'nba.com/history'},
  {date:'1996-03-26',imp:2,cat:'milestone',desc:`Seattle’s Gary Payton become the ninth player in NBA history to record 2,000 career steals. Payton reached the mark in a triumph over the Jazz.`,source:'nba.com/history'},
  {date:'1994-03-27',imp:2,cat:'milestone',desc:`Magic Johnson returned to the Los Angeles Lakers as head coach and led them to a 110-101 victory over Milwaukee. Johnson coached the Lakers for the last 16 games of the 1993-94 season, posting a 5-11 record.`,source:'nba.com/history'},
  {date:'1994-03-27',imp:2,cat:'milestone',desc:`Moses Malone of Philadelphia moved past Elvin Hayes into third place on the NBA’s all-time games played list, with 1,304, during the 76ers’ 124-122 OT loss against Boston at Hartford.`,source:'nba.com/history'},
  {date:'1998-03-27',imp:2,cat:'milestone',desc:`An NBA record 62,046 fans witnessed Chicago’s 89-74 win over Atlanta in the Georgia Dome.`,source:'nba.com/history'},
  {date:'1998-03-27',imp:2,cat:'milestone',desc:`Karl Malone tied Moses Malone (27,409) for fourth place on the all-time scoring list.`,source:'nba.com/history'},
  {date:'1998-03-27',imp:2,cat:'milestone',desc:`Orlando’s Chuck Daly recorded his 600th career NBA victory with a 100-75 win over Houston.`,source:'nba.com/history'},
  {date:'1999-03-27',imp:2,cat:'milestone',desc:`Utah’s Karl Malone and John Stockton are both held under 10 points in a game against the Los Angeles Clippers. This marks the first time since November 21, 1987 that both Malone and Stockton did not reach double figures in scoring in the same game.`,source:'nba.com/history'},
  {date:'2001-03-27',imp:2,cat:'milestone',desc:`Alonzo Mourning of the Miami Heat returned to action after missing the first 69 games of the season after being diagnosed with the kidney ailment focal glomerulosclerosis. Mourning recorded nine points and seven rebounds in 18 minutes of playing time.`,source:'nba.com/history'},
  {date:'2015-03-27',imp:2,cat:'milestone',desc:`Longtime voice of the Utah Jazz and former two-time All-Star Hot Rod Hundley dies at 80. Hundley was a Hall of Fame broadcaster who followed the Jazz from their inception in 1974 in New Orleans through 35 seasons before retiring from that post in 2009.`,source:'nba.com/history'},
  {date:'2021-03-27',imp:2,cat:'milestone',desc:`Spurs coach Gregg Popovich guides San Antonio to a 120-104 win against the Chicago Bulls to secure career win No. 1,300. In doing so, he joined Hall of Fame coaches Don Nelson (1,335 wins) and Lenny Wilkins (1,332) as the only ones in NBA history with 1,300 or more career wins.`,source:'nba.com/history'},
  {date:'1944-03-28',imp:2,cat:'milestone',desc:`Rick Barry was born in Elizabeth, New Jersey.`,source:'nba.com/history'},
  {date:'1973-03-28',imp:2,cat:'milestone',desc:`Wilt Chamberlain’s then NBA record streak of 1,045 games without disqualification ended with his retirement. In a career spanning 14 seasons, Chamberlain did not foul out of a single game. Moses Malone, who fouled out of only five games in his NBA career, later had a string of 1,212 games without fouling out.`,source:'nba.com/history'},
  {date:'1982-03-28',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar became the 15th man in NBA history to play in 1,000 regular season games, as the Los Angeles Lakers defeated the host Kansas City Kings 109-96.`,source:'nba.com/history'},
  {date:'1987-03-28',imp:2,cat:'milestone',desc:`Dallas coach Dick Motta became the third coach in NBA history to reach 800 victories as his Mavericks defeated the Washington Bullets 114-107 at Capital Centre.`,source:'nba.com/history'},
  {date:'1990-03-28',imp:2,cat:'milestone',desc:`Chicago’s Michael Jordan scored a regular season career-high 69 points, during the Bulls’ 117-113 road win at Cleveland.`,source:'nba.com/history'},
  {date:'1995-03-28',imp:2,cat:'milestone',desc:`Boston’s Dominique Wilkins scored 19 points in a 126-115 win at Miami, moving past Jerry West and into eighth place on the NBA’s all-time scoring list with 25,207 points.`,source:'nba.com/history'},
  {date:'2006-03-28',imp:2,cat:'milestone',desc:`The Milwaukee Bucks set a then NBA single-game record for most 3-pointers in one quarter. They hit 11 in the third quarter against the Phoenix Suns.`,source:'nba.com/history'},
  {date:'2018-03-28',imp:2,cat:'milestone',desc:`Against the Charlotte Hornets, LeBron James scores in double-figures for the 866th straight game. In doing so, he ties Michael Jordan for the longest such streak in NBA history.`,source:'nba.com/history'},
  {date:'2018-03-28',imp:2,cat:'milestone',desc:`On a layup with 20 seconds left in the game, Charlotte’s Kemba Walker scores to pass Dell Curry as the franchise’s all-time leading scorer. Curry had scored 9,839 points in his career, which Walker surpassed with the layup to give him 9,841 points.`,source:'nba.com/history'},
  {date:'2018-03-28',imp:2,cat:'milestone',desc:`Minnesota Timberwolves center Karl-Anthony Towns scores a team-record 56 points in a 126-114 home win against the Atlanta Hawks. He shot 19 of 32 from the field and 12 of 15 from the free throw line, dropping in 30 points and 11 rebounds in the second half.`,source:'nba.com/history'},
  {date:'1952-03-29',imp:2,cat:'milestone',desc:`Minneapolis center George Mikan scored a then NBA playoff record 47 points against the Rochester Royals in Game 1 of the Western Division Finals, but the Lakers were defeated 88-78.`,source:'nba.com/history'},
  {date:'1960-03-29',imp:2,cat:'milestone',desc:`Boston Celtics standout Bill Russell hauled down an NBA Finals record 40 rebounds as the Celtics lost to St. Louis 113-103. On April 18, 1962, Russell matched his 40-rebound effort in a Game 7 overtime win against the Los Angeles Lakers that gave Boston the 1962 NBA championship.`,source:'nba.com/history'},
  {date:'1962-03-29',imp:2,cat:'milestone',desc:`Elgin Baylor (45) and Jerry West (41) of the Lakers became the first teammates to both score 40 or more points in a Playoff game as the Lakers lost to Detroit 118-117 in a Western Division Finals game.`,source:'nba.com/history'},
  {date:'1990-03-29',imp:2,cat:'milestone',desc:`Houston’s Hakeem Olajuwon became just the third NBA player (along with Nate Thurmond and Alvin Robertson) to record a quadruple-double, with 18 points, 16 rebounds, 10 assists and 11 blocks in the Rockets’ 120-94 win over Milwaukee. Four years later, David Robinson became the fourth NBA player to record a quadruple-double.`,source:'nba.com/history'},
  {date:'1996-03-29',imp:2,cat:'milestone',desc:`Utah beat Vancouver 105-91, increasing the Grizzlies’ record losing streak to 20. Vancouver would extend its losing streak to an NBA record 23 games. The 23-game losing streak would be tied by the Denver Nuggets during the 1997-98 season.`,source:'nba.com/history'},
  {date:'1998-03-29',imp:2,cat:'milestone',desc:`Indiana scored an NBA record-low 55 points (since the introduction of the 24-second shot clock) in a 74-55 loss to San Antonio. On April 10, 1999, the Chicago Bulls scored 49 points against Miami to set a new record low.`,source:'nba.com/history'},
  {date:'2017-03-29',imp:2,cat:'milestone',desc:`Russell Westbrook of the Oklahoma City Thunder scores 57 points in a 114-106 win over the Orlando Magic.`,source:'nba.com/history'},
  {date:'2021-03-29',imp:2,cat:'milestone',desc:`In just his 38th career game as a member of the Wizards, Washington’s Russell Westbrook finishes with 35 points, 14 rebounds and a career-best 21 assists to give him his 16th triple-double with the team, breaking the record set by Darrell Walker. In addition, Westbrook’s 30-20-10 triple-double is the NBA’s first such triple-double since Magic Johnson recorded on in 1988 against the Philadelphia 76ers.`,source:'nba.com/history'},
  {date:'1976-03-30',imp:2,cat:'milestone',desc:`Paul Silas of the Boston Celtics joined Bill Russell and Bill Bridges as the third player in NBA history to collect 10,000 rebounds before scoring 10,000 points.`,source:'nba.com/history'},
  {date:'1979-03-30',imp:2,cat:'milestone',desc:`Robert Parish of Golden State became the first Warrior in 10 years (since Nate Thurmond) to get at least 30 points and 30 rebounds in a game. Parish scored 30 points and hauled down 32 boards as the host Warriors defeated New York 114-98.`,source:'nba.com/history'},
  {date:'1980-03-30',imp:2,cat:'milestone',desc:`San Antonio’s George Gervin becomes the fifth player to win at least three consecutive scoring titles, joining George Mikan, Neil Johnston, Wilt Chamberlain and Bob McAdoo. Michael Jordan would later join that select circle.`,source:'nba.com/history'},
  {date:'1986-03-30',imp:2,cat:'milestone',desc:`The Boston Celtics tied an NBA record by beating New Jersey 122-117 for Boston’s 27th consecutive home court victory, matching the single-season mark set by the Minneapolis Lakers in 1950. The Celtics eventually extended their record streak to 38 games, over two seasons, before losing to Washington in Hartford on Dec. 2, 1986.`,source:'nba.com/history'},
  {date:'1995-03-30',imp:2,cat:'milestone',desc:`Chicago beat Boston 100-82 to win the first of an NBA record 44 consecutive home games (over two seasons) before losing to Charlotte 98-97 on April 8, 1996.`,source:'nba.com/history'},
  {date:'2000-03-30',imp:2,cat:'milestone',desc:`The United Nations Drug Control Program (UNDCP) and the NBA teamed up to produce an anti-drug public service announcement featuring Sacramento Kings center Vlade Divac. The NBA Store hosted a special press conference featuring Divac on two-way video to announce his participation as the United Nations Drug Control Program Goodwill Ambassador for Sports Against Drugs.`,source:'nba.com/history'},
  {date:'2000-03-30',imp:2,cat:'milestone',desc:`NBA.com launched NBA.com/UK, a special online section customized for basketball fans in the United Kingdom. NBA.com/UK features information relevant to UK fans, including television listings for NBA games and shows on ITV and TNT, local event information, features and statistics. Fans are also be able to participate in interactive activities such as special player chats and mailboxes.`,source:'nba.com/history'},
  {date:'2000-03-30',imp:2,cat:'milestone',desc:`The NBA/National Basketball Players Association (NBPA) Prohibited Substances Committee adds Androstenedione (Andro), along with eight additional substances, to the list of steroids banned by the NBA/NBPA Anti-Drug Agreement. The Committee, jointly appointed by the NBA and NBPA, includes three experts in the field of illegal and performance enhancing drugs. The steroids added by the Committee to the list of Prohibited Substances are as follows: Androstenedione, Dehydroepiandrosterone (DHEA), Fluoxymesterone, Methyltestosterone, Nandrolone, Oxandrolone, Oxymetholone, Stanozolol and Testosterone.`,source:'nba.com/history'},
  {date:'2001-03-30',imp:2,cat:'milestone',desc:`The Philadelphia 76ers retired the No. 34 in honor of Charles Barkley, who played eight seasons for the Sixers from 1984 to 1992. Barkley became the seventh player in 76ers’ history to have his number retired.`,source:'nba.com/history'},
  {date:'2001-03-30',imp:2,cat:'milestone',desc:`John Stockton of the Utah Jazz played in the 1,330th game of his NBA career, a 95-88 win over Cleveland, and moved into third place all-time in NBA games played. Stockton trailed only Robert Parish (1,611 games) and Kareem Abdul-Jabbar (1,560).`,source:'nba.com/history'},
  {date:'2008-03-30',imp:2,cat:'milestone',desc:`Boston limits the Miami Heat to just 17 field goals in an 88-62 win. That total is the lowest in an NBA game since the advent of the shot clock in 1954.`,source:'nba.com/history'},
  {date:'2012-03-30',imp:2,cat:'milestone',desc:`Deron Williams of the New Jersey Nets dished out 20 assists in a 102-101 win over the Golden State Warriors.`,source:'nba.com/history'},
  {date:'1982-03-31',imp:2,cat:'milestone',desc:`The NBA and the Players Association reached a four-year agreement that included a revenue-sharing plan, the first of its kind in team sports. Players received 53 percent of revenues starting the 1984-85 season in return for minimum and maximum payrolls.`,source:'nba.com/history'},
  {date:'1992-03-31',imp:2,cat:'milestone',desc:`Phoenix coach Cotton Fitzsimmons guided the Suns to a 128-111 home win over Portland, becoming the sixth coach in NBA history to chalk up 800 career wins.`,source:'nba.com/history'},
  {date:'1996-03-31',imp:2,cat:'milestone',desc:`After defeating the visiting Phoenix Suns 97-83, the San Antonio Spurs become the 11th NBA team to go unbeaten over a month, with a 16-0 mark in March. The Spurs tied the 1971-72 Lakers (who were 16-0 in December of 1971) for the winningest month ever by an NBA team.`,source:'nba.com/history'},
  {date:'2000-03-31',imp:2,cat:'milestone',desc:`The NBA announced the NBA Legends Tour, which featured a star-studded team of former NBA players that traveled to China for a series of games against the Sydney Olympics-bound Chinese Men’s National Basketball team. Three international exhibition games were staged August 11, 14 and 17 in Beijing, Guangzhou and Shanghai, respectively, against the Chinese Men’s National Basketball team.`,source:'nba.com/history'},
  {date:'2022-03-31',imp:2,cat:'milestone',desc:`Chicago’s DeMar DeRozan scores 50 points in an overtime win against the LA Clippers. In doing so, he became the 14th different player to reach the half-century mark this season, setting a new NBA record. He was also the seventh different player to go for at least 50 in the month of March alone, setting a new single-month league record as well. Overall, there were nine instances in which a player scored 50 points in March, 2022, with the feats being accomplished by: DeRozan, LeBron James, Jayson Tatum, Kyrie Irving, Kevin Durant, Karl-Anthony Towns and Saddiq Bey.`,source:'nba.com/history'},
  {date:'1963-05-01',imp:2,cat:'milestone',desc:`J. Walter Kennedy was named the NBA’s second President, succeeding Maurice Podoloff. The job title was later changed to Commissioner.`,source:'nba.com/history'},
  {date:'1970-05-01',imp:2,cat:'milestone',desc:`The Los Angeles Lakers outscored New York 22-16 in the highest scoring overtime in NBA Playoff history, defeating the Knicks 121-115 in Game 4 of the Finals.`,source:'nba.com/history'},
  {date:'1980-05-01',imp:2,cat:'milestone',desc:`Dallas is granted an expansion franchise, and the Mavericks bring the total number of NBA teams to 23.`,source:'nba.com/history'},
  {date:'1988-05-01',imp:2,cat:'milestone',desc:`Michael Jordan of Chicago became the first player to score 50 or more points in consecutive playoff games when he drilled Cleveland for 55 points in Chicago’s 106-101 victory in Game 2 of their Eastern Conference first round series. In Game 1 on April 28, Jordan scored 50 points in Chicago’s 104-93 victory.`,source:'nba.com/history'},
  {date:'1999-05-01',imp:2,cat:'milestone',desc:`NBA referee Tommy Nunez, a 27-year veteran referee in the NBA, is presented with The Gold Whistle Award during halftime of the Phoenix Suns home game against the Vancouver Grizzlies. The award is presented annually to an official recognized for community involvement, achievement in officiating and a reputation of strong integrity and ethics.`,source:'nba.com/history'},
  {date:'2001-05-01',imp:2,cat:'milestone',desc:`Harold “Happy” Hairston, a key member of the Los Angeles Lakers’ 1972 NBA championship team that posted a 69-13 record and an 11-year NBA veteran, died in Los Angeles at age 58.`,source:'nba.com/history'},
  {date:'2017-05-02',imp:2,cat:'milestone',desc:`Isaiah Thomas of the Boston Celtics scores 53 points in a 129-119 playoff win over the Washington Wizards.`,source:'nba.com/history'},
  {date:'1968-05-02',imp:2,cat:'milestone',desc:`Bill Russell won his first NBA title as player-coach of the Celtics when Boston defeated the host Los Angeles Lakers 124-109 in Game 6 of the NBA Finals.`,source:'nba.com/history'},
  {date:'2005-05-02',imp:2,cat:'milestone',desc:`The NBA fines Houston Rockets coach Jeff Van Gundy $100,000 — the largest amount ever for a coach — a day after accusing officials of targeting center Yao Ming during the Playoffs.`,source:'nba.com/history'},
  {date:'2014-05-02',imp:2,cat:'milestone',desc:`Portland star Damian Lillard his a 3-pointer with :00.9 left in Game 6 to give the Trail Blazers a 99-98 series-clinching win against the Houston Rockets.`,source:'nba.com/history'},
  {date:'2015-05-02',imp:2,cat:'milestone',desc:`Chris Paul’s fallaway floater with 1 second left gives the LA Clippers a series-clinching 111-109 win against the defending-champion San Antonio Spurs in Game 7 of the first round.`,source:'nba.com/history'},
  {date:'2017-05-02',imp:2,cat:'milestone',desc:`Isaiah Thomas of the Boston Celtics scores 53 points in a 129-119 playoff win over the Washington Wizards. The showing comes on what would have been his Chyna Thomas’ 23rd birthday. She was killed in a single-car accident just two weeks earlier on April 15, 2017.`,source:'nba.com/history'},
  {date:'2023-05-02',imp:2,cat:'milestone',desc:`Philadelphia 76ers center Joel Embiid finishes ahead of Denver Nuggets center Nikola Jokic in the Kia MVP balloting to collect his first career MVP. Jokic was aiming to become the fourth player with three consecutive MVPs (the first since Larry Bird 1983-86). Embiid becomes the first Sixers player to collect MVP honors since Allen Iverson in 2000-01 and the fifth player in team history to do so (Iverson, Wilt Chamberlain, Julius Erving and Moses Malone are the others).`,source:'nba.com/history'},
  {date:'1968-05-03',imp:2,cat:'milestone',desc:`It is announced that the St. Louis Hawks would move to Atlanta for the 1968-69 season, under the guidance of new owners Tom Cousins and former Georgia Governor Carl Sanders.`,source:'nba.com/history'},
  {date:'1974-05-03',imp:2,cat:'milestone',desc:`“Pistol” Pete Maravich was obtained by the expansion New Orleans Jazz from Atlanta in exchange for first-round draft picks in 1974 and 1975, second-round picks in 1975 and 1976, and the Jazz’ second and third selections in the expansion draft.`,source:'nba.com/history'},
  {date:'1981-05-03',imp:2,cat:'milestone',desc:`The Boston Celtics wiped out a double-digit deficit in the second half for the third straight time and defeated Philadelphia 91-90 in Game 7 of a memorable Eastern Conference Finals series.`,source:'nba.com/history'},
  {date:'1987-05-03',imp:2,cat:'milestone',desc:`Milwaukee beat Philadelphia 102-89 in the deciding Game 5 of their Eastern Conference First Round series, the last game of Julius Erving’s illustrious 16-year professional basketball career in the NBA and ABA. Dr. J led the Sixers with 24 points.`,source:'nba.com/history'},
  {date:'1994-05-03',imp:2,cat:'milestone',desc:`Golden State’s Chris Webber, who became the first rookie in NBA history to total over 1,000 points (1,333), 500 rebounds (694), 250 assists (272), 150 blocks (164) and 75 steals (93), was named the NBA Rookie of the Year.`,source:'nba.com/history'},
  {date:'2005-05-03',imp:2,cat:'milestone',desc:`Bryant Jackson, the “Chair Throwing Fan” from the Detroit Pistons – Indiana Pacers altercation, is sentenced to two years of probation and ordered to consult with an anger-management therapist.`,source:'nba.com/history'},
  {date:'2007-05-03',imp:2,cat:'milestone',desc:`Behind the play of Baron Davis and others, the Golden State Warriors make history in a 111-86 win in Game 6 of their first round series against the Dallas Mavericks. The Warriors won the series, 4-2, becoming the first No. 8 seed to beat a No. 1 seed in the best-of-seven playoff format.`,source:'nba.com/history'},
  {date:'2011-05-03',imp:2,cat:'milestone',desc:`Rising Chicago Bulls superstar Derrick Rose wins the regular season MVP award at the age of 22 years old. He becomes the youngest player in history to receive the award after collecting 113 out of 120 possible first-place votes.`,source:'nba.com/history'},
  {date:'2021-05-03',imp:2,cat:'milestone',desc:`Wizards guard Russell Westbrook registers 21 rebounds and 21 points in a 154-141 win against the Indiana Pacers. In doing so, he joins Wilt Chamberlain and himself (in 2019) as the only players in NBA history to collect more than 20 rebounds and 20 assists in the same game.`,source:'nba.com/history'},
  {date:'2021-05-03',imp:2,cat:'milestone',desc:`Blazers forward Carmelo Anthony nails a jumper against the Atlanta Hawks to give him 27,314 career points and become the No. 10 all-time scorer in NBA history. Anthony passed Hall of Famer Elvin Hayes, who previously held the mark with 27,313 points.`,source:'nba.com/history'},
  {date:'1968-05-04',imp:2,cat:'milestone',desc:`The Pittsburgh Pipers won the first ABA title with a 122-113 win over New Orleans.`,source:'nba.com/history'},
  {date:'1970-05-04',imp:2,cat:'milestone',desc:`The New York Knicks, with Dave DeBusschere forced to play center against Wilt Chamberlain after a leg injury sidelined Willis Reed, nevertheless defeated Los Angeles 107-100 in Game 5 of the NBA Finals. The Knicks ultimately captured their first NBA title with a Game 7 victory.`,source:'nba.com/history'},
  {date:'1994-05-04',imp:2,cat:'milestone',desc:`Charles Barkley of Phoenix hit 23-of-31 field goal attempts and finished with 56 points, leading the visiting Suns to a 140-133 win over Golden State and a three-game sweep of their Western Conference First Round series. Barkley’s 56 points tied for the third-highest total ever in an NBA Playoff game, and his 38 points in the first half set a record. Sleepy Floyd holds the second-half scoring record in the NBA Playoffs with 39 points, which he scored in Golden State’s 129-121 home win over the Los Angeles Lakers in Game 4 of the 1987 Western Conference Semifinals.`,source:'nba.com/history'},
  {date:'2015-05-04',imp:2,cat:'milestone',desc:`Warriors guard Stephen Curry is named NBA MVP after making a then league-record 286 3-pointers while leading Golden State to a record 67 wins. He became the first Warriors player to win MVP honors since Wilt Chamberlain in 1959-60 when the franchise played in Philadelphia.`,source:'nba.com/history'},
  {date:'1969-05-05',imp:2,cat:'milestone',desc:`Hall of Famers Bill Russell and Sam Jones, two of Boston’s all-time greats, ended their Celtic careers with a 108-106 Game 7 victory over the Los Angeles Lakers, giving Boston its 11th NBA championship in 13 years.`,source:'nba.com/history'},
  {date:'1981-05-05',imp:2,cat:'milestone',desc:`Larry Bird of the Boston Celtics, anticipating that his jumper from the right of the key during Game 1 of the 1981 NBA Finals against Houston was going to be off target, raced to the right baseline, grabbed the rebound with his right hand, switched the ball into his left hand as his momentum was taking him out of bounds and somehow laid it in the basket. Red Auerbach called it the greatest play he had ever seen, both for Bird’s physical ability to make the shot and his basketball instinct to get into position for the rebound. The Celtics won the game 98-95, and went on to take the series in six games.`,source:'nba.com/history'},
  {date:'1986-05-05',imp:2,cat:'milestone',desc:`NBA legends Rick Barry, Walt Frazier and Pete Maravich were among five men inducted into the Naismith Memorial Basketball Hall of Fame.`,source:'nba.com/history'},
  {date:'1993-05-05',imp:2,cat:'milestone',desc:`Alonzo Mourning of the Charlotte Hornets nails a top-of-the-key jumper with 0.4 seconds left in Game 4 against the Boston Celtics. The shot seals Charlotte’s 104-103 win against the Boston Celtics, advancing it into the Eastern Conference semifinals.`,source:'nba.com/history'},
  {date:'1995-05-05',imp:2,cat:'milestone',desc:`Clyde Drexler scored a game-high 41 points and Hakeem Olajuwon added 40 to lead Houston to a 123-106 win over visiting Utah in Game 4 of their Western Conference First Round series. It marked the third time in NBA Playoff history that a pair of teammates had scored 40 or more points in the same game.`,source:'nba.com/history'},
  {date:'1998-05-05',imp:2,cat:'milestone',desc:`Atlanta’s Dikembe Mutombo is named the winner of the 1997-98 NBA Defensive Player of the Year Award, becoming the first player in NBA history to win the award three times.`,source:'nba.com/history'},
  {date:'2000-05-05',imp:2,cat:'milestone',desc:`Portland Trail Blazers assistant coach Bill Musselman died in the morning from complications from amyloidosis, a disease affecting the liver. He was at the Mayo Clinic in Rochester, Minn. A moment of silence was observed at the Rose Garden on Sunday, May 7 before the Trail Blazers’ 94-75 victory over Utah in Game 1 of their Western Conference semifinal series. The 59-year-old Musselman, a former NBA head coach with the Minnesota Timberwolves, was in his third season with the Blazers.`,source:'nba.com/history'},
  {date:'2010-05-05',imp:2,cat:'milestone',desc:`The Phoenix Suns make national headlines when they don jerseys emblazoned with “Los Suns.” They are worn “to celebrate diversity on Cinco de Mayo,” according to team owner Robert Sarver, but also to protest a controversial immigration law that had been recently signed by Arizona’s governor. Los Suns beat the San Antonio Spurs, 110-102 in a conference semi-final contest.`,source:'nba.com/history'},
  {date:'1970-05-06',imp:2,cat:'milestone',desc:`The Los Angeles Lakers converted 57 of 94 field goal attempts in a 135-113 Game 6 victory over New York in the NBA Finals. The Lakers’ field goal percentage of .606 set a record for an NBA Finals game that would last 15 years, and their 44 assists set an NBA record that stood for 17 years until it was tied by the 1987 Los Angeles Lakers.`,source:'nba.com/history'},
  {date:'1985-05-06',imp:2,cat:'milestone',desc:`NBA legends Billy Cunningham, Tom Heinsohn and Red Holzman were among six men inducted into the Naismith Memorial Basketball Hall of Fame.`,source:'nba.com/history'},
  {date:'1993-05-06',imp:2,cat:'milestone',desc:`Shaquille O’Neal of Orlando is named the NBA Rookie of the Year after averaging 23.4 points (eighth in the NBA), 13.9 rebounds (second) and 3.53 blocks per game (second), leading the Magic (41-41) to an improvement of 20 wins over the previous season.`,source:'nba.com/history'},
  {date:'1996-05-06',imp:2,cat:'milestone',desc:`The Seattle SuperSonics (20) and Houston Rockets (13) combine for 33 three-point field goals made in Game 2 of their Western Conference Semifinal series, a 105-101 Seattle win. The 33 three-pointers made is the most ever in an NBA playoff game.`,source:'nba.com/history'},
  {date:'1996-05-06',imp:2,cat:'milestone',desc:`Former NBA stars George Gervin, David Thompson, Gail Goodrich and George Yardley are four of the six individuals inducted into the Naismith Memorial Basketball Hall of Fame. The other two inductees are Kresimir Cosic and Nancy Lieberman-Cline.`,source:'nba.com/history'},
  {date:'1997-05-06',imp:2,cat:'milestone',desc:`Robert Horry of the Los Angeles Lakers sets an NBA playoff record by making all seven of his 3-point field goal attempts in the Lakers’ 103-101 loss to the Utah Jazz in Game 2 of the Western Conference Semifinals.`,source:'nba.com/history'},
  {date:'1998-05-06',imp:2,cat:'milestone',desc:`Michael Jordan becomes the first player in history to be selected to the NBA All-Defensive First Team nine times when the NBA announced the 1997-98 NBA All-Defensive First and Second Teams.`,source:'nba.com/history'},
  {date:'1998-05-06',imp:2,cat:'milestone',desc:`Former Syracuse Nationals’ star Paul Seymour died after a long battle with heart disease at the age of 70.`,source:'nba.com/history'},
  {date:'2000-05-06',imp:2,cat:'milestone',desc:`Indiana Pacers Reggie Miller and Jalen Rose each notched 40 points in the Pacers’ 108-91 triumph over Philadelphia in Game 1 of their Eastern Conference semifinal series. Their productivity gained the duo entrance into an exclusive club, as they became the fourth pair of teammates in NBA history to score 40 or more points in the same playoff game. It was the first time the feat had been accomplished since May 5, 1995, when Clyde Drexler and Hakeem Olajuwon scored 41 and 40 points, respectively, in a first-round game against Utah.`,source:'nba.com/history'},
  {date:'2008-05-06',imp:2,cat:'milestone',desc:`Los Angeles Lakers guard Kobe Bryant is named NBA MVP, becoming the third player in Lakers history to win the award (Magic Johnson and Kareem Abdul-Jabbar are the others). Bryant collected 82 first-place votes and led the Lakers to a West-leading 57-25 campaign in which he finished second in scoring (28.3 ppg) in the NBA.`,source:'nba.com/history'},
  {date:'1972-05-07',imp:2,cat:'milestone',desc:`The Lakers defeated the New York Knicks 4-1 in the NBA Finals, capturing their first league championship since moving to Los Angeles from Minneapolis.`,source:'nba.com/history'},
  {date:'1989-05-07',imp:2,cat:'milestone',desc:`Michael Jordan of the Chicago Bulls got the ball on the right side of the court with his team trailing by one point in the closing seconds of a deciding Game 5 of their 1989 Eastern Conference First Round playoff series against the Cleveland Cavaliers. Jordan drove just inside the top of the key and while falling away from the basket to his left nailed an 18-footer over the outstretched fingertips of leaping Cavaliers’ defender Craig Ehlo for a 101-100 victory.`,source:'nba.com/history'},
  {date:'1994-05-07',imp:2,cat:'milestone',desc:`In one of the biggest upsets in NBA Playoff history, the eighth-seeded Denver Nuggets eliminated the top-seeded Seattle SuperSonics 98-94 in overtime in Game 5 of their Western Conference First Round series at the Seattle Coliseum. The Nuggets, who won the last three games of the series, became the first # 8 seed to upset a # 1 seed since the First Round of the NBA Playoffs went to a best-of-5 format in 1984. Nuggets center Dikembe Mutombo fell to the floor after grabbing the final rebound, clutching the ball as tears of joy streamed down his face.`,source:'nba.com/history'},
  {date:'1995-05-07',imp:2,cat:'milestone',desc:`Indiana’s Reggie Miller scored eight points (two three-pointers, two game–winning free throws) over the final 16.4 seconds of the game, helping lead the Pacers to a shocking 107-105 come-from-behind win over host New York in Game 1 of their Eastern Conference Semifinal series. The Pacers went on to win the series in seven games.`,source:'nba.com/history'},
  {date:'2017-05-07',imp:2,cat:'milestone',desc:`The Cleveland Cavaliers defeat the Toronto Raptors 109-102 in the Eastern Conference semifinals, winning the series 4-0.`,source:'nba.com/history'},
  {date:'1970-05-08',imp:2,cat:'milestone',desc:`The Knicks claimed their first NBA title by defeating Los Angeles 113-99 in Game 7 of the Finals. New York was led by the inspirational play of injured center Willis Reed, who limped onto the court and scored the game’s first two baskets, and guard Walt Frazier, who led the Knicks with 36 points and 19 assists.`,source:'nba.com/history'},
  {date:'1988-05-08',imp:2,cat:'milestone',desc:`Michael Jordan of the Chicago Bulls scored 226 points in the Bulls’ five-game Eastern Conference first round series against Cleveland, breaking Bernard King’s record of 213 set in 1984.`,source:'nba.com/history'},
  {date:'1988-05-08',imp:2,cat:'milestone',desc:`The Los Angeles Lakers held the Utah Jazz to just eight points in the first quarter of Game 1 of their Western Conference semifnials series, a 110-91 Lakers’ victory, with the Jazz setting a record low for first quarter points scored in an NBA Playoff game.`,source:'nba.com/history'},
  {date:'1999-05-08',imp:2,cat:'milestone',desc:`Utah’s Karl Malone (3,712 points) passed Magic Johnson (3,701) for the sixth position all-time in playoff scoring.`,source:'nba.com/history'},
  {date:'2000-05-08',imp:2,cat:'milestone',desc:`John Nucatola, one of the original referees in the NBA when it was formed as the Basketball Association of America in 1946, dies at the age of 92. Nucatola, inducted into the Naismith Memorial Basketball Hall of Fame as a referee in 1978, was the NBA’s Supervisor of Officials from 1970 to 1977. He officiated in more than 2,000 games during his career at the collegiate, Olympic and professional levels. Born November 17, 1907, in New York, Nucatola was once called basketball’s “greatest official” by Hall of Famer Clair Bee. After a playing and coaching career of 22 years, Nucatola became a referee in the East Coast Athletic Conference (ECAC). He later went on to officiate games in the ACC and Ivy League and became one of the founders of the College Basketball Officials Association. He officiated in 18 NCAA and 18 NIT tournaments while conducting over 1,200 clinics worldwide.`,source:'nba.com/history'},
  {date:'2016-05-08',imp:2,cat:'milestone',desc:`The Cleveland Cavaliers defeat the Atlanta Hawks 100-99 in the Eastern Conference semifinals for a 4-0 series win.`,source:'nba.com/history'},
  {date:'2017-05-08',imp:2,cat:'milestone',desc:`The Golden State Warriors defeat the Utah Jazz 121-95 in the Western Conference semifinals, winnings the series 4-0/`,source:'nba.com/history'},
  {date:'1983-05-09',imp:2,cat:'milestone',desc:`George and Gordon Gund, co-owners of The Coliseum, assumed ownership of the Cleveland Cavaliers.`,source:'nba.com/history'},
  {date:'1988-05-09',imp:2,cat:'milestone',desc:`Former NBA legends Lenny Wilkens and K. C. Jones were among three men inducted into the Naismith Memorial Basketball Hall of Fame. Wilkens would get the call from the Hall again 10 years later, when he was inducted as a coach.`,source:'nba.com/history'},
  {date:'1994-05-09',imp:2,cat:'milestone',desc:`Longtime NBA head coach and former NBA player Buddy Jeannette were inducted into the Naismith Memorial Basketball Hall of Fame.`,source:'nba.com/history'},
  {date:'2000-05-09',imp:2,cat:'milestone',desc:`The NBA announced that Stu Jackson, former President and General Manager of the Vancouver Grizzlies, would join the NBA as Senior Vice President, Basketball Operations, effective June 1. On June 6, 2000, the NBA announced that, effective July 1, Jackson would assume the responsibilities previously held by Rod Thorn as head of the NBA’s Basketball Operations department. Jackson’s new duties would include chairing the league’s Competition and Rules Committee, overseeing officiating, and imposing discipline for misconduct by players and coaches. The NBA said Jackson would report to NBA Deputy Commissioner and Chief Operating Officer Russ Granik.`,source:'nba.com/history'},
  {date:'2009-05-09',imp:2,cat:'milestone',desc:`Hall of Fame Coach Chuck Daly, winner of 2 NBA Championships, dies in Jupiter, Florida at the age of 78.`,source:'nba.com/history'},
  {date:'2015-05-09',imp:2,cat:'milestone',desc:`Paul Pierce banks in a jumper from near the top of the key to give the Washington Wizards a 103-101 win in Game 3 against the Atlanta Hawks in the Eastern Conference semifinals. After hitting the shot, Pierce famously says in his walk-off interview: “I called game!”`,source:'nba.com/history'},
  {date:'1974-05-10',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar’s sky-hook with three seconds remaining in the second overtime gave Milwaukee a 102-101 victory over Boston in Game 6 of the NBA Finals. The Celtics, however, took the deciding seventh game.`,source:'nba.com/history'},
  {date:'1987-05-10',imp:2,cat:'milestone',desc:`Sleepy Floyd of Golden State set NBA playoff records with 29 points in the fourth quarter and 39 points in the second half as the Warriors beat the Los Angeles Lakers 129-121 in Game 4 of the West Semifinals. Floyd finished the game with 51 points.`,source:'nba.com/history'},
  {date:'1993-05-10',imp:2,cat:'milestone',desc:`Former NBA players Julius Erving, Walt Bellamy, Dan Issel, Dick McGuire, Calvin Murphy and Bill Walton were inducted into the Naismith Memorial Basketball Hall of Fame.`,source:'nba.com/history'},
  {date:'1995-05-10',imp:2,cat:'milestone',desc:`Chicago’s 104-94 win over host Orlando in Game 2 of their Eastern Conference Semifinal Round series drew a 7.9 rating on TNT and was viewed in an average of better than five million homes, making it at the time the most watched NBA game ever on cable television.`,source:'nba.com/history'},
  {date:'2012-05-10',imp:2,cat:'milestone',desc:`Led by Andre Iguodala’s 20-point game, the Philadelphia 76ers defeat the Chicago Bulls in Game 6 of their first-round series to win the series. With the series win, the No. 8-seeded 76ers upset ousted the No. 1-seeded Bulls marking the first time in NBA history that happened in the first round in back-to-back years.`,source:'nba.com/history'},
  {date:'2016-05-10',imp:2,cat:'milestone',desc:`Stephen Curry of the Warriors becomes the first unanimous NBA MVP winner after breaking his own record for 3-pointers in a season (402) and leading Golden State to an NBA-record 73-9 season. In winning the MVP, he became the 11th back-to-back MVP winner in NBA history and the first since Steve Nash in 2004-05 and 2005-06 to accomplish the feat.`,source:'nba.com/history'},
  {date:'2021-05-10',imp:2,cat:'milestone',desc:`Russell Westbrook finishes with 28 points, 13 rebounds and 21 assists in the Wizards’ 125-124 loss to surpass Oscar Robertson for the all-time lead in triple-doubles. Westbrook’s performance was his 182nd career triple-double, besting the mark set by Robertson that had stood since his retirement in 1974.`,source:'nba.com/history'},
  {date:'2022-05-10',imp:2,cat:'milestone',desc:`Bob Lanier, a Hall of Famer and respected ambassador of the game, dies at 73. Lanier was an 8-time All-Star and was well-known after his playing days for his community service work.`,source:'nba.com/history'},
  {date:'1976-05-11',imp:2,cat:'milestone',desc:`Before a capacity crowd of 21,564 at the Richfield Coliseum, the Cleveland Cavaliers defeated the Boston Celtics 83-78 in Game 3 of the Eastern Conference Finals. Boston went on to win the series 4-2 and later the NBA Championship, but the 1975-76 season still stands as the Miracle of Richfield.`,source:'nba.com/history'},
  {date:'1980-05-11',imp:2,cat:'milestone',desc:`One of the NBA’s most memorable moves took place on this date. Julius Erving started out on the right side and drove past Lakers’ forward Mark Landsberger along the baseline. As Erving elevated toward the basket, Kareem Abdul-Jabbar came over to block a layup attempt. Erving changed course in mid-air and floated behind the backboard to the other side of the basket then wrapped his right arm behind Kareem and laid in a reverse layup. “Here I was trying to win a championship and my mouth just dropped open,” recalled Lakers’ guard Magic Johnson, then a rookie. “I thought, ‘What should we do? Should we take the ball out or should we ask him to do it again?’” The Lakers would win the series in six games.`,source:'nba.com/history'},
  {date:'1992-05-11',imp:2,cat:'milestone',desc:`NBA legends Bob Lanier and Connie Hawkins and long-time NBA coach Jack Ramsay were among nine individuals inducted into the Naismith Memorial Basketball Hall of Fame.`,source:'nba.com/history'},
  {date:'1992-05-11',imp:2,cat:'milestone',desc:`The Portland Trail Blazers defeated the host Phoenix Suns 153-151 in double-overtime in Game 4 of their Western Conference Semifinal Round series, the highest-scoring NBA Playoff game ever. The Blazers went on to win the series in five games.`,source:'nba.com/history'},
  {date:'2000-05-11',imp:2,cat:'milestone',desc:`Elton Brand of the Chicago Bulls and Steve Francis of the Houston Rockets, who both enjoyed stellar first-year campaigns, are named co-winners of the 1999-2000 Schick Rookie of the Year Award. Brand and Francis each received 58 of a possible 121 votes from a nationwide panel of sports writers and broadcasters.`,source:'nba.com/history'},
  {date:'2000-05-11',imp:2,cat:'milestone',desc:`Hall of Fame guard Nate “Tiny” Archibald is named head coach of the NBA Ambassadors, the NBA developmental league’s entry in the 2000 Asian Basketball Association League. Former NBA swingman Tony Campbell was named as Archibald’s assistant coach. The NBA Ambassadors were one of six teams to take part in a six-week competition against teams from China, Hong Kong, Japan, Korea and Taiwan.`,source:'nba.com/history'},
  {date:'2001-05-11',imp:2,cat:'milestone',desc:`Vince Carter of the Toronto Raptors connected on eight 3-point field goals in one half of his team’s 102-78 win over Philadelphia in Game 3 of the Eastern Conference Semifinals. It broke a record shared by five players of six 3-pointers made in one half of a playoff game.`,source:'nba.com/history'},
  {date:'2007-05-11',imp:2,cat:'milestone',desc:`Baron Davis takes off for a one-handed power jam on Utah Jazz forward Andrei Kirilenko in Golden State’s 125-105 win against the Utah Jazz in Game 3 of the Western Conference semifinals.`,source:'nba.com/history'},
  {date:'2011-05-11',imp:2,cat:'milestone',desc:`Former NBA player Robert Traylor is found dead in his apartment at the age of 34 of a heart attack.`,source:'nba.com/history'},
  {date:'1974-05-12',imp:2,cat:'milestone',desc:`The Boston Celtics won their 12th NBA Championship, defeating the Milwaukee Bucks 102-87 in Game 7 at Milwaukee.`,source:'nba.com/history'},
  {date:'1985-05-12',imp:2,cat:'milestone',desc:`New York won the first-ever NBA Draft Lottery, enabling the Knicks to select Georgetown center Patrick Ewing with the first pick in the 1985 NBA Draft.`,source:'nba.com/history'},
  {date:'1992-05-12',imp:2,cat:'milestone',desc:`USA Basketball named Christian Laettner and Clyde Drexler to the remaining spots on the “Dream Team” for the 1992 Olympics.`,source:'nba.com/history'},
  {date:'1996-05-12',imp:2,cat:'milestone',desc:`Houston’s two-year reign as NBA Champions ends as Seattle, led by Shawn Kemp’s 32 points and 15 rebounds, tops the Rockets 114-107 in overtime in Game 4 of the Western Conference Semifinals, completing a series sweep.`,source:'nba.com/history'},
  {date:'2019-05-12',imp:2,cat:'milestone',desc:`Kawhi Leonard hit a shot from the corner over Joel Embiid at the buzzer that bounced off the rim four times before falling to give the Toronto Raptors a 92-90 victory over the 76ers on Sunday night in Game 7 of the Eastern Conference semifinal series. It was the first winning buzzer-beater in a Game 7 in NBA history.`,source:'nba.com/history'},
  {date:'1976-05-13',imp:2,cat:'milestone',desc:`The New York Nets defeated the Denver Nuggets 112-106 to win what became the last ABA championship, four games to two. The next month, four former ABA teams–San Antonio, Denver, New York and Indiana were admitted into the NBA.`,source:'nba.com/history'},
  {date:'1977-05-13',imp:2,cat:'milestone',desc:`Maurice Lucas scored 26 points to help the Trail Blazers defeat the Lakers 105-101, for a sweep of the Western Conference Finals. Portland went on to capture its only NBA title, defeating Philadelphia 4-2 in the NBA Finals.`,source:'nba.com/history'},
  {date:'1991-05-13',imp:2,cat:'milestone',desc:`Former NBA Commissioner Larry O’Brien, National Basketball Players Association founder Larry Fleisher and NBA legends Nate Archibald, Dave Cowens and Harry Gallatin were inducted into the Hall of Fame.`,source:'nba.com/history'},
  {date:'1999-05-13',imp:2,cat:'milestone',desc:`The San Antonio Spurs defeat the Minnesota Timberwolves 85-71 in Game 3 of their first round Western Conference playoff series. The win was the first of what would become a record 12 straight playoff game victories in one playoffs for the Spurs. San Antonio would lose only once more in the 1999 playoffs en route to capturing its first NBA championship.`,source:'nba.com/history'},
  {date:'1999-05-13',imp:2,cat:'milestone',desc:`Philadelphia’s Allen Iverson recorded an NBA playoff-record 10 steals in a 97-85 win over the Orlando Magic.`,source:'nba.com/history'},
  {date:'1980-05-14',imp:2,cat:'milestone',desc:`Magic Johnson committed an NBA Finals-record 10 turnovers in Game 5 against Philadelphia, but the Lakers won anyway, 108-103 at Los Angeles.`,source:'nba.com/history'},
  {date:'1981-05-14',imp:2,cat:'milestone',desc:`Larry Bird scored 27 points and Cedric Maxwell added 19 to lead Boston to a 102-91 victory over Houston in Game 6 of the Finals, giving the Celtics their 14th NBA Championship.`,source:'nba.com/history'},
  {date:'1996-05-14',imp:2,cat:'milestone',desc:`The legendary Earvin “Magic” Johnson of the LA Lakers, who returned to the NBA after a four-year retirement to play 32 regular season and four playoff games, announced his retirement from the NBA.`,source:'nba.com/history'},
  {date:'2003-05-14',imp:2,cat:'milestone',desc:`Hall of Fame NBA player, NBA coach, and ABA Commissioner Dave DeBusschere passes away in New York, aged 62.`,source:'nba.com/history'},
  {date:'1982-05-15',imp:2,cat:'milestone',desc:`The Los Angeles Lakers moved into the NBA Finals by beating San Antonio 128-123 in Game 4 of the Western Conference Finals. It was the Lakers’ eighth straight victory, making them the first team in NBA Playoff history to sweep back-to- back best-of-7 series.`,source:'nba.com/history'},
  {date:'1984-05-15',imp:2,cat:'milestone',desc:`Magic Johnson notched a playoff record 24 assists as the Lakers beat Phoenix 118-102 in Game 2 of the West Finals. John Stockton of the Utah Jazz tied the record with 24 assists against the Lakers on May 17, 1988.`,source:'nba.com/history'},
  {date:'1990-05-15',imp:2,cat:'milestone',desc:`Former NBA stars Dave Bing, Elvin Hayes, Neil Johnston and Earl “The Pearl” Monroe were inducted into the Basketball Hall of Fame.`,source:'nba.com/history'},
  {date:'1995-05-15',imp:2,cat:'milestone',desc:`Former NBA stars Kareem Abdul-Jabbar and Vern Mikkelsen, former NBA coach John Kundla and former NBA referee Earl Strom were among seven individuals inducted into the Naismith Memorial Basketball Hall of Fame.`,source:'nba.com/history'},
  {date:'2001-05-15',imp:2,cat:'milestone',desc:`Allen Iverson of the Philadelphia 76ers was named the recipient of the Maurice Podoloff Trophy as the NBA’s Most Valuable Player for the 2000-01 season, at 6-foot and 165 pounds becoming the shortest and lightest MVP in league history.`,source:'nba.com/history'},
  {date:'1980-05-16',imp:2,cat:'milestone',desc:`Rookie guard Magic Johnson filled in at center for the injured Kareem Abdul-Jabbar and came up with 42 points, 15 rebounds and seven assists as the Los Angeles Lakers won the NBA title by beating Philadelphia 123-107 in Game 6 of the Finals. Johnson sank all 14 of his free throw attempts to set a Finals record and he was named the Finals MVP. Johnson’s 42 points were the most scored by a rookie in an NBA Finals game.`,source:'nba.com/history'},
  {date:'1999-05-16',imp:2,cat:'milestone',desc:`The New York Knicks became only the second eighth-seeded team in NBA playoff history to defeat a number one seed in the playoffs when they defeated the Miami Heat in five games. Seattle was the other eighth-seeded team to advance when they ousted Seattle in 1994.`,source:'nba.com/history'},
  {date:'2000-05-16',imp:2,cat:'milestone',desc:`Utah’s Jef Hornacek walked off the court for the final time after the Jazz are eliminated from the postseason by the Portland Trail Blazers. Hornacek, who entered the league as a point guard and ended up one of the game’s best pure shooters, concluded his career after 1,077 career games. He averaged 14.5 points and 4.9 assists per game, with shooting percentages of 49.6% from the field, 40.3% from three-point range and 87.7% from the free throw line.`,source:'nba.com/history'},
  {date:'2001-05-16',imp:2,cat:'milestone',desc:`Allen Iverson of the Philadelphia 76ers scored 52 points against the Toronto Raptors in Game 5 of their Eastern Conference Semifinal series. Iverson joined Michael Jordan as the only two players ever to score 50 or more points in two games of the same playoff series. Iverson scored 54 points against Toronto in Game 2 of the series.`,source:'nba.com/history'},
  {date:'1979-05-17',imp:2,cat:'milestone',desc:`Jack Sikma of Seattle scored 33 points and grabbed 11 rebounds to lead the SuperSonics to a 114-110 victory over Phoenix in Game 7 of their Western Conference Finals series, before a crowd of 37,552 at the Kingdome. The Sonics went on to win their only NBA Championship, defeating Washington in five games in the Finals.`,source:'nba.com/history'},
  {date:'1988-05-17',imp:2,cat:'milestone',desc:`John Stockton of Utah tied Magic Johnson’s NBA Playoff assist record with 24 in a losing effort (111-109) against Los Angeles in Game 5 of the Western Conference Semifinals.`,source:'nba.com/history'},
  {date:'1993-05-17',imp:2,cat:'milestone',desc:`New York’s Pat Riley was named IBM NBA Coach of the Year, beating out Houston’s Rudy Tomjanovich by a single vote in the closest balloting ever, becoming only the fifth NBA coach to win the award twice. Riley, who led the Knicks to a 60-win season for only the second time in the 47-year history of the franchise, also won the Coach of the Year award with the Los Angeles Lakers in 1990.`,source:'nba.com/history'},
  {date:'1993-05-17',imp:2,cat:'milestone',desc:`Michael Jordan knocks down a contested fadeaway at the buzzer in Game 4 over Gerald Wilkins to defeat the Cavs 103-101 in the Eastern Conference finals. With the win, the Bulls clinch their third straight NBA Finals berth.`,source:'nba.com/history'},
  {date:'1995-05-17',imp:2,cat:'milestone',desc:`Jason Kidd of Dallas and Grant Hill of Detroit were named co-winners of the NBA Rookie of the Year Award, marking the first time since 1971–when Boston’s Dave Cowens and Portland’s Geoff Petrie were named co-winners–that two players shared the Eddie Gottlieb Trophy.`,source:'nba.com/history'},
  {date:'1975-05-18',imp:2,cat:'milestone',desc:`Rick Barry hit a jumper with 38 seconds remaining to put Game 1 of the NBA Finals out of reach as Golden State defeated Washington 101-95. Barry, the series MVP, continued with dominating performances as the Warriors swept the Bullets 4-0 to take the title.`,source:'nba.com/history'},
  {date:'1998-05-18',imp:2,cat:'milestone',desc:`Michael Jordan is named the 1998 NBA Most Valuable Player, earning his fifth MVP honor, tied for the second-most league MVP awards with the legendary Bill Russell. Kareem Abdul-Jabbar was named NBA MVP a record six times.`,source:'nba.com/history'},
  {date:'2021-05-18',imp:2,cat:'milestone',desc:`The Indiana Pacers defeat the Charlotte Hornets 144-117 and the Boston Celtics defeat the Washington Wizards 118-100 in the inaugural games of the State Farm NBA Play-In Tournament in the Eastern Conference. The Wizards clinch the No. 7 seed with their win, while the Pacers move on to play the Celtics in another Play-In game with the No. 8 seed on the line.`,source:'nba.com/history'},
  {date:'1928-05-19',imp:2,cat:'milestone',desc:`Dolph Schayes is born in New York City.`,source:'nba.com/history'},
  {date:'1976-05-19',imp:2,cat:'milestone',desc:`Hall of Famer and 15-time All-Star Kevin Garnett is born in Greenville, S.C.`,source:'nba.com/history'},
  {date:'1987-05-19',imp:2,cat:'milestone',desc:`Los Angeles Lakers guard Magic Johnson was named the Edge NBA Most Valuable Player after averaging 23.9 ppg and a league-high 12.2 apg, becoming the first guard in 23 years to gain that honor.`,source:'nba.com/history'},
  {date:'2009-05-19',imp:2,cat:'milestone',desc:`The NBA’s Los Angeles Clippers win the first overall pick in the 2009 NBA Draft lottery. This was the Clippers’ first lottery win since the 1998 NBA Draft where they selected Michael Olowokandi out of the University of Pacific.`,source:'nba.com/history'},
  {date:'2021-05-19',imp:2,cat:'milestone',desc:`The Memphis Grizzlies defeat the San Antonio Spurs 100-96 and the Los Angeles Lakers defeat the Golden State Warriors 103-100 in the inaugural games of the State Farm NBA Play-In Tournament in the Western Conference. The Lakers clinch the No. 7 seed with their win, while the Grizzlies move on to play the Warriors in another Play-In game with the No. 8 seed on the line.`,source:'nba.com/history'},
  {date:'1974-05-20',imp:2,cat:'milestone',desc:`The Atlanta Hawks trade Pete Maravich to the New Orleans Jazz for two players and five future Draft picks.`,source:'nba.com/history'},
  {date:'1979-05-20',imp:2,cat:'milestone',desc:`Washington reserve Larry Wright hit two free throws with no time on the clock to give his club a 99-97 victory in the opening game of the NBA Finals against Seattle. Wright’s clutch shots gave him 26 points in just 23 minutes and led the Bullets to their only victory of the five-game championship series.`,source:'nba.com/history'},
  {date:'1995-05-20',imp:2,cat:'milestone',desc:`Houston’s Mario Elie sank a three-pointer from the corner with 7.1 seconds left in the game, lifting the visiting Rockets to a 115-114 win over Phoenix in Game 7 of their Western Conference Semifinal Round series at America West Arena. With the win, the Rockets became the first NBA team in 13 years (since the ’82 Sixers against Boston) to overcome a 3-1 deficit to win a best-of-7 playoff series. Houston’s victory also broke a string of 20 consecutive wins by the home team in the deciding Game 7 of a playoff series. Just 24 hours later, Indiana repeated that feat by the road team after downing host New York 97-95 in Game 7 of their Eastern Conference Semifinal Round series.`,source:'nba.com/history'},
  {date:'1996-05-20',imp:2,cat:'milestone',desc:`Chicago’s Michael Jordan earns a record 96.5 percent of first-place votes (109 of 113) from the media to win the Maurice Podoloff Trophy as the 1995-96 NBA Most Valuable Player, his fourth overall NBA MVP Award. Jordan’s MVP stats include 30.4 points, 6.6 rebounds, 4.3 assists and 2.20 steals per game`,source:'nba.com/history'},
  {date:'2000-05-20',imp:2,cat:'milestone',desc:`Malik Sealy of the Minnesota Timberwolves dies in an auto accident at the age of 30. Sealy starred at Tolentine High School in the Bronx, leading the school to the mythical high school national championship in 1988. Later that year, he took his game to St. John’s, where he carved out a stellar career, putting together numbers bettered only by Chris Mullin. Sealy was drafted by the Indiana Pacers with the 14th pick in the first round of the 1992 NBA Draft, and he played with Indiana, the Los Angeles Clippers, Detroit and Minnesota in an eight-year NBA career.`,source:'nba.com/history'},
  {date:'2012-05-20',imp:2,cat:'milestone',desc:`The San Antonio Spurs defeat the Los Angeles Clippers 102-99 in the Western Conference semifinals for a 4-0 series win.`,source:'nba.com/history'},
  {date:'2019-05-20',imp:2,cat:'milestone',desc:`A Game 4 win against the Portland Trail Blazers in the Western Conference finals sends the Golden State Warriors to The Finals for a fifth straight postseason. They join the 1960s Boston Celtics (10 total) as the only teams in NBA history to make The Finals in five consecutive seasons or more. The Celtics hold the all-time record for consecutive Finals berths, appearing in 10 championship series from 1957-67.`,source:'nba.com/history'},
  {date:'2021-05-20',imp:2,cat:'milestone',desc:`The Washington Wizards defeat the Indiana Pacers 142-115 in the State Farm NBA Play-In Tournament to clinch the No. 8 seed in the Eastern Conference playoffs.`,source:'nba.com/history'},
  {date:'1986-05-21',imp:2,cat:'milestone',desc:`Ralph Sampson, who teamed with Hakeem Olajuwon in a Twin Towers alignment for the Houston Rockets, caught an inbounds pass with one second left and bounced in a turnaround jumper to beat the Los Angeles Lakers 114-112 at Los Angeles in Game 5 of the 1986 Western Conference Finals. The loss kept the defending champion Lakers, who had won 62 games during the regular season, out of the NBA Finals for the only time in a span of eight years from 1982 through 1989.`,source:'nba.com/history'},
  {date:'1991-05-21',imp:2,cat:'milestone',desc:`With a 105-97 win over the Detroit Pistons at Chicago Stadium in Game 2 of their Eastern Conference Final series, the Chicago Bulls set an NBA playoff record for consecutive wins at home with 15. The Bulls’ postseason home winning streak was broken on June 2, 1991 by the Los Angeles Lakers, with a 93-91 loss in Game 1 of the NBA Finals.`,source:'nba.com/history'},
  {date:'1992-05-21',imp:2,cat:'milestone',desc:`Golden State’s Don Nelson was named IBM NBA Coach of the Year, becoming the first NBA coach to win the award three times. Nelson guided the Warriors to a 55-27 record, the second-best mark in franchise history. Nelson also won the Coach of the Year award in Milwaukee in 1983 and 1985.`,source:'nba.com/history'},
  {date:'1994-05-21',imp:2,cat:'milestone',desc:`In Denver’s 91-81 loss to Utah in Game 7 of their Western Conference Semifinal Round series, Dikembe Mutombo swatted away two shots to give him an NBA record 38 for a seven-game playoff series, obliterating Hakeem Olajuwon’s previous mark of 30, set in 1993 against Seattle.`,source:'nba.com/history'},
  {date:'1996-05-21',imp:2,cat:'milestone',desc:`Chicago’s 93-88 home win over Orlando in Game 2 of the Eastern Conference Finals draws an 8.6 rating and a 13.8 share on TNT. With nearly 8.2 million persons tuning in, it is the most-watched NBA game in cable television history.`,source:'nba.com/history'},
  {date:'1998-05-21',imp:2,cat:'milestone',desc:`The Sacramento Kings traded veterans Mitch Richmond and Otis Thorpe to the Washington Wizards for Chris Webber.`,source:'nba.com/history'},
  {date:'2021-05-21',imp:2,cat:'milestone',desc:`The Memphis Grizzlies defeat the Golden State Warriors 117-112 in the State Farm NBA Play-In Tournament to clinch the No. 8 seed in the Western Conference playoffs.`,source:'nba.com/history'},
  {date:'1963-05-22',imp:2,cat:'milestone',desc:`The NBA approved the franchise shift of the Syracuse Nationals to Philadelphia. The franchise was purchased by Philadelphia’s Irv Kosloff and Ike Richman earlier that spring.`,source:'nba.com/history'},
  {date:'1988-05-22',imp:2,cat:'milestone',desc:`Dominique Wilkins and Larry Bird traded bucket for bucket in the fourth quarter of Game 7 of the 1988 Eastern Conference Semifinals until Boston escaped with a 118-116 victory. Wilkins finished with 47 points and Bird had 34 — with 20 of his points tallied in the fourth quarter. “The basket was like a well,” remembered Wilkins. “I couldn’t miss. He couldn’t miss. That’s the greatest game I’ve ever played in or seen played. It was two guys who just did not want to lose.” The teams shot a combined .588 percent from the field, the second highest mark in playoff history.`,source:'nba.com/history'},
  {date:'1994-05-22',imp:2,cat:'milestone',desc:`Toronto, scheduled to enter the NBA as an expansion franchise in 1995-96, unveiled Raptors as the team’s nickname.`,source:'nba.com/history'},
  {date:'2020-05-22',imp:2,cat:'milestone',desc:`Legendary coach Jerry Sloan dies at 78 from complications related to Parkinson’s disease and Lewy body dementia. Upon his passing, Sloan’s 1,221 career wins ranked as the fourth-highest total in NBA history.`,source:'nba.com/history'},
  {date:'1975-05-23',imp:2,cat:'milestone',desc:`Golden State notched an NBA Finals game record 17 steals during their 109-101 victory over Washington in Game 3 of the NBA Finals.`,source:'nba.com/history'},
