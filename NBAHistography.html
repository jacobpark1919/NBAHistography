  {date:'1978-02-07',imp:2,cat:'milestone',desc:`The Nets were snowbound by a blizzard in New Jersey, forcing their game in San Antonio to be postponed. This marked the first time a basketball game in south Texas was snowed out. The game was rescheduled for March 7. The Nets lost to the Spurs, 129-98.`,source:'nba.com/history'},
  {date:'1987-02-07',imp:2,cat:'milestone',desc:`In Seattle, Michael Jordan started at the opposite foul line to get a running start and took off from the near foul line to dunk without touching the floor in the Nestle Crunch Slam Dunk.`,source:'nba.com/history'},
  {date:'2011-02-07',imp:2,cat:'milestone',desc:`Carmelo Anthony of the Denver Nuggets scores 50 points in a 109-103 loss to the Houston Rockets.`,source:'nba.com/history'},
  {date:'2023-02-07',imp:2,cat:'milestone',desc:`LeBron James sinks a 21-foot turnaround with 10.9 seconds left in the third quarter at Crypto.com Arena, moving him to 38,388 career points. With that basket, he surpassed Kareem Abdul-Jabbar for the NBA’s all-time scoring mark, a title Abdul-Jabbar had held for almost four decades.`,source:'nba.com/history'},
  {date:'1986-02-08',imp:2,cat:'milestone',desc:`5-foot-7 Spud Webb of the Atlanta Hawks scored two perfect scores of 50 to beat teammate Dominique Wilkins in Spud’s hometown of Dallas during the Nestle Crunch Slam Dunk. The AT&T Shootout debuted with Larry Bird capturing the crown.`,source:'nba.com/history'},
  {date:'1987-02-08',imp:2,cat:'milestone',desc:`Tom Chambers of the Seattle SuperSonics, a last-minute replacement for the injured Ralph Sampson, scored a game-high 34 points to lead the West to a 154-149 overtime win over the East in the 37th NBA All-Star Game before 34,275 at the Kingdome. Chambers was named the All-Star MVP for his efforts.`,source:'nba.com/history'},
  {date:'1992-02-08',imp:2,cat:'milestone',desc:`Cedric Ceballos used his “Hocus-Pocus” (blindfolded) dunk to win the Nestle Crunch Slam-Dunk in Orlando.`,source:'nba.com/history'},
  {date:'1992-02-08',imp:2,cat:'milestone',desc:`Craig Hodges of the Chicago Bulls captured his third straight AT&T Shootout at All-Star Saturday in Orlando, beating Sacramento’s Jim Les in the final round. Hodges matched Larry Bird’s string of three straight titles in the event from 1986-88.`,source:'nba.com/history'},
  {date:'1996-02-08',imp:2,cat:'milestone',desc:`After hitting for 30 points in a 107-102 win over visiting New Jersey, Phoenix’s Charles Barkley moves past 20,000 career points.`,source:'nba.com/history'},
  {date:'1998-02-08',imp:2,cat:'milestone',desc:`Michael Jordan scored 23 points, grabbed six rebounds and also dished a team-high eight assists on way to being named the 1998 NBA All-Star Game MVP. Jordan became the oldest All-Star Game MVP, winning the award nine days before his 35th birthday. One night earlier, Utah’s Jeff Hornacek survived an overtime en route to winning the 1998 AT&T Shootout while Cleveland’s Zydrunas Ilgauskas, who scored a game high 18 points, is named the Schick Rookie Game MVP. Houston Rocket Clyde Drexler and Houston Comet Cynthia Cooper captured the title in the debut of the Nestlé Crunch All-Star 2ball competition with a 73-61 win over Utah.`,source:'nba.com/history'},
  {date:'2018-02-08',imp:2,cat:'milestone',desc:`Dwyane Wade is traded from the Cleveland Cavaliers to the Miami Heat for a future second-round pick.`,source:'nba.com/history'},
  {date:'1980-02-09',imp:2,cat:'milestone',desc:`Houston’s Rick Barry connected on 8-of-12 three-pointers in a Rockets victory over Utah, setting a record for three-pointers that would last 10 years, until Seattle’s Dale Ellis sank nine on April 20, 1990.`,source:'nba.com/history'},
  {date:'1986-02-09',imp:2,cat:'milestone',desc:`Isiah Thomas of the Detroit Pistons scored 30 points and handed out 10 assists to lead the East to a 139-132 win and capture the All-Star MVP Award in the 36th All-Star Game in Dallas.`,source:'nba.com/history'},
  {date:'1991-02-09',imp:2,cat:'milestone',desc:`Craig Hodges of the Chicago Bulls set an All-Star Saturday record in Charlotte by hitting 19 straight shots in the AT&T Shootout. That streak, which helped Hodges capture his second straight shootout title, broke Larry Bird’s consecutive shot streak of 11 set in 1986.`,source:'nba.com/history'},
  {date:'1991-02-09',imp:2,cat:'milestone',desc:`Dee Brown used his “Peek-A-Boo” dunk with his head hidden by his forearm to win the Nestle Crunch Slam-Dunk in Charlotte.`,source:'nba.com/history'},
  {date:'1992-02-09',imp:2,cat:'milestone',desc:`Magic Johnson, playing for the first time since announcing his retirement on Nov. 7, 1991 scored a game-high 25 points and dished off for a game-high nine assists to lead the West to a 153-113 win over the East in the 42nd annual NBA All-Star Game at the Orlando Arena. For his memorable effort, Johnson was honored with the second All-Star Game MVP award of his career.`,source:'nba.com/history'},
  {date:'2000-02-09',imp:2,cat:'milestone',desc:`Bobby Phills, who died in an auto accident on January12, 2000, became the first Charlotte Hornets player to have his number retired, as the team had a ceremony prior to their game against the Cleveland Cavaliers. Phills’ No. 13 is raised to the Charlotte Coliseum rafters before the Hornets faced the Cavaliers, whose uniform Phills wore for six seasons before signing with Charlotte as a free agent in 1997.`,source:'nba.com/history'},
  {date:'2004-02-09',imp:2,cat:'milestone',desc:`Rasheed Wallace is traded from the Portland Trail Blazers to the Atlanta Hawks in the precursor to a more famous move. Ten days later, Wallace is dealt again, this time to the Detroit Pistons as part of a three-team deal involving the Hawks, Pistons and Boston Celtics. The trade would help spur Detroit on to The Finals and an upset of the Los Angeles Lakers for the NBA title.`,source:'nba.com/history'},
  {date:'2012-02-09',imp:2,cat:'milestone',desc:`Serge Ibaka of the Oklahoma City Thunder blocks 10 shots in a 106-101 loss to the Sacramento Kings.`,source:'nba.com/history'},
  {date:'2023-02-09',imp:2,cat:'milestone',desc:`In a blockbuster trade, the Brooklyn Nets deal star forward Kevin Durant to the Phoenix Suns as a part of a four-team trade that also involved the Indiana Pacers and Milwaukee Bucks. In the swap, the Suns received Durant and TJ Warren, while the Nets got back Mikal Bridges, Cam Johnson and Juan Pablo Vaulet as well as six future Draft picks and a pick swap.`,source:'nba.com/history'},
  {date:'1949-02-10',imp:2,cat:'milestone',desc:`Joe Fulks of Philadelphia scored 63 points in a 108-87 win over Indianapolis to set an NBA scoring record which would last for nearly a decade.`,source:'nba.com/history'},
  {date:'1952-02-10',imp:2,cat:'milestone',desc:`The Baltimore Bullets played a full 48-minute game without making a single substitution, beating the Fort Wayne Pistons 82-77.`,source:'nba.com/history'},
  {date:'1991-02-10',imp:2,cat:'milestone',desc:`The East team scored 45 second-quarter points–the most ever scored by the East in one quarter of All-Star play–en route to a 116-114 win over the West in the 41st annual All-Star Game in Charlotte. Charles Barkley of the East, the game’s MVP, had 22 rebounds, the most since Wilt Chamberlain grabbed 22 in 1967.`,source:'nba.com/history'},
  {date:'1995-02-10',imp:2,cat:'milestone',desc:`FIBA and the NBA announced that the winner of the NBA Finals would represent the National Basketball Association in the McDonald’s Championship to be played the following October. The tournament featured many of the best club teams in the world. The McDonald’s Championship, formerly known as the McDonald’s Open, was established as a joint effort by FIBA and the NBA in 1987.`,source:'nba.com/history'},
  {date:'1998-02-10',imp:2,cat:'milestone',desc:`Karl Malone passed Adrian Dantley for fifth place on the all-time free throws made list with 6,834.`,source:'nba.com/history'},
  {date:'1998-02-10',imp:2,cat:'milestone',desc:`Atlanta’s Lenny Wilkens earned his 1,100th career victory with a 108-100 defeat of Milwaukee.`,source:'nba.com/history'},
  {date:'1998-02-10',imp:2,cat:'milestone',desc:`Clyde Drexler notched an assist that helped him join John Havlicek, Oscar Robertson and Jerry West as the only NBA players with 6,000 career assists and 20,000 career points in a 97-83 win over the Seattle SuperSonics.`,source:'nba.com/history'},
  {date:'1999-02-10',imp:2,cat:'milestone',desc:`Golden State’s John Starks hit the 1,000th three-pointer of his career in an 89-82 loss to Seattle. Starks became the 15th player in NBA history to make 1,000 three-point field goals.`,source:'nba.com/history'},
  {date:'2002-02-10',imp:2,cat:'milestone',desc:`The Lakers’ Kobe Bryant recorded 31 points on 12-for-25 shooting in 30 minutes and was the unanimous choice as Most Valuable Player, sparking the Western Conference to a 135-120 triumph in the 2002 NBA All-Star Game in Philadelphia.`,source:'nba.com/history'},
  {date:'2017-02-10',imp:2,cat:'milestone',desc:`Golden State’s Draymond Green becomes the first player in NBA history to record a triple-double with fewer than 10 points scored. Green had 12 rebounds, 10 assists, 10 steals and four points in a 122-107 win over Memphis. Green also had five blocks, which made him the first player to record 10 steals and five blocks in a game since steals and blocks were first tracked in 1973-74.`,source:'nba.com/history'},
  {date:'2018-02-10',imp:2,cat:'milestone',desc:`The Boston Celtics officially retired Paul Pierce’s No. 34 jersey after the Cavaliers-Celtics game at TD Garden. Pierce became the 21st Celtics player to have his jersey retired, joining legends such as Larry Bird, Robert Parish, Kevin McHale, Bill Russell, John Havlicek and others.`,source:'nba.com/history'},
  {date:'1970-02-11',imp:2,cat:'milestone',desc:`The Atlanta Hawks scored 97 points, the most ever scored in the second half of an NBA game, en route to a 155-131 win at San Diego. The record for any half was set by Phoenix, which scored 107 points in the first half against Denver on November 10, 1990.`,source:'nba.com/history'},
  {date:'1978-02-11',imp:2,cat:'milestone',desc:`George Gervin of San Antonio scored 23 fourth-quarter points, one more than the entire Golden State team, as the Spurs won in overtime, 131-122.`,source:'nba.com/history'},
  {date:'1982-02-11',imp:2,cat:'milestone',desc:`Houston Rockets center Moses Malone grabbed an NBA-record 21 offensive rebounds in a 117-100 victory over Seattle.`,source:'nba.com/history'},
  {date:'1989-02-11',imp:2,cat:'milestone',desc:`Calvin Murphy scored an event-record 26 points, including a three-pointer at the buzzer, to lead the West over the East 54-53 in the Schick Legends Classic at All-Star Saturday in Houston.`,source:'nba.com/history'},
  {date:'1990-02-11',imp:2,cat:'milestone',desc:`The TeamUp Youth Celebration started in Miami during All-Star Weekend.`,source:'nba.com/history'},
  {date:'1995-02-11',imp:2,cat:'milestone',desc:`The Miami Heat became the first NBA team to have two of its players sweep the All-Star Saturday competition, as Harold Miner won the Nestle Crunch Slam Dunk and Glen Rice captured the AT&T Shootout.`,source:'nba.com/history'},
  {date:'1996-02-11',imp:2,cat:'milestone',desc:`The East team defeats the West 129-118 in the 46th annual NBA All-Star Game played before 36,037 fans at the Alamodome in San Antonio. Shaquille O’Neal scores a game-high 25 points and grabs 10 rebounds and Michael Jordan, the All-Star MVP, has 20 points in only 22 minutes to lead the East.`,source:'nba.com/history'},
  {date:'2001-02-11',imp:2,cat:'milestone',desc:`Allen Iverson of the East All-Stars scored 15 of his game-high 25 points in the fourth quarter to lead his team all the way back from a 19-point deficit after three quarters and score a dramatic 111-110 come-from-behind victory over the West in the 50th NBA All-Star Game at the MCI Center in Washington, D.C. Stephon Marbury of the New Jersey Nets hit a three-pointer with 28 seconds remaining to give the East the victory. Iverson was named the game’s Most Valuable Player.`,source:'nba.com/history'},
  {date:'2011-02-11',imp:2,cat:'milestone',desc:`After 30 years with the Utah Jazz, 23 years as the team’s head coach, Jerry Sloan retires midseason with 1,127 career wins with the team. Sloan reasons he “ran out of gas” but disputes with ownership over the course of the franchise presumably played a role in Sloan’s sudden departure.`,source:'nba.com/history'},
  {date:'1934-02-12',imp:2,cat:'milestone',desc:`Bill Russell is born in Monroe, Louisiana.`,source:'nba.com/history'},
  {date:'1987-02-12',imp:2,cat:'milestone',desc:`Bill Fitch became the fifth coach in NBA history to reach 700 career wins when the Houston Rockets beat the New Jersey Nets 121-99.`,source:'nba.com/history'},
  {date:'1989-02-12',imp:2,cat:'milestone',desc:`A crowd of 44,735, the largest in NBA All-Star Game history at the time, turned out at the Houston Astrodome to watch the West beat the East 143-134 in the 39th renewal, as Utah’s Karl Malone won MVP honors after scoring a team-high 28 points.`,source:'nba.com/history'},
  {date:'1994-02-12',imp:2,cat:'milestone',desc:`Cleveland’s Mark Price captured his second straight AT&T Shootout title, Minnesota rookie Isaiah Rider won the Nestle Crunch Slam Dunk, and the Phenoms, led by Golden State’s Chris Webber (14 points, 10 rebounds), defeated the Sensations 75-68 in the inaugural Schick Rookie Game at All-Star Saturday, held at the Target Center in Minneapolis.`,source:'nba.com/history'},
  {date:'1995-02-12',imp:2,cat:'milestone',desc:`In the 45th annual NBA All-Star Game at America West Arena in Phoenix, Sacramento’s Mitch Richmond scored a game-high 22 points and won MVP honors in leading the West to a 139-112 triumph over the East.`,source:'nba.com/history'},
  {date:'1999-02-12',imp:2,cat:'milestone',desc:`Mark Price announced his retirement from the NBA at a news conference at Alexander Memorial Coliseum, where he starred for Georgia Tech from 1982 to 1986.`,source:'nba.com/history'},
  {date:'1999-02-12',imp:2,cat:'milestone',desc:`Utah’s Karl Malone became the 10th player in NBA history to log 40,000 career minutes in a game against Golden State.`,source:'nba.com/history'},
  {date:'2000-02-12',imp:2,cat:'milestone',desc:`NBA All-Star Saturday in Oakland had Chicago’s Elton Brand winning the Schick Rookie Challenge MVP after finishing with 14 points and 21 rebounds as the 2000 Rookies defeated the 1999 Rookies 92-81 in overtime. The Sony All-Star 2ball competition was won by Utah Jazz guard Jeff Hornacek and Utah Starzz Natalie Williams, as they edged out Phoenix’s Jason Kidd and Jennifer Gillom, 68-61. Hornacek carried his hot shooting into the AT&T Shootout, and became the fourth player in the history of the event to repeat as champion, edging out Dallas’ Dirk Nowitzki and Milwaukee’s Ray Allen in the final round with a score of 13. Vince Carter took center stage in the evening’s grand finale and turned in an Oscar-worthy performance, capturing the NBA.com Slam Dunk title. Carter registered three perfect scores of 50 points and distanced himself from a talented collection of high risers, including second-place finisher Steve Francis of Houston and Raptors teammate and cousin Tracy McGrady (third).`,source:'nba.com/history'},
  {date:'1977-02-13',imp:2,cat:'milestone',desc:`Julius Erving, playing in his first NBA All-Star Game, was voted MVP following a 30-point, 12-rebound performance, despite his East team losing 125-124.`,source:'nba.com/history'},
  {date:'1994-02-13',imp:2,cat:'milestone',desc:`Chicago’s Scottie Pippen hit five three-pointers and scored a game-high 29 points, helping lift the East to a 127-118 win over the West at the 44th annual NBA All-Star Game in Minnesota. Pippen captured All-Star Game MVP honors for his performance.`,source:'nba.com/history'},
  {date:'2000-02-13',imp:2,cat:'milestone',desc:`Shaquille O’Neal, Tim Duncan and Kevin Garnett, the starting frontcourt of 7-footers for the West All-Stars, combined for 70 points and 33 rebounds as the West held off several strong challenges from the East to score a 137-126 victory before an energized crowd at The Arena in Oakland. O’Neal and Duncan shared MVP honors.`,source:'nba.com/history'},
  {date:'1966-02-14',imp:2,cat:'milestone',desc:`Wilt Chamberlain scored 41 points in a 149-123 Philadelphia win over Detroit to pass Bob Pettit (20,880 points), becoming the NBA’s all-time scoring leader, a distinction he held for more than 18 years until passed by Kareem Abdul-Jabbar in 1984.`,source:'nba.com/history'},
  {date:'1967-02-14',imp:2,cat:'milestone',desc:`San Francisco’s Rick Barry scored 50 points against visiting Boston at Oakland, one of his seven 40-plus point games during February en route to his winning the NBA scoring title that season with a 35.6 ppg average.`,source:'nba.com/history'},
  {date:'1975-02-14',imp:2,cat:'milestone',desc:`In one of the longest and highest-scoring games in ABA history, the San Diego Conquistadors defeated the New York Nets 176-166 in four overtimes. The game featured a career-high 63 points from the Nets’ Julius Erving, who set an ABA record by shooting 25-for-46 from the field.`,source:'nba.com/history'},
  {date:'1982-02-14',imp:2,cat:'milestone',desc:`San Antonio’s George Gervin’s failure to score 20 points in a 114-94 win over Seattle broke his club-record streak of 53 straight games with 20 or more points.`,source:'nba.com/history'},
  {date:'1986-02-14',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar surpassed Elvin Hayes’ career total of 50,000 minutes during the Los Angeles Lakers’ 141-117 win over Atlanta, becoming the NBA’s all-time leader in that category.`,source:'nba.com/history'},
  {date:'1987-02-14',imp:2,cat:'milestone',desc:`A crowd of 52,745, at the time the largest in NBA history, turned out at the Pontiac Silverdome to watch the Pistons beat Philadelphia 125-107. The mark lasted less than a year, with the Pistons breaking it at the Silverdome once again, drawing 61,983 for a game against Boston on January 29, 1988.`,source:'nba.com/history'},
  {date:'1995-02-14',imp:2,cat:'milestone',desc:`The Houston Rockets acquired Clyde Drexler (and forward Tracy Murray) from the Portland Trail Blazers for veteran forward Otis Thorpe, a 1995 first round draft choice and the draft rights to forward Marcelo Nicola. With Drexler in place, the Rockets went on to win their second consecutive NBA championship.`,source:'nba.com/history'},
  {date:'2009-02-14',imp:2,cat:'milestone',desc:`Commissioner David Stern announced that the NBA Finals MVP trophy would be named the Bill Russell NBA Finals Most Valuable Player Award in honor of Russell.`,source:'nba.com/history'},
  {date:'2010-02-14',imp:2,cat:'milestone',desc:`The NBA All-Star Game sets a record for attendance at a basketball game, as 108,713 fans take the stands at Cowboys Stadium in Dallas, Texas for a 141-139 victory for the East over the West.`,source:'nba.com/history'},
  {date:'2016-02-14',imp:2,cat:'milestone',desc:`The West defeated the East 196-173 in the 65th NBA All-Star Game before 18,298 fans in Toronto.`,source:'nba.com/history'},
  {date:'2019-02-14',imp:2,cat:'milestone',desc:`Russell Westbrook finishes with 44 points, 14 rebounds and 11 assists in the Oklahoma City Thunder’s 131-122 loss to the New Orleans Pelicans. That marked his 11th straight triple-double, the longest streak in NBA history. The run would come to an end in the Thunder’s next game (on Feb. 22) as Westbrook finished with 43 points, 15 rebounds and eight assists.`,source:'nba.com/history'},
  {date:'1989-02-15',imp:2,cat:'milestone',desc:`Golden State picked up 25 steals against San Antonio in a 133-96 win at the Oakland Coliseum. That tied the NBA record originally set by the Warriors on March 25, 1975, in a 139-122 home win over the Los Angeles Lakers. The Seattle SuperSonics broke the tie when they tallied 27 steals against Toronto on January 15, 1997.`,source:'nba.com/history'},
  {date:'2001-02-15',imp:2,cat:'milestone',desc:`Mitch Richmond of the Washington Wizards became the 26th player in NBA history to score 20,000 points when he tallied 18 points in a 102-78 loss to San Antonio. Richmond achieved the milestone with a 16-foot jump shot in the second quarter.`,source:'nba.com/history'},
  {date:'2009-02-15',imp:2,cat:'milestone',desc:`The West defeated the East 146-119 in the 58th NBA All-Star Game before 16,382 fans in Phoenix.`,source:'nba.com/history'},
  {date:'2015-02-15',imp:2,cat:'milestone',desc:`The West defeated the East 163-158 in the 64th NBA All-Star Game before 17,198 fans in New York.`,source:'nba.com/history'},
  {date:'1967-02-16',imp:2,cat:'milestone',desc:`Rick Barry of the San Francisco Warriors scored 52 points against Chicago at Fresno for his second consecutive 50-point game.`,source:'nba.com/history'},
  {date:'1972-02-16',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the Los Angeles Lakers became the first player in NBA history to reach the 30,000 point mark for his career during a 110-109 loss to the Phoenix Suns. Chamberlain also passed Bill Russell during the 1971-72 season to become the NBA’s all-time leading rebounder.`,source:'nba.com/history'},
  {date:'1992-02-16',imp:2,cat:'milestone',desc:`The Los Angeles Lakers officially retired Magic Johnson’s #32 jersey at halftime of the Celtics-Lakers game at the Great Western Forum. Johnson became the fifth Lakers player to have his jersey retired, joining Jerry West, Elgin Baylor, Wilt Chamberlain and Kareem Abdul-Jabbar.`,source:'nba.com/history'},
  {date:'1994-02-16',imp:2,cat:'milestone',desc:`By handing out 12 assists in Utah’s 103-99 road win over the Los Angeles Clippers, John Stockton became the third guard in NBA history (joining Magic Johnson and Oscar Robertson) to reach the 9,000 career assist plateau.`,source:'nba.com/history'},
  {date:'1996-02-16',imp:2,cat:'milestone',desc:`Vancouver dropped a 110-100 decision to Atlanta in the first of an NBA record 23 consecutive games lost by the Grizzlies.`,source:'nba.com/history'},
  {date:'1999-02-16',imp:2,cat:'milestone',desc:`Gary Gerould, the voice of the Sacramento Kings, announced his 1,000th broadcast during the Kings 101-98 win over the Boston Celtics.`,source:'nba.com/history'},
  {date:'2001-02-16',imp:2,cat:'milestone',desc:`Philadelphia 76ers’ head coach Larry Brown notched his 1,000th professional basketball coaching victory when the 76ers defeated the Los Angeles Clippers 108-93. Brown had 771 coaching wins in the NBA and 229 in the American Basketball Association.`,source:'nba.com/history'},
  {date:'2014-02-16',imp:2,cat:'milestone',desc:`The East defeated the West 163-155 in the 63rd NBA All-Star Game before 12, 727 fans in New Orleans.`,source:'nba.com/history'},
  {date:'2023-02-16',imp:2,cat:'milestone',desc:`Milwaukee Bucks forward Giannis Antetokounmpo feeds Brook Lopez for a 3-pointer in the second quarter against the Chicago Bulls, giving him 3,273 assists with the Bucks to secure the franchise’s all-time lead in that category.`,source:'nba.com/history'},
  {date:'1963-02-17',imp:2,cat:'milestone',desc:`Michael Jordan is born in Brooklyn, New York.`,source:'nba.com/history'},
  {date:'1967-02-17',imp:2,cat:'milestone',desc:`Philadelphia’s Wilt Chamberlain hit the first of what would become an NBA record 35 consecutive field goals without a miss.`,source:'nba.com/history'},
  {date:'1978-02-17',imp:2,cat:'milestone',desc:`The NBA’s 3,000,000th point occurred in Indiana-Washington, Buffalo-Kansas City, Detroit-New York, New Jersey-Cleveland, or Philadelphia-San Antonio game.`,source:'nba.com/history'},
  {date:'1979-02-17',imp:2,cat:'milestone',desc:`Jerry Sloan became the first Chicago Bulls player to have his uniform (#4) retired.`,source:'nba.com/history'},
  {date:'1994-02-17',imp:2,cat:'milestone',desc:`San Antonio’s David Robinson recorded the fourth quadruple-double in NBA history with 34 points, 10 rebounds, 10 assists and 10 blocks in the Spurs’ 115-96 win over visiting Detroit. The three other quadruple-doubles in NBA history were compiled by Hakeem Olajuwon (3/29/90), Alvin Robertson (2/18/86) and Nate Thurmond (10/18/74).`,source:'nba.com/history'},
  {date:'1996-02-17',imp:2,cat:'milestone',desc:`In a pre-game ceremony at the Palace of Auburn Hills, the Detroit Pistons retired the No. 11 jersey of Isiah Thomas, who appeared in 979 regular-season and 111 playoff games with the team in 13 seasons. Thomas, a 12-time all-star, helped lead the Pistons to back-to-back NBA Championships in 1989 and 1990, being named the NBA Finals MVP in ’90 when Detroit defeated Portland in five games.`,source:'nba.com/history'},
  {date:'1999-02-17',imp:2,cat:'milestone',desc:`Minnesota’s Stephon Marbury becomes the fifth player in NBA history to register at least 40 points and 10 assists with no turnovers in a game when he had 40 points, 12 assists and zero turnovers in the Timberwolves’ 116-102 defeat of Houston at the Target Center.`,source:'nba.com/history'},
  {date:'2008-02-17',imp:2,cat:'milestone',desc:`The East defeated the West 134-128 in the 57th NBA All-Star Game before 16, 271 fans in New Orleans.`,source:'nba.com/history'},
  {date:'2013-02-17',imp:2,cat:'milestone',desc:`The West defeated the East 143-138 in the 62nd NBA All-Star Game before 16,101 fans in Houston.`,source:'nba.com/history'},
  {date:'1961-02-18',imp:2,cat:'milestone',desc:`Bob Pettit of St. Louis scored 57 points, the highest scoring game of his great career, in a 141-138 victory over the Detroit Pistons.`,source:'nba.com/history'},
  {date:'1964-02-18',imp:2,cat:'milestone',desc:`Wilt Chamberlain scored 52 points against Detroit, his second consecutive 50-point game.`,source:'nba.com/history'},
  {date:'1972-02-18',imp:2,cat:'milestone',desc:`Randy Smith of Buffalo played the first of what would become an NBA record 906 consecutive games over an 11-year span, ending in March of 1983. Smith’s record was broken by A.C. Green of the Dallas Mavericks, who played his 907th consecutive game on November 20, 1997.`,source:'nba.com/history'},
  {date:'1983-02-18',imp:2,cat:'milestone',desc:`Philadelphia’s Moses Malone scored the NBA’s 4,000,000th point on a tip-in of his own miss at 11:59 of the first quarter against Houston.`,source:'nba.com/history'},
  {date:'1984-02-18',imp:2,cat:'milestone',desc:`Former New York Knicks forward Bill Bradley had his uniform #24 retired at Madison Square Garden.`,source:'nba.com/history'},
  {date:'1986-02-18',imp:2,cat:'milestone',desc:`San Antonio’s Alvin Robertson recorded just the second quadruple-double (along with Nate Thurmond) in NBA history at the time, with 20 points, 11 rebounds, 10 assists and 10 steals in the Spurs’ 120-114 win over Phoenix. Hakeem Olajuwon and David Robinson later became the two other NBA players to accomplish this feat.`,source:'nba.com/history'},
  {date:'1993-02-18',imp:2,cat:'milestone',desc:`The NBA Jam Session Presented by Fleer was introduced at the 1993 All-Star Weekend in Salt Lake City. Jam Session is an event that gives fans the opportunity to experience the NBA interactively through basketball activities and, challenges as well as meeting NBA legends and current stars.`,source:'nba.com/history'},
  {date:'1995-02-18',imp:2,cat:'milestone',desc:`John Stockton became the first guard in NBA history to collect 10,000 career assists after dishing off for 15 in Utah’s 108-98 home win over Boston.`,source:'nba.com/history'},
  {date:'1996-02-18',imp:2,cat:'milestone',desc:`Chicago’s Michael Jordan pours in 44 points and teammate Scottie Pippen adds 40 during the Bulls’ 110-102 road win at Indiana, as they become the ninth pair of NBA teammates (and just the sixth in a non-overtime game) to score 40 or more points in the same game.`,source:'nba.com/history'},
  {date:'1982-02-19',imp:2,cat:'milestone',desc:`Atlanta’s 127-122 four-overtime win over Seattle equaled the fourth-longest game in NBA history and the second-longest since the institution of the 24-second clock.`,source:'nba.com/history'},
  {date:'1995-02-19',imp:2,cat:'milestone',desc:`Houston’s Hakeem Olajuwon passed the 10,000-career rebound plateau after pulling down nine boards in the Rockets’ 122-117 loss at New York.`,source:'nba.com/history'},
  {date:'2007-02-18',imp:2,cat:'milestone',desc:`The West defeated the East 153-132 in the 56th NBA All-Star Game before 15, 694 fans in Las Vegas.`,source:'nba.com/history'},
  {date:'1996-02-19',imp:2,cat:'milestone',desc:`Phoenix’s Charles Barkley pulls down his 10,000th career rebound in the first quarter of the Suns’ 98-94 OT win against visiting Vancouver, becoming the 10th NBA player with 20,000 points and 10,000 rebounds in a career.`,source:'nba.com/history'},
  {date:'2001-02-19',imp:2,cat:'milestone',desc:`Guy Rodgers, a four-time NBA All-Star who led the league in assists twice in a 12-year NBA career from 1958 to 1970, died of a heart attack in Los Angeles at age 65.`,source:'nba.com/history'},
  {date:'2004-02-19',imp:2,cat:'milestone',desc:`The Atlanta Hawks trade forward Rasheed Wallace to the Detroit Pistons as part of a three-team trade also involving the Boston Celtics. Wallace was with the Hawks for just 10 days — having landed there via an earlier trade with the Portland Trail Blazers — before moving on the Pistons. In Detroit that season, Wallace would prove vital to the Pistons winning the NBA championship.`,source:'nba.com/history'},
  {date:'2008-02-19',imp:2,cat:'milestone',desc:`The New Jersey Nets trade star guard Jason Kidd to the Dallas Mavericks. Kidd returned to Dallas, where he spent the first 2 1/2 seasons of his career (1994-96) and would go on to help the Mavs to the NBA title in 2011.`,source:'nba.com/history'},
  {date:'2017-02-19',imp:2,cat:'milestone',desc:`The West defeated the East 192-182 in the 66th NBA All-Star Game before 15, 701 fans in New Orleans.`,source:'nba.com/history'},
  {date:'1972-02-20',imp:2,cat:'milestone',desc:`Larry Brown of the Denver Rockets set ABA records for assists in a game (23), half (18) and quarter (10) during a 146-123 win over the Pittsburgh Condors at Denver.`,source:'nba.com/history'},
  {date:'1996-02-20',imp:2,cat:'milestone',desc:`Utah’s John Stockton became the all-time leader in steals with 2,311, passing previous leader Maurice Cheeks in a 112-98 win over Boston.`,source:'nba.com/history'},
  {date:'1997-02-20',imp:2,cat:'milestone',desc:`Houston’s Hakeem Olajuwon became the 15th player in NBA history to score 23,000 career points in a 107-97 win over Toronto.`,source:'nba.com/history'},
  {date:'2001-02-20',imp:2,cat:'milestone',desc:`Mark Jackson of the Toronto Raptors recorded 12 assists to move past Isiah Thomas and into fourth place on the NBA’s all-time assists list. Jackson notched his 9,062nd career assist in Toronto’s 113-102 win over Golden State.`,source:'nba.com/history'},
  {date:'2003-02-20',imp:2,cat:'milestone',desc:`In a blockbuster trade, the Seattle SuperSonics deal franchise icon Gary Payton (as well as Desmond Mason) to the Milwaukee Bucks for Ray Allen, Flip Murray and Kevin Ollie.`,source:'nba.com/history'},
  {date:'2011-02-20',imp:2,cat:'milestone',desc:`The West defeated the East 148-143 in the 60th NBA All-Star Game before 17,163 fans in Los Angeles.`,source:'nba.com/history'},
  {date:'2017-02-20',imp:2,cat:'milestone',desc:`On the day after the 2017 NBA All-Star Game, the Sacramento Kings trade All-Star center DeMarcus Cousins to the New Orleans Pelicans. Cousins is sent to New Orleans with forward Omri Casspi for Tyreke Evans, Langston Galloway, Buddy Hield, a 2017 1st round draft pick and a 2017 2nd round draft pick.`,source:'nba.com/history'},
  {date:'1952-02-21',imp:2,cat:'milestone',desc:`The Boston Celtics and the Fort Wayne Pistons tipped off at midnight in a “Milkman’s Special” following an Ice Follies performance at Boston Garden. Bob Cousy kept the 2,368 customers awake with 24 points in a 88-67 win.`,source:'nba.com/history'},
  {date:'1960-02-21',imp:2,cat:'milestone',desc:`Wilt Chamberlain scored 58 points in the Warriors 129-122 win over the Knicks, tying his rookie record for the most points scored in a game.`,source:'nba.com/history'},
  {date:'1976-02-21',imp:2,cat:'milestone',desc:`Red Holzman won his 500th game following New York’s 102-98 win over New Orleans at Madison Square Garden. At the time, Holzman was only the second coach–after Red Auerbach–to reach that plateau.`,source:'nba.com/history'},
  {date:'1992-02-21',imp:2,cat:'milestone',desc:`Utah’s John Stockton became only the sixth NBA player ever to collect more than 7,000 career assists when he handed out 15 in a 124-97 Jazz win over Houston at the Delta Center.`,source:'nba.com/history'},
  {date:'1993-02-21',imp:2,cat:'milestone',desc:`The West defeated the East 135-132 in overtime in the 43rd annual NBA All-Star Game in Salt Lake City, as Utah’s John Stockton (15 assists) and Karl Malone (28 points) became the first players from the same NBA team to ever share the All-Star Game MVP award.`,source:'nba.com/history'},
  {date:'2000-02-21',imp:2,cat:'milestone',desc:`New York’s Patrick Ewing reaches the 23,157-point plateau in an 87-76 victory over the Los Angeles Clippers, good for 16th place on the NBA all-time list ahead, passing Elgin Baylor.`,source:'nba.com/history'},
  {date:'2006-02-21',imp:2,cat:'milestone',desc:`Fans at Quicken Loans Arena break the Guinness World Record for “most people wearing wigs in a single venue” when 20,562 fans wear curly wigs given away before the game in celebration of Cleveland Cavaliers forward Anderson Varejao‘s unique hairstyle.`,source:'nba.com/history'},
  {date:'2009-02-21',imp:2,cat:'milestone',desc:`Don Nelson joins Lenny Wilkens as one of the only two NBA coaches with 1,300 wins when the Golden State Warriors beat the Oklahoma City Thunder at the Oracle Arena 133-120.`,source:'nba.com/history'},
  {date:'2016-02-21',imp:2,cat:'milestone',desc:`Anthony Davis of the New Orleans Pelicans scores 59 points in 111-106 win over the Pistons.`,source:'nba.com/history'},
  {date:'1950-02-22',imp:2,cat:'milestone',desc:`Julius Erving is born in Roosevelt, New York.`,source:'nba.com/history'},
  {date:'1962-02-22',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the Philadelphia Warriors attempted an NBA record 34 free throws in a 139-121 Warrior victory over St. Louis.`,source:'nba.com/history'},
  {date:'1985-02-22',imp:2,cat:'milestone',desc:`George Gervin of San Antonio scored his 25,000th career point (ABA/NBA combined) in a 118-111 win over Phoenix.`,source:'nba.com/history'},
  {date:'1992-02-22',imp:2,cat:'milestone',desc:`Golden State Coach Don Nelson became the ninth coach in NBA history to chalk up 700 career victories, following the Warriors’ 126-124 road win over the Los Angeles Lakers. Nelson reached 700 wins in 1,181 games, faster than any other coach except Red Auerbach (1,091 games).`,source:'nba.com/history'},
  {date:'1994-02-22',imp:2,cat:'milestone',desc:`The Schick Rookie Game, showcasing first-year NBA players, was introduced in Minneapolis, replacing the Schick Legends Game.`,source:'nba.com/history'},
  {date:'1996-02-22',imp:2,cat:'milestone',desc:`In one of the most active trading deadline days ever, six trades involving 19 players took place. Miami’s roster underwent the biggest change, as the Heat acquired Tim Hardaway and Chris Gatling from Golden State, Walt Williams and Tyrone Corbin from Sacramento and Tony Smith from Phoenix.`,source:'nba.com/history'},
  {date:'2007-02-22',imp:2,cat:'milestone',desc:`Five-time NBA All-Star Dennis Johnson dies at the age of 52.`,source:'nba.com/history'},
  {date:'2007-02-22',imp:2,cat:'milestone',desc:`After much speculation, Carmelo Anthony (along with Chauncey Billups, Anthony Carter, Renaldo Balkman, and Shelden Williams) gets traded to the New York Knicks in exchange for Raymond Felton, Danilo Gallinari, Wilson Chandler, Timofey Mozgov, $3 million in cash, and a 2014 first-round draft pick. That night, the Knicks also moved three players in a trade with the Minnesota Timberwolves. This trade sent Corey Brewer to New York for Eddy Curry, Anthony Randolph, and $3 million in cash.`,source:'nba.com/history'},
  {date:'1986-02-23',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar of the Los Angeles Lakers replaced Elvin Hayes as the NBA’s all-time leader in games played when he appeared in his 1,304th game, a 117-111 overtime win at Philadelphia. Abdul-Jabbar went on to play in 1,560 games and is now second all-time to Robert Parish, who played in 1,611 games.`,source:'nba.com/history'},
  {date:'1987-02-23',imp:2,cat:'milestone',desc:`Nate McMillan of the Seattle SuperSonics tied the rookie record for assists in one game when he handed out 25 assists in a game against the Los Angeles Clippers. McMillan matched Ernie DiGregorio, who tallied 25 assists on January 1, 1974 against Portland.`,source:'nba.com/history'},
  {date:'1992-02-23',imp:2,cat:'milestone',desc:`Hakeem Olajuwon of Houston rejected seven shots in the Rockets’ 90-83 win over San Antonio at The Summit, becoming the sixth player in NBA history to register 2,000 career blocks.`,source:'nba.com/history'},
  {date:'1993-02-23',imp:2,cat:'milestone',desc:`Utah’s John Stockton picked up seven assists in a 105-78 loss to Houston, becoming only the fourth guard (along with Oscar Robertson, Magic Johnson and Isiah Thomas) in NBA history to reach the 8,000 career assist plateau.`,source:'nba.com/history'},
  {date:'1967-02-24',imp:2,cat:'milestone',desc:`Wilt Chamberlain of Philadelphia shot 18-for-18 from the field against the Baltimore Bullets, an NBA record for field goals in a game without a miss.`,source:'nba.com/history'},
  {date:'1978-02-24',imp:2,cat:'milestone',desc:`Kevin Porter of the New Jersey Nets handed out 29 assists in a 126-112 win over Houston, an NBA record that lasted more than a dozen years, until Orlando’s Scott Skiles collected 30 assists against Denver on December 30, 1990.`,source:'nba.com/history'},
  {date:'1998-02-24',imp:2,cat:'milestone',desc:`Houston’s Hakeem Olajuwon became the eighth player in NBA history to play 1,000 or more games with the same team. John Stockton is the all-time leader, having played in more than 1,300 games for the Utah Jazz.`,source:'nba.com/history'},
  {date:'2023-02-24',imp:2,cat:'milestone',desc:`Malik Monk scores a career-high 45 points and De’Aaron Fox had the go-ahead basket and finished with 42 as the Sacramento Kings beat the LA Clippers 176-175 in double overtime in the second-highest scoring game in NBA history. Detroit beat Denver 186-184 in triple overtime on Dec. 13, 1983, in the highest-scoring NBA game. The Kings are third on the scoring list with the 176 points and the Clippers fourth.`,source:'nba.com/history'},
  {date:'1977-02-25',imp:2,cat:'milestone',desc:`“Pistol” Pete Maravich scored a career-high 68 points as the New Orleans Jazz defeated New York 124-107. Only five NBA players have ever scored more than 68 points in a game.`,source:'nba.com/history'},
  {date:'1995-02-25',imp:2,cat:'milestone',desc:`During Philadelphia’s 84-75 home setback against Indiana, Dana Barros hits a single three-pointer, giving him the NBA single-season record of 44 consecutive games with at least one three-point field goal, breaking Michael Adams’ previous mark of 43. Barros stretched the streak to 58 games by the season’s end and 89 games before it ended on January 12, 1996.`,source:'nba.com/history'},
  {date:'1998-02-25',imp:2,cat:'milestone',desc:`Bill Fitch passed Red Auerbach (938) to become at the time the second-winningest coach in NBA history with a 117-108 win over Philadelphia.`,source:'nba.com/history'},
  {date:'1999-02-25',imp:2,cat:'milestone',desc:`The NBA and Hard Rock Care, International broke ground and unveiled the name — NBA City — and logo of the first-ever NBA restaurant. NBA City opened in summer 1999 in the Citywalk entertainment district at Universal Studios Escape in Orlando, Florida.`,source:'nba.com/history'},
  {date:'1999-02-25',imp:2,cat:'milestone',desc:`Indiana’s Reggie Miller becomes the first NBA player to reach 4,000 three-point field goal attempts in a 81-74 win over the Cleveland Cavaliers.`,source:'nba.com/history'},
  {date:'2016-02-25',imp:2,cat:'milestone',desc:`Stephen Curry of the Golden State Warriors scores 51 points in a 130-114 win over the Orlando Magic.`,source:'nba.com/history'},
  {date:'1985-02-26',imp:2,cat:'milestone',desc:`Philadelphia’s Julius Erving passed Elvin Hayes (27,313 points) as the third leading all-time scorer in pro basketball history during the 76ers’ 116-97 loss at Milwaukee.`,source:'nba.com/history'},
  {date:'2002-02-26',imp:2,cat:'milestone',desc:`By playing five minutes in the Kings’ 107-81 triumph over Utah, Sacramento’s Chucky Brown set a league record by taking the floor with his 12th NBA team.`,source:'nba.com/history'},
  {date:'2012-02-26',imp:2,cat:'milestone',desc:`The West defeated the East 152-149 in the 61st NBA All-Star Game before 17, 125 fans in Orlando, Fl.`,source:'nba.com/history'},
  {date:'2023-02-26',imp:2,cat:'milestone',desc:`Damian Lillard sets a franchise and career highs with 71 points — tied for the most in the NBA this season — and 13 3-pointers and the Portland Trail Blazers snapped a two-game skid with a 131-114 victory over the Houston Rockets. Lillard’s 13 3-pointers were one shy of the NBA record set by Golden State’s Klay Thompson in 2018.`,source:'nba.com/history'},
  {date:'1955-02-27',imp:2,cat:'milestone',desc:`Boston beat Milwaukee 62-57 at Providence, Rhode Island in a game which set a record for fewest points scored by both teams since the introduction of the 24-second clock.`,source:'nba.com/history'},
  {date:'1959-02-27',imp:2,cat:'milestone',desc:`Boston Celtics star Bob Cousy dished off for what was then an NBA record 28 assists in a 173-139 win over Minneapolis, the highest scoring game in NBA history at that time. Boston’s 173 points is still the record for a non-overtime game, a mark that was matched by Phoenix in 1990. Scott Skiles of Orlando set the NBA single-game assist record of 30 on December 30, 1990. Cousy’s record of 19 assists in one half has stood for more than 40 years.`,source:'nba.com/history'},
  {date:'1996-02-27',imp:2,cat:'milestone',desc:`The Bulls defeated Minnesota 120-99 at the United Center and improved to 50-6, reaching 50 wins with the fewest losses in a season of any major professional sports team (NBA, NHL, NFL, MLB) this century.`,source:'nba.com/history'},
  {date:'1998-02-27',imp:2,cat:'milestone',desc:`The Indiana Pacers defeat the Portland Trail Blazers 124-59. The 65-point margin of victory is the second-largest in NBA history, outpaced only by the 68-point margin when Cleveland defeated Miami 148-80 on December 17, 1991.`,source:'nba.com/history'},
  {date:'1999-02-27',imp:2,cat:'milestone',desc:`Los Angeles Clippers broadcaster Ralph Lawler works his 1,500th Clippers game in a game against the Atlanta Hawks.`,source:'nba.com/history'},
  {date:'1999-02-27',imp:2,cat:'milestone',desc:`The Golden State Warriors, with a 110-93 defeat of Denver, became the seventh franchise in NBA history to register 2,000 victories. The Warriors’ mark includes the triumphs posted by the Philadelphia Warriors (1946-62) and San Francisco Warriors (1962-71).`,source:'nba.com/history'},
  {date:'2002-02-27',imp:2,cat:'milestone',desc:`Mengke Bateer becomes the second player from China to play in the NBA, when he joins the Denver Nuggets and records three rebounds in 14 minutes of Denver’s 110-93 loss at Golden State.`,source:'nba.com/history'},
  {date:'2012-02-27',imp:2,cat:'milestone',desc:`In the third quarter of the West’s 152-149 victory over the East, Kobe Bryant breaks Michael Jordan’s record for career points scored in the ASG. Needing 19 points to surpass Jordan’s record of 262 career points, Bryant finished the game with 27 points to set the new record at 271 points.`,source:'nba.com/history'},
  {date:'2013-02-27',imp:2,cat:'milestone',desc:`Stephen Curry of the Golden State Warriors scores 54 points in a 109-105 loss to the New York Knicks.`,source:'nba.com/history'},
  {date:'1967-02-28',imp:2,cat:'milestone',desc:`Wilt Chamberlain missed his first field goal in four games to end his NBA record shooting streak of 35 consecutive field goals, during Philadelphia’s 127-107 victory over Cincinnati at Syracuse.`,source:'nba.com/history'},
  {date:'1981-02-28',imp:2,cat:'milestone',desc:`Houston’s Calvin Murphy made the last of his 78 consecutive free throws, in a game against San Diego, setting what was then an NBA record. The record was later broken during the 1993-94 season by Minnesota’s Micheal Williams, who converted 97 consecutive free throws.`,source:'nba.com/history'},
  {date:'1987-02-28',imp:2,cat:'milestone',desc:`Los Angeles Lakers broadcaster Chick Hearn called his 2,000th consecutive game for the club, a streak spanning 22 years.`,source:'nba.com/history'},
  {date:'2003-02-28',imp:2,cat:'milestone',desc:`Patrick Ewing, New York Knicks legend, and the first ever NBA lottery draft pick, watches as his jersey number 33 is retired before a cheering crowd at Madison Square Garden.`,source:'nba.com/history'},
  {date:'2013-02-28',imp:2,cat:'milestone',desc:`Joakim Noah of the Chicago Bulls blocks 11 shots in a 93-82 win over the Phliladelphia 76ers.`,source:'nba.com/history'},
  {date:'1964-02-29',imp:2,cat:'milestone',desc:`Cincinnati Royals teammates Jerry Lucas and Oscar Robertson combined for a rare 40-40 performance as the Royals defeated the host Philadelphia 76ers 117-114. Rookie of the Year Lucas collected a team-record 40 rebounds and league MVP Robertson tallied 43 points.`,source:'nba.com/history'},
  {date:'1978-03-01',imp:2,cat:'milestone',desc:`John Drew of Atlanta committed 14 turnovers in a game at New Jersey, an NBA record. Jason Kidd of the Phoenix Suns tied the record by committing 14 turnovers against New York on November 17, 2000.`,source:'nba.com/history'},
  {date:'1981-03-01',imp:2,cat:'milestone',desc:`Calvin Murphy of the Houston Rockets missed a free mthrow in San Antonio, ending his NBA record consecutive free throw streak at 78. Murphy’s record was broken by Minnesota’s Micheal Williams, who put together a streak of 84 consecutive free throws through the end of the 1992-93 season. The streak eventually grew to 97, before Williams missed a FT attempt early in the 1993-94 season.`,source:'nba.com/history'},
  {date:'1986-03-01',imp:2,cat:'milestone',desc:`The New York Knicks retired Hall of Famer Earl “The Pearl” Monroe’s uniform No. 15. Monroe starred on the Knicks’ 1973 NBA championship team.`,source:'nba.com/history'},
  {date:'1996-03-01',imp:2,cat:'milestone',desc:`Atlanta’s Lenny Wilkens became the first coach in the NBA to reach 1,000 career victories when the Hawks downed the Cleveland Cavaliers 74-68.`,source:'nba.com/history'},
  {date:'1998-03-01',imp:2,cat:'milestone',desc:`Miami head coach Pat Riley became the fifth coach to record 900 career wins with a 85-84 win over New Jersey.`,source:'nba.com/history'},
  {date:'1999-03-01',imp:2,cat:'milestone',desc:`Philadelphia’s Larry Brown coached his 1,200th NBA game as the Sixers defeat the Washington Wizards 104-91. Brown becomes the 12th coach to coach 1,200 NBA games, joining Pat Riley, Don Nelson and Lenny Wilkens as the only active coaches with 1,200 games coached.`,source:'nba.com/history'},
  {date:'2009-03-01',imp:2,cat:'milestone',desc:`Deron Williams of the Utah Jazz dished 20 assists in a 112-104 win over the Golden State Warriors.`,source:'nba.com/history'},
  {date:'1951-03-02',imp:2,cat:'milestone',desc:`In the first NBA All-Star Game, held at Boston Garden, “Easy” Ed Macauley of the Celtics scored 20 points to lead the East to a 111-94 victory. Macauley was named the game’s MVP.`,source:'nba.com/history'},
  {date:'1962-03-02',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the Philadelphia Warriors scored 100 points, the most ever by an NBA player in a single game, during his team’s 169-147 win over the New York Knicks in Hershey, Pennsylvania. Chamberlain shot 36-of-63 from the field and 28-of-32 from the free-throw line, to go with 25 rebounds. His 50.4 ppg scoring average in 80 games during the 1961-62 season remains an NBA record.`,source:'nba.com/history'},
  {date:'1988-03-02',imp:2,cat:'milestone',desc:`The flaming basketball is adopted as Miami’s official logo from over 1,000 entries. Mark Henderson submitted the winning entry.`,source:'nba.com/history'},
  {date:'1993-03-02',imp:2,cat:'milestone',desc:`Denver retired the No. 7 jersey of long-time Nugget Alex English, who spent 10 1/2 of his 15 years in the NBA in the Mile High City, scoring a career total of 25,613 points.`,source:'nba.com/history'},
  {date:'2024-03-02',imp:2,cat:'milestone',desc:`LeBron James becomes the first player in NBA history to reach 40,000 points in a 124-114 loss to the Denver Nuggets. James drove past Michael Porter Jr. and hit a layup with 10:39 left for the historic basket in 1,475 regular-season games.`,source:'nba.com/history'},
  {date:'1985-03-03',imp:2,cat:'milestone',desc:`Kevin McHale of the Celtics connected on 22-of-28 field goal attempts and scored a team-record 56 points in a 138-129 victory over Detroit at Boston Garden. Nine days later against Atlanta, Larry Bird set a new Celtics single-game scoring record by hitting for 60 points.`,source:'nba.com/history'},
  {date:'1986-03-03',imp:2,cat:'milestone',desc:`Mark Aguirre of the Mavericks scored 42 points, giving him back-to-back games of 40-plus points, as he led Dallas to a 139-138 double-overtime win over Phoenix.`,source:'nba.com/history'},
  {date:'1995-03-03',imp:2,cat:'milestone',desc:`Phoenix forward A.C. Green moved past former NBA great Dolph Schayes and into third place on the all-time consecutive games played list, with 707, after playing 38 minutes and scoring 13 points in the Suns’ 122-118 overtime win over visiting Seattle.`,source:'nba.com/history'},
  {date:'1999-03-03',imp:2,cat:'milestone',desc:`Milwaukee’s Dell Curry reached 1,000 3-pointers made in a 106-78 win over the Golden State Warriors.`,source:'nba.com/history'},
  {date:'2014-03-03',imp:2,cat:'milestone',desc:`LeBron James of the Miami Heat scores 61 points in a 124-107 win over the Charlotte Bobcats. James made 22 of 33 shots from the field, including his first eight 3-point attempts. He had 24 points at halftime, then added 25 in the third quarter. The record-breaker came with 5:46 left, when James spun through three defenders for a layup that fell as he tumbled to the court.`,source:'nba.com/history'},
  {date:'2020-03-03',imp:2,cat:'milestone',desc:`San Antonio Spurs legend and Hall of Famer Tim Duncan makes his debut as an NBA coach, serving as the Spurs’ acting head coach in a 104-103 road win against the Charlotte Hornets. Duncan was filling in for coach Gregg Popovich, who missed the game due to personal reasons.`,source:'nba.com/history'},
  {date:'1982-03-04',imp:2,cat:'milestone',desc:`San Antonio’s George Gervin racked up 48 points, surpassing 19,000 career points, in a 110-101 loss to Boston.`,source:'nba.com/history'},
  {date:'1996-03-04',imp:2,cat:'milestone',desc:`Utah’s John Stockton hands out 11 assists during the Jazz’ 110-87 victory over Phoenix, becoming the first NBA player to collect 11,000 career assists.`,source:'nba.com/history'},
  {date:'1998-03-04',imp:2,cat:'milestone',desc:`Arbitrator John Feerick upheld the NBA’s suspension of Latrell Sprewell for the 1997-98 season, resulting in a monetary penalty of $6.4 million, finding that the NBA’s investigation was “done in good faith and was fair and adequate.” Feerick also found “that the NBA complied with the standards of industrial due process.” He reduced the NBA’s suspension to the extent it had included approximately one month of the 1998-99 season. However, the arbitrator reinstated Sprewell’s contract with Golden State for the 1998-99 and 1999-2000 seasons, finding that the combination of a one-season suspension and a contract termination would not be appropriate under all of the circumstances.`,source:'nba.com/history'},
  {date:'2012-03-04',imp:2,cat:'milestone',desc:`Deron Williams of the New Jersey Nets scores 57 points in a 104-101 win over the Charlotte Bobcats.`,source:'nba.com/history'},
  {date:'2012-03-04',imp:2,cat:'milestone',desc:`Rajon Rondo of the Boston Celtics dished 20 assists in a 115-111 win over the New York Knicks.`,source:'nba.com/history'},
  {date:'2016-03-04',imp:2,cat:'milestone',desc:`Damian Lillard of the Portland Trail Blazers scores 50 points in a 117-115 loss to the Toronto Raptors.`,source:'nba.com/history'},
  {date:'1983-03-05',imp:2,cat:'milestone',desc:`Golden State’s Joe Barry Carroll scored 52 points in a 127-121 Warriors victory over the Utah Jazz.`,source:'nba.com/history'},
  {date:'1996-03-05',imp:2,cat:'milestone',desc:`Dallas sets a then NBA record for 3-point field goal attempts (49) in a game during a 127-117 win over visiting New Jersey. George McCloud makes seven threes in an NBA record-tying 20 attempts. Michael Adams of Denver also attempted 20 3-point field goals against the Los Angeles Clippers on April 12, 1991. The mark was surpassed by the Rockets on Jan. 16, 2019 as Houston attempted 70 3-pointers.`,source:'nba.com/history'},
  {date:'1982-03-06',imp:2,cat:'milestone',desc:`The Spurs defeated Milwaukee 171-166 in triple-overtime in San Antonio in what was then the highest scoring game in NBA history. The mark of 337 points was erased when Detroit beat Denver 186-184, also in triple-overtime, on December 13, 1983 for a total of 370 points.`,source:'nba.com/history'},
  {date:'2000-03-06',imp:2,cat:'milestone',desc:`Shaquille O’Neal of the Los Angeles Lakers scored an NBA season-high 61 points to go with 23 rebounds in the Lakers’ 123-103 triumph over the Los Angeles Clippers.`,source:'nba.com/history'},
  {date:'2001-03-06',imp:2,cat:'milestone',desc:`The Portland Trail Blazers retired the No. 22 jersey worn by versatile guard Clyde Drexler, who played for the team for more than 11 seasons from 1983 to 1995.`,source:'nba.com/history'},
  {date:'2019-03-06',imp:2,cat:'milestone',desc:`With a driving layup in the second quarter against the Denver Nuggets, LeBron James of the Los Angeles Lakers surpassed Michael Jordan’s 32,292 career points. In doing so, James became the fourth-leading scorer in NBA history. Despite his efforts, though, the Lakers lost the game, 115-99.`,source:'nba.com/history'},
  {date:'2026-03-06',imp:2,cat:'milestone',desc:`LeBron James hit a turnaround 12-foot jumperwith 12 seconds left in the first quarter of theLakers’ 120-113 loss to the Nuggetsto surpass Kareem Abdul-Jabbar’s mark. The record-breaking bucket gave James 15,838 career field goals in his unprecedented 23rd NBA season. Abdul-Jabbar had 15,837 baskets when the skyhook-wielding big man ended his 20-year career in 1989 as the NBA’s career scoring leader.`,source:'nba.com/history'},
  {date:'1974-03-07',imp:2,cat:'milestone',desc:`The New Orleans Jazz (who later moved to Utah) became the NBA’s 18th franchise.`,source:'nba.com/history'},
  {date:'1995-03-07',imp:2,cat:'milestone',desc:`Dominique Wilkins of Boston scored 19 points in the Celtics’ 115-110 loss at New York, moving him past 25,000 career points, the ninth NBA player to reach that plateau.`,source:'nba.com/history'},
  {date:'1996-03-07',imp:2,cat:'milestone',desc:`With seven assists against Sacramento in the visiting Lakers’ 102-89 victory, Magic Johnson becomes the second NBA player to register 10,000 career assists.`,source:'nba.com/history'},
  {date:'2001-03-07',imp:2,cat:'milestone',desc:`The Phoenix Suns retired the No. 7 jersey worn by Kevin Johnson, the immensely popular point guard who played for the team for 12 seasons and retired sixth on the NBA’s all-time assists list.`,source:'nba.com/history'},
  {date:'2017-03-07',imp:2,cat:'milestone',desc:`Russell Westbrook of the Oklahoma City Thunder scores 58 points in a 126-121 loss to the Portland Trail Blazers.`,source:'nba.com/history'},
  {date:'2017-03-07',imp:2,cat:'milestone',desc:`The Dallas Mavericks’ Dirk Nowitzki becomes the sixth member of the 30,000 all-time points club in a win over the Los Angeles Lakers.`,source:'nba.com/history'},
  {date:'1971-03-08',imp:2,cat:'milestone',desc:`The Milwaukee Bucks defeated Seattle 104-99 to run their winning streak to 20 straight games, the second-longest winning streak in NBA history, behind the 33 consecutive games won by the Los Angeles Lakers during the 1971-72 season. Milwaukee finished the 1970-71 season with a 66-16 record and went on to capture the NBA championship.`,source:'nba.com/history'},
  {date:'1994-03-08',imp:2,cat:'milestone',desc:`Chicago’s Scottie Pippen and Pete Myers became the first set of teammates in NBA history to convert four-point plays (3-point field goal and free throw) in the same game, with both turning the trick in the fourth quarter of the Bulls’ 116-95 win over visiting Atlanta.`,source:'nba.com/history'},
  {date:'1996-03-08',imp:2,cat:'milestone',desc:`Utah coach Jerry Sloan won his 500th career NBA game after the Jazz defeated visiting Houston 109-89.`,source:'nba.com/history'},
  {date:'2006-03-08',imp:2,cat:'milestone',desc:`In the first major professional sporting event in New Orleans since Hurricane Katrina devastated the city more than six months earlier, the Lakers defeat the Hornets, 113-107. A sellout crowd of 17,744 shows up at New Orleans Arena, which encountered flooding problems following one of the worst hurricanes in American history on August 29, 2005.`,source:'nba.com/history'},
  {date:'2008-03-08',imp:2,cat:'milestone',desc:`Atlanta defeats the Miami Heat in the first NBA “do-over” game in a quarter-century. On December 19, 2007 Atlanta’s scorer mistakenly fouled out Miami’s Shaquille O’Neal with 51.9 seconds left in overtime and the Hawks up, 114-111. Miami appealed and the league ordered the end of the game to be replayed. The game ends in anti-climactic fashion, as neither team scores. Despite having only five fouls, Shaq does not play in the redo, having been traded in the interim to the Phoenix Suns.`,source:'nba.com/history'},
  {date:'2025-03-08',imp:2,cat:'milestone',desc:`Denver Nuggets star Nikola Jokić became the first player in NBA history to amass at least 30 points, 20 rebounds and 20 assists in a single game, finishing with 31 points, 21 rebounds and 22 assists in a 149-141 win vs. Phoenix. Jokić was still an assist shy of the historic 30-20-20 mark with less than 90 seconds remaining in overtime. Twenty-seven seconds later, he had 22, cementing his name in history with passes leading to two dunks and a layup.`,source:'nba.com/history'},
  {date:'1958-03-09',imp:2,cat:'milestone',desc:`George Yardley of the Detroit Pistons became the first NBA player to score 2,000 points in a single season.`,source:'nba.com/history'},
  {date:'1960-03-09',imp:2,cat:'milestone',desc:`The Boston Celtics defeated the New York Knicks 148-128 at Boston Garden, giving the Celtics their 59th win of the season, topping the previous NBA high for wins in a season by seven. The Celtics also set NBA records during that 1959-60 season for the most field goals made per game (49.9) and field goal attempted per game (119.6) and the most rebounds per game (71.5). All three records still stand more than 40 years later.`,source:'nba.com/history'},
  {date:'1979-03-09',imp:2,cat:'milestone',desc:`Detroit’s Kevin Porter handed out a franchise-record 25 assists as the Pistons defeated Boston 160-117 at the Pontiac Silverdome. Porter finished the 1978-79 season with 1,099 (13.4 apg) assists, becoming the first player in NBA history to garner over 1,000 assists in a season.`,source:'nba.com/history'},
  {date:'1985-03-09',imp:2,cat:'milestone',desc:`Fat Lever of the Denver Nuggets set an NBA record for steals in one quarter when he notched eight against the Indiana Pacers.`,source:'nba.com/history'},
  {date:'1988-03-09',imp:2,cat:'milestone',desc:`Los Angeles Lakers coach Pat Riley recorded his 400th career victory in a 104-99 win over the Knicks in New York, reaching the 400 victory plateau faster (540 games) than any other coach in NBA history.`,source:'nba.com/history'},
  {date:'1997-03-09',imp:2,cat:'milestone',desc:`Utah’s Karl Malone became the fifth player in NBA history with 25,000 points and 10,000 rebounds during a 115-106 vicotry at Minnesota.`,source:'nba.com/history'},
  {date:'1999-03-09',imp:2,cat:'milestone',desc:`Houston’s Hakeem Olajuwon blocks career shot No. 3,500 in game against Denver. He finishes the game with 3,503 career blocks and is the NBA’s all-time leader in blocked shots, an official statistic beginning with the 1973-74 season.`,source:'nba.com/history'},
  {date:'2000-03-09',imp:2,cat:'milestone',desc:`Wilt Chamberlain, who played one season with the Harlem Globetrotters before moving to the NBA, has his No. 13 retired by the Globetrotters when they play at Overbrook High School in Philadelphia, Chamberlain’s alma mater. Chamberlain, who is the first Globetrotter to have his number retired, is one of five people with Globetrotters ties to be inducted into the Naismith Memorial Basketball Hall of Fame. The four others are William “Pop” Gates, Connie Hawkins, Marques Haynes, and founder Abe Saperstein.`,source:'nba.com/history'},
  {date:'2011-03-09',imp:2,cat:'milestone',desc:`With 16 points and 21 rebounds in a 101-75 win over the Indiana Pacers, Minnesota Timberwolves superstar Kevin Love records his 52nd straight double-double, breaking Moses Malone’s record for the most consecutive double-doubles since the NBA-ABA merger.`,source:'nba.com/history'},
  {date:'2016-03-09',imp:2,cat:'milestone',desc:`Four-time NBA All-Star Clyde Lovellette dies at the age of 86.`,source:'nba.com/history'},
  {date:'1961-03-10',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the Philadelphia Warriors became the first NBA player to score 3,000 points in a season.`,source:'nba.com/history'},
  {date:'1963-03-10',imp:2,cat:'milestone',desc:`Wilt Chamberlain, playing for the San Francisco Warriors, scored 70 points in a 163-148 loss to Syracuse, one of six 70-plus point games in his career.`,source:'nba.com/history'},
  {date:'1985-03-10',imp:2,cat:'milestone',desc:`Dallas coach Dick Motta became the fourth NBA coach to record his 700th career victory as the Mavericks beat New Jersey 126-113.`,source:'nba.com/history'},
  {date:'1987-03-10',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar became the NBA’s all-time leader in personal fouls committed when he charged into Denver’s Danny Schayes with 4:23 left in the first quarter of the Lakers’ 143-107 victory over the Nuggets. Referee Bruce Alexander blew the whistle on the 4,194th foul of Abdul-Jabbar’s career, which moved Abdul-Jabbar past previous leader Elvin Hayes (4,193).`,source:'nba.com/history'},
  {date:'1987-03-10',imp:2,cat:'milestone',desc:`Ron Harper of Cleveland sets a franchise record and NBA rookie record for steals in a game with 10 during the Cavaliers’ 100-91 loss to Philadelphia at Richfield Coliseum.`,source:'nba.com/history'},
  {date:'1998-03-10',imp:2,cat:'milestone',desc:`Houston forwards Charles Barkley and Kevin Willis both played in the 1,000th game of their NBA careers.`,source:'nba.com/history'},
  {date:'1999-03-10',imp:2,cat:'milestone',desc:`The Los Angeles Clippers lost their 17th straight game to begin the lockout-shortened 1998-99 season, tying the NBA record for losses at the start of a season set by the Miami Heat in the 1988-89 season.`,source:'nba.com/history'},
  {date:'1999-03-10',imp:2,cat:'milestone',desc:`USA Basketball announced the first nine players of the 1999 USA Men’s Senior National Team. Selected are Vin Baker (Seattle SuperSonics); Tim Duncan (San Antonio Spurs); Kevin Garnett (Minnesota Timberwolves); Tom Gugliotta (Phoenix Suns); Tim Hardaway (Miami Heat); Allan Houston (New York Knicks); Jason Kidd (Phoenix Suns); Gary Payton (Seattle SuperSonics) and Steve Smith (Atlanta Hawks). Duncan and Gugliotta later are forced to withdraw from the team due to injuries.`,source:'nba.com/history'},
  {date:'2000-03-10',imp:2,cat:'milestone',desc:`The Detroit Pistons hold a ceremony to retire the jersey of Joe Dumars when they host Vancouver at the Palace of Auburn Hills. Dumars, who won two NBA championships with the Pistons, becomes the seventh member of the club to have his number raised. Dumars joins Dave Bing (No. 21), Bob Lanier (No. 16), Vinnie Johnson (No. 15), Bill Laimbeer (No. 40), Isiah Thomas (No. 11) and coach Chuck Daly (No. 2).`,source:'nba.com/history'},
  {date:'2000-03-10',imp:2,cat:'milestone',desc:`The NBA announced that it would honor Joe Dumars, who led the Detroit Pistons to a pair of NBA championships, by naming the NBA Sportsmanship Award named for him. The Joe Dumars Trophy will be presented annually to the player who best represents the ideals of sportsmanship on the court, with the winner selected by writers and broadcasters who cover the NBA. Dumars was the winner of the inaugural NBA Sportsmanship Award in 1995-96, in recognition of his distinguished career.`,source:'nba.com/history'},
  {date:'2002-03-10',imp:2,cat:'milestone',desc:`By registering 13 assists in a 95-92 loss to Houston, Utah’s John Stockton improved his career assist total of 15,000, and became the only player in NBA history to reach that plateau.`,source:'nba.com/history'},
  {date:'2004-03-10',imp:2,cat:'milestone',desc:`Tracy McGrady scores an Orlando Magic franchise-record 62 points in a 108-99 victory over the Washington Wizards.`,source:'nba.com/history'},
  {date:'2004-03-10',imp:2,cat:'milestone',desc:`Richard Hamilton wears his trademark mask for the first time.`,source:'nba.com/history'},
  {date:'2004-03-10',imp:2,cat:'milestone',desc:`Richard Hamilton wears his trademark mask for the first time.`,source:'nba.com/history'},
  {date:'2026-03-10',imp:2,cat:'milestone',desc:`Bam Adebayo scored 83 points, the second-best scoring effort in NBA history, to carry the Heat to a 150-129 win over the Wizards. Adebayo had 31 points in the first quarter, 43 by halftime and 62 by the end of the third quarter. He finished 20 for 43 from the field, 36 for 43 from the foul line and 7 for 22 from 3-point range. Adebayo’s free throw makes and attempts both set NBA records for a game.`,source:'nba.com/history'},
  {date:'1965-03-11',imp:2,cat:'milestone',desc:`Boston’s Bill Russell grabbed 49 rebounds, the third-highest total in NBA history, in a 112-100 win over Detroit at Providence.`,source:'nba.com/history'},
  {date:'2000-03-11',imp:2,cat:'milestone',desc:`Rolando Blackman, then a holder of 24 Dallas Mavericks records, was honored by the team when it retired his No. 22 jersey during halftime of Dallas’ game against Phoenix at Reunion Arena. Blackman joined Brad Davis (No. 15) as the only Mavericks to be so honored.`,source:'nba.com/history'},
  {date:'1956-03-12',imp:2,cat:'milestone',desc:`Dick Farley of Syracuse fouled out after playing just five minutes, the fastest disqualification in NBA history, in a game against St. Louis. Farley’s record stood for more than 41 years until Bubba Wells of the Dallas Mavericks fouled out in three minutes against the Chicago Bulls December 29, 1997.`,source:'nba.com/history'},
  {date:'1972-03-12',imp:2,cat:'milestone',desc:`It was Bill Russell Day at Boston Garden, and uniform No. 6 was retired in afternoon ceremonies.`,source:'nba.com/history'},
  {date:'1985-03-12',imp:2,cat:'milestone',desc:`Larry Bird scored a Celtics-record 60 points as Boston beat Atlanta 126-115 in New Orleans.`,source:'nba.com/history'},
  {date:'1992-03-12',imp:2,cat:'milestone',desc:`Golden State coach Don Nelson became the first man in NBA history to participate in 2,500 NBA games as a player and coach (regular season and Playoffs), as he led the Warriors against Detroit at the Oakland Coliseum Arena. The Pistons ended up ruining the occasion by posting a 119-112 win over the Warriors.`,source:'nba.com/history'},
  {date:'1992-03-12',imp:2,cat:'milestone',desc:`Milwaukee’s Moses Malone scored 17 points in the Bucks’ 106-100 setback against visiting Phoenix, moving him into fourth place on the NBA’s all-time scoring list at the time — behind Kareem Abdul-Jabbar, Wilt Chamberlain and Elvin Hayes — with 26,715 points.`,source:'nba.com/history'},
  {date:'1998-03-12',imp:2,cat:'milestone',desc:`Hakeem Olajuwon joined Kareem Abdul-Jabbar and Wilt Chamberlain as the only players in NBA history with at least 24,000 points, 12,000 rebounds and 2,500 assists.`,source:'nba.com/history'},
  {date:'1998-03-12',imp:2,cat:'milestone',desc:`Basketball Hall of Famer and former NBA player Buddy Jeannette passed away after suffering a stroke at age 80.`,source:'nba.com/history'},
  {date:'2015-03-12',imp:2,cat:'milestone',desc:`Kyrie Irving of the Cleveland Cavaliers score 57 points in a 128-125 win over the San Antonio Spurs.`,source:'nba.com/history'},
  {date:'2020-03-12',imp:2,cat:'milestone',desc:`The 2019-20 season is suspended by NBA Commissioner Adam Silver after a player on the Utah Jazz has preliminarily tested positive for COVID-19. The NBA used this hiatus to determine next steps for moving forward in regard to the worldwide coronavirus pandemic. That same day, the NBA G League suspends its 2019-20 season as well.`,source:'nba.com/history'},
  {date:'1962-03-13',imp:2,cat:'milestone',desc:`The Boston Celtics beat the Syracuse Nationals 142-110, becoming the first team to win 60 games (60-20) in an NBA season.`,source:'nba.com/history'},
  {date:'1983-03-13',imp:2,cat:'milestone',desc:`Randy Smith’s consecutive game played streak ended at 906 games, then the longest in NBA history. During that time Smith played for Buffalo, San Diego (twice), Cleveland and New York. A.C. Green of the Dallas Mavericks broke Smith’s record on November 20, 1997.`,source:'nba.com/history'},
  {date:'1990-03-13',imp:2,cat:'milestone',desc:`Denver coach Doug Moe earned his 600th career victory in the Nuggets’ 117-114 win over the Houston Rockets.`,source:'nba.com/history'},
  {date:'1992-03-13',imp:2,cat:'milestone',desc:`Los Angeles Lakers broadcaster Chick Hearn called his 2,500th consecutive Lakers game at the Richfield Coliseum in Cleveland, a streak dating back to November of 1965.`,source:'nba.com/history'},
  {date:'1998-03-13',imp:2,cat:'milestone',desc:`Utah’s John Stockton scored the 15,000th point of his career in a 110-101 win over Vancouver.`,source:'nba.com/history'},
  {date:'1999-03-13',imp:2,cat:'milestone',desc:`Charles Barkley of the Houston Rockets became the third player in NBA history to amass 20,000 points, 10,000 rebounds and 4,000 assists when he recorded his first assist in a 100-89 victory over Cleveland. He joined Kareem Abdul-Jabbar and Wilt Chamberlain in this elite group.`,source:'nba.com/history'},
  {date:'1999-03-13',imp:2,cat:'milestone',desc:`Dallas’ A.C. Green plays in his 1,000th consecutive game in a 91-74 win over the Vancouver Grizzlies.`,source:'nba.com/history'},
  {date:'2009-03-13',imp:2,cat:'milestone',desc:`LeBron James of the Cleveland Cavaliers scores 51 points in a 126-123 win over the Sacramento Kings.`,source:'nba.com/history'},
  {date:'2021-03-13',imp:2,cat:'milestone',desc:`For the first time in NBA history, five different players recorded the statistical feat on the same day:  the Bucks’ Giannis Antetokounmpo, the Wizards’ Russell Westbrook, the Pacers’ Domantas Sabonis, the Nets’ James Harden and the Knicks’ Julius Randle. Antetokounmpo and Westbrook’s respective triple-doubles occurred in the same game, marking just the sixth time in league history opponents registered 30-point versions of the milestone.`,source:'nba.com/history'},
  {date:'2025-03-13',imp:2,cat:'milestone',desc:`Golden State Warriors guard Stephen Curry becomes the first player in NBA history to reach 4,000 3-pointers. He hit the shotfrom the right wing and under pressure off a pass from Moses Moody with 8:19 left in the third quarter of a 130-104 win vs. the Sacramento Kings.`,source:'nba.com/history'},
  {date:'1954-03-14',imp:2,cat:'milestone',desc:`Baltimore dropped a 65-54 decision at Milwaukee, giving the Bullets their 20th consecutive road loss for the season, and making them the only team in NBA history to go an entire season without winning a game on the road.`,source:'nba.com/history'},
  {date:'1960-03-14',imp:2,cat:'milestone',desc:`Philadelphia rookie Wilt Chamberlain scored a then-NBA playoff record 53 points in the Warriors’ 132-112 win over Syracuse in the third and deciding game of the Eastern Division Semifinals.`,source:'nba.com/history'},
  {date:'1962-03-14',imp:2,cat:'milestone',desc:`In Philadelphia’s 119-115 OT win at Chicago, Wilt Chamberlain completed his banner regular season of setting records that still stand by averaging 50.4 points and 48.5 minutes per game. He also set the single game scoring record when he scored 100 points on March 2 against New York.`,source:'nba.com/history'},
  {date:'1963-03-14',imp:2,cat:'milestone',desc:`San Francisco guard Guy Rodgers handed out 28 assists in a 114-109 loss to St. Louis, matching what was at the time an NBA record.`,source:'nba.com/history'},
  {date:'1965-03-14',imp:2,cat:'milestone',desc:`The Boston Celtics became the first NBA team to reach 61 wins in a season, following a 106-98 win over San Francisco, led by Bill Russell’s 40 rebounds and 20 points. Boston finished the 1964-65 season with 62 wins.`,source:'nba.com/history'},
  {date:'1986-03-14',imp:2,cat:'milestone',desc:`Forward Rod Higgins became the first player in NBA history to play for four teams in the same season when he took the court for Chicago. He previously played for Seattle, San Antonio and New Jersey.`,source:'nba.com/history'},
  {date:'1991-03-14',imp:2,cat:'milestone',desc:`John MacLeod, by virtue of New York’s 125-121 double-overtime win over Miami at Madison Square Garden, became the eighth coach in league history to reach the 700-win mark for his career.`,source:'nba.com/history'},
  {date:'1996-03-14',imp:2,cat:'milestone',desc:`San Antonio’s Chuck Person connects on seven 3-pointers in 12 attempts, becoming the fourth NBA player to hit 1,000 career 3-pointers, as the Spurs defeat visiting Miami 120-100.`,source:'nba.com/history'},
  {date:'1998-03-14',imp:2,cat:'milestone',desc:`Charles Barkley cracked the all-time Top 10 in FT’s made when he made seven to pass Wilt Chamberlain (6,057) with 6,059 free throws made.`,source:'nba.com/history'},
  {date:'1991-03-15',imp:2,cat:'milestone',desc:`Moses Malone of Atlanta picked up his 15,000th career rebound in the NBA during the Hawks’ 127-117 win over Dallas at Reunion Arena.`,source:'nba.com/history'},
  {date:'1992-03-15',imp:2,cat:'milestone',desc:`Cleveland coach Lenny Wilkens became only the fifth coach in NBA history (joining Red Auerbach, Jack Ramsay, Dick Motta and Bill Fitch) to record 800 career victories after the Cavs defeated Denver 100-91 at Richfield Coliseum.`,source:'nba.com/history'},
  {date:'2002-03-15',imp:2,cat:'milestone',desc:`Miami Heat broadcaster Eric Reid reaches a career milestone as he broadcasts his 1,000th regular season game as Miami faces the New Jersey Nets in New Jersey.`,source:'nba.com/history'},
  {date:'2011-03-15',imp:2,cat:'milestone',desc:`JaVale McGee of the Washington Wizards blocks 12 shots in a 98-79 loss to the Chicago Bulls.`,source:'nba.com/history'},
  {date:'1988-03-16',imp:2,cat:'milestone',desc:`Utah center Mark Eaton blocked six shots, including the 2,000th of his career, in the Jazz’s 120-105 victory over the Mavericks.`,source:'nba.com/history'},
  {date:'1991-03-16',imp:2,cat:'milestone',desc:`New Jersey coach Bill Fitch earned his 800th career victory, as the Nets beat Washington 110-86 at the Meadowlands. Fitch became only the fourth coach (along with Red Auerbach, Jack Ramsay and Dick Motta) in NBA history at the time to win that many games.`,source:'nba.com/history'},
  {date:'2000-03-16',imp:2,cat:'milestone',desc:`The Los Angeles Lakers’ 19-game winning streak ends with a 109-102 loss to Washington. The streak ranked third at the time in NBA history.`,source:'nba.com/history'},
  {date:'2007-03-16',imp:2,cat:'milestone',desc:`Kobe Bryant of the Los Angeles Lakers scores 65 points in a 116-111 win over the Portland Trail Blazers.`,source:'nba.com/history'},
  {date:'2008-03-16',imp:2,cat:'milestone',desc:`Denver blows out Seattle, 168-113, putting up the most point by an NBA team in almost 20 years. Eight Nuggets scored in double figures.`,source:'nba.com/history'},
  {date:'1963-03-17',imp:2,cat:'milestone',desc:`During a tearful farewell at Boston Garden on Bob Cousy Day, as the retiring 34-year-old Celtics star tried to compose himself, a throaty fan in the upper balcony relieved an awkward silence by hollering the instantly famous, “We love ya, Cooz!”.`,source:'nba.com/history'},
  {date:'1974-03-17',imp:2,cat:'milestone',desc:`The Celtics downed the Capital Bullets 129-103 at Boston Garden, collecting an NBA record 61 defensive rebounds during the contest.`,source:'nba.com/history'},
  {date:'1984-03-17',imp:2,cat:'milestone',desc:`Houston retired the No. 23 jersey worn by Calvin Murphy, only the second Rocket player (after Rudy Tomjanovich) to be so honored.`,source:'nba.com/history'},
  {date:'1985-03-17',imp:2,cat:'milestone',desc:`Dan Issel of Denver scored 27 points in a 124-119 loss to San Antonio to move past Elvin Hayes into fourth place at the time on pro basketball’s all-time scoring list behind Kareem Abdul-Jabbar, Wilt Chamberlain and Julius Erving.`,source:'nba.com/history'},
  {date:'1991-03-17',imp:2,cat:'milestone',desc:`New York forward Kiki Vandeweghe scored 17 points in the Knicks’ 102-101 loss to Milwaukee at the Bradley Center, moving him past the 15,000-point mark for his career.`,source:'nba.com/history'},
  {date:'1999-03-17',imp:2,cat:'milestone',desc:`Atlanta head coach Lenny Wilkens coaches in his 2,051st NBA game to surpass Bill Fitch’s 2,050 games coached to become the NBA’s all-time leader in games coached.`,source:'nba.com/history'},
  {date:'2010-03-17',imp:2,cat:'milestone',desc:`Hall-of-Famer Michael Jordan is approved as majority owner of the Charlotte Bobcats (now Hornets).`,source:'nba.com/history'},
  {date:'2015-03-17',imp:2,cat:'milestone',desc:`Reggie Jackson of the Detroit Pistons dishes 20 assists in a 105-95 win over the Memphis Grizzlies.`,source:'nba.com/history'},
  {date:'2017-03-17',imp:2,cat:'milestone',desc:`John Wall of the Washington Wizards dishes 20 assists in a 112-107 win over the Chicago Bulls.`,source:'nba.com/history'},
  {date:'2018-03-17',imp:2,cat:'milestone',desc:`Houston Rockets point guard Chris Paul steals the ball of the New Orleans Pelicans’ Nikola Mirotic, giving him 2,000 steals in his career. In accomplishing this feat, he joined Hall of Famers Gary Payton, John Stockton and Jason Kidd as the only players with 8,000 assists and 2,000 steals in their career.`,source:'nba.com/history'},
  {date:'1988-03-18',imp:2,cat:'milestone',desc:`The Golden State Warriors retired Rick Barry’s uniform No. 24, joining the numbers of only three other former Warriors: Al Attles, Tom Meschery, and Nate Thurmond.`,source:'nba.com/history'},
  {date:'1991-03-18',imp:2,cat:'milestone',desc:`The Philadelphia 76ers retired Wilt Chamberlain’s No. 13 jersey, only the fifth jersey ever retired by the Sixers, along with those of Billy Cunningham, Hal Greer, Bobby Jones and Julius Erving. Chamberlain ultimately had his jersey retired by the Los Angeles Lakers and Golden State Warriors, becoming the first NBA player to have his number retired by three teams.`,source:'nba.com/history'},
