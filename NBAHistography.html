  {date:'1989-11-03',imp:2,cat:'milestone',desc:`Sarunas Marciulionis and Alexander Volkov became the first players from the Soviet Union to participate in a regular season NBA game. Marciulionis scored 19 points as Golden State lost to Phoenix 136-106, and Volkov was held scoreless as Atlanta lost to Indiana 126-103.`,source:'nba.com/history'},
  {date:'1989-11-03',imp:2,cat:'milestone',desc:`The Minnesota Timberwolves opened their first season in the NBA by dropping a 106-94 decision to the host Seattle SuperSonics.`,source:'nba.com/history'},
  {date:'1990-11-03',imp:2,cat:'milestone',desc:`Atlanta’s Moses Malone set an NBA record for free throws made in a career by hitting 7-of-9 from the line in a 121-120 win over Indiana at the Omni. Those seven successful FT attempts allowed Malone to pass Oscar Robertson–who previously held the record with 7,694 –on the all-time list. Moses Malone was surpassed on March 24, 2001, when Karl Malone of the Utah Jazz connected on his 8,532nd free throw in a game against the Washington Wizards.`,source:'nba.com/history'},
  {date:'1990-11-03',imp:2,cat:'milestone',desc:`Gary Payton makes his NBA debut for the Seattle SuperSonics in their 118-106 win against the Houston Rockets.`,source:'nba.com/history'},
  {date:'1995-11-03',imp:2,cat:'milestone',desc:`With a 105-91 victory over Charlotte, Chicago won their first of an NBA record 72 games in one season and their first of an NBA record 37 home games won at the start of a season.`,source:'nba.com/history'},
  {date:'1995-11-03',imp:2,cat:'milestone',desc:`The NBA’s two Canadian expansion teams, the Toronto Raptors and Vancouver Grizzlies, both make successful NBA debuts with victories in their first regular-season games. In front of more than 33,000 fans at SkyDome, the Raptors defeated New Jersey 94-79. The Grizzlies won their opener on the road, defeating Portland 92-80 at the Blazers’ new home, the Rose Garden.`,source:'nba.com/history'},
  {date:'1995-11-03',imp:2,cat:'milestone',desc:`In a major trade just before the start of the 1995-96 season, Charlotte sent center Alonzo Mourning, guard Pete Myers and forward-center LeRon Ellis to Miami in exchange for swingman Glen Rice, point guard Khalid Reeves, center Matt Geiger and a 1996 first round draft pick.`,source:'nba.com/history'},
  {date:'1995-11-03',imp:2,cat:'milestone',desc:`Kevin Garnett makes his NBA debut for the Minnesota Timberwolves in their 95-86 loss to the Sacramento Kings.`,source:'nba.com/history'},
  {date:'1996-11-03',imp:2,cat:'milestone',desc:`Kobe Bryant makes his NBA debut for the Los Angeles Lakers in their 91-85 win against the Minnesota Timberwolves.`,source:'nba.com/history'},
  {date:'1999-11-03',imp:2,cat:'milestone',desc:`The Boston Celtics hold a special evening on opening night vs. the Washington Wizards, in honor of Red Auerbach, who had a hand in each of the team’s 16 NBA championships. At halftime, legendary Celtics Bill Russell and Tom Heinsohn assist Auerbach in the raising of a banner commemorating his 50th season. This evening’s game, along with all other home games, will feature video highlights, dedications and vignettes sharing memories and special events from Auerbach’s legendary career.`,source:'nba.com/history'},
  {date:'1999-11-03',imp:2,cat:'milestone',desc:`The Los Angeles Lakers debut in their new home, Staples Center, by hosting the Vancouver Grizzlies. Magic Johnson and Chick Hearn co-hosted a ceremony unveiling the Lakers’ retired jerseys and championship banners in their new building.`,source:'nba.com/history'},
  {date:'2001-11-03',imp:2,cat:'milestone',desc:`The NBDL announced the 2001-02 Supplemental Draft selections. The Roanoke Dazzle selected 7-foot center Lorenzo Coleman from Tennessee Tech with the No. 1 overall selection.`,source:'nba.com/history'},
  {date:'2001-11-03',imp:2,cat:'milestone',desc:`Steve Smith of the San Antonio Spurs, playing in his first game against his former Portland Trail Blazers teammates, tied an NBA record for most 3-point field goals in a game without a miss, as he went 8-for-8 from beyond the arc and finished with 36 points in a 106-90 triumph.`,source:'nba.com/history'},
  {date:'2004-11-03',imp:2,cat:'milestone',desc:`Dwight Howard makes his NBA debut in the Orlando Magic’s 93-92 win against the Denver Nuggets.`,source:'nba.com/history'},
  {date:'2008-11-03',imp:2,cat:'milestone',desc:`Chauncey Billups is traded Antonio McDyess and Cheikh Samb from the Detroit Pistons to the Denver Nuggets for Allen Iverson.`,source:'nba.com/history'},
  {date:'2023-11-03',imp:2,cat:'milestone',desc:`The first set of Group Play games in the inaugural In-Season Tournament begins when the Cleveland Cavaliers play the Indiana Pacers as part of a seven-game slate of Group Play games. As a part of the tournament, each of the 30 teams participating debuts new playing courts at their arena that feature a distinctive color scheme and the NBA Cup at center court.`,source:'nba.com/history'},
  {date:'1950-11-04',imp:2,cat:'milestone',desc:`Paul Arizin made his debut for the Philadelphia Warriors at home against the Boston Celtics. The Warriors won 77-68.`,source:'nba.com/history'},
  {date:'1960-11-04',imp:2,cat:'milestone',desc:`Philadelphia’s Wilt Chamberlain set an NBA record for the most free throw attempts in a game with none made when he missed all 10 of his tries against Detroit. Chamberlain’s dubious record last more than 40 years before another dominant center, Shaquille O’Neal of the Los Angeles Lakers, broke it by missing all 11 free throw attempts against Seattle on December 8, 2000.`,source:'nba.com/history'},
  {date:'1961-11-04',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the Philadelphia Warriors began a streak of 65 consecutive games of scoring 30 or more points. The second-longest such streak in NBA history — only 31 games — was set by Chamberlain the next season.`,source:'nba.com/history'},
  {date:'1965-11-04',imp:2,cat:'milestone',desc:`Johnny Kerr played in the last of his 844 consecutive games spanning 12 seasons, then an NBA record, as his Baltimore Bullets lost 108-107 at New York.`,source:'nba.com/history'},
  {date:'1987-11-04',imp:2,cat:'milestone',desc:`The Blazers honor Maurice Lucas by retiring his uniform number (#20).`,source:'nba.com/history'},
  {date:'1988-11-04',imp:2,cat:'milestone',desc:`In front of 23,388 fans at the sold-out Charlotte Coliseum, the Charlotte Hornets, playing their first NBA game, were defeated by the Cleveland Cavaliers, 133-93.`,source:'nba.com/history'},
  {date:'1989-11-04',imp:2,cat:'milestone',desc:`The Orlando Magic opened their inaugural season in the NBA with a 111-106 loss to the New Jersey Nets at Orlando Arena.`,source:'nba.com/history'},
  {date:'1989-11-04',imp:2,cat:'milestone',desc:`David Robinson made his debut for the San Antonio Spurs against the Los Angeles Lakers. San Antonio won 106-98. Robinson’s NBA debut was delayed two years because of his military commitment.`,source:'nba.com/history'},
  {date:'1993-11-04',imp:2,cat:'milestone',desc:`NBA Vice President, Operations Rod Thorn announced that veteran referee Darell Garretson would relinquish his on-court officiating duties at the conclusion of the 1993-94 season, his 27th in the NBA. Starting with the 1994-95 season, Garretson became the NBA’s Director of Officiating.`,source:'nba.com/history'},
  {date:'1993-11-04',imp:2,cat:'milestone',desc:`The NBA Board of Governors voted to grant the league’s 28th franchise to a Toronto group headed by John Bitove, Jr. The Raptors began play in the 1995-96 season.`,source:'nba.com/history'},
  {date:'1994-11-04',imp:2,cat:'milestone',desc:`After having spent the previous 28 seasons in Chicago Stadium, the Bulls successfully opened their new arena across the street, the United Center, with an 89-83 opening night win over Charlotte in front of 22,313 fans. Scottie Pippen’s game-high 22 points helped lead the Bulls to victory.`,source:'nba.com/history'},
  {date:'1994-11-04',imp:2,cat:'milestone',desc:`Clyde Drexler scored a game-high 26 points and Buck Williams pulled down 14 rebounds to lead the Portland Trail Blazers to a 121-100 victory over the LA Clippers, in a game played before a sold-out crowd of 14,239 at the Yokohama Arena in Yokohama, Japan. The game marked the third time in five years that the NBA tipped off the regular season in Japan.`,source:'nba.com/history'},
  {date:'1994-11-04',imp:2,cat:'milestone',desc:`Grant Hill makes his NBA debut with the Detroit Pistons in a 115-98 loss to the Los Angeles Lakers.`,source:'nba.com/history'},
  {date:'1996-11-04',imp:2,cat:'milestone',desc:`With four assists during Houston’s 75-72 win over Utah, Charles Barkley became the fourth player in NBA history to reach 20,000 points, 10,000 rebounds and 3,500 assists for his career.`,source:'nba.com/history'},
  {date:'1997-11-04',imp:2,cat:'milestone',desc:`Washington’s Rod Strickland dished the 5,000th assist of his career in the Wizards’ 120-96 win over Denver.`,source:'nba.com/history'},
  {date:'1997-11-04',imp:2,cat:'milestone',desc:`Milwaukee ended Orlando’s NBA-record streak of 316 straight games with at least one three-pointer in a 110-76 win for the Bucks.`,source:'nba.com/history'},
  {date:'1999-11-04',imp:2,cat:'milestone',desc:`The Atlanta Hawks break the seal on the new Philips Arena by hosting the Milwaukee Bucks. Recording artist Montel Jordan sang the national anthem.`,source:'nba.com/history'},
  {date:'2005-11-04',imp:2,cat:'milestone',desc:`The Utah Jazz’s Jerry Sloan passed Bill Fitch for fifth on the NBA’s all-time win list (945) at the Oracle Arena beating the Golden State Warriors 91-85.`,source:'nba.com/history'},
  {date:'2016-11-04',imp:2,cat:'milestone',desc:`Stephen Curry’s record streak of games with at least one 3-pointer made ends at 157.`,source:'nba.com/history'},
  {date:'2016-11-04',imp:2,cat:'milestone',desc:`Chris Paul finds J.J. Redick for a floater and in doing so, becomes the Clippers’ all-time assist leader, passing Randy Smith. That assist gave Paul 3,499 at that point and he finished his career in LA with 4,023 assists.`,source:'nba.com/history'},
  {date:'1946-11-05',imp:2,cat:'milestone',desc:`Chuck Connors of the Boston Celtics shattered the first backboard in NBA history during the warm-up before a Celtics game. Connors went on to shatter desperadoes in the television show “The Rifleman.”`,source:'nba.com/history'},
  {date:'1955-11-05',imp:2,cat:'milestone',desc:`Jack Twyman made his debut for the Rochester Royals at home against New York. The Knicks won 100-98 in overtime.`,source:'nba.com/history'},
  {date:'1971-11-05',imp:2,cat:'milestone',desc:`Los Angeles Lakers forward Elgin Baylor, plagued by injury, retired after a 14-year, 846-game career that included 23,149 points. Five years later, he was elected to the Naismith Memorial Basketball Hall of Fame.`,source:'nba.com/history'},
  {date:'1982-11-05',imp:2,cat:'milestone',desc:`With a 99-91 loss to the New Jersey Nets, the Cleveland Cavaliers set an NBA record for consecutive games lost (over two seasons) with 24.`,source:'nba.com/history'},
  {date:'1988-11-05',imp:2,cat:'milestone',desc:`The visiting LA Clippers spoiled the debut of NBA basketball in the state of Florida with a 111-91 win over the Miami Heat at the Miami Arena.`,source:'nba.com/history'},
  {date:'1988-11-05',imp:2,cat:'milestone',desc:`Mitch Richmond makes his NBA debut for the Golden State Warriors in their 117-104 win against the Phoenix Suns.`,source:'nba.com/history'},
  {date:'1993-11-05',imp:2,cat:'milestone',desc:`San Antonio, playing its first regular season game at the new Alamodome, established an NBA record for opening night attendance by drawing 36,523 fans. The Spurs sent the crowd home happy with a 91-85 win over Golden State, led by David Robinson’s game-high 32 points.`,source:'nba.com/history'},
  {date:'1993-11-05',imp:2,cat:'milestone',desc:`The Houston Rockets beat the New Jersey Nets 110-88 to begin their 15-game start of season winning streak, tying the 1948 Washington Capitols for the best start in NBA history.`,source:'nba.com/history'},
  {date:'1994-11-05',imp:2,cat:'milestone',desc:`Jason Kidd makes his NBA debut for the Dallas Mavericks in their 112-103 win against the New Jersey Nets.`,source:'nba.com/history'},
  {date:'2008-11-05',imp:2,cat:'milestone',desc:`Spurs guard Tony Parker scores a career-high 55 points in a 129-125 loss to the Timberwolves. Parker shoots 22-for-36 overall and nearly registers a triple-double, finishing with seven rebounds and 10 assists.`,source:'nba.com/history'},
  {date:'2016-11-05',imp:2,cat:'milestone',desc:`LeBron James scores 25 points in a win against the Philadelphia 76ers and passes Hakeem Olajuwon for 10th on the NBA’s all-time scoring list.`,source:'nba.com/history'},
  {date:'1971-11-06',imp:2,cat:'milestone',desc:`The Los Angeles Lakers won the first of what would turn out to be an NBA-record 16 consecutive road games, beating Golden State 105-89.`,source:'nba.com/history'},
  {date:'1985-11-06',imp:2,cat:'milestone',desc:`Chris Mullin makes his NBA debut with the Golden State Warriors in a 105-101 win against the Seattle SuperSonics.`,source:'nba.com/history'},
  {date:'1987-11-06',imp:2,cat:'milestone',desc:`Reggie Miller makes his NBA debut with the Indiana Pacers in a 108-95 loss to the Philadelphia 76ers`,source:'nba.com/history'},
  {date:'1992-11-06',imp:2,cat:'milestone',desc:`In a 106-94 loss to New York at the Omni, Atlanta’s Dominique Wilkins became the 17th player in NBA history to score 20,000 points, after hitting for 30 against the Knicks.`,source:'nba.com/history'},
  {date:'1992-11-06',imp:2,cat:'milestone',desc:`Shaquille O’Neal makes his NBA debut with the Orlando Magic in a 110-100 win against the Miami Heat.`,source:'nba.com/history'},
  {date:'1992-11-06',imp:2,cat:'milestone',desc:`Robert Parish scored 14 points and grabbed 12 rebounds to help the host Boston Celtics to a 113-92 win over Minnesota, becoming only the second player in NBA history to play in the league for 17 seasons (Kareem Abdul-Jabbar played 20). Parish now holds the record with 21 having passed Abdul-Jabbar in the 1996-97.`,source:'nba.com/history'},
  {date:'1992-11-06',imp:2,cat:'milestone',desc:`Two years after becoming the first major professional sports league to play regular season games outside of North America, the NBA returned to Japan for a pair of games to open the 1992-93 season. Shawn Kemp’s 29 points and 20 rebounds led Seattle to a 111-94 win over Houston before a sellout crowd of 15,640 at Yokohama Arena. The SuperSonics completed a Far East sweep the next evening with an 89-85 win.`,source:'nba.com/history'},
  {date:'1992-11-06',imp:2,cat:'milestone',desc:`Milwaukee celebrated its 25th Anniversary with a 86-81 win at Detroit.`,source:'nba.com/history'},
  {date:'1999-11-06',imp:2,cat:'milestone',desc:`The Conseco Fieldhouse, the new home of the Indiana Pacers, took its bows when the Pacers hosted the Boston Celtics. Hall of Famer and Indiana basketball legend John Wooden served as the honorary scorer, NBC broadcaster Bob Costas handled player introductions and Crystal Gayle performed the national anthem. At halftime, the Pacers paid tribute to the state of Indiana’s 50 greatest basketball legends. The Pacers sent their fans home happy with a 115-108 victory.`,source:'nba.com/history'},
  {date:'1999-11-06',imp:2,cat:'milestone',desc:`For the fifth time this decade, the NBA staged regular season games in Japan when the Minnesota Timberwolves and Sacramento Kings play two games at the Tokyo Dome on Nov. 6 and Nov. 7 in the NBA Japan Games. Sacramento won the first game by a 100-95 score and Minnesota came back to take the second game 114-101.`,source:'nba.com/history'},
  {date:'2007-11-06',imp:2,cat:'milestone',desc:`“Only” 14,908 tickets are sold to see the the Kings host the Seattle SuperSonics, ending a streak of 354 sellouts at Arco Arena. The streak began in 1999.`,source:'nba.com/history'},
  {date:'1959-11-07',imp:2,cat:'milestone',desc:`Philadelphia Warriors rookie Wilt Chamberlain and Boston Celtics star and former MVP Bill Russell face off for the first time. Overall, Chamberlain and Russell would play each other 143 times total — regular season and playoffs combined — in their careers.`,source:'nba.com/history'},
  {date:'1986-11-07',imp:2,cat:'milestone',desc:`The Philadelphia 76ers retired uniform No. 24 in honor of forward Bobby Jones.`,source:'nba.com/history'},
  {date:'1987-11-07',imp:2,cat:'milestone',desc:`Scottie Pippen and Horace Grant make their NBA debuts in the Chicago Bulls’ 104-94 win against the Philadelphia 76ers.`,source:'nba.com/history'},
  {date:'1991-11-07',imp:2,cat:'milestone',desc:`Earvin “Magic” Johnson retired from the NBA after disclosing that he had tested positive for the HIV virus. Johnson, who helped lead the Lakers to five NBA titles in his 12 seasons with the team, retired as the league’s all-time leader in career assists with 9,921. The assist mark was later surpassed by Utah’s John Stockton. Johnson returned as an active player for 32 games during the 1995-96 season.`,source:'nba.com/history'},
  {date:'1992-11-07',imp:2,cat:'milestone',desc:`With five assists in Detroit’s 89-87 road win at Indiana, Isiah Thomas became only the third guard in NBA history (along with Magic Johnson and Oscar Robertson) to pass the 8,000 career assist mark. Utah’s John Stockton joined this exclusive club on February 23, 1993 with seven assists during a loss to Houston.`,source:'nba.com/history'},
  {date:'1992-11-07',imp:2,cat:'milestone',desc:`The Suns celebrated their 30th Anniversary season by moving into the America West Arena.`,source:'nba.com/history'},
  {date:'1996-11-07',imp:2,cat:'milestone',desc:`The NBA named Joe Dumars of the Detroit Pistons the recipient of the first-ever NBA Sportsmanship Award. The NBA Sportsmanship Award is a major award that is presented annually to an NBA player who best represents the classic ideals of sportsmanship on the court.`,source:'nba.com/history'},
  {date:'1997-11-07',imp:2,cat:'milestone',desc:`Sacramento’s streak of sellouts ended at 497, which had been the longest streak in the league.`,source:'nba.com/history'},
  {date:'2008-11-07',imp:2,cat:'milestone',desc:`Jerry Sloan becomes the first coach in NBA history to record 1,000 wins with the same club, as the Utah Jazz win 104-97 over the Oklahoma City Thunder.`,source:'nba.com/history'},
  {date:'2016-11-07',imp:2,cat:'milestone',desc:`Stephen Curry sinks then-NBA-record 13 3-pointers in a win against the New Orleans Pelicans. Curry finishes with 46 points and shoots 13-for-17 overall on 3-pointers in Golden State’s win.`,source:'nba.com/history'},
  {date:'2016-11-07',imp:2,cat:'milestone',desc:`Wizards guard John Wall becomes Washington’s all-time assist leader, passing Hall of Famer Wes Unseld.`,source:'nba.com/history'},
  {date:'2022-11-07',imp:2,cat:'milestone',desc:`NBA Academy graduates Bennedict Mathurin of the Indiana Pacers and Dyson Daniels of the New Orleans Pelicans make history when they square off Monday in Indianapolis. They are the first pair of NBA Academy graduates to play in a game together, which the Pacers won, 129-122.`,source:'nba.com/history'},
  {date:'1978-11-08',imp:2,cat:'milestone',desc:`The Philadelphia 76ers and the New Jersey Nets began a game where the final 17:50 of the contest was replayed on March 23, 1979, due to a protest being upheld. Harvey Catchings and Ralph Simpson played for the 76ers and Eric Money and Al Skinner played for the Nets when the game began, but were traded to the opposing teams by the time the game was resumed. It’s the only time in the history of professional sports that any player played for both teams in the same game.`,source:'nba.com/history'},
  {date:'1992-11-08',imp:2,cat:'milestone',desc:`After losing 43 consecutive road games against the Los Angeles Lakers, the Sacramento Kings finally snapped the streak with a 124-114 victory behind 29 points from Mitch Richmond. The Kings had last won at the Great Western Forum on October 20, 1974, when they were based in Kansas City-Omaha.`,source:'nba.com/history'},
  {date:'1994-11-08',imp:2,cat:'milestone',desc:`Cleveland became the second NBA team to open a new arena during the 1994-95 season, as 20,562 fans filed into the Gund Arena to watch the defending NBA Champion Houston Rockets shade the Cavaliers 100-98.`,source:'nba.com/history'},
  {date:'1994-11-08',imp:2,cat:'milestone',desc:`Detroit’s Joe Dumars tied the NBA record (held by Brian Shaw) for most three-point field goals in a single game by hitting 10-of-18 attempts from behind the arc and finishing with a game-high 40 points in the Pistons’ 126-112 win over visiting Minnesota. Dennis Scott of the Orlando Magic set a new NBA record when he made 11 3-pointers against Atlanta on April 18, 1996.`,source:'nba.com/history'},
  {date:'1999-11-08',imp:2,cat:'milestone',desc:`The Philadelphia 76ers paid tribute to the recently deceased Wilt Chamberlain when they hosted the Seattle SuperSonics. The 76ers observed a moment of silence in Wilt’s memory, showed a video highlight from Wilt’s 100-point game in 1962 and enlisted Teddy Pendergrass to perform the national anthem.`,source:'nba.com/history'},
  {date:'2022-11-08',imp:2,cat:'milestone',desc:`For the first time in NBA history, there are no games played on Election Day as teams are encouraged by the NBA to share election information with fans.`,source:'nba.com/history'},
  {date:'1946-11-09',imp:2,cat:'milestone',desc:`George Mikan made his professional basketball debut for the Chicago American Gears in a 66-61 loss at the Oshkosh All-Stars in a National Basketball League game.`,source:'nba.com/history'},
  {date:'1975-11-09',imp:2,cat:'milestone',desc:`Mendy Rudolph ended his 23-year career as a referee in the NBA, in which he officiated more games (2,113) than any man in league history at the time. Earl Strom later broke Rudolph’s record and officiated over 2,400 games in his 30-year career.`,source:'nba.com/history'},
  {date:'1983-11-09',imp:2,cat:'milestone',desc:`David Stern was named to succeed Larry O’Brien, who resigned after 8 1/2 years, as NBA Commissioner. Stern officially took over on February 1, 1984.`,source:'nba.com/history'},
  {date:'1989-11-09',imp:2,cat:'milestone',desc:`The Milwaukee Bucks defeated the Seattle SuperSonics 155-154 in five overtime periods, matching the second-longest game in NBA history (Syracuse-Anderson on Nov. 24, 1949). The Bucks-Sonics game was the longest game since the advent of the 24-second shot clock in 1954. Seattle’s Dale Ellis set an NBA record by playing 69 of the 73 minutes.`,source:'nba.com/history'},
  {date:'1993-11-09',imp:2,cat:'milestone',desc:`Minnesota’s Micheal Williams had his record-setting NBA consecutive free throw streak end at 97 in a game at San Antonio, when he misfired on a second-quarter attempt. Williams’ mark of 97 eclipsed Calvin Murphy’s previous consecutive free throw record of 78, set during the 1980-81 season. Denver’s Mahmoud Abdul-Rauf moved into second place on the all-time consecutive FT streak list with 81, with his streak ending on Nov. 16, 1993 against San Antonio.`,source:'nba.com/history'},
  {date:'1995-11-09',imp:2,cat:'milestone',desc:`The Chicago Bulls defeated the Cleveland Cavaliers 106-88, to earn the first of an NBA-record 33 road victories in one season.`,source:'nba.com/history'},
  {date:'1997-11-09',imp:2,cat:'milestone',desc:`New York’s Buck Williams played in his 1,270th game, tying him with John Havlicek for fifth on the all-time list.`,source:'nba.com/history'},
  {date:'2007-11-09',imp:2,cat:'milestone',desc:`Two Chinese giants meet in the NBA for the first time. Yao Ming and the Houston Rockets emerge triumphant, vanquishing Yi Jianlian and the Milwaukee Bucks, 104-88. An estimated 150-250 million Chinese fans watch the live television broadcast.`,source:'nba.com/history'},
  {date:'1964-11-10',imp:2,cat:'milestone',desc:`Detroit Pistons’ player-coach Dave DeBusschere recorded his first coaching victory, 119-117 against Baltimore in Philadelphia. At age 24, DeBusschere was the youngest coach in NBA history.`,source:'nba.com/history'},
  {date:'1971-11-10',imp:2,cat:'milestone',desc:`The Baltimore Bullets trade Earl Monroe to New York, where he would help the Knicks to the 1973 NBA championship.`,source:'nba.com/history'},
  {date:'1989-11-10',imp:2,cat:'milestone',desc:`The Associated Press named NBA Commissioner David J. Stem the Sports Executive of the Decade for the 1980s. The AP’s NBA award winners were: Team of the Decade (Los Angeles Lakers), Coach of the Decade (Pat Riley) and Player of the Decade (Magic Johnson).`,source:'nba.com/history'},
  {date:'1989-11-10',imp:2,cat:'milestone',desc:`The Minnesota Timberwolves captured their first NBA victory with a 125-118 overtime triumph over Philadelphia at the Target Center.`,source:'nba.com/history'},
  {date:'1990-11-10',imp:2,cat:'milestone',desc:`The host Phoenix Suns routed the Denver Nuggets 173-143 to tie a record held by the 1959 Boston Celtics for the most points scored in a non-overtime game. The Suns had 107 points in the first half, breaking the mark of 90 set by the Nuggets three days earlier in a 161-153 loss to San Antonio. Suns Coach Cotton Fitzsimmons also picked up his 700th career coaching victory, becoming only the seventh coach in the history of the league to reach that mark.`,source:'nba.com/history'},
  {date:'2012-11-10',imp:2,cat:'milestone',desc:`Mike Brown is fired as head coach of the Los Angeles Lakers after a disappointing 1-4 start to the season. It is the soonest into a season a coach is relieved of duty since the NBA-ABA merger.`,source:'nba.com/history'},
  {date:'1980-11-11',imp:2,cat:'milestone',desc:`Billy Knight of the Indiana Pacers scored a team-record 52 points at San Antonio to lead the Pacers to a 119-113 victory. Reggie Miller broke the record by scoring 57 points in a 134-122 win over Charlotte on Nov. 28, 1992.`,source:'nba.com/history'},
  {date:'1992-11-11',imp:2,cat:'milestone',desc:`Shaquille O’Neal made his NBA debut for the Orlando Magic against Miami. Orlando won 110-100. He tallied 12 points, 18 rebounds and three blocks.`,source:'nba.com/history'},
  {date:'1993-11-11',imp:2,cat:'milestone',desc:`New Jersey retired the No. 3 jersey worn by the late Drazen Petrovic prior to a game at the Meadowlands Arena with Indiana. Petrovic was killed in an auto accident in Germany on June 7,1993. On hand for the ceremony were NBA Commissioner David J. Stern, Petrovic’s former Croatian teammates Dino Radja and Stojko Vrankovic, his father Jole, mother Biserka and brother Aleksander.`,source:'nba.com/history'},
  {date:'1993-11-11',imp:2,cat:'milestone',desc:`The NBA Board of Governors voted to adopt a modified NBA Draft Lottery system that increased the chances of the teams with the worst records in the league of winning one of the first three picks in the NBA Draft.`,source:'nba.com/history'},
  {date:'1995-11-11',imp:2,cat:'milestone',desc:`Houston’s Hakeem Olajuwon scores 21 points in the Rockets’ 119-97 victory over visiting Minnesota, becoming the ninth NBA player to collect 20,000 points and 10,000 rebounds in a career.`,source:'nba.com/history'},
  {date:'1996-11-11',imp:2,cat:'milestone',desc:`New York’s Patrick Ewing became the 23rd player in NBA history to reach 20,000 points, scoring 24 in the Knicks’ 92-88 win at Orlando.`,source:'nba.com/history'},
  {date:'2006-11-11',imp:2,cat:'milestone',desc:`Michael Redd of the Milwaukee Bucks scores 57 points in a 113-111 loss to the Utah Jazz.`,source:'nba.com/history'},
  {date:'2014-11-11',imp:2,cat:'milestone',desc:`Dirk Nowitzki becomes the top international scorer in NBA history and moves past Hakeem Olajuwon into 9th on the all-time scoring list. Nowitzki scores 23 points in the Dallas Mavericks’ win over the Sacramento Kings.`,source:'nba.com/history'},
  {date:'1980-11-12',imp:2,cat:'milestone',desc:`Denver Nuggets center Dan Issel hit a fourth quarter layup during a 118-111 loss at New Jersey, lifting his career point total to 20,000 as he became the 12th man in pro basketball history to reach that plateau.`,source:'nba.com/history'},
  {date:'1994-11-12',imp:2,cat:'milestone',desc:`NBA All-Star balloting extended beyond the United States for the first time, as ballots were made available to fans at Foot Locker stores in Mexico, Puerto Rico, Canada and Australia.`,source:'nba.com/history'},
  {date:'2010-11-12',imp:2,cat:'milestone',desc:`Kevin Love notched 31 points and 31 rebounds against the New York Knicks, becoming first player since Charles Barkley (1996) to pull down 30 rebounds in a game. He also set a Timberwolves record and became 19th player in NBA history to record a 30-30 game.`,source:'nba.com/history'},
  {date:'1964-11-13',imp:2,cat:'milestone',desc:`St. Louis Hawks forward Bob Pettit became the first NBA player to score 20,000 points.`,source:'nba.com/history'},
  {date:'1977-11-13',imp:2,cat:'milestone',desc:`Boston Celtics great John Havlicek scored 14 points in a 127-119 OT victory at Milwaukee to raise his career total to 25,202 points and pass Jerry West into what was then third place on the NBA all-time scoring list.`,source:'nba.com/history'},
  {date:'1979-11-13',imp:2,cat:'milestone',desc:`While playing center for Philadelphia, Darryl Dawkins shattered a backboard with a slam-dunk during the Sixers’ 110-103 loss at Kansas City.`,source:'nba.com/history'},
  {date:'1990-11-13',imp:2,cat:'milestone',desc:`Magic Johnson of the Los Angeles Lakers became only the second guard in NBA history to reach the 9,000 career assist mark (joining Oscar Robertson) in a 112-111 loss to Phoenix at the Great Western Forum. Utah’s John Stockton later surpassed both players in career assists.`,source:'nba.com/history'},
  {date:'1998-11-13',imp:2,cat:'milestone',desc:`William “Red” Holzman, who coached the New York Knicks to their only two NBA titles in 1970 and 1973, died at age 78.`,source:'nba.com/history'},
  {date:'1999-11-13',imp:2,cat:'milestone',desc:`The Cleveland Cavaliers honor former All-Star point guard Mark Price by retiring his No. 25 jersey at a special ceremony that takes place at halftime of the Cavs’ home game against the Milwaukee Bucks. Price played for Cleveland from 1986 to 1995 and is the franchise’s all-time leader in assists (4,206) and steals (734).`,source:'nba.com/history'},
  {date:'2010-11-13',imp:2,cat:'milestone',desc:`Minnesota Timberwolves star forward Kevin Love records 31 points and 30 rebounds in a 112-103 win over the New York Knicks. It is the first time since Moses Malone in 1982 a player would record at least 30 points and 30 rebounds in the same game.`,source:'nba.com/history'},
  {date:'2016-11-13',imp:2,cat:'milestone',desc:`The Golden State Warriors beat the Phoenix Suns 133-120 to reach 96 days without two consecutive losses, which sets an NBA record.`,source:'nba.com/history'},
  {date:'1984-11-14',imp:2,cat:'milestone',desc:`Moses Malone of the Philadelphia 76ers finishes with 51 points and 17 rebounds in a 137-133 overtime loss to the Detroit Pistons.`,source:'nba.com/history'},
  {date:'1997-11-14',imp:2,cat:'milestone',desc:`Phoenix’s 140-139 quadruple overtime game was the eighth such even in NBA history, and the first since Golden State defeated New Jersey 150-147 February 1, 1987.`,source:'nba.com/history'},
  {date:'2006-11-14',imp:2,cat:'milestone',desc:`Peja Stojaković became the first player in NBA history to start a game off by scoring 20 consecutive points for his team. He set a New Orleans Hornets record of 22 points in the first quarter. He went on to score a career-high 42 points, helping the Hornets beat the Charlotte Bobcats 94-85.`,source:'nba.com/history'},
  {date:'2009-11-14',imp:2,cat:'milestone',desc:`Russell Westbrook of the Sacramento Kings becomes the second player in NBA history to amass 25,000 career points and 10,000 career assists in a 124-110 loss to the Minnesota Timberwolves.`,source:'nba.com/history'},
  {date:'2025-11-14',imp:2,cat:'milestone',desc:`Rookie Brandon Jennings set a Milwaukee Bucks record by scoring 55 points against the Golden State Warriors, breaking previous record set by Kareem Abdul-Jabbar in 1970. Jennings’ 55 points were the most by a rookie since Earl “The Pearl” Monroe’s 56 in 1968.`,source:'nba.com/history'},
  {date:'1960-11-15',imp:2,cat:'milestone',desc:`Elgin Baylor of the Los Angeles Lakers tallied 71 points, an NBA record at that time, in a 123-108 victory over the Knicks in New York. Baylor’s record lasted less than two years as Wilt Chamberlain scored 100 points against New York on March 2, 1962.`,source:'nba.com/history'},
  {date:'1994-11-15',imp:2,cat:'milestone',desc:`Radio station KAZN-AM in Los Angeles aired a broadcast of the Lakers-Clippers game in Mandarin Chinese, making it the first time an NBA game was broadcast in Chinese in the United States NBA games had previously been broadcast on radio in the U.S. in Spanish and Navajo Indian.`,source:'nba.com/history'},
  {date:'1995-11-15',imp:2,cat:'milestone',desc:`After rejecting seven Toronto shots in Houston’s 96-93 road triumph, the Rockets’ Hakeem Olajuwon becomes the third NBA player to surpass 3,000 career blocks.`,source:'nba.com/history'},
  {date:'1997-11-15',imp:2,cat:'milestone',desc:`With a 96-93 win over Denver, Miami head coach Pat Riley moved past Jack Ramsay (864) for sole possession of fifth-place on the all-time win list.`,source:'nba.com/history'},
  {date:'2005-11-15',imp:2,cat:'milestone',desc:`At the age of 19, Dwight Howard became youngest player ever score 20 points and grab 20 rebounds in a game against the Charlotte Bobcats.`,source:'nba.com/history'},
  {date:'1957-11-16',imp:2,cat:'milestone',desc:`Bill Russell of the Boston Celtics snared 32 rebounds in one half in a 111-89 Celtics’ home victory over Philadelphia. Russell’s one half total is an NBA record and he finished the game with 49. Later in his career, Russell grabbed 51 rebounds in a game against Syracuse, on February 5, 1960. Only Wilt Chamberlain ever grabbed more rebounds in a game, with 55.`,source:'nba.com/history'},
  {date:'1961-11-16',imp:2,cat:'milestone',desc:`Connie Hawkins made his professional debut for the Pittsburgh Rens of the ABL at home in a 97-89 loss to the Chicago Majors.`,source:'nba.com/history'},
  {date:'1962-11-16',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the San Francisco Warriors scored 73 points against the New York Knicks, tied for the third-highest single-game point total in NBA history.`,source:'nba.com/history'},
  {date:'1993-11-16',imp:2,cat:'milestone',desc:`Mahmoud Abdul-Rauf of the Denver Nuggets had his consecutive free throw streak end at 81 in a game against San Antonio. Abdul-Rauf’s streak was the second longest in NBA history, trailing only the record 97 established by Minnesota’s Micheal Williams one week earlier.`,source:'nba.com/history'},
  {date:'1994-11-16',imp:2,cat:'milestone',desc:`With five rejections in New York’s 110-89 road win over the LA Lakers, Patrick Ewing became the ninth NBA player to reach 2,000 career blocks.`,source:'nba.com/history'},
  {date:'2001-11-16',imp:2,cat:'milestone',desc:`NBDL tipped-off its inaugural season when the Greenville Groove hosted the North Charleston Lowgators at the BI-LO Center in Greenville, S.C.`,source:'nba.com/history'},
  {date:'1945-11-17',imp:2,cat:'milestone',desc:`Elvin Hayes was born in Rayville, Louisiana.`,source:'nba.com/history'},
  {date:'1959-11-17',imp:2,cat:'milestone',desc:`Connie Dierking of the Syracuse Nationals became the first player to foul out of a game in the first quarter as Syracuse beat Cincinnati at New York, 121-116.`,source:'nba.com/history'},
  {date:'1981-11-17',imp:2,cat:'milestone',desc:`New York Knicks center Bill Cartwright made 19 free throws, missing none, in a game against Kansas City, tying the NBA record set by St. Louis’ Bob Pettit. This record was later tied by Detroit’s Adrian Dantley and broken by Atlanta’s Dominique Wilkins, who made 23 consecutive FTs without a miss on Dec. 8, 1992 against Chicago.`,source:'nba.com/history'},
  {date:'1984-11-17',imp:2,cat:'milestone',desc:`Purvis Short scored 59 points, the most by any NBA player since April 9, 1978, but his Golden State Warriors lost to New Jersey 131-114. It was the third time in a week that Short had scored more than 40 points in a game.`,source:'nba.com/history'},
  {date:'1999-11-17',imp:2,cat:'milestone',desc:`NBA Commissioner David Stern announces that Jeffrey Mishkin, Executive Vice President and Chief Legal Officer of the NBA for the past seven years, will be returning to private practice as a partner at the New York office of Skadden, Arps, Slate, Meagher & Flom LLP, effective January 1, 2000. As Executive Vice President and Chief Legal Officer, Mishkin had overseen every aspect of the NBA’s legal affairs, including all litigation, labor relations, commercial transactions, legislation and enforcement of the league’s intellectual property rights. During his tenure at the NBA, Mishkin remained an active practitioner, personally arguing the appeals in the NBA’s most significant matters, including NBA v. Williams, Chicago Professional Sports and WGN v. NBA, and NBA v. Motorola.`,source:'nba.com/history'},
  {date:'2000-11-17',imp:2,cat:'milestone',desc:`Reggie Miller of the Indiana Pacers became the 25th player in NBA history to score 20,000 career points as he tallied 30 points in a 92-90 loss to Golden State.`,source:'nba.com/history'},
  {date:'2000-11-17',imp:2,cat:'milestone',desc:`Jason Kidd of the Phoenix Suns tied the NBA record for turnovers in a game when he turned the ball over 14 times in a 90-85 loss to New York. John Drew of the Atlanta Hawks committed 14 turnovers at New Jersey on March 1, 1978.`,source:'nba.com/history'},
  {date:'2018-11-17',imp:2,cat:'milestone',desc:`Charlotte Hornets guard Kemba Walker notches 60 points in a 122-119 loss to the Philadelphia 76ers.`,source:'nba.com/history'},
  {date:'2020-11-17',imp:2,cat:'milestone',desc:`The NBA announces the structure and format for the 2020-21 season, which will feature a 72-game schedule for each team. The schedule was released in two segments, a First Half and Second Half as well as an All-Star break that went from March 5-10 in 2021. Additionally, the NBA Board of Governors approved the proposal of a Play-In Tournament on a one-year basis. The tournament will include teams No. 7-10 in each conference.`,source:'nba.com/history'},
  {date:'1989-11-18',imp:2,cat:'milestone',desc:`For the first time in NBA history, two players from the Soviet Union met on the court — Atlanta’s Alexander Volkov and Golden State’s Sarunas Marciulionis, who were teammates on the Soviet team that won the gold medal at the 1988 Olympics in South Korea. On this night, Volkov came out on top, as the Hawks downed the Warriors, 112-96.`,source:'nba.com/history'},
  {date:'2020-11-18',imp:2,cat:'milestone',desc:`The 2020 NBA draft is held virtually for the first time in league history. Anthony Edwards of the University of Georgia is selected No. 1 overall by the Minnesota Timberwolves.`,source:'nba.com/history'},
  {date:'2011-11-18',imp:2,cat:'milestone',desc:`One-time All-Star Walt Hazzard, a star for the UCLA Bruins and several NBA teams, including the Lakers, dies at the age of 69.`,source:'nba.com/history'},
  {date:'2016-11-18',imp:2,cat:'milestone',desc:`San Antonio Spurs coach Gregg Popovich oversees a 116-107 win against the Los Angeles Lakers. That victory gets him win No. 1,099 to pass Larry Brown for No. 7 on the all-time coaching wins list.`,source:'nba.com/history'},
  {date:'1977-11-19',imp:2,cat:'milestone',desc:`The New Orleans Jazz set a then NBA record for fewest free throws made in a game — one. Despite 17 fouls by Houston, the Jazz went to the foul line only five times and made just one, yet still managed to defeat the Rockets 103-101. On January 9, 1996, the Toronto Raptors did not make a single free throw in a loss to the Charlotte Hornets, erasing the Jazz’s record of one free throw.`,source:'nba.com/history'},
  {date:'1983-11-19',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar of the Los Angeles Lakers became the second player in NBA history to score 30,000 points, joining Wilt Chamberlain at that plateau, as the Lakers won 117-110 at Portland.`,source:'nba.com/history'},
  {date:'1996-11-19',imp:2,cat:'milestone',desc:`Patrick Ewing finishes with 24 points in a 92-88 win against the Orlando Magic and becomes the 23rd player to score 20,000 career points.`,source:'nba.com/history'},
  {date:'2004-11-19',imp:2,cat:'milestone',desc:`The Indiana Pacers visited the Detroit Pistons in what set to be a matchup between two of the league’s best teams, but ended as one of the most infamous nights in NBA history. The Malice at the Palace, as what it was later dubbed, began when Ron Artest (now Metta World Peace) charged into the stands after being hit with a thrown drink from the crowd. A massive brawl ensued, with nine players being suspended without pay. The fight led to increased security at NBA games, as well as a limit to the sale of the alcohol.`,source:'nba.com/history'},
  {date:'1979-11-20',imp:2,cat:'milestone',desc:`Red Holzman won his 500th game at the helm of the New York Knicks following a 130-125 overtime win over Houston at Madison Square Garden. At the time, Holzman was only the second coach–after Red Auerbach–to reach that plateau with one team.`,source:'nba.com/history'},
  {date:'1992-11-20',imp:2,cat:'milestone',desc:`Karl Malone’s game-high 34 points lifted Utah to a 97-95 win over Indiana at Market Square Arena and pushed him past the 15,000 point mark for his career.`,source:'nba.com/history'},
  {date:'1993-11-20',imp:2,cat:'milestone',desc:`Orlando’s Shaquille O’Neal scored 24 points, grabbed 28 rebounds and blocked 15 shots (tying Manute Bol for the second-highest total in NBA history) during the Magic’s 87-85 victory over New Jersey at the Meadowlands Arena.`,source:'nba.com/history'},
  {date:'1997-11-20',imp:2,cat:'milestone',desc:`A.C. Green of the Dallas Mavericks set an NBA record by playing in his 907th consecutive game in a matchup against Golden State. Green broke the record of Randy Smith, who played in 906 consecutive games from 1972 to 1983. Green continued to add to the record, playing in 1,192 games through the end of the 2000-01 season.`,source:'nba.com/history'},
  {date:'1999-11-20',imp:2,cat:'milestone',desc:`Houston’s Hakeem Olajuwon reached 2,000 career steals after a steal in the second quarter of the Rockets’ 110-107 loss to Seattle Saturday night. Olajuwon is the only player in NBA history with 2,000 steals and 2,000 blocks. Steals and blocks have been compiled since the 1973-74 season.`,source:'nba.com/history'},
  {date:'2020-11-20',imp:2,cat:'milestone',desc:`Negotiations with free agents began at 6 p.m. ET with signings permitted starting at 12:01 p.m. with signings permitted starting at 12:01 p.m. ET on Nov. 22. That was a quicker window than usual for free agency in the NBA, which typically has about a week spanning the start of talks and the beginning of signings.`,source:'nba.com/history'},
  {date:'2020-11-20',imp:2,cat:'milestone',desc:`The Toronto Raptors announce they will start the 2020-21 season playing in Tampa, Fla., because of the public health concerns related to the coronavirus pandemic.`,source:'nba.com/history'},
  {date:'1965-11-21',imp:2,cat:'milestone',desc:`Chick Hearn began his streak of broadcasting consecutive Los Angeles Lakers’ games. The last time Hearn missed a Lakers’ broadcast was Nov. 20, 1965, when he worked a college football game in Arkansas the day before and had his flight canceled. By the end of the 2000-01 season, Hearn had broadcast 3,301 consecutive Lakers games, including preseason and playoff games.`,source:'nba.com/history'},
  {date:'1984-11-21',imp:2,cat:'milestone',desc:`The Boston Celtics sank 55-of-81 field goal attempts for a club-record .679 shooting percentage in a 135-91 rout of Golden State.`,source:'nba.com/history'},
  {date:'1990-11-21',imp:2,cat:'milestone',desc:`Atlanta’s Moses Malone became only the seventh player in NBA history to reach the 25,000-point plateau by scoring 22 points in the Hawks’ 105-93 loss to Milwaukee at the Bradley Center.`,source:'nba.com/history'},
  {date:'1996-11-21',imp:2,cat:'milestone',desc:`With the LA Clippers’ 105-94 loss at Dallas, Bill Fitch became the first NBA coach to record 1,000 career loses.`,source:'nba.com/history'},
  {date:'2001-11-21',imp:2,cat:'milestone',desc:`The Denver Nuggets call up Chris Andersen from the Fayetteville Patriots, making Andersen the first D-League player to be called up to the NBA.`,source:'nba.com/history'},
  {date:'2013-11-21',imp:2,cat:'milestone',desc:`Six-time All-Star Vern Mikkelsen, a Hall of Famer, dies at the age of 85.`,source:'nba.com/history'},
  {date:'2023-11-21',imp:2,cat:'milestone',desc:`The Indiana Pacers defeat the Atlanta Hawks, 157-152, in Group Play of the inaugural In-Season Tournament to become the first team to clinch East Group A and advance to the Knockout Rounds. Later that night, the Los Angeles Lakers defeat the Utah Jazz, 131-99, to clinch West Group A and also advance.`,source:'nba.com/history'},
  {date:'1950-11-22',imp:2,cat:'milestone',desc:`The Fort Wayne Pistons defeated the Minneapolis Lakers 19-18 in Minneapolis in the lowest-scoring game in NBA history.`,source:'nba.com/history'},
  {date:'1961-11-22',imp:2,cat:'milestone',desc:`St. Louis Hawks forward Bob Pettit connected on all 19 of his foul shots in a 141-121 loss at Boston, establishing what was then an NBA record.`,source:'nba.com/history'},
  {date:'1992-11-22',imp:2,cat:'milestone',desc:`Rick Adelman posted the 200th victory of his coaching career as the Blazers beat Detroit, 115-90. At the time, no coach had reached the 200-win milestone that quickly. The win came in his 288th game.`,source:'nba.com/history'},
  {date:'1994-11-22',imp:2,cat:'milestone',desc:`Golden State Coach Don Nelson became the first individual in NBA history to participate in 2,700 career games as a player or coach (both regular season and playoffs), during the Warriors’ 102-98 road setback at Golden State. Later in the 1994-95 season, Nelson was passed in career NBA game appearances, as a player or coach, by Atlanta head coach Lenny Wilkens.`,source:'nba.com/history'},
  {date:'2000-11-22',imp:2,cat:'milestone',desc:`The Philadelphia 76ers lost 88-73 to the Charlotte Hornets, ending their season-opening winning streak at 10 games. The Sixers became the 12th team in NBA history to begin a season with at least 10 consecutive victories.`,source:'nba.com/history'},
  {date:'2023-11-22',imp:2,cat:'milestone',desc:`The NBA’s all-time leading scorer, LeBron James, reaches uncharted territory by becoming the only player to score 39,000 career points. James reached the milestone with a 3-pointer in the first quarter of the Lakers’ 131-99 win against the Jazz. He finished with 17 points in 24 minutes as the Lakers went undefeated in Group Play in the In-Season Tournament.`,source:'nba.com/history'},
  {date:'1979-11-23',imp:2,cat:'milestone',desc:`Washington’s Elvin Hayes scored 18 points in a 128-108 loss at San Antonio to move ahead of Hal Greer, at that time into seventh place on the NBA all-time scoring list, with 21,587 points.`,source:'nba.com/history'},
  {date:'1991-11-23',imp:2,cat:'milestone',desc:`The Sacramento Kings snapped their NBA record 43-game road losing streak with a 95-93 win over the Magic at the Orlando Arena. Lionel Simmons scored a game-high 27 points to lead the Kings to their first road triumph since Nov. 20, 1990 in Washington.`,source:'nba.com/history'},
  {date:'1994-11-23',imp:2,cat:'milestone',desc:`Jeff Hornacek of Utah set a then-NBA record by sinking all eight of his 3-point field goal attempts during the Jazz’ 113-103 home win over Seattle. Hornacek scored a career-high 40 points and broke the previous mark held by Portland’s Terry Porter (1992) and the Sonics’ Sam Perkins (1993), who both went 7-of-7 from 3-point range. Perkins tied Hornacek’s 8-for-8 performance for Seattle against Toronto on January 15, 1997.`,source:'nba.com/history'},
  {date:'1994-11-23',imp:2,cat:'milestone',desc:`Wesley Person hit for 19 points to lead 10 double-figure scorers in Phoenix’s 140-109 home win over the LA Clippers. The Suns became the third team in NBA history to have 10 different players score in double figures in the same game. On March 30, 1980, Seattle defeated Portland 135-104, with Gus Williams’ 23 points leading 10 double-figure scorers for the Sonics. And on April 14, 1994, the Sonics accomplished the feat again, defeating the visiting LA Clippers 150-101, with Detlef Schrempf’s 21 points leading the way.`,source:'nba.com/history'},
  {date:'1997-11-23',imp:2,cat:'milestone',desc:`Los Angeles Lakers coach Del Harris recorded his 500th career win after a 119-102 win over the LA Clippers.`,source:'nba.com/history'},
  {date:'2016-11-23',imp:2,cat:'milestone',desc:`Cleveland Cavaliers forward Kevin Love scores 34 points in the first quarter against his hometown Portland Trail Blazers. In doing so, he set a record for most points in a first quarter as the Cavs won 137-125.`,source:'nba.com/history'},
  {date:'1938-11-24',imp:2,cat:'milestone',desc:`Oscar Robertson is born in Charlotte, Tennessee.`,source:'nba.com/history'},
  {date:'1949-11-24',imp:2,cat:'milestone',desc:`Don Otten of the Tri-Cities Blackhawks set an NBA record by committing eight personal fouls in a 120-113 loss to Sheboygan.`,source:'nba.com/history'},
  {date:'1949-11-24',imp:2,cat:'milestone',desc:`The Syracuse Nationals defeated the Anderson Packers 125-123 in five overtimes, at that time the longest game in NBA history. The record was broken a little over a year later when Rochester and Indianapolis played a six-overtime contest on January 6, 1951.`,source:'nba.com/history'},
  {date:'1960-11-24',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the Philadelphia Warriors grabbed an NBA record 55 rebounds in a 132-129 loss to Boston. Chamberlain went on to collect 2,149 rebounds in 79 games during the 1960-61 season, averaging 27.2 rpg, both NBA records that still stand.`,source:'nba.com/history'},
  {date:'1986-11-24',imp:2,cat:'milestone',desc:`Maurice Podoloff, the first chief executive of the NBA, died at the age of 95. Podoloff held the title of NBA President (title changed to Commissioner in 1967) from 1946 through his retirement in 1963.`,source:'nba.com/history'},
  {date:'1996-11-24',imp:2,cat:'milestone',desc:`With a pair of free throws in the third quarter of Houston’s 90-85 road win over the Lakers, Clyde Drexler became the 24th player in NBA history to reach 20,000 points.`,source:'nba.com/history'},
  {date:'1999-11-24',imp:2,cat:'milestone',desc:`A.C. Green of the Los Angeles Lakers ties former ABA and NBA star Ron Boone for the longest consecutive games played streak in professional basketball history by playing in his 1,041st game when the Lakers host the Utah Jazz at Staples Center. Green became the NBA’s all-time iron man when he played his 907th consecutive game while a member of the Dallas Mavericks on Nov. 20, 1997, passing Randy Smith, who played in 906 consecutive games for Buffalo, San Diego, Cleveland and New York.`,source:'nba.com/history'},
  {date:'1999-11-24',imp:2,cat:'milestone',desc:`Pat Riley of the Miami Heat collects his 200th win with the team after a 93-91 win over Atlanta, giving him 200 wins with three teams (Lakers, New York, Miami). He joins Lenny Wilkens and Bill Fitch as the only coaches to accomplish that feat.`,source:'nba.com/history'},
  {date:'2001-11-24',imp:2,cat:'milestone',desc:`With three assists in a 99-94 loss to Minnesota, Terry Porter of the San Antonio Spurs became the only player in NBA history to record 15,000 points, 7,000 assists, 1,000 steals and 1,000 3-pointers.`,source:'nba.com/history'},
  {date:'1960-11-25',imp:2,cat:'milestone',desc:`Bailey Howell of Detroit set what was then a Pistons’ home record 19 free throws in a game against Los Angeles, as he finished with 43 points. He also grabbed a Pistons’ home game record 21 rebounds in one half.`,source:'nba.com/history'},
  {date:'1986-11-26',imp:2,cat:'milestone',desc:`The Milwaukee Bucks beat the Washington Bullets 122-103 to give Don Nelson his 500th career coaching victory. At the time he reached the milestone faster than any coach in NBA history, needing only 817 games. Pat Riley later reached 500 wins in 684 games.`,source:'nba.com/history'},
  {date:'1994-11-26',imp:2,cat:'milestone',desc:`During a 101-87 victory over Golden State at Gund Arena, the Cleveland Cavaliers set an NBA record by attempting just two free throws the entire game, breaking the mark of three previously held by the Los Angeles Lakers for 14 years. John “Hot Rod” Williams and Tony Campbell each went 1-for-1 from the line for the Cavs.`,source:'nba.com/history'},
  {date:'1999-11-26',imp:2,cat:'milestone',desc:`A.C. Green of the Los Angeles Lakers played in his professional basketball record 1,042nd consecutive game by appearing in a 103-80 win over New Jersey. Green eclipsed the record of former ABA and NBA star Ron Boone.`,source:'nba.com/history'},
  {date:'2000-11-26',imp:2,cat:'milestone',desc:`John Stockton appeared in his 1,271st NBA game, all in a Utah Jazz uniform, passing previous record-holder John Havlicek of the Boston Celtics for most career games played for one team. “I have such great respect for John Havlicek, I can’t even express it,” said Stockton.`,source:'nba.com/history'},
  {date:'2011-11-26',imp:2,cat:'milestone',desc:`The NBA and NBA Players Association reach an agreement on a new collective bargaining agreement, ending the second-longest labor stoppage in league history after 160 days.`,source:'nba.com/history'},
  {date:'1947-11-27',imp:2,cat:'milestone',desc:`Philadelphia’s Howie Dallmar set an NBA record for the most field goal attempts with none made, 15, against New York. The record was not topped for 44 years, until Tim Hardaway of Golden State shot 0-for-17 on December 27, 1991.`,source:'nba.com/history'},
  {date:'1963-11-27',imp:2,cat:'milestone',desc:`Wilt Chamberlain hit 18 field goals in a row during a 118-89 win over New York to set what was at that time an NBA record.`,source:'nba.com/history'},
  {date:'2015-11-27',imp:2,cat:'milestone',desc:`James Harden of the Houston Rockets scores 50 points in a 116-114 win over the Philadelphia 76ers.`,source:'nba.com/history'},
  {date:'1969-11-28',imp:2,cat:'milestone',desc:`The New York Knicks scored six points in the final 16 seconds to defeat the Cincinnati Royals 106-105 to run their winning streak to a then-NBA record of 18 straight games. The Lakers set the current NBA mark of 33 straight wins during the 1971-72 season.`,source:'nba.com/history'},
  {date:'1986-11-28',imp:2,cat:'milestone',desc:`The Celtics downed San Antonio 111-96 at Boston Garden, setting an NBA record with their 38th consecutive home victory.`,source:'nba.com/history'},
  {date:'1988-11-28',imp:2,cat:'milestone',desc:`Los Angeles Lakers guard Magic Johnson finishes with 32 points, 11 rebounds and 20 assists in a 109-104 win against the Philadelphia 76ers.`,source:'nba.com/history'},
  {date:'1992-11-28',imp:2,cat:'milestone',desc:`Cleveland Cavaliers head coach Lenny Wilkens appeared in his 2,500th NBA game (in 29 seasons as a player and coach, in both regular season and playoff games) in the Cavs’ 95-93 road loss at Orlando. Wilkens, elected to the Hall of Fame in 1988, joined Don Nelson as the only individuals to appear in 2,500 games. During the 1994-95 season he passed Nelson as the NBA’s all-time leader in game appearances, as a player or coach, with 2,737.`,source:'nba.com/history'},
  {date:'1992-11-28',imp:2,cat:'milestone',desc:`Reggie Miller exploded for 57 points to set an Indiana team record as the Pacers defeated the host Charlotte Hornets 134-122.`,source:'nba.com/history'},
  {date:'1992-11-28',imp:2,cat:'milestone',desc:`The LA. Clippers’ 121-119 road win at Denver gave Clippers’ head coach Larry Brown his 400th career NBA victory.`,source:'nba.com/history'},
  {date:'1997-11-28',imp:2,cat:'milestone',desc:`Chicago’s Michael Jordan scored 26 points at Indiana to move past Elvin Hayes (27,313) into fourth place on the NBA’s all-time scoring list with 27,332 points.`,source:'nba.com/history'},
  {date:'2003-11-28',imp:2,cat:'milestone',desc:`Los Angeles Lakers forward Karl Malone finishes with 10 points, 11 rebounds and 10 assists in a 103-87 win against the San Antonio Spurs. Malone, at 40 years old and 127 days, becomes the oldest player in NBA history to record a triple-double.`,source:'nba.com/history'},
  {date:'2012-11-28',imp:2,cat:'milestone',desc:`Rajon Rondo is ejected midway through the Boston Celtics 95-83 loss to the Brooklyn Nets. With only three assists in the game at the time of his ejection, Rondo’s historic double-digit assist streak ends at 37 games. It is second only to Magic Johnson’s 46-game streak.`,source:'nba.com/history'},
  {date:'2023-11-28',imp:2,cat:'milestone',desc:`On a wild final night of Group Play in the first In-Season Tournament, the Knicks, Bucks, Celtics and Kings all score wins and advance to the Knockout Rounds. The quarterfinals, which would take place on Dec. 4 and 5, feature the following matchups: Bucks vs. Knicks, Lakers vs. Suns, Pacers vs. Celtics and Pelicans vs. Kings.`,source:'nba.com/history'},
  {date:'1997-11-29',imp:2,cat:'milestone',desc:`After 24 seasons at US Airways Arena in Landover, MD, the Washington Wizards played their final game there against the Chicago Bulls, an 88-83 Chicago win.`,source:'nba.com/history'},
  {date:'1999-11-29',imp:2,cat:'milestone',desc:`Tyrone Corbin of the Sacramento Kings accomplished something that Michael Jordan, Larry Bird and Magic Johnson never did. He played in his 1,000th regular season NBA game.`,source:'nba.com/history'},
  {date:'2015-11-29',imp:2,cat:'milestone',desc:`Kobe Bryant announces via a poem on The Players’ Tribune Web site that he will retire after the 2015-16 season. Bryant spent his entire 20-season NBA career with the Los Angeles Lakers`,source:'nba.com/history'},
  {date:'1977-11-30',imp:2,cat:'milestone',desc:`Lenny Wilkens replaced Bob Hopkins as coach of the Seattle SuperSonics, who at that time had a 5-17 record. Under Wilkens, the Sonics went 42-18 for the rest of the season and made it all the way to the NBA Finals, where they lost in seven games to the Washington Bullets.`,source:'nba.com/history'},
  {date:'1990-11-30',imp:2,cat:'milestone',desc:`Boston Celtics forward Larry Bird scored his 20,000th career point in the Celtics’ 123-95 win over Washington at the Garden. At the time, Bird became only the fifth player in league history (along with Kareem Abdul-Jabbar, John Havlicek, Oscar Robertson and Jerry West) to gather 20,000 points, 5,000 rebounds and 5,000 assists in his playing career.`,source:'nba.com/history'},
  {date:'1996-11-30',imp:2,cat:'milestone',desc:`Michael Jordan became the 10th player in NBA history to reach 25,000 points after scoring 35 in the Bulls 97-88 win at the Spurs. Jordan reached 25,000 in 782 games, faster than any other player but Wilt Chamberlain (691).`,source:'nba.com/history'},
  {date:'2019-11-30',imp:2,cat:'milestone',desc:`Houston Rockets guard James Harden scores 60 points in 31 minutes in a 158-111 romp against the Atlanta Hawks. He came one point shy of matching his career high and franchise record while making eight 3-pointers and 20 free throws.`,source:'nba.com/history'},
  {date:'1981-12-01',imp:2,cat:'milestone',desc:`Los Angeles Lakers center Kareem Abdul-Jabbar passed Oscar Robertson to become the NBA’s second all-time leading scorer, behind Wilt Chamberlain. Abdul-Jabbar finished the season with over 28,000 career points and eventually surpassed Chamberlain for the top spot with 38,387.`,source:'nba.com/history'},
  {date:'1984-12-01',imp:2,cat:'milestone',desc:`Phoenix Suns Coach John MacLeod became the 10th coach in NBA history to compile 500 career wins as the Suns defeated Golden State 115-103.`,source:'nba.com/history'},
  {date:'1990-12-01',imp:2,cat:'milestone',desc:`New Jersey Coach Bill Fitch registered his 785th career victory, 111-92 over Orlando, at the time moving him into fourth place on the NBA’s all-time list behind Dick Motta, Jack Ramsay and Red Auerbach.`,source:'nba.com/history'},
  {date:'1991-12-01',imp:2,cat:'milestone',desc:`Isiah Thomas became Detroit’s all-time leading scorer, with 15,493 points, after scoring a game-high 22 points in the Pistons’ 94-87 win over Houston at the Palace of Auburn Hills. Thomas passed previous leader Bob Lanier on Detroit’s all-time scoring chart.`,source:'nba.com/history'},
  {date:'1996-12-01',imp:2,cat:'milestone',desc:`Hersey Hawkins of the Seattle SuperSonics became part of basketball history when he scored the 7,000,000th point in NBA history off a 12-foot jumper with 7:58 left in the fourth quarter of the Sonics’ 96-90 loss to visiting Utah.`,source:'nba.com/history'},
  {date:'1954-12-02',imp:2,cat:'milestone',desc:`Frank Selvy of the Milwaukee Hawks, in a game against the Minneapolis Lakers at Fort Wayne, hit 24 of 26 free throws, both NBA rookie records for free throws attempted and made in a game.`,source:'nba.com/history'},
  {date:'1978-12-02',imp:2,cat:'milestone',desc:`Golden State Coach Al Attles captured his 400th career victory, only the 10th coach in NBA history at the time to achieve that feat, as the Warriors beat the Suns 116-108 at Phoenix.`,source:'nba.com/history'},
  {date:'1986-12-02',imp:2,cat:'milestone',desc:`The Washington Bullets beat the Boston Celtics 117-109 to end the Celtics’ homecourt winning streak at 38 games. Although the game was played at the Hartford Civic Center instead of the Boston Garden, it still counted as a home contest for the Celtics.`,source:'nba.com/history'},
  {date:'1996-12-02',imp:2,cat:'milestone',desc:`Houston’s Clyde Drexler became the fifth player in NBA history to reach 2,000 career steals, after picking up four against Toronto. Drexler retired with 2,207 steals.`,source:'nba.com/history'},
  {date:'1997-12-02',imp:2,cat:'milestone',desc:`The Washington Wizards began a new era when they opened the doors to the downtown MCI Center in a matchup against Seattle.`,source:'nba.com/history'},
  {date:'1999-12-02',imp:2,cat:'milestone',desc:`William “Pop” Gates, one of the greatest players of the 1930s and 1940s barnstorming era of basketball died of heart failure. Gates, who was elected to the Basketball Hall of Fame in 1989, earned acclaim as a player-coach of the Harlem Globetrotters in the 1950s. But those who played against him during the earlier era place him among the best of his time.`,source:'nba.com/history'},
  {date:'2021-12-02',imp:2,cat:'milestone',desc:`The Memphis Grizzlies defeat the Oklahoma City Thunder, 152-79, for the largest margin of victory in NBA history. The 73-point win easily topped the previous mark, which was Cleveland’s 68-point win over Miami. The Cavaliers beat the Heat 148-80 on Dec. 17, 1991. Jaren Jackson Jr. scored 27 points to pace the 12 Memphis players who scored in double figures in the win.`,source:'nba.com/history'},
  {date:'2024-12-02',imp:2,cat:'milestone',desc:`James Harden becomes the second player in NBA history with at least 3,000 career 3-pointers when he hits six total to give him 3,004 in his career in a 126-122 victory against the Denver Nuggets. At the time, only Harden and Golden State Warriors guard Stephen Curry have more than 3,000 career 3-pointers.`,source:'nba.com/history'},
  {date:'1946-12-03',imp:2,cat:'milestone',desc:`Joe Fulks of the Philadelphia Warriors set what was then a league scoring mark with 37 points against the Providence Steamrollers at Philadelphia. Fulks’ 50 field goal attempts (he made 16) were the most by a player during a game in the NBA’s inaugural season and remained the record for the most field goal attempts by a rookie in a game for 13 years.`,source:'nba.com/history'},
  {date:'1976-12-03',imp:2,cat:'milestone',desc:`Seattle’s Fred Brown had 10 steals in a 121-112 victory at Philadelphia to tie an NBA record held by Jerry West and Larry Steele. The record would be broken 23 days later by San Antonio’s Larry Kenon, who picked up 11 steals at Kansas City.`,source:'nba.com/history'},
  {date:'1990-12-03',imp:2,cat:'milestone',desc:`The Boston Celtics honored long-time announcer Johnny Most by unveiling a banner bearing a microphone on the balcony facade near his old broadcast position. Most retired following the 1989-90 season after calling Celtics games on the radio for 37 years.`,source:'nba.com/history'},
  {date:'1993-12-03',imp:2,cat:'milestone',desc:`The Atlanta Hawks beat the Houston Rockets 133-111, ending Houston’s record-tying streak for the best start in NBA history at 15-0. The 15-0 start tied the all-time NBA record set by the Washington Capitols at the start of the 1948-49 season.`,source:'nba.com/history'},
  {date:'1948-12-04',imp:2,cat:'milestone',desc:`The Washington Capitols beat Baltimore 83-82 to raise their record to 15-0, the best start in NBA history. Their streak ended with a 94-78 loss at Indianapolis on December 7. This 15-0 streak to start the season was matched by the Houston Rockets at the outset of the 1993-94 season.`,source:'nba.com/history'},
  {date:'1987-12-04',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar’s consecutive game streak of scoring in double figures (787) is snapped at Milwaukee.`,source:'nba.com/history'},
  {date:'1996-12-04',imp:2,cat:'milestone',desc:`Detroit’s Terry Mills began an NBA record-tying streak of 13 straight 3-point field goals made over three games in the Pistons 100-90 win over the Hawks.`,source:'nba.com/history'},
  {date:'1997-12-04',imp:2,cat:'milestone',desc:`Golden State’s Latrell Sprewell is suspended without pay for one year by NBA Commissioner David Stern.`,source:'nba.com/history'},
  {date:'2017-12-04',imp:2,cat:'milestone',desc:`Stephen Curry of the Golden State Warriors makes the 2,000th 3-pointer in his career. He needed just 597 games to do so, 225 fewer than the previous record-holder, Ray Allen. Additionally, Curry is one of just eight players in NBA history with 2,000 or more 3-pointers.`,source:'nba.com/history'},
  {date:'2023-12-04',imp:2,cat:'milestone',desc:`The Pacers beat the Celtics, 122-112 and the Pelicans beat the Kings, 127-117, to advance to the semifinals in the Knockout Rounds of the inaugural In-Season Tournament.`,source:'nba.com/history'},
  {date:'2025-12-04',imp:2,cat:'milestone',desc:`LeBron James’ run of 1,297 consecutive double-digit regular-season scoring efforts ends as the Lakers win in Toronto, 123-120, as he finished with eight points. The streak started on Jan. 6, 2007, and was, by far, the longest such streak in NBA history: Michael Jordan had 866 consecutive double-digit scoring games, Kareem Abdul-Jabbar had 787 and Karl Malone had the fourth-longest run at 575.`,source:'nba.com/history'},
  {date:'1967-12-05',imp:2,cat:'milestone',desc:`Walt Hazzard of Seattle scored 15 consecutive points in a 133-121 loss to San Francisco at Oakland, tying an NBA record held by Wilt Chamberlain.`,source:'nba.com/history'},
  {date:'1987-12-05',imp:2,cat:'milestone',desc:`The San Antonio Spurs retired the No. 44 jersey worn by George Gervin.`,source:'nba.com/history'},
  {date:'1991-12-05',imp:2,cat:'milestone',desc:`Moses Malone of Milwaukee became only the sixth player in NBA history to score 26,000 career points, after he hit for 12 points in the Bucks’ 109-101 loss to New Jersey at the Bradley Center.`,source:'nba.com/history'},
  {date:'1992-12-05',imp:2,cat:'milestone',desc:`Detroit’s Bill Laimbeer grabbed 12 rebounds in the Pistons’ 112-88 win over visiting Philadelphia, helping him to reach the 10,000 career rebound mark.`,source:'nba.com/history'},
  {date:'1996-12-05',imp:2,cat:'milestone',desc:`Portland’s Jermaine O’Neal, who celebrated his 18th birthday on October 13, became the youngest player ever to participate in an NBA game.`,source:'nba.com/history'},
  {date:'1997-12-05',imp:2,cat:'milestone',desc:`Indiana’s Mark Jackson moved past Bob Cousy (6,955) and into seventh place on the all-time assist chart.`,source:'nba.com/history'},
  {date:'2000-12-05',imp:2,cat:'milestone',desc:`Karl Malone of the Utah Jazz converted a finger roll in the lane for two points, moving past Wilt Chamberlain and into second place on the NBA’s all-time scoring list. Malone scored 31 points in Utah’s 98-84 win over Toronto, giving him 31,443 career points, 24 more than Chamberlain’s 31,419 points.`,source:'nba.com/history'},
  {date:'2000-12-05',imp:2,cat:'milestone',desc:`Don Nelson of the Dallas Mavericks notched his 938th career coaching win in Dallas’ 94-85 victory over New York, tying him with his Boston Celtics’ mentor Red Auerbach for fourth place on the all-time coaching victories list.`,source:'nba.com/history'},
  {date:'2001-12-05',imp:2,cat:'milestone',desc:`With an 98-94 victory over the Dallas Mavericks, the Lakers extended their best-ever start to 16-1, landing them a spot among the top 11 starts in league annals.`,source:'nba.com/history'},
  {date:'2012-12-05',imp:2,cat:'milestone',desc:`With a right-handed runner in the second quarter of the Los Angeles Lakers 103-87 win over the New Orleans Hornets, Kobe Bryant becomes the youngest player in NBA history to reach 30,000 points for his career. At 34 years, 104 days old, Bryant breaks Wilt Chamberlain’s record of 35 years, 179 days.`,source:'nba.com/history'},
  {date:'2016-12-05',imp:2,cat:'milestone',desc:`Klay Thompson of the Golden State Warriors scores 60 points in 29 minutes in a 142-106 win over the Indiana Pacers.`,source:'nba.com/history'},
  {date:'2023-12-05',imp:2,cat:'milestone',desc:`The Bucks beat the Knicks, 146-122 and the Lakers beat the Suns, 106-103, to advance to the semifinals in the Knockout Rounds of the inaugural In-Season Tournament.`,source:'nba.com/history'},
  {date:'1966-12-06',imp:2,cat:'milestone',desc:`Rick Barry of the San Francisco Warriors made an NBA-record 14 free throws in one quarter as the Warriors beat the Knicks 126-116 at New York.`,source:'nba.com/history'},
  {date:'1984-12-06',imp:2,cat:'milestone',desc:`Milwaukee retired uniform No. 16 in honor of center Bob Lanier, who had retired after the 1984 NBA Playoffs.`,source:'nba.com/history'},
  {date:'1986-12-06',imp:2,cat:'milestone',desc:`The Seattle SuperSonics posted a 136-80 win over the Rockets at The Summit in Houston. The 56-point margin made it the most one-sided road win in NBA history. The most one-sided road win in NBA Playoff history was the Lakers’ 126-70 win at Golden State in Game 3 of the 1973 Western Conference Finals on April 21.`,source:'nba.com/history'},
  {date:'1997-12-06',imp:2,cat:'milestone',desc:`The Houston Rockets defeated the Dallas Mavericks 108-106 in the first regular season game to be played in Mexico City at the Palacio de los Deportes.`,source:'nba.com/history'},
  {date:'2000-12-06',imp:2,cat:'milestone',desc:`Antawn Jamison of the Golden State Warriors and Kobe Bryant of the Los Angeles Lakers each scored 51 points in the Warriors’ 125-122 overtime victory. It was the first time in nearly 38 years and only the third time in NBA history that opposing players each scored at least 50 points in an NBA game. The feat last occurred on December 14, 1962, when Wilt Chamberlain scored 63 points for the Philadelphia Warriors and Elgin Baylor tallied 50 points for the Los Angeles Lakers. For Jamison, it was also the second straight game in which he scored 51 points, having hit that number December 3 in a loss to Seattle.`,source:'nba.com/history'},
  {date:'2016-12-06',imp:2,cat:'milestone',desc:`John Wall of the Washington Wizards scores 52 points in a 124-116 loss to the Orlando Magic.`,source:'nba.com/history'},
  {date:'1948-12-07',imp:2,cat:'milestone',desc:`The Indianapolis Jets beat the Washington Capitols 94-78, snapping the Capitols’ NBA-record streak at 15 consecutive games won at the start of the season. The mark was tied by the 1993-94 Houston Rockets.`,source:'nba.com/history'},
  {date:'1956-12-07',imp:2,cat:'milestone',desc:`Larry Bird is born in West Baden, Indiana.`,source:'nba.com/history'},
  {date:'1982-12-07',imp:2,cat:'milestone',desc:`The Utah Jazz, in a 137-121 loss at Portland, set an NBA record for free throw percentage in a game, connecting on all 39 of their attempts from the line.`,source:'nba.com/history'},
  {date:'1986-12-07',imp:2,cat:'milestone',desc:`The Los Angeles Lakers beat Golden State 132-100 for Coach Pat Riley’s 300th career victory. He reached that plateau in 416 games, faster than any other coach in NBA history, beating Billy Cunningham’s previous record of 430 games.`,source:'nba.com/history'},
  {date:'1990-12-07',imp:2,cat:'milestone',desc:`The New Jersey Nets retired jersey No. 23 in honor of “Super John” Williamson, who played three years in the ABA and four years in the NBA with the Nets. Williamson owned the second-highest NBA scoring average (22.5 ppg) in team history.`,source:'nba.com/history'},
  {date:'1993-12-07',imp:2,cat:'milestone',desc:`The Orlando Magic established an NBA record by holding the visiting Detroit Pistons to only six points in the fourth quarter of a 91-89 victory. The Pistons broke the previous NBA low of seven fourth-quarter points, set by Houston against the Los Angeles Lakers on November 15, 1991.`,source:'nba.com/history'},
  {date:'1994-12-07',imp:2,cat:'milestone',desc:`The Philadelphia 76ers, behind Jeff Malone’s game-high 34 points, posted a 111-102 road win at Miami to become the third NBA franchise (joining Boston and the Los Angeles Lakers) to reach 2,000 victories.`,source:'nba.com/history'},
  {date:'1995-12-07',imp:2,cat:'milestone',desc:`Veteran NBA referee Jake O’Donnell announces his retirement after officiating more than 2,100 regular-season and 279 playoff and 39 NBA Finals games in 28 seasons in the league.`,source:'nba.com/history'},
  {date:'1995-12-07',imp:2,cat:'milestone',desc:`The NBA and the National Basketball Referees Association sign a five-year labor agreement, through the 1999-2000 season, ending a lockout of referees that began on October 1.`,source:'nba.com/history'},
  {date:'1996-12-07',imp:2,cat:'milestone',desc:`Detroit’s Terry Mills tied an NBA record for the most consecutive 3-point field goals made, with 13, after connecting on his first attempt during the Pistons’ 95-69 win at New Jersey. Mills’ streak, which stretched over three games, tied the mark set by Brent Price during the 1995-96 season.`,source:'nba.com/history'},
  {date:'2023-12-07',imp:2,cat:'milestone',desc:`The Pacers beat the Bucks, 128-119, and the Lakers beat the Pelicans, 133-89, to advance both teams to the championship of the inaugural In-Season Tournament. The championship, in which the winner would collect the NBA Cup, would be held Dec. 9.`,source:'nba.com/history'},
  {date:'1961-12-08',imp:2,cat:'milestone',desc:`Larry Costello of the Syracuse Nationals scored 32 straight points without missing — 13 field goals and six free throws — as Syracuse lost 123-111 at Boston.`,source:'nba.com/history'},
  {date:'1961-12-08',imp:2,cat:'milestone',desc:`Wilt Chamberlain scored 78 points, the second highest scoring performance in NBA history, in the Philadelphia Warriors’ 151-147 loss to the Los Angeles Lakers in three overtimes.`,source:'nba.com/history'},
  {date:'1989-12-08',imp:2,cat:'milestone',desc:`Jack Sikma, playing for the Milwaukee Bucks, grabbed his 10,000th career rebound, becoming only the 18th player in league history at the time to accomplish that feat.`,source:'nba.com/history'},
  {date:'1992-12-08',imp:2,cat:'milestone',desc:`Atlanta’s Dominique Wilkins set an NBA record for most free throws made in a game without a miss, as he went 23-for-23 from the FT line in the Hawks’ 123-114 win over visiting Chicago.`,source:'nba.com/history'},
  {date:'1998-12-08',imp:2,cat:'milestone',desc:`The NBA announced the cancellation of the 1999 NBA All-Star Weekend, including the 49th Annual NBA All-Star Game scheduled for February 14 at the First Union Center in Philadelphia. This is the first time that the annual event had been cancelled. The cancellation was due to a labor dispute between the NBA and the National Basketball Players Association.`,source:'nba.com/history'},
  {date:'1999-12-08',imp:2,cat:'milestone',desc:`Houston Rockets forward Charles Barkley’s storied career came to an end in Philadelphia, when he attempted to block a shot by the Sixers’ Tyrone Hill. Barkley, who scored 23,755 points (13th in NBA history) and grabbed 12,545 rebounds (14th in NBA history), tore the left quadriceps tendon away from the kneecap in the first quarter of Houston’s 83-73 loss to Philadelphia. After the game, Barkley held a news conference and paid tribute to former teammates Julius Erving, Maurice Cheeks, Andrew Toney and Bobby Jones, who Barkley said initiated him in the ways of the NBA in his early years with the 76ers. Barkley would return to play token minutes in the last game of the regular season, which would then be the final game of his career.`,source:'nba.com/history'},
  {date:'2000-12-08',imp:2,cat:'milestone',desc:`Hakeem Olajuwon passed the 26,000-point plateau for his career in a 111-98 loss to Sacramento, becoming only the fifth NBA player to record 26,000 career points and 13,000 career rebounds. Olajuwon joined Kareem Abdul-Jabbar, Wilt Chamberlain, Moses Malone and Elvin Hayes.`,source:'nba.com/history'},
  {date:'2000-12-08',imp:2,cat:'milestone',desc:`Shaquille O’Neal of the Los Angeles Lakers broke a 40-year-old NBA record when he missed all 11 of his free throw attempts against Seattle. Wilt Chamberlain missed all 10 of his free throw attempts against Detroit on November 4, 1960.`,source:'nba.com/history'},
  {date:'2006-12-08',imp:2,cat:'milestone',desc:`Andre Miller of the Denver Nuggets dished out 20 assists in a 123-107 win over the Miami Heat.`,source:'nba.com/history'},
  {date:'2011-12-08',imp:2,cat:'milestone',desc:`The NBA and NBPA officially ended the 161-day lockout that started on July 1, 2011. Free agency, trades and training camps began the next day.`,source:'nba.com/history'},
  {date:'2011-12-08',imp:2,cat:'milestone',desc:`In an unprecedented move, a three-team trade that would have sent Chris Paul from the New Orleans Hornets to the Los Angeles Lakers is vetoed by Commissioner David Stern. With the NBA owning a majority-stake in the Hornets, the trade was overturned amid pressure from other team owners who opposed the transaction. Paul was subsequently traded to the LA Clippers before the NBA sold the Hornets to New Orleans Saints owner Tom Benson.`,source:'nba.com/history'},
  {date:'2023-12-08',imp:2,cat:'milestone',desc:`San Antonio Spurs rookie Victor Wembanyama becomes the youngest player in league history to record 20 points and 20 rebounds in a game in a 128-112 win vs. the Chicago Bulls. At 19 years and 38 days old, he broke the mark previously held by Dwight Howard by four days on Nov. 15, 2005.`,source:'nba.com/history'},
  {date:'1988-12-09',imp:2,cat:'milestone',desc:`Jerry Sloan was named head coach of the Utah Jazz, replacing Frank Layden, who resigned as head coach. Sloan’s coaching tenure with the Jazz is the longest current term of service among head coaches in the NBA.`,source:'nba.com/history'},
  {date:'1993-12-09',imp:2,cat:'milestone',desc:`Kevin Johnson of Phoenix became the 13th NBA player to record 10 steals in a game, during the Suns’ 114-95 win over visiting Washington.`,source:'nba.com/history'},
