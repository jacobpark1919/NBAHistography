<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Histography</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #060a14; }
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 28px 28px; pointer-events: none; z-index: 0;
}
#canvas { position: fixed; inset: 0; z-index: 1; cursor: grab; touch-action: none; }
#canvas.dragging { cursor: grabbing; }
#header {
  position: fixed; top: 24px; left: 38px; z-index: 10;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  padding: 16px 20px 18px;
  background: linear-gradient(180deg, rgba(7,10,18,0.92), rgba(7,10,18,0.58));
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  box-shadow: 0 10px 32px rgba(0,0,0,0.35);
}
.h-row { display: flex; align-items: center; gap: 14px; }
.h-title {
  font-family: 'Bebas Neue', cursive; font-size: 46px; letter-spacing: 6px;
  color: #ffffff; line-height: 0.95; text-shadow: 0 2px 16px rgba(0,0,0,0.45);
}
.h-pip   {
  width: 10px; height: 10px; border-radius: 50%; background: #ff9f1c;
  align-self: center; flex-shrink: 0; box-shadow: 0 0 18px rgba(255,159,28,0.95);
}
.h-sub {
  font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 700;
  letter-spacing: 2.4px; color: rgba(255,255,255,0.92); text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(0,0,0,0.38);
}
#vp {
  position: fixed; top: 24px; right: 38px; z-index: 10; pointer-events: auto;
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  padding: 16px 20px 18px;
  background: linear-gradient(180deg, rgba(7,10,18,0.92), rgba(7,10,18,0.58));
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  box-shadow: 0 10px 32px rgba(0,0,0,0.35);
  text-align: right;
}
.vp-main {
  font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 700;
  letter-spacing: 2.4px; color: rgba(255,255,255,0.92); text-transform: uppercase;
  text-shadow: 0 2px 10px rgba(0,0,0,0.38);
}
.vp-meta {
  font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 400;
  letter-spacing: 1.5px; color: rgba(255,255,255,0.86);
  text-shadow: 0 2px 10px rgba(0,0,0,0.38);
}
.vp-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  align-items: center;
  gap: 6px;
  max-width: 420px;
}
.vp-link {
  color: rgba(255,255,255,0.96);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  pointer-events: auto;
}
.vp-link:hover { opacity: 0.88; }
.vp-link-nba { color: #ff9f1c; }
.vp-link-hoops { color: #ffd84d; }
.vp-counts {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  width: 100%;
}
.vp-count-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  width: 100%;
}
.vp-count-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.74);
}
.vp-count-value {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 1.2px;
}
.vp-count-value.nba { color: #ff9f1c; }
.vp-count-value.hoops { color: #ffd84d; }
.vp-count-value.combined { color: rgba(255,255,255,0.94); }
.vp-filters {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 10px 14px;
  margin-top: 2px;
  width: 100%;
}
.vp-filter {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.8px;
  color: rgba(255,255,255,0.9);
  cursor: pointer;
  user-select: none;
}
.vp-filter input {
  accent-color: #ff9f1c;
  cursor: pointer;
}
.vp-filter-hoops input {
  accent-color: #ffd84d;
}
.vp-filter-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  box-shadow: 0 0 10px currentColor;
}
.vp-filter-dot.nba { color: #ff9f1c; background: #ff9f1c; }
.vp-filter-dot.hoops { color: #ffd84d; background: #ffd84d; }
#hint {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  font-family: 'Barlow Condensed', sans-serif; font-size: 10px; letter-spacing: 3px;
  text-transform: uppercase; color: rgba(255,255,255,0.12);
  z-index: 10; pointer-events: none; transition: opacity 2s;
}
#hint.gone { opacity: 0; }

/* ── Popup card ── */
#popup {
  position: fixed;
  z-index: 20;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s ease;
  max-width: 360px;
}
#popup.visible { opacity: 1; }
#popup-inner {
  background: rgba(7, 9, 18, 0.96);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px;
  padding: 16px 20px 18px;
  backdrop-filter: blur(20px);
  box-shadow: 0 16px 48px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
}
#popup-date {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}
#popup-desc {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 300;
  color: rgba(232,232,242,0.82);
  line-height: 1.55;
}
#popup-source {
  margin-top: 12px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  letter-spacing: 1.2px;
  color: rgba(255,255,255,0.58);
}
#popup-source a {
  color: rgba(255,159,28,0.92);
  text-decoration: underline;
}
/* connector line from bubble to card */
#popup-stem {
  position: absolute;
  width: 1px;
  background: rgba(255,255,255,0.18);
  transform-origin: top center;
}


@media (max-width: 760px) {
  #header {
    top: 12px; left: 12px; right: 12px;
    padding: 12px 14px 13px;
    gap: 6px;
    border-radius: 12px;
  }
  .h-row { gap: 10px; }
  .h-title {
    font-size: 31px;
    letter-spacing: 3.2px;
  }
  .h-pip {
    width: 8px; height: 8px;
    box-shadow: 0 0 14px rgba(255,159,28,0.95);
  }
  .h-sub {
    font-size: 12px;
    letter-spacing: 1.5px;
    line-height: 1.2;
  }
  #vp {
    left: 12px; right: 12px; top: 96px;
    padding: 11px 14px 12px;
    align-items: flex-start;
    text-align: left;
    border-radius: 12px;
  }
  .vp-main {
    font-size: 15px;
    letter-spacing: 1.7px;
    line-height: 1.15;
  }
  .vp-meta {
    font-size: 11px;
    letter-spacing: 1.1px;
    line-height: 1.3;
  }
  .vp-links {
    justify-content: flex-start;
    max-width: none;
  }
  .vp-counts {
    align-items: flex-start;
  }
  .vp-count-row {
    justify-content: flex-start;
  }
  .vp-count-label {
    font-size: 11px;
    letter-spacing: 1.2px;
  }
  .vp-count-value {
    font-size: 11px;
    letter-spacing: 0.9px;
  }
  .vp-filters {
    justify-content: flex-start;
    gap: 8px 12px;
  }
  .vp-filter {
    font-size: 11px;
  }
  #hint {
    bottom: 22px;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.22);
    padding: 0 18px;
    text-align: center;
  }
  #popup {
    max-width: min(320px, calc(100vw - 22px));
  }
  #popup-inner {
    padding: 14px 16px 15px;
  }
  #popup-date {
    font-size: 12px;
    letter-spacing: 1.6px;
  }
  #popup-desc {
    font-size: 15px;
    line-height: 1.45;
  }
  #popup-source {
    font-size: 11px;
    letter-spacing: 1px;
  }
}

</style>
</head>
<body>
<div id="header">
  <div class="h-row">
    <span class="h-title">NBA Histography</span>
    <span class="h-pip"></span>
  </div>
  <div class="h-sub">Scroll to zoom · Drag to pan · 1894-Present</div>
</div>
<div id="vp">
  <div class="vp-main">About · Powered by</div>
  <div class="vp-meta vp-links">
    <a class="vp-link vp-link-nba" href="https://www.nba.com/history" target="_blank" rel="noopener noreferrer">NBA.com/history</a>
    <span>and</span>
    <a class="vp-link vp-link-hoops" href="https://hoopsrewind.app" target="_blank" rel="noopener noreferrer">Hoopsrewind.app</a>
  </div>
  <div class="vp-meta">A visual timeline of pro basketball history</div>
  <div class="vp-counts">
    <div class="vp-count-row">
      <span class="vp-count-label">NBA.com/history</span>
      <span class="vp-count-value nba"><span id="nba-count">0</span> events</span>
    </div>
    <div class="vp-count-row">
      <span class="vp-count-label">Hoopsrewind.app</span>
      <span class="vp-count-value hoops"><span id="hoops-count">0</span> events</span>
    </div>
    <div class="vp-count-row">
      <span class="vp-count-label">Combined</span>
      <span class="vp-count-value combined"><span id="event-count">0</span> events and counting</span>
    </div>
  </div>
  <div class="vp-filters">
    <label class="vp-filter vp-filter-nba">
      <input type="checkbox" id="filter-nba" checked>
      <span class="vp-filter-dot nba"></span>
      <span>NBA.com/history</span>
    </label>
    <label class="vp-filter vp-filter-hoops">
      <input type="checkbox" id="filter-hoops" checked>
      <span class="vp-filter-dot hoops"></span>
      <span>Hoopsrewind.app</span>
    </label>
  </div>
</div>
<div id="hint">Scroll to dive in · Drag to explore</div>
<canvas id="canvas"></canvas>

<!-- Hover popup card -->
<div id="popup">
  <div id="popup-stem"></div>
  <div id="popup-inner">
    <div id="popup-date"></div>
    <div id="popup-desc"></div>
    <div id="popup-source">Source: <a id="popup-source-link" href="#" target="_blank" rel="noopener noreferrer"></a></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
//  DATE UTILITIES
// ══════════════════════════════════════════════════════════════════════════════

const parseISODateUTC = s => {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
};

const FIRST_EVENT_DATE = parseISODateUTC('1890-01-01');
const NBA_EPOCH_MS = FIRST_EVENT_DATE.getTime();
const TODAY = new Date();
const TODAY_UTC = new Date(Date.UTC(TODAY.getUTCFullYear(), TODAY.getUTCMonth(), TODAY.getUTCDate()));
const TOTAL_DAYS = Math.floor((TODAY_UTC.getTime() - NBA_EPOCH_MS) / 86400000);
const START_YR = FIRST_EVENT_DATE.getUTCFullYear();
const END_YR = TODAY_UTC.getUTCFullYear();

const dayOf = s => Math.max(0, Math.floor((parseISODateUTC(s).getTime() - NBA_EPOCH_MS) / 86400000));
const dayToDate = d => new Date(NBA_EPOCH_MS + d * 86400000);
const fy = yr => Math.max(0, Math.floor((Date.UTC(yr, 0, 1) - NBA_EPOCH_MS) / 86400000));
const fm = (yr, mo) => Math.max(0, Math.floor((Date.UTC(yr, mo, 1) - NBA_EPOCH_MS) / 86400000));
const MOS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ══════════════════════════════════════════════════════════════════════════════
//  VISUAL CONSTANTS — these never change with zoom
// ══════════════════════════════════════════════════════════════════════════════

const DOT_R    = 4.5;          // dot radius (px) — always fixed
const DOT_STEP = 12;           // vertical spacing (px) — always fixed
const DOT_DIAM = DOT_R * 2;    // 9px — overlap threshold

// ── Era-tinted placeholder color ─────────────────────────────────────────────
const SOURCE_META = {
  'nba.com/history': {
    color: '#ff9f1c',
    label: 'NBA.com/history',
    url: 'https://www.nba.com/history'
  },
  'hoopsrewind.app': {
    color: '#ffd84d',
    label: 'Hoopsrewind.app',
    url: 'https://hoopsrewind.app'
  }
};

const DOT_COLOR = SOURCE_META['nba.com/history'].color;
const COLORS = {
  championship:DOT_COLOR, record:DOT_COLOR, draft:DOT_COLOR,
  rule:DOT_COLOR, tragedy:DOT_COLOR, expansion:DOT_COLOR, milestone:DOT_COLOR,
};

function eraRGB(t) {                        // t = 0..1 across timeline
  if (t < 0.28) return [22,  48, 105];      // deep navy   — foundational era
  if (t < 0.52) return [28,  38, 115];      // indigo-blue — Bird/Magic/Jordan
  if (t < 0.76) return [42,  32, 108];      // purple-blue — Shaq/Kobe/LeBron
  return              [18,  62, 125];        // vivid blue  — modern era
}

// ══════════════════════════════════════════════════════════════════════════════
//  REAL EVENT DATA
// ══════════════════════════════════════════════════════════════════════════════

const REAL_EVENTS_DATA = [
  {date:'1974-01-01',imp:2,cat:'milestone',desc:`Ernie DiGregorio of Buffalo handed out 25 assists in the Braves’ 120-119 win over Portland, establishing a single-game record for assists by a rookie. Seattle’s Nate McMillan tied DiGregorio’s mark in a game against the Los Angeles Clippers on February 23, 1987.`,source:'nba.com/history'},
  {date:'1979-01-01',imp:2,cat:'milestone',desc:`John Y. Brown attended his first game as owner of the Boston Celtics. Brown, the former owner of the Buffalo Braves, and Irving H. Levin, who had owned the Celtics, decided to “trade” franchises in June of 1978. This unprecedented maneuver brought about the eventual relocation of the Buffalo Braves and the name change to the San Diego Clippers before the 1978-79 season.`,source:'nba.com/history'},
  {date:'2012-01-01',imp:2,cat:'milestone',desc:`All-Star Jimmy Butler made his Chicago Bulls’ debut in in a 104-64 win over the Memphis Grizzlies.`,source:'nba.com/history'},
  {date:'2020-01-01',imp:2,cat:'milestone',desc:`NBA Commissioner Emeritus David Stern dies at 77 after a nearly month-long battle with a brain hemorrhage. Stern had been involved with the NBA for nearly two decades before he became its fourth commissioner on Feb. 1, 1984. By the time he left his position in 2014, a league that fought for a foothold before him had grown to a more than $5 billion a year industry and made NBA basketball perhaps the world’s most popular sport.`,source:'nba.com/history'},
  {date:'1987-01-02',imp:2,cat:'milestone',desc:`The Indiana Pacers beat the Los Angeles Clippers 116-106 to give Coach Jack Ramsay his 800th NBA victory, at the time one of only two coaches (along with Red Auerbach) to reach that plateau.`,source:'nba.com/history'},
  {date:'2000-01-02',imp:2,cat:'milestone',desc:`19,600 fans watched the Miami Heat defeat the Orlando Magic, 111-103 in the first game at the Heat’s new American Airlines Arena.`,source:'nba.com/history'},
  {date:'2021-01-02',imp:2,cat:'milestone',desc:`Phoenix Suns legend and Hall of Famer Paul Westphal dies at age 70 in Arizona. A five-time All-Star, Westphal played in the NBA from 1972-84. After winning a championship with the Celtics, he made the finals in 1976 with Phoenix and, after his playing career ended, Westphal was the Suns coach. He guided Phoenix to the 1993 Finals and was also the coach of Seattle and Sacramento.`,source:'nba.com/history'},
  {date:'2023-01-02',imp:2,cat:'milestone',desc:`Cleveland Cavaliers guard Donovan Mitchell sets a franchise record with 71 points, most by any player in 17 years, as the Cavaliers rallied from 21 down to beat the Chicago Bulls 145-134 in overtime. Mitchell’s total matched the eighth-highest in league history and marked the most points by an NBA player since Lakers great Kobe Bryant scored 81 against Toronto on Jan. 22, 2006. Wilt Chamberlain owns the NBA record with 100 for Philadelphia against New York on March 2, 1962, at Hershey, Pa.`,source:'nba.com/history'},
  {date:'1998-01-03',imp:2,cat:'milestone',desc:`Los Angeles Clippers head coach Bill Fitch coached his 2,000th NBA game.`,source:'nba.com/history'},
  {date:'2021-01-03',imp:2,cat:'milestone',desc:`Golden State Warriors guard Stephen Curry scores a 62 points in a 137-122 win against the Portland Trail Blazers. He finished 18 for 31 and 8 of 16 on 3-pointers after beginning with a 21-point first quarter. His previous career high was 54 points on Feb. 27, 2013 against the Knicks at Madison Square Garden.`,source:'nba.com/history'},
  {date:'1975-01-04',imp:2,cat:'milestone',desc:`The New Orleans Jazz set a then NBA record (for games played with the use of the 24-second shot clock) by scoring only 20 points in the first half of a 111-89 loss at Seattle. The record stood for nearly 25 years before the Los Angeles Clippers scored 19 points in the first half against the Los Angeles Lakers on December 14, 1999.`,source:'nba.com/history'},
  {date:'1984-01-04',imp:2,cat:'milestone',desc:`Adrian Dantley tied Wilt Chamberlain’s record for most free throws made in one game by converting 28 free throws (in 29 attempts) in Utah’s 116-111 victory over Houston at Las Vegas.`,source:'nba.com/history'},
  {date:'1985-01-04',imp:2,cat:'milestone',desc:`The Boston Celtics honored Team President Red Auerbach by retiring uniform #2 in ceremonies prior to a game against New York.`,source:'nba.com/history'},
  {date:'1992-01-04',imp:2,cat:'milestone',desc:`Boston’s Robert Parish became the fifth player in NBA history (along with Kareem Abdul-Jabbar, Mark Eaton, Wayne Rollins and George Johnson) to register 2,000 career blocks during the Celtics’ 100-96 road loss at Minnesota.`,source:'nba.com/history'},
  {date:'2001-01-04',imp:2,cat:'milestone',desc:`Fayetteville, North Carolina was named as the first city to be granted a franchise in the National Basketball Development League, the NBA’s new minor league. The NBA announced the NBDL would begin play in November 2001.`,source:'nba.com/history'},
  {date:'2001-01-04',imp:2,cat:'milestone',desc:`Michael Jordan of the Washington Wizards, by hoisting the second of two free throws with 5:28 remaining in the second quarter of an 89-83 victory against Chicago, became the fourth player in NBA history to score 30,000 career points.`,source:'nba.com/history'},
  {date:'2005-01-04',imp:2,cat:'milestone',desc:`Indiana Pacers center Jermaine O’Neal scores 55 points in a 116-99 win against the Washington Wizards.`,source:'nba.com/history'},
  {date:'1962-01-05',imp:2,cat:'milestone',desc:`Wilt Chamberlain of Philadelphia began a streak of 47 consecutive complete games, an NBA record.`,source:'nba.com/history'},
  {date:'1988-01-05',imp:2,cat:'milestone',desc:`Hall of Famer Pete Maravich died at the age of 40 after suffering a heart attack while playing in a pick-up game in California.`,source:'nba.com/history'},
  {date:'1995-01-05',imp:2,cat:'milestone',desc:`Bill Fitch became the fifth coach in NBA history to register 850 career victories with the Clippers’ 95-93 home win over Philadelphia.`,source:'nba.com/history'},
  {date:'2001-01-05',imp:2,cat:'milestone',desc:`Kings forward Chris Webber notches a career-best 51 points and 26 rebounds in a 93-91 overtime loss to the Pacers. Webber shot 24-for-47 overall and added five assists, three steals and two blocks in the defeat.`,source:'nba.com/history'},
  {date:'2001-01-05',imp:2,cat:'milestone',desc:`Tim Thomas of the Milwaukee Bucks connected on eight 3-point field goals in the second half of Milwaukee’s 119-115 victory over Portland, breaking the record of seven 3-pointers made in one half shared by 10 players.`,source:'nba.com/history'},
  {date:'2011-01-05',imp:2,cat:'milestone',desc:`The Celtics’ Rajon Rondo dishes out 23 assists in a 105-103 win over the San Antonio Spurs.`,source:'nba.com/history'},
  {date:'2019-01-05',imp:2,cat:'milestone',desc:`The Golden State Warriors and Sacramento Kings make history in the Warriors’ 127-123 win by combining to hit 41 3-pointers. The Warriors made 21 of 47 shots from distance, while the Kings hit a franchise-record 20 of 36 attempts. It also marked the first game in NBA history in which both teams made 20 3-pointers.`,source:'nba.com/history'},
  {date:'1951-01-06',imp:2,cat:'milestone',desc:`The Indianapolis Olympians defeated the Rochester Royals 75-73 in six overtimes–the longest game in NBA history.`,source:'nba.com/history'},
  {date:'1991-01-06',imp:2,cat:'milestone',desc:`The Portland Trail Blazers defeated the Seattle SuperSonics 114-111 before a sellout crowd at the Portland Memorial Coliseum. It marked the Blazers’ 600th consecutive sellout at home.`,source:'nba.com/history'},
  {date:'1995-01-06',imp:2,cat:'milestone',desc:`Atlanta Coach Lenny Wilkens passed the legendary Red Auerbach to become the NBA’s all-time winningest coach, with 939 career victories, after the Hawks defeated Washington 112-90 at the Omni. Wilkens reached the victory record in his 22nd year as an NBA coach, including four as a player-coach. In tribute to Auerbach, Wilkens puffed on a postgame victory cigar.`,source:'nba.com/history'},
  {date:'2001-01-06',imp:2,cat:'milestone',desc:`Philadelphia 76ers star Allen Iverson scores 54 points in a 107-103 win against the Cleveland Cavaliers.`,source:'nba.com/history'},
  {date:'2021-01-06',imp:2,cat:'milestone',desc:`Bradley Beal scores 60 points in the Washington Wizards’ 141-136 loss to the Philadelphia 76ers, tying Gilbert Arenas’ single-game franchise mark set on Dec. 17, 2006. Beal went 20 of 25 from the floor, made 7 of 10 3-points and went 13 of 15 from the line.`,source:'nba.com/history'},
  {date:'1951-01-07',imp:2,cat:'milestone',desc:`Just one day after playing in the longest game in NBA history, a 75-73 win over the Rochester Royals in six overtimes, the Indianapolis Olympians were defeated by the Tri-Cities Blackhawks, 83-79, with each of the Olympians’ five starters playing all 48 minutes.`,source:'nba.com/history'},
  {date:'1972-01-07',imp:2,cat:'milestone',desc:`The Los Angeles Lakers defeated the Atlanta Hawks 134-90 for their 33rd straight win, the longest winning streak in major professional sports.`,source:'nba.com/history'},
  {date:'1995-01-07',imp:2,cat:'milestone',desc:`Larry Brown posted his 500th career NBA coaching victory, following Indiana’s 88-83 road win at Houston.`,source:'nba.com/history'},
  {date:'1998-01-07',imp:2,cat:'milestone',desc:`LA Clippers coach Bill Fitch tied Dick Motta (935) for third on the coaching victory list after a 110-102 win over Vancouver.`,source:'nba.com/history'},
  {date:'1998-01-07',imp:2,cat:'milestone',desc:`Los Angeles Lakers center Shaquille O’Neal blocked three shots in a 114-102 win over Milwaukee to bring his career total to 1,002.`,source:'nba.com/history'},
  {date:'1999-01-07',imp:2,cat:'milestone',desc:`The NBA Board of Governors unanimously ratified the new six-year collective bargaining agreement between the league and the National Basketball Players Association, setting the stage for the 1998-99 season to get underway. The agreement runs through the 2003-2004 NBA season, with a league option for the 2004-05 season.`,source:'nba.com/history'},
  {date:'2002-01-07',imp:2,cat:'milestone',desc:`Anthony Johnson of the Mobile Revelers was signed to a 10-day contract by the New Jersey Nets, becoming the first NBDL player to sign a NBA 10-day contract.`,source:'nba.com/history'},
  {date:'1985-01-08',imp:2,cat:'milestone',desc:`The San Antonio Spurs, behind a near quadruple-double by guard Johnny Moore, beat Golden State 139-94. Moore had 26 points, 13 assists, 11 rebounds and nine steals.`,source:'nba.com/history'},
  {date:'1993-01-08',imp:2,cat:'milestone',desc:`Michael Jordan’s game-high 35 points led Chicago to a 120-95 win over Milwaukee, giving him exactly 20,000 points in the 620th game of his NBA career. Jordan was the second-fastest to reach 20,000 points behind only Wilt Chamberlain, who did it in 499 games.`,source:'nba.com/history'},
  {date:'1993-01-08',imp:2,cat:'milestone',desc:`Robert Parish pulled down 11 rebounds in Boston’s 102-88 win over New Jersey, becoming the ninth player in NBA history to collect 13,000 career rebounds.`,source:'nba.com/history'},
  {date:'1997-01-08',imp:2,cat:'milestone',desc:`The Top Ten Teams in NBA History was announced: 1964-65 Boston Celtics, 1966-67 Philadelphia 76ers, 1969-70 New York Knicks, 1971-72 Los Angeles Lakers, 1982-83 Philadelphia 76ers, 1985-86 Boston Celtics, 1986-87 Los Angeles Lakers, 1988-89 Detroit Pistons, 1991-92 Chicago Bulls and the 1995-96 Chicago Bulls`,source:'nba.com/history'},
  {date:'1998-01-08',imp:2,cat:'milestone',desc:`Utah’s Karl Malone moved past former Boston Celtics great John Havlicek (26,395) and into eighth place on the NBA’s all-time scoring list. In the same game Malone also started his 500th consecutive game and passed Kareem Abdul-Jabbar (6,712) to move into sixth place on the NBA’s all-time list for free throws made.`,source:'nba.com/history'},
  {date:'2026-01-08',imp:2,cat:'milestone',desc:`Coach Rick Carlisle became the 11th coach to reach the milestone when the Pacers won 114-112 in Charlotte. He’s the first coach to join the group since Doc Rivers in November 2021.`,source:'nba.com/history'},
  {date:'1947-01-09',imp:2,cat:'milestone',desc:`Don Martin of Providence became the first NBA player to ever score 40 points in a game, in a matchup against Cleveland.`,source:'nba.com/history'},
  {date:'1972-01-09',imp:2,cat:'milestone',desc:`Milwaukee, led by Kareem Abdul-Jabbar, defeated the Los Angeles Lakers 120-104, ending the Lakers’ consecutive win streak at 33, the longest winning streak in major league sports history.`,source:'nba.com/history'},
  {date:'1972-01-09',imp:2,cat:'milestone',desc:`The NBA’s 2,000,000th point occurred in either the Baltimore-Phoenix or Detroit-Buffalo game.`,source:'nba.com/history'},
  {date:'1991-01-09',imp:2,cat:'milestone',desc:`Chicago’s Michael Jordan scored a game-high 40 points to lead the Bulls to a 107-99 win over Philadelphia at the Spectrum, reaching the 15,000 point mark for his career. Jordan reached 15,000 points in 460 games, quicker than any player in NBA history except Wilt Chamberlain (358 games).`,source:'nba.com/history'},
  {date:'1993-01-09',imp:2,cat:'milestone',desc:`Detroit retired Hall of Fame center Bob Lanier’s jersey #16 at halftime of the Pistons-Warriors game. Lanier played 91/2 seasons with the Pistons and finished his career in Milwaukee.`,source:'nba.com/history'},
  {date:'1996-01-09',imp:2,cat:'milestone',desc:`Toronto established an NBA record by becoming the first team ever not to hit a foul shot during the course of a game. The Raptors are 0-of-3 from the line during a 92-91 loss to visiting Charlotte.`,source:'nba.com/history'},
  {date:'2001-01-09',imp:2,cat:'milestone',desc:`Patrick Ewing of the Seattle SuperSonics scored his 24,000th career point, becoming the 13th player in NBA history to reach that total.`,source:'nba.com/history'},
  {date:'2021-01-09',imp:2,cat:'milestone',desc:`Charlotte Hornets rookie LaMelo Ball finishes with 22 points, 12 rebounds and 11 assists off the bench in a 113-105 win against the Atlanta Hawks. At the time, Ball, 19, replaced Markelle Fultz as the youngest NBA player to record a triple-double by 177 days. Other notable players to post their first triple-double at young ages include Luka Doncic (19 years, 327 days), LeBron James (20 years, 20 days) and Magic Johnson (20 years, 75 days.)`,source:'nba.com/history'},
  {date:'1985-01-10',imp:2,cat:'milestone',desc:`Lenny Wilkens became the first person to coach in 1,000 NBA games when the Seattle SuperSonics defeated the Golden State Warriors 89-86.`,source:'nba.com/history'},
  {date:'1986-01-10',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar of the Los Angeles Lakers scored his 34,000th career point, the only NBA player to reach that milestone.`,source:'nba.com/history'},
  {date:'1994-01-10',imp:2,cat:'milestone',desc:`Isiah Thomas of Detroit was added to the roster of Dream Team II, replacing the injured Tim Hardaway. The team would go on to win the gold medal at the 1994 World Championship of Basketball in Ontario, Canada.`,source:'nba.com/history'},
  {date:'1996-01-10',imp:2,cat:'milestone',desc:`In the Celtics’ 113-104 win against the Kings, Boston guard Dana Barros sank a three-point field goal in his 89th straight game, an NBA record streak that would be stopped in his next game.`,source:'nba.com/history'},
  {date:'1998-01-10',imp:2,cat:'milestone',desc:`Utah head coach Jerry Sloan won his 600th game with a 111-84 win at Houston.`,source:'nba.com/history'},
  {date:'2003-01-10',imp:2,cat:'milestone',desc:`The NBA announces that Charlotte, N.C., has been awarded NBA an expansion franchise. The team would be known as the Charlotte Bobcats before eventually changing to the Charlotte Hornets for the 2014-15 season.`,source:'nba.com/history'},
  {date:'2007-01-10',imp:2,cat:'milestone',desc:`Dikembe Mutombo surpasses Kareem Abdul-Jabbar to become the second most prolific shot-blocker in NBA history, behind only Hakeem Olajuwon.`,source:'nba.com/history'},
  {date:'2018-01-10',imp:2,cat:'milestone',desc:`In a 125-106 loss to the LA Clippers, Kevin Durant scored his 20,000th career point, doing so in the 737th game in his career. To boot, Durant was 29 years and 103 days old when he reached that mark, making him the second-youngest to do so (trailing only LeBron James, who did it at 28 years and 17 days old).`,source:'nba.com/history'},
  {date:'2019-01-10',imp:2,cat:'milestone',desc:`San Antonio Spurs coach Gregg Popovich moves into third place on the NBA’s all-time wins list with a 154-147 double-overtime victory against the Oklahoma City Thunder. In doing so, he passed former Utah Jazz coach and Hall of Famer Jerry Sloan with win No. 1,222.`,source:'nba.com/history'},
  {date:'1947-01-11',imp:2,cat:'milestone',desc:`The NBA voted to outlaw the use of zone defenses. When the league began play two and a half months earlier, it did so under college rules that permitted zones. But league officials felt that zones were slowing down the game and allowing teams to clog the middle and thus voted that they be prohibited.`,source:'nba.com/history'},
  {date:'1967-01-11',imp:2,cat:'milestone',desc:`San Diego was granted an NBA franchise to be called the Rockets. The franchise moved to Houston for the 1971-72 season.`,source:'nba.com/history'},
  {date:'1984-01-11',imp:2,cat:'milestone',desc:`Denver defeated San Antonio 163-155 in the second-highest scoring non-overtime game in NBA history. Golden State and Denver combined for 320 points on Nov. 2, 1990.`,source:'nba.com/history'},
  {date:'2000-01-11',imp:2,cat:'milestone',desc:`Ray Allen of the Milwaukee Bucks, Grant Hill of the Detroit Pistons and Alonzo Mourning of the Miami Heat were selected as the final three members of the 2000 USA Basketball Men’s Senior National Team, scheduled to participate in the 2000 Olympic Games in Sydney, Australia. Named previously to the USA Men’s Senior National Team were Vin Baker and Gary Payton of the Seattle SuperSonics; Tim Duncan of the San Antonio Spurs; Kevin Garnett of the Minnesota Timberwolves; Tom Gugliotta of the Phoenix Suns; Tim Hardaway of the Miami Heat; Allan Houston of the New York Knicks; Jason Kidd of the Phoenix Suns; and Steve Smith of the Portland Trail Blazers.`,source:'nba.com/history'},
  {date:'2000-01-11',imp:2,cat:'milestone',desc:`David Robinson of the San Antonio Spurs is among seven inductees to the Texas Sports Hall of Fame, in ceremonies taking place in Waco, Texas. Robinson, chosen as one of the 50 Greatest Players in NBA history is an eight-time All-Star and three-time U.S. Olympian who helped lead the Spurs to their first NBA championship in 1999.`,source:'nba.com/history'},
  {date:'2001-01-11',imp:2,cat:'milestone',desc:`The New York Knicks held an opponent under 100 points for an NBA-record 29th straight game when the Knicks dropped a 76-75 decision to the Houston Rockets. The streak snapped the 46-year-old NBA record of 28 straight set by the Fort Wayne Pistons in the 1954-55 season.`,source:'nba.com/history'},
  {date:'1966-01-12',imp:2,cat:'milestone',desc:`Red Auerbach of the Boston Celtics recorded his 1,000th career victory (regular season and playoffs), 114-102 over the Los Angeles Lakers in Boston.`,source:'nba.com/history'},
  {date:'1971-01-12',imp:2,cat:'milestone',desc:`33-year-old Lenny Wilkens of Seattle became, at the time, the oldest MVP in All-Star history as he scored 21 points in the West’s 108-107 win in San Diego. Michael Jordan became the oldest All-Star Game MVP when he captured the award in 1998, nine days short of his 35th birthday.`,source:'nba.com/history'},
  {date:'1996-01-12',imp:2,cat:'milestone',desc:`Boston’s Dana Barros misses all nine of his three-point attempts during the Celtics’ 105-92 loss to visiting New York, ending his NBA record streak of consecutive games with at least one three-pointer at 89.`,source:'nba.com/history'},
  {date:'2000-01-12',imp:2,cat:'milestone',desc:`Charlotte Hornets guard Bobby Phills died in an automobile accident near Charlotte Coliseum, following the team’s shootaround. He was 30 years old. The Hornets’ game that evening against the Chicago Bulls was postponed and rescheduled. The nine-year NBA veteran became a member of the Hornets on August 19, 1997, when he was signed as a free agent. In 1998, he was one of four finalists for the NBA’s Sportsmanship Award and started the Bobby Phills Educational Foundation.`,source:'nba.com/history'},
  {date:'2007-01-12',imp:2,cat:'milestone',desc:`Ray Allen scores a career-best 54 points in a 122-114 Sonics win in overtime against the Jazz. Allen shot 17-for-32 overall, went 8-for-12 on 3-pointers and made all 12 of his free throw attempts.`,source:'nba.com/history'},
  {date:'1962-01-13',imp:2,cat:'milestone',desc:`Wilt Chamberlain of Philadelphia scored 73 points to lead the host Warriors to a 135-117 win over the Chicago Packers. The 73 points was, at the time, the most points ever scored by an NBA player in a regulation game, and it remains tied for the third-highest total in NBA history.`,source:'nba.com/history'},
  {date:'1999-01-13',imp:2,cat:'milestone',desc:`Chicago’s Michael Jordan announced his second retirement from the NBA, just prior to the start of the lockout-shortened 1998-99 NBA season.`,source:'nba.com/history'},
  {date:'2001-01-13',imp:2,cat:'milestone',desc:`The Atlanta Hawks retired Dominique Wilkins’ No. 21 in ceremonies before a cheering, packed house at Philips Arena. Wilkins joined Bob Pettit and Lou Hudson as the only Hawks to have their numbers retired.`,source:'nba.com/history'},
  {date:'2008-01-13',imp:2,cat:'milestone',desc:`The Orlando Magic knock down an NBA-record 23 3-pointers in 37 attempts (62.2%). Jameer Nelson leads the way, going 5-for-5 from beyond the arc as the Magic defeat the Sacramento Kings 139-107.`,source:'nba.com/history'},
  {date:'2015-01-13',imp:2,cat:'milestone',desc:`Mo Williams of the Minnesota Timberwolves scores 52 points in a 110-101 win over the Indiana Pacers.`,source:'nba.com/history'},
  {date:'2023-01-23',imp:2,cat:'milestone',desc:`The San Antonio Spurs host the Golden State Warriors at the Alamodome and set the NBA’s single-game attendance record with 68,323 fans. The previous record of 62,046 was set on March 27, 1998, when the Atlanta Hawks hosted the Michael Jordan-led Chicago Bulls at the Georgia Dome.`,source:'nba.com/history'},
  {date:'1966-01-14',imp:2,cat:'milestone',desc:`The Philadelphia 76ers, led by Wilt Chamberlain, won the first of what was then an NBA record 36 consecutive home games, defeating Boston 112-110. The Celtics broke the mark by winning 38 games in a row at home during the 1985-86 and 1986-87 seasons.`,source:'nba.com/history'},
  {date:'1993-01-14',imp:2,cat:'milestone',desc:`Mark Eaton of the Utah Jazz blocked two shots in a 96-89 win over Seattle, becoming only the second player in NBA history (along with Kareem Abdul-Jabbar) to record 3,000 career blocks.`,source:'nba.com/history'},
  {date:'1993-01-14',imp:2,cat:'milestone',desc:`Uniform #77, symbolic of the Blazers’ 1977 championship season, is retired in honor of former Coach Jack Ramsay. He joins Harry Glickman, Bill Walton, Maurice Lucas, Geoff Petrie and Larry Weinberg in being selected to the organization’s Walk of Fame in Memorial Coliseum.`,source:'nba.com/history'},
  {date:'1994-01-14',imp:2,cat:'milestone',desc:`Boston’s Robert Parish scored 21 points in the host Celtics’ 102-95 loss to the Los Angeles Clippers, becoming the 12th player at the time to score 22,000 points in his career.`,source:'nba.com/history'},
  {date:'2000-01-14',imp:2,cat:'milestone',desc:`Mark Cuban purchases a majority stake in the Dallas Mavericks from H. Ross Perot, Jr.`,source:'nba.com/history'},
  {date:'1892-01-15',imp:2,cat:'milestone',desc:`The 13 original rules of basketball were printed in the Springfield YMCA training school newspaper.`,source:'nba.com/history'},
  {date:'1957-01-15',imp:2,cat:'milestone',desc:`Attempting a length-of-the-court pass to Bob Cousy, Bill Sharman stunned an NBA All-Star Game audience in Boston Garden when his 70-foot pass swished through the net. After the shot, Cousy asked Sharman, “Don’t you ever pass?”`,source:'nba.com/history'},
  {date:'1965-01-15',imp:2,cat:'milestone',desc:`In one of the biggest trades in NBA history, the San Francisco Warriors, in the middle of a then league record 17-game losing streak, traded Wilt Chamberlain to the Philadelphia 76ers in exchange for Connie Dierking, Lee Shaffer, Paul Neumann and cash.`,source:'nba.com/history'},
  {date:'1987-01-15',imp:2,cat:'milestone',desc:`Boston Celtics forward Larry Bird was named Man of the Year by The Sporting News and Athlete of the Year by The Associated Press, marking the first time one athlete had gained both distinctions.`,source:'nba.com/history'},
  {date:'1990-01-15',imp:2,cat:'milestone',desc:`Golden State Coach Don Nelson became the second man in NBA history to appear in 1,000 games both as a player and a coach (joining Lenny Wilkens) when the Warriors lost to the Indiana Pacers 144-105.`,source:'nba.com/history'},
  {date:'1994-01-15',imp:2,cat:'milestone',desc:`In dropping a 104-87 decision to San Antonio at Reunion Arena, the Dallas Mavericks set an NBA record with their 17th consecutive home loss, breaking the mark of 16 set by Orlando in 1990. The Mavericks’ home losing skein would increase to 19 before they would defeat Sacramento, 108-101 on Jan. 29.`,source:'nba.com/history'},
  {date:'1996-01-15',imp:2,cat:'milestone',desc:`Washington’s Brent Price began a NBA record streak of hitting on 13 straight three-point field goal attempts over three games. Terry Mills of the Detroit Pistons tied the record by hitting 13 straight in December of 1996.`,source:'nba.com/history'},
  {date:'1997-01-15',imp:2,cat:'milestone',desc:`Seattle’s Sam Perkins tied Jeff Hornacek’s NBA single-game record by connecting on eight three-point field goals without a miss, during the Sonics’ 122-78 win over visiting Toronto. Seattle also set an NBA record in the game with 27 steals.`,source:'nba.com/history'},
  {date:'1998-01-15',imp:2,cat:'milestone',desc:`Chicago’s Michael Jordan notched the 28,000th point of his career in the Bulls’ 106-96 loss to Philadelphia.`,source:'nba.com/history'},
  {date:'2000-01-15',imp:2,cat:'milestone',desc:`Utah Jazz coach Jerry Sloan became the 12th coach in NBA history to reach the 700-victory plateau when the Jazz defeated the Los Angeles Clippers 112-75 at Delta Center.`,source:'nba.com/history'},
  {date:'1962-01-16',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the Philadelphia Warriors scored 42 points, the most ever in an All-Star Game, and grabbed 24 rebounds as he won MVP honors even though his East team lost to the West 150-130. The West’s Bob Pettit had an All-Star record 27 rebounds.`,source:'nba.com/history'},
  {date:'1966-01-16',imp:2,cat:'milestone',desc:`Chicago was granted an NBA franchise to be called the Bulls.`,source:'nba.com/history'},
  {date:'1990-01-16',imp:2,cat:'milestone',desc:`The Milwaukee Bucks retired Sidney Moncrief’s #4 jersey.`,source:'nba.com/history'},
  {date:'1993-01-16',imp:2,cat:'milestone',desc:`Michael Jordan scored 64 points, but Chicago was upended in overtime by visiting Orlando 128-124. The Magic was led by rookie center Shaquille O’Neal, who posted 29 points and 24 rebounds.`,source:'nba.com/history'},
  {date:'2013-01-16',imp:2,cat:'milestone',desc:`In the third quarter of the Miami Heat’s 92-75 victory over the Golden State Warriors, LeBron James becomes the youngest player in NBA history to record 20,000 career points. James, at 28 years, 17 days, passed Kobe Bryant, 29 years, 122 days.`,source:'nba.com/history'},
  {date:'1961-01-17',imp:2,cat:'milestone',desc:`The Cincinnati Royals’ 22-year-old rookie sensation, Oscar Robertson, became the youngest player to receive All-Star MVP honors. Robertson scored 23 points and handed out 14 assists in a 153-131 victory for the West at Syracuse.`,source:'nba.com/history'},
  {date:'1992-01-17',imp:2,cat:'milestone',desc:`Boston’s Robert Parish became the 16th player in NBA history to reach the 20,000-point plateau for his career, after scoring 14 points in the Celtics’ 98-95 win over Philadelphia at Boston Garden.`,source:'nba.com/history'},
  {date:'1992-01-17',imp:2,cat:'milestone',desc:`Milwaukee’s Moses Malone became the sixth player in NBA history to appear in 1,200 games–along with Kareem Abdul-Jabbar, Elvin Hayes, John Havlicek, Paul Silas and Robert Parish–as he scored a team-high 20 points to lead the Bucks to a 90-85 win over New York at the Bradley Center.`,source:'nba.com/history'},
  {date:'1994-01-17',imp:2,cat:'milestone',desc:`Patrick Ewing became the first New York player to reach the 15,000-point mark for his career, scoring a game-high 34 points in the Knicks’ 106-94 win over visiting Minnesota.`,source:'nba.com/history'},
  {date:'1994-01-17',imp:2,cat:'milestone',desc:`The Sacramento Kings-Los Angeles Lakers game at the Great Western Forum was postponed due to an earthquake in Los Angeles. Also, due to damage caused by the earthquake, the Los Angeles Clippers were forced to move two games out of the LA Sports Arena.`,source:'nba.com/history'},
  {date:'2012-01-17',imp:2,cat:'milestone',desc:`In the third quarter of the Miami Heat’s 92-75 victory over the Golden State Warriors, LeBron James becomes the youngest player in NBA history to record 20,000 career points. James, at 28 years, 17 days, passed Kobe Bryant, 29 years, 122 days.`,source:'nba.com/history'},
  {date:'2014-01-17',imp:2,cat:'milestone',desc:`The Oklahoma City Thunder’s Kevin Durant scores 54 points in a 127-121 win over the Golden State Warriors.`,source:'nba.com/history'},
  {date:'1972-01-18',imp:2,cat:'milestone',desc:`The Lakers’ “Mr. Clutch,” Jerry West, sank a last-second, 20-foot jumper to lead the West team to a 112-110 All-Star victory over the East, as he garnered MVP honors.`,source:'nba.com/history'},
  {date:'1983-01-18',imp:2,cat:'milestone',desc:`Dick Motta becomes the fifth NBA coach to log 600 wins as Dallas knocked off Golden State 112-102 in Oakland.`,source:'nba.com/history'},
  {date:'1998-01-18',imp:2,cat:'milestone',desc:`Former Boston Celtics center Robert Parish is honored by having his No. 00 raised to the FleetCenter rafters at halftime of a game vs. Indiana. The game marked the return of Larry Bird to Boston as head coach of the Indiana Pacers.`,source:'nba.com/history'},
  {date:'2002-01-18',imp:2,cat:'milestone',desc:`Alex Hannum, the first coach to win championships in both the ABA and NBA, and one of only two coaches to win NBA titles with different teams, died at his home in San Diego. He was 78.`,source:'nba.com/history'},
  {date:'2016-01-18',imp:2,cat:'milestone',desc:`The Charlotte Hornets’ Kemba Walker scores 52 points in a 124-119 win over the Utah Jazz.`,source:'nba.com/history'},
  {date:'1977-01-19',imp:2,cat:'milestone',desc:`Norm Van Lier of the Chicago Bulls sank a shot measured at 84 feet in a game at San Antonio, but the Spurs still won, 115-107.`,source:'nba.com/history'},
  {date:'1996-01-19',imp:2,cat:'milestone',desc:`Washington’s Brent Price missed his fourth three-point field goal attempt, after extending his NBA record streak to 13 straight field goal attempts without a miss.`,source:'nba.com/history'},
  {date:'1998-01-19',imp:2,cat:'milestone',desc:`Los Angeles Lakers’ broadcaster Chick Hearn announced his 3,000th consecutive game. Hearn last missed a broadcast on November 20, 1965.`,source:'nba.com/history'},
  {date:'2000-01-19',imp:2,cat:'milestone',desc:`Michael Jordan, who led the Chicago Bulls to six NBA championships as a player, returned to the NBA when he joined the Washington Wizards as part owner and President of Basketball Operations, overseeing all aspects of the team. Jordan has also joined Lincoln Holdings, LLC, as a partner and investor. Lincoln Holdings owns the Washington Capitals and is a minority partner in Washington Sports & Entertainment, including the Washington Wizards.`,source:'nba.com/history'},
  {date:'1952-01-20',imp:2,cat:'milestone',desc:`George Mikan scored 61 points, a career-high for the NBA’s first superstar, as he led the Minneapolis Lakers to a 91-81 double-overtime victory over the Rochester Royals.`,source:'nba.com/history'},
  {date:'1967-01-20',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the Philadelphia 76ers made all 15 of his field goal attempts against the Los Angeles Lakers, at the time the NBA record for most field goals made without a miss in a single game. Remarkably, Chamberlain bettered the mark twice before the 1966-67 season ended, including his NBA record 18-for-18 performance against Baltimore on February 24, 1967.`,source:'nba.com/history'},
  {date:'1970-01-20',imp:2,cat:'milestone',desc:`Cincinnati’s Tom Van Arsdale and Phoenix’s Dick Van Arsdale become the first brothers to play in the same All-Star Game. Dick scored eight points for the West team, while Tom scored five for the East, which won the game 142-135 at Philadelphia.`,source:'nba.com/history'},
  {date:'1995-01-20',imp:2,cat:'milestone',desc:`Karl Malone reached 20,000 career points after hitting for a game-high 28 points in Utah’s 94-84 win over visiting Cleveland.`,source:'nba.com/history'},
  {date:'1996-01-20',imp:2,cat:'milestone',desc:`Denver’s Dale Ellis connected on a pair of three-point field goals during the Nuggets’ 115-110 home loss to Sacramento, allowing him to become the first NBA player with 1,200 career three-pointers.`,source:'nba.com/history'},
  {date:'1999-01-20',imp:2,cat:'milestone',desc:`The NBA and the National Basketball Players Association signed the new Collective Bargaining Agreement, paving the way for training camps to open after the first regular-season work stoppage in NBA history.`,source:'nba.com/history'},
  {date:'2000-01-20',imp:2,cat:'milestone',desc:`Karl Malone of the Utah Jazz reaches the 43,000-minute plateau in Utah’s 94-89 victory over Vancouver to become the eighth player in NBA history to pass that mark.`,source:'nba.com/history'},
  {date:'2001-01-20',imp:2,cat:'milestone',desc:`Former New York Knicks’ General Manager Eddie Donovan, who built the roster of the Knicks’ 1970 NBA championship team, died in New Jersey at age 78.`,source:'nba.com/history'},
  {date:'2007-01-20',imp:2,cat:'milestone',desc:`Coach Jerry Sloan passes Larry Brown for fourth on the NBA’s all-time win list (1,010) after the Utah Jazz defeat the Chicago Bulls 95-85 at the United Center.`,source:'nba.com/history'},
  {date:'1954-01-21',imp:2,cat:'milestone',desc:`For the first time in All-Star history, an overtime period was needed to decide a winner. Boston Celtics’ guard Bob Cousy’s 10-point overtime scoring burst gave the East a 98-93 victory and brought Cousy All-Star MVP honors.`,source:'nba.com/history'},
  {date:'1958-01-21',imp:2,cat:'milestone',desc:`Bob Pettit of St. Louis became the first member of the losing team to win the All-Star MVP award, scoring 28 points and grabbing 26 rebounds, even though the East beat the West 130-118.`,source:'nba.com/history'},
  {date:'1990-01-21',imp:2,cat:'milestone',desc:`Golden State’s Don Nelson became the 10th NBA coach to win 600 games, following the Warriors’ 120-115 road win at Boston. That improved his overall record to 600-404 in his 13th season of coaching in the NBA, and at 49 Nelson was the second youngest to reach that plateau. Red Auerbach was 43 when he won his 600th game.`,source:'nba.com/history'},
  {date:'1991-01-21',imp:2,cat:'milestone',desc:`Dick Motta of Sacramento coached in his 1,648th regular season game, a 97-94 victory over Houston, at the time an NBA record for the most regular-season coaching appearances.`,source:'nba.com/history'},
  {date:'1994-01-21',imp:2,cat:'milestone',desc:`The Dallas Mavericks fell to the Seattle SuperSonics 91-87, Dallas’ 19th consecutive loss at Reunion Arena, establishing an NBA record for the most consecutive home games lost.`,source:'nba.com/history'},
  {date:'1998-01-21',imp:2,cat:'milestone',desc:`Michael Jordan made 14 field goals to increase his career total to 10,524, passing John Havlicek (10,513) for fifth place on the NBA’s all-time field goals made list.`,source:'nba.com/history'},
  {date:'2002-01-21',imp:2,cat:'milestone',desc:`New Jersey’s Jason Kidd recorded his 5,000th career assist in his 531st game, thus becoming the sixth-fastest player in NBA history to reach that milestone, joining Oscar Robertson (467 games), Magic Johnson (472), John Stockton (483), Isiah Thomas (490) and Kevin Johnson (519). Kidd registered 15 assists in a 113-105 loss to Dallas.`,source:'nba.com/history'},
  {date:'2010-01-21',imp:2,cat:'milestone',desc:`Kobe Bryant becomes the youngest NBA player ever to reach 25,000 points at 31 years, and 151 days; beating Wilt Chamberlain by 35 days.`,source:'nba.com/history'},
  {date:'2015-01-21',imp:2,cat:'milestone',desc:`Brandon Jennings of the Detroit Pistons dishes 21 assists in a 128-118 win over the Orlando Magic.`,source:'nba.com/history'},
  {date:'1968-01-22',imp:2,cat:'milestone',desc:`The NBA Board of Governors granted franchises to the cities of Milwaukee and Phoenix.`,source:'nba.com/history'},
  {date:'1992-01-22',imp:2,cat:'milestone',desc:`Philadelphia’s Charles Barkley pulled down a game-high 14 rebounds to help lead the 76ers to a 119-109 win over New York at the Spectrum. Those 14 boards helped Barkley set a 76ers record for career rebounds, with 6,642, surpassing former leaders Billy Cunningham and Wilt Chamberlain.`,source:'nba.com/history'},
  {date:'1998-01-22',imp:2,cat:'milestone',desc:`The NBA has reached six-year agreements with ABC, ESPN and AOL Time Warner to have ABC, ESPN, TNT and a new AOL Time Warner/NBA jointly owned national cable sports network televise NBA games beginning with the 2002-03 season.`,source:'nba.com/history'},
  {date:'2006-01-22',imp:2,cat:'milestone',desc:`Kobe Bryant scores 81 points in a 122-104 Lakers victory against the Toronto Raptors. His point total in that game is the second-highest in NBA history, behind only Wilt Chamberlain’s 100-point game in 1962.`,source:'nba.com/history'},
  {date:'2018-01-22',imp:2,cat:'milestone',desc:`New Orleans Pelicans center DeMarcus Cousins finishes with 44 points, 24 rebounds and 10 assists in a 132-128 double-overtime win against the Chicago Bulls. He becomes the first player since Kareem Abdul-Jabbar in 1972 to notch 40-plus points, 20-plus rebounds and 10-plus assists in a game.`,source:'nba.com/history'},
  {date:'2020-01-22',imp:2,cat:'milestone',desc:`New Orleans Pelicans forward Zion Williamson makes his much-anticipated NBA debut in a 121-117 loss to the San Antonio Spurs. Williamson scored 17 straight points in a four-minute stretch as the crowd was worked into a frenzy watching his exploits.`,source:'nba.com/history'},
  {date:'2024-01-22',imp:2,cat:'milestone',desc:`Philadelphia 76ers center Joel Embiid scores a franchise-record 70  points in a 133-123 win against the San Antonio Spurs. Embiid’s total breaks the 76ers record set by Hall of Famer Wilt Chamberlain, who had 68 points on Dec. 16, 1967 and marked Embiid’s 21st consecutive game with at least 30 points.`,source:'nba.com/history'},
  {date:'1959-01-23',imp:2,cat:'milestone',desc:`In the NBA All-Star Game in Detroit, St. Louis’ Bob Pettit and Elgin Baylor of Minneapolis became the first co-winners of the MVP award as their West team won 124-108.`,source:'nba.com/history'},
  {date:'1980-01-23',imp:2,cat:'milestone',desc:`George Gervin of San Antonio scored 55 points in a 144-130 Spurs’ victory over the Pacers in Indianapolis.`,source:'nba.com/history'},
  {date:'1992-01-23',imp:2,cat:'milestone',desc:`Houston’s Otis Thorpe became the 10th player in NBA history to play in 500 consecutive games, scoring 20 points and grabbing 10 rebounds in the Rockets’ 109-96 win over the Los Angeles Clippers at The Summit.`,source:'nba.com/history'},
  {date:'1998-01-23',imp:2,cat:'milestone',desc:`Denver tied the single-season record of 23 consecutive losses set by the Vancouver Grizzlies in 1995-96. The streak halted with a 99-81 win the next day vs. the Los Angeles Clippers.`,source:'nba.com/history'},
  {date:'1998-01-23',imp:2,cat:'milestone',desc:`Michael Jordan scored in double figures for the 800th consecutive game in a 100-98 OT win over New Jersey. Jordan would add 40 more double-figure scoring games to his NBA record before retiring for the second time at the end of the 1997-98 season.`,source:'nba.com/history'},
  {date:'2000-01-23',imp:2,cat:'milestone',desc:`Dallas Mavericks coach Don Nelson becomes the sixth coach in NBA history to win 900 career games when the Mavericks defeat the Detroit Pistons 99-91 at The Palace of Auburn Hills.`,source:'nba.com/history'},
  {date:'2015-01-23',imp:2,cat:'milestone',desc:`The Golden State Warriors’ Klay Thompson scores 52 points in a 126-101 win over the Sacramento Kings. In the win, Thompson set an NBA record for points in a quarter by scoring 37 in the third. It broke the record of 33 points previously held by George Gervin and Carmelo Anthony.`,source:'nba.com/history'},
  {date:'2018-01-23',imp:2,cat:'milestone',desc:`LeBron James sinks a left wing jump shot with 1.1 seconds left in the first quarter in San Antonio to cross the 30,000 career points threshold. He becomes the youngest player and seventh all-time to reach 30,000 career points, joining Kareem Abdul-Jabbar, Karl Malone, Kobe Bryant, Michael Jordan, Wilt Chamberlain and Dirk Nowitzki.`,source:'nba.com/history'},
  {date:'1956-01-24',imp:2,cat:'milestone',desc:`With the West defeating the East 108-94 in the sixth All-Star Game in Rochester, Bob Pettit of the St. Louis Hawks captured the first of his NBA record four All-Star Game MVP awards, leading his team with 20 points and 24 rebounds.`,source:'nba.com/history'},
  {date:'1985-01-24',imp:2,cat:'milestone',desc:`NBA players announced plans to aid famine victims in Ethiopia by donating their winners’ and losers’ shares from the 1985 All-Star Game. The NBA matched this sum to bring the donation to more than $100,000.`,source:'nba.com/history'},
  {date:'1990-01-24',imp:2,cat:'milestone',desc:`The Los Angeles Lakers’ Pat Riley became the 13th coach to reach the 500-victory plateau, getting there faster than any coach as the Lakers downed the Pacers 120-111. At 500-184 Riley surpassed Don Nelson, who was 500-317 when he reached that milestone.`,source:'nba.com/history'},
  {date:'2014-01-24',imp:2,cat:'milestone',desc:`The New York Knicks’ Carmelo Anthony scores 62 points in a 125-96 win over the Charlotte Bobcats.`,source:'nba.com/history'},
  {date:'2021-01-24',imp:2,cat:'milestone',desc:`Golden State Warriors guard Stephen Curry nails a catch-and-shoot 3-pointer in the third quarter against the Utah Jazz to pass Hall of Famer Reggie Miller for No. 2 on the NBA’s all-time 3-pointers made list. Miller amassed 2,560 3-pointers in his career over 1,389 games while Curry surpassed Miller in his 715th career game.`,source:'nba.com/history'},
  {date:'1960-01-25',imp:2,cat:'milestone',desc:`Wilt Chamberlain scored 58 points, the most ever by an NBA rookie, as Philadelphia beat Detroit 127-117 at Bethlehem, PA. Chamberlain tied his record less than a month later.`,source:'nba.com/history'},
  {date:'1986-01-25',imp:2,cat:'milestone',desc:`Manute Bol of the Washington Bullets blocked 15 shots in a 111-103 win over Atlanta. His total is tied for second (Orlando’s Shaquille O’Neal had 15 rejections at New Jersey on November 20, 1993), behind the NBA record of 17 blocks by the Lakers’ Elmore Smith on October 28, 1973.`,source:'nba.com/history'},
  {date:'1988-01-25',imp:2,cat:'milestone',desc:`Jazz guard Rickey Green scored the NBA’s 5,000,000th point on a 24-foot three-pointer as the buzzer sounded ending the third quarter of Utah’s 119-96 victory over Cleveland.`,source:'nba.com/history'},
  {date:'1996-01-25',imp:2,cat:'milestone',desc:`In the closest NBA All-Star balloting returns since 1977, Grant Hill of Detroit edges Chicago’s Michael Jordan 1,358,004 votes to 1,341,422, out of more than 6.4 million ballots cast. Hill leads all vote-getters for the second straight year.`,source:'nba.com/history'},
  {date:'1998-01-25',imp:2,cat:'milestone',desc:`Michael Jordan led all players in votes received for a record ninth time in his career and Los Angeles Lakers guard Kobe Bryant becomes the youngest starter in NBA All-Star Game history after the final returns in the 1998 McDonald’s NBA All-Star voting program.`,source:'nba.com/history'},
  {date:'1999-01-25',imp:2,cat:'milestone',desc:`Former NBA referee Sid Borgia passed away.`,source:'nba.com/history'},
  {date:'2015-01-25',imp:2,cat:'milestone',desc:`The Miami Heat’s Hassan Whiteside blocks 12 shots in a 96-84 win over the Chicago Bulls.`,source:'nba.com/history'},
  {date:'2016-01-25',imp:2,cat:'milestone',desc:`DeMarcus Cousins of the Sacramento Kings scores 56 points in a 129-128 loss to the Charlotte Hornets.`,source:'nba.com/history'},
  {date:'2020-01-25',imp:2,cat:'milestone',desc:`LeBron James of the Los Angeles Lakers scores on a driving layup with 7:23 left in the third quarter to pass Kobe Bryant as the No. 3 scorer in NBA history. With that basket, James had 33,644 points and he finished the game at 33,655. Bryant finished his career with 33,643, all with the Lakers.`,source:'nba.com/history'},
  {date:'1973-01-26',imp:2,cat:'milestone',desc:`George Gervin made his debut for the Virginia Squires of the ABA against Utah. The Stars won 127-121.`,source:'nba.com/history'},
  {date:'1980-01-26',imp:2,cat:'milestone',desc:`The Cleveland Cavaliers lost at home to Indiana 115-114, but had cause to celebrate as Austin Carr became the franchise’s first 10,000-point scorer.`,source:'nba.com/history'},
  {date:'1990-01-26',imp:2,cat:'milestone',desc:`Cleveland Cavaliers Coach Lenny Wilkens won his 700th career game, 85-84 over Minnesota.`,source:'nba.com/history'},
  {date:'1991-01-26',imp:2,cat:'milestone',desc:`Houston guard Vernon Maxwell became the fifth player in NBA history to score 30 points in a quarter, joining Wilt Chamberlain, David Thompson, George Gervin and Michael Jordan. Maxwell, who finished with 51 points, hit for 30 in the final quarter of the Rockets’ 103-97 home win over Cleveland. Gervin holds the NBA record for scoring the most points in a quarter (33) in San Antonio’s 153-132 loss to New Orleans on Apr. 9, 1978.`,source:'nba.com/history'},
  {date:'1993-01-26',imp:2,cat:'milestone',desc:`New Jersey’s Chuck Daly became the 15th coach in NBA history to register 500 career victories, after the Nets defeated the visiting Los Angeles Lakers 106-91.`,source:'nba.com/history'},
  {date:'1995-01-26',imp:2,cat:'milestone',desc:`With a record 6,254,427 ballots cast by fans in the Foot Locker NBA All-Star Voting program, Detroit’s Grant Hill became the first rookie to ever lead all NBA players in All-Star votes received, earning the nod on 1,289,585 ballots.`,source:'nba.com/history'},
  {date:'2020-01-26',imp:2,cat:'milestone',desc:`Kobe Bryant, the 18-time All-Star who won five NBA championships and became one of the greatest basketball players of his generation during his 20-year career all with the Lakers, dies in a helicopter crash in California. The accident also claims the life of Bryant’s 13-year-old daughter, Gianna, and seven other people.`,source:'nba.com/history'},
  {date:'2024-01-26',imp:2,cat:'milestone',desc:`Dallas Mavericks guard Luka Doncic scores 73 points in a 148-143 win vs. the Atlanta Hawks, the fourth-most in NBA history surpassed only by Wilt Chamberlain and Kobe Bryant. His record night came just four days after Philadelphia 76ers center Joel Embiid scored a franchise record 70 points in a win vs. San Antonio.`,source:'nba.com/history'},
  {date:'1982-01-27',imp:2,cat:'milestone',desc:`Geoff Huston of Cleveland handed out a club record 27 assists in a 110-106 victory over the Golden State Warriors. At the time, it was the fourth-highest assist total in NBA history.`,source:'nba.com/history'},
  {date:'2017-01-27',imp:2,cat:'milestone',desc:`The Houston Rockets’ James Harden scores 51 points in a 123-118 win over the Philadelphia 76ers.`,source:'nba.com/history'},
  {date:'2018-01-27',imp:2,cat:'milestone',desc:`With a free throw in the third quarter against the Detroit Pistons, Oklahoma City Thunder forward Carmelo Anthony becomes the 21st player to reach 25,000 career points. At the time, Anthony scored 13,970 points with Denver, 10,186 points with New York and 845 with OKC.`,source:'nba.com/history'},
  {date:'1975-01-28',imp:2,cat:'milestone',desc:`The ABA’s eighth All-Star Game was held in San Antonio. The East squad beat the West squad 151-124. Freddie Lewis was named MVP. He had 26 points, 10 assists and five rebounds. The game featured future NBA stars Julius Erving, George Gervin, Dan Issel, and Moses Malone.`,source:'nba.com/history'},
  {date:'1980-01-28',imp:2,cat:'milestone',desc:`New York Coach Red Holzman won his 600th game, only the second (after Red Auerbach) coach at the time to reach that plateau, as the Knicks defeated Golden State 107-103.`,source:'nba.com/history'},
  {date:'1985-01-28',imp:2,cat:'milestone',desc:`Bill Fitch became the sixth coach in NBA history to post 600 wins as the Houston Rockets beat New Jersey 97-93.`,source:'nba.com/history'},
  {date:'1988-01-28',imp:2,cat:'milestone',desc:`Michael Adams of Denver began a record streak of 79 consecutive games with at least one three-point field goal. The streak, which stretched over two seasons, lasted from Jan. 28, 1988 against Milwaukee through Jan. 23, 1989 against Indiana. Dana Barros bested the streak by hitting 89 consecutive during the 1995 and 1996 seasons.`,source:'nba.com/history'},
  {date:'1998-01-28',imp:2,cat:'milestone',desc:`Indiana’s Reggie Miller had one steal in an 85-84 win over Washington to give him 1,000 for his career.`,source:'nba.com/history'},
  {date:'2015-01-28',imp:2,cat:'milestone',desc:`Kyrie Irving scores 55 points in a 99-94 win over the Portland Trail Blazers.`,source:'nba.com/history'},
  {date:'1971-01-29',imp:2,cat:'milestone',desc:`Hal Greer of the Philadelphia 76ers became the sixth player in NBA history at the time to score 20,000 points as the Sixers lost to Milwaukee 142-118.`,source:'nba.com/history'},
  {date:'1980-01-29',imp:2,cat:'milestone',desc:`Norm Nixon played a then NBA record 64 minutes for Los Angeles as the Lakers dropped a 154-153 four-overtime decision to Cleveland. This record was matched by Sleepy Floyd of Golden State seven years later and broken by Dale Ellis of Seattle, who played 69 minutes in a five-overtime game at Milwaukee on Nov. 9, 1989.`,source:'nba.com/history'},
  {date:'1984-01-29',imp:2,cat:'milestone',desc:`The NBA’s first All-Star Saturday took place in Denver at McNichols Arena. The inaugural Schick Legends Classic was won by the West, 64-63. The first Nestle Crunch Slam-Dunk winner was Larry Nance, who used a two-ball windmill dunk to beat favorites Julius Erving and Dominique Wilkins.`,source:'nba.com/history'},
  {date:'1988-01-29',imp:2,cat:'milestone',desc:`The Detroit Pistons drew a then NBA regular season record crowd of 61,983 fans to the Pontiac Silverdome, and the fans went home happy after watching the Pistons down Boston 125-108. The Chicago Bulls, led by Michael Jordan, and the Atlanta Hawks broke the attendance record by drawing 62,046 fans to the Georgia Dome on March 27, 1998.`,source:'nba.com/history'},
  {date:'2000-01-29',imp:2,cat:'milestone',desc:`Karl Malone of the Utah Jazz became the third player in NBA history to score 30,000 career points, as he finishes with 35 in a 96-94 loss to Minnesota at Target Center. Malone’s historic basket came when he made a layup with 8:53 left in the third quarter, and thus took his place in NBA annals alongside Kareem Abdul-Jabbar (38,387 career points) and Wilt Chamberlain (31,419).`,source:'nba.com/history'},
  {date:'2026-01-29',imp:2,cat:'milestone',desc:`Cooper Flagg set the NBA record for points by a teenager with 49 on Thursday night in Dallas’ 123-121 loss to Charlotte. In doing so, he broke the franchise rookie scoring record he shared with Mark Aguirre. Cliff Robinson set the previous NBA teen record of 45 at age 19 for New Jersey in a game against Detroit on March 9, 1980.`,source:'nba.com/history'},
  {date:'1994-01-30',imp:2,cat:'milestone',desc:`The #32 worn by Kevin McHale for 13 seasons with the Boston Celtics was retired during halftime ceremonies at Boston Garden. McHale, a seven-time NBA All-Star, scored 17,335 points, grabbed 7,122 rebounds and blocked 1,690 shots during his career, playing a key role on Boston teams that won three NBA Championships.`,source:'nba.com/history'},
  {date:'1996-01-30',imp:2,cat:'milestone',desc:`Chicago defeats host Houston 98-87, led by Scottie Pippen’s 28 points and 12 rebounds, helping the Bulls post the 10th perfect month in NBA history (at least 12 games played) with a 14-0 record.`,source:'nba.com/history'},
  {date:'1996-01-30',imp:2,cat:'milestone',desc:`Magic Johnson of the Los Angeles Lakers comes out of retirement, helping lead the Lakers to 128-118 victory over Golden State at the Great Western Forum with 19 points, eight rebounds and 10 assists. Johnson had last appeared in an NBA game during the 1991 NBA Finals against Chicago.`,source:'nba.com/history'},
  {date:'2002-01-30',imp:2,cat:'milestone',desc:`By scoring 18 points in a 90-78 triumph over Chicago at the Delta Center, Utah’s Karl Malone became the second player in NBA history to register 34,000 career points, trailing only Kareem Abdul-Jabbar (38,387 points).`,source:'nba.com/history'},
  {date:'2002-01-30',imp:2,cat:'milestone',desc:`With a 88-71 victory over Atlanta, the Detroit Pistons recorded the 2,000th victory in franchise history. The Pistons became the sixth NBA franchise to reach that milestone, joining the Los Angeles Lakers, Boston Celtics, Philadelphia 76ers, New York Knicks and Atlanta Hawks.`,source:'nba.com/history'},
  {date:'1994-01-31',imp:2,cat:'milestone',desc:`Atlanta’s Dominique Wilkins became the 11th player in NBA history to score 23,000 career points, netting 24 in the Hawks’ 90-85 win at Dallas.`,source:'nba.com/history'},
  {date:'1997-01-31',imp:2,cat:'milestone',desc:`San Antonio’s Dominique Wilkins scored 27 points in the Spurs’ 97-95 loss to Minnesota, giving him 26,009 career points. Wilkins was only the sixth NBA player to score 26,000 points.`,source:'nba.com/history'},
  {date:'2001-01-31',imp:2,cat:'milestone',desc:`Milwaukee Bucks’ head coach George Karl guided the Bucks to a 116-111 win over Denver, notching his 600th NBA coaching victory. Karl became the 17th NBA head coach to reach the milestone, and he was the sixth-fastest to 600 wins in NBA history.`,source:'nba.com/history'},
  {date:'2015-01-31',imp:2,cat:'milestone',desc:`A 91-85 win against the 76ers moves the Hawks to 17-0 for January, setting a new NBA record. The Hawks’ mark helped them pass the 1971-72 Lakers, who went 16-0 in December 1971 and the 2013 Heat, who went 17-1 in March 2013.`,source:'nba.com/history'},
  {date:'2018-01-31',imp:2,cat:'milestone',desc:`James Harden of the Houston Rockets becomes the first player in NBA history to log a 60-point triple-double. Harden finished with 60 points, 10 rebounds, 11 assists, four steals and a block in a 114-107 win against the Orlando Magic. Additionally, Harden set the Rockets’ franchise record for points in a game, besting Calvin Murphy’s 57-point mark set on March 18, 1978.`,source:'nba.com/history'},
  {date:'1967-02-01',imp:2,cat:'milestone',desc:`The American Basketball Association was born. The league, which fielded 11 teams in its first season, lasted until the 1975-76 season, when it was forced to disband after facing financial difficulties. Four former ABA clubs joined the NBA in the summer of 1976–the Denver Nuggets, Indiana Pacers, New York (now New Jersey) Nets and San Antonio Spurs.`,source:'nba.com/history'},
  {date:'1984-02-01',imp:2,cat:'milestone',desc:`Bernard King scored 50 points for the Knicks at Dallas, equaling the 50 he tallied the night before in San Antonio. He was the first player to score 50 points on consecutive nights since Wilt Chamberlain did it 20 years earlier.`,source:'nba.com/history'},
  {date:'1984-02-01',imp:2,cat:'milestone',desc:`David J. Stern officially took over as the NBA’s fourth Commissioner, replacing the retired Larry O’Brien, who had served as Commissioner since 1975. Stern had previously served as the NBA’s first General Counsel and later as Executive VP of Legal & Business Affairs.`,source:'nba.com/history'},
  {date:'1995-02-01',imp:2,cat:'milestone',desc:`With a crisp bounce pass to teammate Karl Malone, who hit a jumper from the corner, Utah guard John Stockton became the NBA’s all-time leader in assists with 9,922, surpassing the mark previously established by Magic Johnson. Utah topped visiting Denver 129-88 and Stockton finished with a game-high 16 assists.`,source:'nba.com/history'},
  {date:'1996-02-01',imp:2,cat:'milestone',desc:`Chicago defeated host Sacramento 105-85, giving the Bulls a 40-3 record, the most wins ever in a season with just three losses. That broke the 197 1-72 LA Lakers’ record, who started the season with a 39-3 mark but then lost their 43rd game to give them a 39-4 record.`,source:'nba.com/history'},
  {date:'1998-02-01',imp:2,cat:'milestone',desc:`Karl Malone scored 20 points to pass Oscar Robertson (26,710 points) for sixth place on the NBA’s all-time scoring list.`,source:'nba.com/history'},
  {date:'2001-02-01',imp:2,cat:'milestone',desc:`Karl Malone of the Utah Jazz grabbed the 13,000th rebound of his career in an 87-76 win over Charlotte, helping him become the sixth player in NBA history to record 26,000 points and 13,000 rebounds in his career. Malone joined Kareem Abdul-Jabbar, Wilt Chamberlain, Moses Malone, Elvin Hayes and Hakeem Olajuwon.`,source:'nba.com/history'},
  {date:'2012-02-01',imp:2,cat:'milestone',desc:`Serge Ibaka of the Oklahoma City thunder blocks 10 shots in a 95-86 win over the Dallas Mavericks.`,source:'nba.com/history'},
  {date:'1968-02-02',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the Philadelphia 76ers dished out a club-record 21 assists in a 131-121 win over Detroit. Maurice Cheeks tied this mark October 30, 1982 vs. New Jersey.`,source:'nba.com/history'},
  {date:'1992-02-02',imp:2,cat:'milestone',desc:`Milwaukee’s Alvin Robertson collected four steals in the Bucks’ 122-106 win over Seattle at the Bradley Center, giving him a career total of 1,700 steals, at the time moving him into second place on the NBA’s all-time list, behind Maurice Cheeks.`,source:'nba.com/history'},
  {date:'1993-02-02',imp:2,cat:'milestone',desc:`Dominique Wilkins scored 34 points to help Atlanta defeat Seattle 118-109, becoming the Hawks’ all-time leading scorer with 20,885 points, surpassing Hall of Famer Bob Pettit, who previously held the franchise scoring record.`,source:'nba.com/history'},
  {date:'1994-02-02',imp:2,cat:'milestone',desc:`Atlanta’s Lenny Wilkens became only the second coach (along with Red Auerbach) in NBA history to win 900 career games, after leading the Hawks to a 118-99 win over visiting Orlando.`,source:'nba.com/history'},
  {date:'1995-02-02',imp:2,cat:'milestone',desc:`The Houston Rockets ended Utah’s 15-game road winning streak with a 121-101 victory at The Summit. The Jazz’ streak, which began at Sacramento on November 27, came within one game of tying the Los Angeles Lakers’ NBA record 16-game road winning streak, set during the 1971-72 season.`,source:'nba.com/history'},
  {date:'1996-02-02',imp:2,cat:'milestone',desc:`Chicago’s 99-84 road win over the LA Lakers–with Michael Jordan and Magic Johnson meeting on the court for the first time since Game 5 of the 1991 NBA Finals–sets, at the time, a record as the highest-rated NBA game ever on cable TV. The telecast on TNT earns a 7.1 rating and a 13.1 share, being viewed in an average of 4.75 million homes. The rating mark stood until the May 21, 1996 Chicago-Orlando playoff game.`,source:'nba.com/history'},
  {date:'2021-02-02',imp:2,cat:'milestone',desc:`Toronto’s Fred VanVleet scores 54 points in a 123-108 win against Orlando and sets a trio of records in the process. His scoring total is the most by an undrafted player in NBA history (besting Moses Malone’s mark of 53 points vs. the Clippers in 1982) and the most in Raptors history (besting DeMar DeRozan’s 52-point game against the Bucks in 2018). VanVleet also hit eight 3-pointers in the first half, which set a Raptors franchise record for most 3-pointers made in any half. The mark had previously been held by Danny Green (vs. Memphis in 2019) and Terrance Ross (vs. the Clippers in 2014).`,source:'nba.com/history'},
  {date:'2025-02-02',imp:2,cat:'milestone',desc:`In a stunning blockbuster trade, the Dallas Mavericks deal star guard Luka Dončić to the Los Angeles Lakers in exchange for big man Anthony Davis,reserve guard Max Christie and a 2029 first-round draft pick. The three-team deal, in which Los Angeles acquires veteran forwards Maxi Kleber and Markieff Morris, also includes Utah getting Jalen Hood-Schifino and a 2025 second-rounder from both the Mavs and Lakers.`,source:'nba.com/history'},
  {date:'1980-02-03',imp:2,cat:'milestone',desc:`Boston rookie Larry Bird scored the first three-pointer in All-Star history, hitting from the corner in the East’s 144-136 overtime victory at the Capital Center. Magic Johnson, playing for the West, became the youngest All-Star ever at 20 years, five months.`,source:'nba.com/history'},
  {date:'1996-02-03',imp:2,cat:'milestone',desc:`Visiting teams were 7-0, the first time in NBA history that road clubs went undefeated in more than five games.`,source:'nba.com/history'},
  {date:'1998-02-03',imp:2,cat:'milestone',desc:`Bill Fitch tied Red Auerbach for second place with 938 all-time coaching victories as the Los Angeles Clippers defeated the Utah Jazz, 111-102.`,source:'nba.com/history'},
  {date:'2000-02-03',imp:2,cat:'milestone',desc:`The Houston Rockets honor Clyde Drexler by retiring his No. 22 in a ceremony held before the Rockets’ game against Philadelphia. Drexler becomes the fourth Rocket to have his jersey raised to the rafters of the Compaq Center, joining Calvin Murphy’s No. 23, Moses Malone’s No. 24 and Rudy Tomjanovich’s No. 45.`,source:'nba.com/history'},
  {date:'2010-02-03',imp:2,cat:'milestone',desc:`Phil Jackson records his 534th win as the Los Angeles Lakers head coach, passing Pat Riley for the most wins in franchise history.`,source:'nba.com/history'},
  {date:'2011-02-03',imp:2,cat:'milestone',desc:`LeBron James of the Miami Heat scored 51 points in a 104-100 win over the Orlando Magic.`,source:'nba.com/history'},
  {date:'2016-02-03',imp:2,cat:'milestone',desc:`Stephen Curry of the Golden State Warriors scores 51 points in a 134-121 win over the Washington Wizards.`,source:'nba.com/history'},
  {date:'2024-02-03',imp:2,cat:'milestone',desc:`Devin Booker scores 34 points in a 121-119 overtime loss to the Blazers to surpass Walter Davis as the Phoenix Suns’ all-time leading scorer.`,source:'nba.com/history'},
  {date:'1987-02-04',imp:2,cat:'milestone',desc:`The Sacramento Kings managed only four points in the first quarter of a 128-92 loss to the Los Angeles Lakers, the fewest points in the first quarter by a team since the inception of the shot clock in 1954.`,source:'nba.com/history'},
  {date:'1993-02-04',imp:2,cat:'milestone',desc:`In a special two-hour ceremony celebrating his storied playing career, Larry Bird’s #33 Celtics jersey was retired at sold-out Boston Garden.`,source:'nba.com/history'},
  {date:'1996-02-04',imp:2,cat:'milestone',desc:`Denver, behind 32 points from Mahmoud Abdul-Rauf, knocked off visiting Chicago 105-99, snapping the Bulls’ franchise-record 18-game winning streak, tying for the third-longest winning streak in NBA history.`,source:'nba.com/history'},
  {date:'2015-02-04',imp:2,cat:'milestone',desc:`Stephen Curry of the Golden State Warriors scores 51 points in a 128-114 win over the Dallas Mavericks.`,source:'nba.com/history'},
  {date:'2015-02-04',imp:2,cat:'milestone',desc:`All five Atlanta Hawks’ starters — DeMarre Carroll, Al Horford, Kyle Korver, Paul Millsap and Jeff Teague — are co-named KIA Players of the Month for January.`,source:'nba.com/history'},
  {date:'2021-02-04',imp:2,cat:'milestone',desc:`Lakers forward LeBron James scores on a driving layup in the first quarter against the Nuggets to move past Wilt Chamberlain for third on the NBA’s all-time field goals made list. The shot gave James 12,682 field goals as the Lakers won 114-93. James also recorded his 96th career triple-double in the victory.`,source:'nba.com/history'},
  {date:'1960-02-05',imp:2,cat:'milestone',desc:`Bill Russell ignored a charley horse to grab a personal best (and second best in NBA history) 51 rebounds in a 124-100 win over Syracuse. Fourteen years later, Russell was inducted into the Naismith Memorial Basketball Hall of Fame.`,source:'nba.com/history'},
  {date:'1978-02-05',imp:2,cat:'milestone',desc:`In what proved to be John Havlicek’s last All-Star Game, Philadelphia’s Doug Collins relinquished his starting spot so Hondo could be in the starting lineup. Havlicek scored 10 points in a 133-125 East win.`,source:'nba.com/history'},
  {date:'1993-02-05',imp:2,cat:'milestone',desc:`Boston’s Robert Parish scored 18 points and grabbed 14 rebounds in a 105-93 win over Philadelphia, his 1,304th NBA game. That moved Parish into second place on the all-time games played list, trailing only Kareem Abdul-Jabbar’s 1,560 games.`,source:'nba.com/history'},
  {date:'2016-02-05',imp:2,cat:'milestone',desc:`Hassan Whiteside of the Miami Heat blocks 10 shots in a 98-95 win over the Charlotte Hornets.`,source:'nba.com/history'},
  {date:'1970-02-06',imp:2,cat:'milestone',desc:`Buffalo was granted an NBA franchise to be called the Braves. They later moved to San Diego, then Los Angeles and changed their name to the Clippers. Cleveland and Portland were also granted NBA franchises.`,source:'nba.com/history'},
  {date:'1988-02-06',imp:2,cat:'milestone',desc:`Larry Bird, who defeated Dale Ellis by two points, left the floor with his finger extended in the #1 sign as his last shot swished in the AT&T Shootout at Chicago Stadium.`,source:'nba.com/history'},
  {date:'1988-02-06',imp:2,cat:'milestone',desc:`The Bulls’ Michael Jordan won the Nestle Crunch Slam Dunk with a perfect score of 50 on his final dunk, in front of an appreciative hometown crowd at Chicago Stadium during NBA All-Star Saturday.`,source:'nba.com/history'},
  {date:'2008-02-06',imp:2,cat:'milestone',desc:`In a blockbuster deal, the Phoenix Suns acquire Shaquille O’Neal from the Miami Heat in exchange for four-time NBA All-Star Shawn Marion and Marcus Banks.`,source:'nba.com/history'},
  {date:'1969-02-07',imp:2,cat:'milestone',desc:`Rick Barry of the Oakland Oaks set an ABA and professional basketball record by going 23-for-23 from the free throw line as Oakland defeated the Kentucky Colonels 124-122 in overtime. Dominique Wilkins of Atlanta later matched Barry’s feat and set the NBA mark on December 8, 1992.`,source:'nba.com/history'},
