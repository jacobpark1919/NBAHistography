  {date:'1997-12-09',imp:2,cat:'milestone',desc:`Chicago’s Michael Jordan becomes the NBA’s third-leading scorer in a 100-82 win over New York, scoring 29 points to give him 27,432 points over 13 seasons. Jordan moved ahead of Moses Malone, who had scored 27,409 points in 19 seasons.`,source:'nba.com/history'},
  {date:'2000-12-09',imp:2,cat:'milestone',desc:`Gary Payton scored 35 points in a loss to Houston, becoming the all-time leading scorer in Seattle SuperSonics history. Payton finished the game with 14,044 career points, surpassing “Downtown” Fred Brown’s 14,018 points.`,source:'nba.com/history'},
  {date:'2004-12-09',imp:2,cat:'milestone',desc:`With the Houston trailing the San Antonio 76-68 with 44.2 seconds left in the game, Rockets guard Tracy McGrady delivered one of the most memorable scoring performances in regular-season history. McGrady scored 13 points in the final 35 seconds, including a running 3-pointer with 1.7 seconds left that clinched an 81-80 win against the Spurs. Overall, McGrady finished with 33 points, eight rebounds and five steals in the wild comeback win.`,source:'nba.com/history'},
  {date:'2023-12-09',imp:2,cat:'milestone',desc:`The Lakers defeat the Pacers, 123-109, to win the inaugural NBA Cup at the first NBA In-Season Tournament. LeBron James is named MVP of the In-Season Tournament and finished with 24 points and 11 rebounds in the championship-clinching victory. In addition to taking home a trophy, Lakers players on standard contracts each made $500,000 and the Pacers received $200,000 apiece. Players on two-way deals take home half those amounts.`,source:'nba.com/history'},
  {date:'1971-12-10',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar scored a career-high 55 points in Milwaukee’s 120-104 victory over Boston.`,source:'nba.com/history'},
  {date:'1985-12-10',imp:2,cat:'milestone',desc:`The Boston Celtics beat Atlanta 118-101 to win the first of an NBA-record 38 straight home games over two seasons, ending November 28, 1986.`,source:'nba.com/history'},
  {date:'1985-12-10',imp:2,cat:'milestone',desc:`The Indiana Pacers made just 19 field goals in an 82-64 loss to the New York Knicks, setting an NBA record for the fewest field goals made by one team since the inception of the shot clock. The record stood for more than 13 years before the Chicago Bulls converted just 18 field goals in a game against Miami on April 10, 1999.`,source:'nba.com/history'},
  {date:'1994-12-10',imp:2,cat:'milestone',desc:`Dallas Coach Dick Motta moved into third place on the all-time coaching wins list (passing Jack Ramsay) with 865 career victories, following the Mavericks’ 99-86 win over visiting Charlotte.`,source:'nba.com/history'},
  {date:'1995-12-10',imp:2,cat:'milestone',desc:`James Worthy became the sixth player in Los Angeles Lakers’ history to have his jersey retired, when the team retired his No. 42 jersey at halftime of the game against Detroit at the Great Western Forum. Worthy, who played in 926 regular-season and 143 playoff games for the Lakers over 12 seasons, was also a member of NBA Championship teams in 1985, ’87 and ’88.`,source:'nba.com/history'},
  {date:'1996-12-10',imp:2,cat:'milestone',desc:`In Detroit’s 93-85 win over Milwaukee, Terry Mills of Detroit missed his first 3-point field goal attempt since extending his NBA-record streak to 13 straight 3-point field goal attempts without a miss against the Nets on December 7th.`,source:'nba.com/history'},
  {date:'1999-12-10',imp:2,cat:'milestone',desc:`Chicago Bulls guard Hersey Hawkins saw a streak of 527 consecutive games played end when he was unable to suit up for the Bulls’ 71-69 win over New Jersey. Hawkins suffered a torn muscle in his left calf in a December 8 game against Cleveland. Hawkins’ 527-game streak was the second-longest active consecutive games played streak behind all-time leader A.C. Green. Before the injury, Hawkins had missed only seven games in his 12-year NBA career.`,source:'nba.com/history'},
  {date:'1999-12-10',imp:2,cat:'milestone',desc:`Carmelo Anthony matches George Gervin’s NBA record for points in a quarter with 33 points in the third. He finishes with a season-high 45 points in the Denver Nuggets’ 116-105 victory over the Minnesota Timberwolves.`,source:'nba.com/history'},
  {date:'2016-12-10',imp:2,cat:'milestone',desc:`Twelve-time NBA All-Star Dolph Schayes, a Hall of Famer, dies at the age of 87.`,source:'nba.com/history'},
  {date:'1946-12-11',imp:2,cat:'milestone',desc:`The Chicago Stags defeated the Cleveland Rebels 88-70 in an experimental game featuring 15-minute quarters, instead of the usual 12-minute quarters.`,source:'nba.com/history'},
  {date:'1959-12-11',imp:2,cat:'milestone',desc:`Richie Guerin scored 57 points, at the time the most ever by a Knick, as New York defeated Syracuse 152-121. His team record survived 25 years until being surpassed by Bernard King, who tallied 60 points against New Jersey on December 25, 1984.`,source:'nba.com/history'},
  {date:'1971-12-11',imp:2,cat:'milestone',desc:`The NBA’s Silver Anniversary team was announced. It included Bob Cousy, Bob Davies, Paul Arizin, Joe Fulks, Sam Jones, George Mikan, Bill Russell, Dolph Schayes, Bill Sharman and Bob Pettit. The coach was Red Auerbach.`,source:'nba.com/history'},
  {date:'1984-12-11',imp:2,cat:'milestone',desc:`The Boston Celtics beat the New Jersey Nets 130-121 at Hartford as the two teams combined to shoot a record 63.2 percent (108-for-171) from the field.`,source:'nba.com/history'},
  {date:'1992-12-11',imp:2,cat:'milestone',desc:`The National Hockey League Board of Governors named Gary Bettman, the NBA’s Senior Vice President and General Counsel, the first Commissioner of the NHL.`,source:'nba.com/history'},
  {date:'1993-12-11',imp:2,cat:'milestone',desc:`With 12 rebounds during Philadelphia’s 99-86 road win at Milwaukee, Moses Malone became the fifth NBA player to surpass 16,000 career rebounds.`,source:'nba.com/history'},
  {date:'2001-12-11',imp:2,cat:'milestone',desc:`Larry Costello, who guided the Milwaukee Bucks to their only NBA title in 1971, died after battling cancer for more than a year. he was 70.`,source:'nba.com/history'},
  {date:'2006-12-11',imp:2,cat:'milestone',desc:`The NBA announces that it will cease using the new synthetic ball (in use since the 2006-07 season began), and revert to the old leather one.`,source:'nba.com/history'},
  {date:'2006-12-11',imp:2,cat:'milestone',desc:`Jerry Sloan became the fifth coach in NBA history to record 1,000 wins when the Utah Jazz beat the Dallas Mavericks 101-79.`,source:'nba.com/history'},
  {date:'2006-12-11',imp:2,cat:'milestone',desc:`George Karl becomes the seventh coach in NBA history to record 1000 career wins after the Denver Nuggets defeated the Toronto Raptors 123-116. Karl had missed the entire 2009-2010 season while battling cancer.`,source:'nba.com/history'},
  {date:'2018-12-11',imp:2,cat:'milestone',desc:`A 111-86 win by the San Antonio Spurs against the Phoenix Suns gives coach Gregg Popovich career win No. 1,211. That victory pushes him past Hall of Fame coach Pat Riley for fourth on the all-time victories list.`,source:'nba.com/history'},
  {date:'2023-12-11',imp:2,cat:'milestone',desc:`With a 123-109 win, the Los Angeles Lakers defeat the Indiana Pacers to win the inaugural NBA Cup trophy. LeBron James, who had 24 points and 11 rebounds in the win, was named the NBA In-Season Tournament MVP.`,source:'nba.com/history'},
  {date:'1932-12-12',imp:2,cat:'milestone',desc:`Bob Pettit is born in Baton Rouge, Louisiana.`,source:'nba.com/history'},
  {date:'1971-12-12',imp:2,cat:'milestone',desc:`Los Angeles defeated Atlanta 104-95 at the Forum for the Lakers’ 21st consecutive victory, breaking the NBA record of 20 straight wins, previously shared by the Washington Capitols (over two seasons) and Milwaukee Bucks. The Lakers went on to win 33 straight games, the longest winning streak in NBA history.`,source:'nba.com/history'},
  {date:'1984-12-12',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar scored 15 points to become the first player in NBA history to surpass 32,000 career points in the Lakers’ 131-107 victory over Golden State.`,source:'nba.com/history'},
  {date:'1988-12-12',imp:2,cat:'milestone',desc:`With a 110-94 loss to Utah at the Salt Palace, the Miami Heat set an NBA record for the most consecutive games lost at the start of a season with 17. The LA Clippers opened the lockout-shortened 1998-99 season with 17 straight defeats, tying the Heat’s mark.`,source:'nba.com/history'},
  {date:'2001-12-12',imp:2,cat:'milestone',desc:`Sacramento’s Rick Adelman became the 22nd coach to register 500 victories as the Kings defeated Orlando 112-100 at ARCO Arena.`,source:'nba.com/history'},
  {date:'2006-12-12',imp:2,cat:'milestone',desc:`Ten-time All-Star Paul Arizin, a member of the Hall of Fame and one of the first jump-shot specialists, dies at the age of 78.`,source:'nba.com/history'},
  {date:'1983-12-13',imp:2,cat:'milestone',desc:`Detroit beat Denver 186-184 in a triple-overtime game that set NBA records for most points scored in a game, one team (Detroit-186) and combined (370); most field goals, one team (Detroit-74) and combined (142); and combined assists (93).`,source:'nba.com/history'},
  {date:'1986-12-13',imp:2,cat:'milestone',desc:`The Washington Bullets retired uniform No. 25 in honor of the late Gus Johnson.`,source:'nba.com/history'},
  {date:'1991-12-13',imp:2,cat:'milestone',desc:`Boston’s Robert Parish became the fifth player in NBA history to appear in 1,200 career games (joining Kareem Abdul-Jabbar, Elvin Hayes, John Havlicek and Paul Silas) during the Celtics’ 117-97 win over Seattle at Boston Garden.`,source:'nba.com/history'},
  {date:'1994-12-13',imp:2,cat:'milestone',desc:`Philadelphia’s Willie Burton set a Spectrum scoring record by pouring in 53 points during the Sixers’ 105-90 win over Miami. That broke the previous scoring high at the Spectrum of 52 points, set by Michael Jordan during the 1988-89 season.`,source:'nba.com/history'},
  {date:'2000-12-13',imp:2,cat:'milestone',desc:`John Stockton of the Utah Jazz collected his 14,000th career assist in a 111-102 loss to Milwaukee. When Stockton notched the assist, he increased his lead over No. 2 career assist man Magic Johnson (10,141 assists) to 3,859 assists.`,source:'nba.com/history'},
  {date:'2001-12-13',imp:2,cat:'milestone',desc:`Larry Costello, who guided the Milwaukee Bucks to their only NBA championship in 1971, passed away after battling cancer for more than a year. He was 70 years old.`,source:'nba.com/history'},
  {date:'2023-12-13',imp:2,cat:'milestone',desc:`Milwaukee Bucks star Giannis Antetokounmpo sets a team and personal best with a 64-point showing against the Indiana Pacers in a 140-126 win. Antetokounmpo broke the team record of 57 set by Michael Redd in a 2006 loss to the Utah Jazz and also set a personal best, surpassing the 55 he scored in a 123-113 win vs. Washington in January of 2023.`,source:'nba.com/history'},
  {date:'2023-12-13',imp:2,cat:'milestone',desc:`Golden State Warriors forward Draymond Green is suspended indefinitely for striking Phoenix Suns center Jusuf Nurkic in the face during a Warriors vs. Suns game the previous day.`,source:'nba.com/history'},
  {date:'1962-12-14',imp:2,cat:'milestone',desc:`Wilt Chamberlain scored 63 points for the Philadelphia Warriors and Elgin Baylor tallied 50 points for the Los Angeles Lakers, one of only three times in NBA history that opposing players each scored at least 50 points in the same game.`,source:'nba.com/history'},
  {date:'1965-12-14',imp:2,cat:'milestone',desc:`Rick Barry of San Francisco poured in 57 points during the Warriors’ 141-137 setback against New York at Madison Square Garden. Barry’s 57 points were the second-highest total ever scored by a rookie in an NBA game (Wilt Chamberlain twice scored 58 for Philadelphia in 1960), and his 21 free throws (in 22 attempts) tied Frank Selvy’s NBA rookie record for the most free throws made in a game.`,source:'nba.com/history'},
  {date:'1975-12-14',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar grabbed 29 defensive rebounds, an NBA record, in a 110-100 win over Detroit. Prior to the 1973-74 season, offensive and defensive rebounds were tabulated collectively.`,source:'nba.com/history'},
  {date:'1985-12-14',imp:2,cat:'milestone',desc:`The Utah Jazz retired Pete Maravich’s uniform No. 7. “Pistol” Pete averaged 24.2 ppg in 10 NBA seasons ending in 1979-80.`,source:'nba.com/history'},
  {date:'1988-12-14',imp:2,cat:'milestone',desc:`The Miami Heat won their first game in the NBA, defeating the LA Clippers 89-88 at the LA Sports Arena. The win by Miami broke a 17-game losing streak, which established an NBA record for consecutive losses at the start of a season that was tied by the Clippers nearly 11 years later.`,source:'nba.com/history'},
  {date:'1990-12-14',imp:2,cat:'milestone',desc:`Alex English of Dallas scored his 25,000th career point during the Mavericks’ 106-104 road loss to the Trail Blazers.`,source:'nba.com/history'},
  {date:'1996-12-14',imp:2,cat:'milestone',desc:`The Clippers beat the Kings 106-94, enabling coach Bill Fitch to join Lenny Wilkens, Red Auerbach and Dick Motta as the only coaches in NBA history to win 900 games.`,source:'nba.com/history'},
  {date:'1999-12-14',imp:2,cat:'milestone',desc:`The LA Clippers scored just 19 points in the first half against the Los Angeles Lakers, snapping a nearly 25-year old record for fewest points in the first half of a game held by the New Orleans Jazz. New Orleans scored 20 points in the first half against Seattle on January 4, 1975.`,source:'nba.com/history'},
  {date:'2000-12-14',imp:2,cat:'milestone',desc:`Rudy Tomjanovich of the Houston Rockets earned his 400th head coaching victory in a 98-95 win over Golden State. Tomjanovich became the 29th NBA coach to accumulate 400 wins.`,source:'nba.com/history'},
  {date:'2000-12-14',imp:2,cat:'milestone',desc:`Jerry Sloan coaches his 1500th game against the LA Clippers, winning 93-91.`,source:'nba.com/history'},
  {date:'2004-12-14',imp:2,cat:'milestone',desc:`The Atlanta Hawks lose their tenth consecutive overtime game, stretching over three seasons, to tie the NBA record. The other record holders are the Golden State Warriors (1979-81) and the Minnesota Timberwolves (1992-95).`,source:'nba.com/history'},
  {date:'2011-12-14',imp:2,cat:'milestone',desc:`Chris Paul was traded from the New Orleans Hornets to the LA Clippers.`,source:'nba.com/history'},
  {date:'1984-12-15',imp:2,cat:'milestone',desc:`Gus Williams of the Washington Bullets recorded his 1,404th steal during a 109-103 loss to the LA Clippers to become, at the time, the NBA’s all-time leader in that category.`,source:'nba.com/history'},
  {date:'1994-12-15',imp:2,cat:'milestone',desc:`Recognizing that 3-point field goals were becoming more frequent at a shorter distance, the NBA announced that it was changing the statistical minimum, from 50 to 82, of 3-point baskets needed in order for a player to qualify for the 3-point field goal percentage title.`,source:'nba.com/history'},
  {date:'1995-12-15',imp:2,cat:'milestone',desc:`Toronto’s Alvin Robertson picks up three steals in the Raptors’ 122-103 loss at Boston, becoming the third NBA player to move past 2,000 career steals.`,source:'nba.com/history'},
  {date:'1997-12-15',imp:2,cat:'milestone',desc:`Chicago plays Phoenix in front of their 500th consecutive home sellout. At the time, it was the longest active streak and third-longest in NBA history. Portland had 814 and Boston is next on the list with 662.`,source:'nba.com/history'},
  {date:'2025-12-15',imp:2,cat:'milestone',desc:`Dallas rookie Cooper Flagg finishes with 42 points in a 140-133 overtime loss to the Jazz, becoming the youngest player – and first 18-year-old – to score at least 40 in a game. He surpasses LeBron James, whose 37 points on Dec. 13, 2003, vs. the Boston Celtics stood as the previous high for the under-19 set.`,source:'nba.com/history'},
  {date:'1961-12-16',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the Philadelphia Warriors began a streak of seven consecutive games in which he scored 50 points or more, another of Chamberlain’s many NBA records.`,source:'nba.com/history'},
  {date:'1993-12-16',imp:2,cat:'milestone',desc:`Patrick Ewing moved past Walt Frazier to become New York’s all-time leading scorer, with 14,618 career points, after hitting a second-quarter jumper during the Knicks’ 108-85 win over the visiting Los Angeles Lakers.`,source:'nba.com/history'},
  {date:'1997-12-16',imp:2,cat:'milestone',desc:`Houston’s Clyde Drexler had five steals to give him a career total of 2,115 and move him into fourth place on the all-time steals list.`,source:'nba.com/history'},
  {date:'2006-12-16',imp:2,cat:'milestone',desc:`In a game between the New York Knicks and Denver Nuggets, there was a fight and ten players on the court were ejected by Dick Bavetta and his officiating crew. The league eventually suspended seven of the players for a total of 47 games and fined both teams $500,000.`,source:'nba.com/history'},
  {date:'1976-12-17',imp:2,cat:'milestone',desc:`The Philadelphia 76ers retired Billy Cunningham’s uniform No. 32. He scored 13,626 points in just nine seasons with the Sixers and was a member of the 1967 NBA Championship team.`,source:'nba.com/history'},
  {date:'1991-12-17',imp:2,cat:'milestone',desc:`Cleveland, which had eight different players score in double figures, defeated Miami 148-80 at Richfield Coliseum. The 68-point margin of victory set an NBA record, shattering the previous mark of 63 points in the Los Angeles Lakers’ 162-99 win over Golden State on March 19, 1972.`,source:'nba.com/history'},
  {date:'1996-12-17',imp:2,cat:'milestone',desc:`Atlanta set an NBA record by making 19 3-point field goals (in 27 attempts) during a 109-73 victory at Dallas. Mookie Blaylock led the Hawks’ barrage from downtown, hitting 7-of-10 attempts.`,source:'nba.com/history'},
  {date:'1996-12-17',imp:2,cat:'milestone',desc:`As part of the NBA’s 50th anniversary season, the Top Ten Coaches in NBA History were announced. The list included Red Auerbach, Chuck Daly, Bill Fitch, Red Holzman, Phil Jackson, John Kundla, Don Nelson, Jack Ramsay, Pat Riley and Lenny Wilkens.`,source:'nba.com/history'},
  {date:'2004-12-17',imp:2,cat:'milestone',desc:`Toronto Raptors star Vince Carter is traded to the New Jersey Nets for Alonzo Mourning, Aaron Williams and Eric Williams and two future Draft picks.`,source:'nba.com/history'},
  {date:'2006-12-17',imp:2,cat:'milestone',desc:`Washington Wizards guard Gilbert Arenas sets two records in a 147-141 overtime win against the Los Angeles Lakers. He scored a career-best 60 points in the victory, shooting 17-for-32 overall. In overtime, he set another record by scoring 16 points, the most points in NBA history in a single overtime period.`,source:'nba.com/history'},
  {date:'2008-12-17',imp:2,cat:'milestone',desc:`Chris Paul steals an attempted pass from Tony Parker to set a new record for consecutive games with a steal at 106 games, breaking the old record previously held by Alvin Robertson.`,source:'nba.com/history'},
  {date:'2016-12-17',imp:2,cat:'milestone',desc:`Russell Westbrook of the the Oklahoma City Thunder dishes 22 assists in a 114-101 win over the the Phoenix Suns.`,source:'nba.com/history'},
  {date:'2023-12-17',imp:2,cat:'milestone',desc:`Golden State Warriors guard Stephen Curry sees his streak of consecutive games with at least one 3-pointer end at 268 games in a 118-114 win against the Portland Trail Blazers. Curry finished with seven points and was 2-for-12 overall and 0-for-8 on 3-pointers.`,source:'nba.com/history'},
  {date:'1984-12-18',imp:2,cat:'milestone',desc:`The Washington Bullets beat the New Jersey Nets 104-95 to give Gene Shue his 700th NBA career coaching victory. Shue became only the third coach to reach that plateau at the time, joining Red Auerbach and Jack Ramsay.`,source:'nba.com/history'},
  {date:'1984-12-18',imp:2,cat:'milestone',desc:`The NBA Expansion Committee unanimously recommends that the NBA Board of Governors approve an expansion franchise for the city of Charlotte, North Carolina, to be owned and operated by Robert L. Johnson. That franchise became the Charlotte Bobcats and is now known as the Charlotte Hornets.`,source:'nba.com/history'},
  {date:'2008-12-18',imp:2,cat:'milestone',desc:`Portland Trail Blazers star guard Brandon Roy scores a career-high 52 points in a 124-119 win against the Phoenix Suns.`,source:'nba.com/history'},
  {date:'2017-12-18',imp:2,cat:'milestone',desc:`In a halftime ceremony at Staples Center, Kobe Bryant’s No. 8 and No. 24 jerseys are retired by the Los Angeles Lakers. He became the 10th player in team history to have his number retired and the only player with two jerseys retired by the Lakers.`,source:'nba.com/history'},
  {date:'1956-12-19',imp:2,cat:'milestone',desc:`Upon his return from Melbourne, Australia, where he led the U.S. Basketball squad to an Olympic gold medal, Bill Russell signed his first contract with the Boston Celtics.`,source:'nba.com/history'},
  {date:'1957-12-19',imp:2,cat:'milestone',desc:`Boston Celtics legend Kevin McHale is born in Hibbing, Minn.`,source:'nba.com/history'},
  {date:'1968-12-19',imp:2,cat:'milestone',desc:`The Detroit Pistons traded Dave DeBusschere to the New York Knicks for Walt Bellamy and Howard Komives. The acquisition of DeBusschere is often credited as providing the last piece to the Knicks’ championship teams of 1970 and 1973. The midseason trade also allowed Bellamy to play in an NBA record 88 games that season with New York and Detroit.`,source:'nba.com/history'},
  {date:'1990-12-19',imp:2,cat:'milestone',desc:`Boston’s Kevin McHale scored 23 points in 29 minutes of play, helping the Celtics down Philadelphia 115-105 while reaching the 15,000 point mark for his career.`,source:'nba.com/history'},
  {date:'1992-12-19',imp:2,cat:'milestone',desc:`New York’s 91-87 win over Miami at Madison Square Garden gave Knicks Coach Pat Riley his 600th career victory, the 12th coach in NBA history to reach that mark.`,source:'nba.com/history'},
  {date:'2006-12-19',imp:2,cat:'milestone',desc:`The Philadelphia 76ers trade star guard Allen Iverson to the Denver Nuggets for Andre Miller, Joe Smith and two future Draft picks.`,source:'nba.com/history'},
  {date:'1966-12-20',imp:2,cat:'milestone',desc:`Seattle was named the 11th franchise city in the NBA. Approximately one month later the team was named the SuperSonics, the result of a local contest won by Howard E. Schmidt.`,source:'nba.com/history'},
  {date:'1992-12-20',imp:2,cat:'milestone',desc:`Buck Williams becomes only the 20th player in NBA history to collect 10,000 rebounds in his career as Portland defeats Golden State, 130-114.`,source:'nba.com/history'},
  {date:'1997-12-20',imp:2,cat:'milestone',desc:`New York’s Patrick Ewing suffered a Lunate dislocation and torn ligaments in right wrist in game vs. Milwaukee Bucks and was declared out for the remainder of the season following surgery.`,source:'nba.com/history'},
  {date:'2001-12-20',imp:2,cat:'milestone',desc:`Chick Hearn, the Lakers’ play-by-play announcer, was not be behind the microphone for the Lakers-Rockets game as he recovered from heart surgery to replace a blocked aortic valve, bringing to end an astonishing streak, one that lasted more than 36 years and 3,338 games.`,source:'nba.com/history'},
  {date:'2005-12-20',imp:2,cat:'milestone',desc:`Kobe Bryant scored 62 points in three quarters against the Dallas Mavericks. The Mavericks had 61 points total, making this the only time a player had done this through three quarters since the advent of the shot clock.`,source:'nba.com/history'},
  {date:'2006-12-20',imp:2,cat:'milestone',desc:`New York Knicks forward David Lee scores a game-winning basket with only 00:00.1 seconds left on the clock. The shot counts because Lee deflects the inbounds pass into the basket. It is the first occurrence of a team winning an NBA game with one-tenth of one second left since the NBA implemented the Trent Tucker Rule in 1990.`,source:'nba.com/history'},
  {date:'2016-12-20',imp:2,cat:'milestone',desc:`DeMarcus Cousins of the Sacramento Kings scores 55 points in a 126-121 win over the Portland Trail Blazers.`,source:'nba.com/history'},
  {date:'2024-12-20',imp:2,cat:'milestone',desc:`Los Angeles Lakers star LeBron James surpassed six-time NBA MVP Kareem Abdul-Jabbar for the most minutes played in league history. Already the all-time leader in career points, James surpassed Abdul-Jabbar with 34 minutes in L.A.’s 113-100 victory over Sacramento, giving him 57,471 in 1,517 games played.`,source:'nba.com/history'},
  {date:'1980-12-21',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar became only the fifth player in NBA history to notch 25,000 points as he scored a season-high 42 points in the Lakers’ 135-102 win over San Antonio.`,source:'nba.com/history'},
  {date:'2001-12-21',imp:2,cat:'milestone',desc:`With 16 points in a 100-94 victory over New Jersey, Indiana’s Reggie Miller improved his career scoring total to 21,801 points and moved past Larry Bird into 19th place on the NBA’s all-time scoring list.`,source:'nba.com/history'},
  {date:'2014-12-21',imp:2,cat:'milestone',desc:`One-time All-Star Paul Walther dies at the age of 87.`,source:'nba.com/history'},
  {date:'1949-12-22',imp:2,cat:'milestone',desc:`In his 13th game as a Celtic, Tony Lavelli scored 26 points as Boston beat the Minneapolis Lakers, who were on their way to a second straight NBA title. At halftime, the versatile Lavelli treated the 5,206 fans at Boston Garden to an accordion mini-concert, one of about two dozen performances he gave around the league for which he was paid $125 per concert by the NBA.`,source:'nba.com/history'},
  {date:'1956-12-22',imp:2,cat:'milestone',desc:`Bill Russell made his debut for the Boston Celtics at home against the St. Louis Hawks. The Celtics won 95-93. Russell scored six points and grabbed 16 rebounds.`,source:'nba.com/history'},
  {date:'1962-12-22',imp:2,cat:'milestone',desc:`The NBA’s 1,000,000th point was scored in either the Detroit-Chicago, New York-Boston or Syracuse-San Francisco game.`,source:'nba.com/history'},
  {date:'1996-12-22',imp:2,cat:'milestone',desc:`By pulling down 12 rebounds in Utah’s 100-94 setback at Cleveland, Karl Malone became the 11th player in NBA history to reach 20,000 and 10,000 rebounds in a season.`,source:'nba.com/history'},
  {date:'2020-12-22',imp:2,cat:'milestone',desc:`A shortened 2020-21 NBA season begins with a doubleheader — Warriors vs. Nets and Clippers vs. Lakers — to begin a 72-game season. The coronavirus pandemic of 2020 caused the season to start later than its typical mid-October start.`,source:'nba.com/history'},
  {date:'1990-12-23',imp:2,cat:'milestone',desc:`In a game that took 26 days to decide, the Boston Celtics downed the Atlanta Hawks 132-104 at the Garden. The game was originally scheduled to be played on November 28, but a wet playing surface, caused by condensation from the ice underneath the parquet floor, forced postponement of the game 90 seconds into the second quarter and the Celtics ahead 37-22.`,source:'nba.com/history'},
  {date:'1992-12-23',imp:2,cat:'milestone',desc:`Michael Jordan scored 57 points to lead Chicago over Washington 107-98, giving Bulls Coach Phil Jackson his 200th career victory, in an NBA record 270 games.`,source:'nba.com/history'},
  {date:'1994-12-23',imp:2,cat:'milestone',desc:`Dana Barros of Philadelphia began a streak of 58 games in which he sank at least one three-point field goal, breaking the NBA record for a single season previously held by Michael Adams at 43.`,source:'nba.com/history'},
  {date:'1997-12-23',imp:2,cat:'milestone',desc:`Hall of Famer Les Harrison, who led the Rochester Royals to the NBA Championship in 1951 as owner, general manager and coach, died at the age of 93.`,source:'nba.com/history'},
  {date:'1997-12-23',imp:2,cat:'milestone',desc:`Chicago’s Phil Jackson recorded his 500th victory as an NBA coach, reaching the mark in his 682nd game, faster than any other coach in NBA history.`,source:'nba.com/history'},
  {date:'1999-12-23',imp:2,cat:'milestone',desc:`The Philadelphia 76ers are selected to host NBA All-Star 2002, the NBA announced. NBA All-Star 2002 will include the 51st NBA All-Star Game, the events of NBA All-Star Saturday, the NBA TeamUp Celebration and the NBA All-Star Jam Session presented by Fleer. NBA All-Star 2002 will be held Feb. 8-10, 2002. The First Union Center, which opened during the 1996-97 season, will host the NBA All-Star Game and the events of NBA All-Star Saturday, while the Pennsylvania Convention Center will play host to the NBA All-Star Jam Session. The city of Philadelphia and the 76ers were originally scheduled to host the 1999 NBA All-Star Weekend, which was cancelled due to a league work stoppage. This will mark the fourth time the NBA All-Star Game will be held in the city of Philadelphia. The Philadelphia Warriors hosted the game in 1960 at Convention Hall, where 10,421 turned out to see the East top the West, 125-115, behind 25 points from Wilt Chamberlain.`,source:'nba.com/history'},
  {date:'2007-12-23',imp:2,cat:'milestone',desc:`In Madison Square Garden against the New York Knicks, Kobe Bryant became the youngest player ever to reach 20,000 points (29 years, 122 days).`,source:'nba.com/history'},
  {date:'1960-12-24',imp:2,cat:'milestone',desc:`Boston pulled down 109 rebounds in a game against Detroit to establish an NBA record as the Celtics beat the Pistons 150-106.`,source:'nba.com/history'},
  {date:'1960-12-25',imp:2,cat:'milestone',desc:`The host Syracuse Nationals routed the New York Knicks 162-100 in a holiday game, setting a record for margin of victory (62 points) that would last for 12 years.`,source:'nba.com/history'},
  {date:'1984-12-25',imp:2,cat:'milestone',desc:`Bernard King scored a franchise-record 60 points for New York, but the Knicks bowed to the New Jersey Nets 120-114.`,source:'nba.com/history'},
  {date:'1984-12-25',imp:2,cat:'milestone',desc:`In their first meeting since the November 19, 2004 brawl, Detroit Pistons beat the Indiana Pacers, 98-93 at the Conseco Fieldhouse in Indianapolis without further incidents.`,source:'nba.com/history'},
  {date:'2008-12-25',imp:2,cat:'milestone',desc:`Shaquille O’Neal became the second player in NBA history to miss 5,000 free throws, joining Wilt Chamberlain.`,source:'nba.com/history'},
  {date:'2008-12-25',imp:2,cat:'milestone',desc:`The Los Angeles Lakers defeated the Boston Celtics, making Phil Jackson the sixth coach to win 1,000 games. He also became the fastest to 1,000, usurping Pat Riley.`,source:'nba.com/history'},
  {date:'2020-12-25',imp:2,cat:'milestone',desc:`Hall of Famer K.C. Jones, an Olympic gold medalist and two-time NCAA champion who won eight straight NBA titles during the Celtics’ Bill Russell era and then coached the Boston teams with Larry Bird, Kevin McHale and Robert Parish to two more championships in the 1980s, dies at 88.`,source:'nba.com/history'},
  {date:'1976-12-26',imp:2,cat:'milestone',desc:`Larry Kenon of San Antonio set an NBA record with 11 steals in the Spurs’ 110-105 victory over Kansas City. Kendall Gill of the New Jersey Nets tied Kenon’s mark more than 22 years later when he recorded 11 steals against Miami on April 3, 1999.`,source:'nba.com/history'},
  {date:'1995-12-26',imp:2,cat:'milestone',desc:`The NBA Jam Session presented by Fleer, the league’s interactive basketball attraction, opens at the annual Barcelona Children’s Festival in Spain, the first time that Jam Session ventured onto European soil.`,source:'nba.com/history'},
  {date:'1997-12-26',imp:2,cat:'milestone',desc:`San Antonio’s David Robinson scored 24 points to pass the 15,000-point plateau for his career.`,source:'nba.com/history'},
  {date:'2000-12-26',imp:2,cat:'milestone',desc:`Don Nelson of the Dallas Mavericks notched his 945th head coaching win when Dallas defeated Seattle 114-93, moving ahead of Bill Fitch (944) and into third place in all-time NBA coaching victories.`,source:'nba.com/history'},
  {date:'2001-12-26',imp:2,cat:'milestone',desc:`Philadelphia 76ers coach Larry Brown became the ninth coach in NBA history to reach 800 victories in the league after the Sixers’ 100-86 triumph over the LA Clippers.`,source:'nba.com/history'},
  {date:'2011-12-26',imp:2,cat:'milestone',desc:`Several members of the 2011 draft make their debuts on this night. Kyrie Irving debuts for the Cleveland Cavaliers in a 104-96 loss to the Toronto Raptors. Kawhi Leonard debuts for the San Antonio Spurs in a 95-82 win over the Memphis Grizzlies. Isaiah Thomas debuts for the Sacramento Kings in a 100-91 win over the Los Angeles Lakers. And Kemba Walker debuts for the Charlotte Bobcats in a 96-95 win over the Milwaukee Bucks.`,source:'nba.com/history'},
  {date:'2023-12-26',imp:2,cat:'milestone',desc:`The Nets defeat the Pistons, 118-112, to give Detroit its 27th straight loss to set a single-season mark.`,source:'nba.com/history'},
  {date:'1956-12-27',imp:2,cat:'milestone',desc:`Bill Sharman’s consecutive free throw streak ended at 55, an NBA record that lasted for 19 years. Houston’s Calvin Murphy broke the record with 58 consecutive free throws during the 1975-76 season. The current record is 97 by Micheal Williams of the Minnesota Timberwolves, set in 1993 over two seasons.`,source:'nba.com/history'},
  {date:'1964-12-27',imp:2,cat:'milestone',desc:`Oscar Robertson of Cincinnati had 16 free throw attempts in one quarter of the Royals’ game at Baltimore, the most free throw attempts in one quarter in NBA history. The mark has been matched by five players in 36 years, including Michael Jordan in 1992, but it has never been surpassed.`,source:'nba.com/history'},
  {date:'1967-12-27',imp:2,cat:'milestone',desc:`The New York Knicks named Red Holzman head coach, replacing Dick McGuire. Holzman went on to lead the Knicks to NBA titles in 1970 and 1973, utilizing several players recommended by McGuire, who became the team’s chief scout.`,source:'nba.com/history'},
  {date:'1978-12-27',imp:2,cat:'milestone',desc:`Seattle’s Paul Silas played in his 1,123rd regular season game, at that time trailing only John Havlicek’s 1,270. Robert Parish now holds the record for the most games played in an NBA career, with 1,560.`,source:'nba.com/history'},
  {date:'1980-12-27',imp:2,cat:'milestone',desc:`Calvin Murphy of the Houston Rockets began a streak of 78 consecutive free throws made in a game against Washington. It was the first of 16 games Murphy would need for his then NBA record FT streak.`,source:'nba.com/history'},
  {date:'1991-12-27',imp:2,cat:'milestone',desc:`Tim Hardaway of Golden State set an NBA record for most field goals attempted with none made in a game when he shot 0-for-17 in the Warriors’ 106-102 OT win at Minnesota.`,source:'nba.com/history'},
  {date:'1950-12-28',imp:2,cat:'milestone',desc:`Dolph Schayes of Syracuse pulled down 35 rebounds, at the time an NBA record in the new statistical category, in a game at Philadelphia against the Warriors.`,source:'nba.com/history'},
  {date:'1995-12-28',imp:2,cat:'milestone',desc:`Dick Motta of Dallas became the third NBA coach to win 900 games when the Mavericks beat the Grizzlies, 103-101 in double-overtime. He joined Red Auerbach (938) and Lenny Wilkens (then with 1,014).`,source:'nba.com/history'},
  {date:'2019-12-28',imp:2,cat:'milestone',desc:`In a game between the Indiana Pacers and New Orleans Pelicans, history was made by the Holiday brothers. Aaron Holiday started for the Pacers as did Jrue Holiday for the Pelicans. Then, with seven minutes and 47 seconds left in the first quarter, Justin Holiday checked in off the Pacers’ bench. That made them the first trio of siblings to play in the same NBA game.`,source:'nba.com/history'},
  {date:'1979-12-29',imp:2,cat:'milestone',desc:`Houston’s Rick Barry scored 19 points in a 104-100 victory over Philadelphia, becoming only the 15th player at the time to surpass 18,000 career points.`,source:'nba.com/history'},
  {date:'1997-12-29',imp:2,cat:'milestone',desc:`Dallas’ Bubba Wells recorded six fouls in three minutes of a 111-105 loss to Chicago. He broke the 41-year-old NBA record of five minutes set by Dick Farley of the Syracuse Nationals.`,source:'nba.com/history'},
  {date:'1999-12-29',imp:2,cat:'milestone',desc:`The late Wilt Chamberlain became the first player to have his number retired by three teams when the Golden State Warriors retired his #13 jersey at halftime of their game against the Philadelphia 76ers. The No. 13 jersey was presented to Barbara Lewis and Yvonne Chamberlain, Wilt’s sisters, and Oliver Chamberlain, his brother. Chamberlain’s number had already been retired by the Philadelphia 76ers, where he was part of the 1967 NBA championship team, and the Los Angeles Lakers, where he was part of the 1972 title team. Chamberlain spent six years with the Warriors organization, averaging 41.5 points and 25.1 rebounds in 429 games.`,source:'nba.com/history'},
  {date:'1999-12-29',imp:2,cat:'milestone',desc:`Philadelphia 76ers coach Larry Brown became the 11th coach in NBA history to reach the 700-victory plateau when the 76ers defeated Golden State 97-94 in Oakland.`,source:'nba.com/history'},
  {date:'2001-12-29',imp:2,cat:'milestone',desc:`Don Nelson became the third coach in league annals to win 1,000 games as his Dallas Mavericks defeated Atlanta 113-97, and Jerry Sloan became the 10th coach in NBA lore to win 800 games when his Utah Jazz downed Philadelphia 89-81. Nelson joined Lenny Wilkens and Pat Riley in the 1,000-victory club.`,source:'nba.com/history'},
  {date:'1961-12-30',imp:2,cat:'milestone',desc:`Wilt Chamberlain scored 42 points in a 116-111 loss to Boston, the 14th straight game in which he scored at least 40 points, an NBA record.`,source:'nba.com/history'},
  {date:'1971-12-30',imp:2,cat:'milestone',desc:`The Los Angeles Lakers posted a 122-106 victory at Seattle, giving them a perfect 16-0 record for December, the best monthly record in NBA history. It was the Lakers’ second consecutive undefeated month, as they also posted a 14-0 mark in November, during their NBA record 33-game winning streak.`,source:'nba.com/history'},
  {date:'1990-12-30',imp:2,cat:'milestone',desc:`Orlando’s Scott Skiles dished off an NBA record 30 assists as the Magic defeated Denver 155-116 at Orlando Arena. Skiles surpassed previous record holder Kevin Porter of New Jersey, who handed out 29 assists in the Nets’ 126-112 win over Houston on Feb. 24, 1978.`,source:'nba.com/history'},
  {date:'1992-12-30',imp:2,cat:'milestone',desc:`The Phoenix Suns defeated Houston 133-110 to finish Dec. with a 14-0 record, tying for the third-best month in NBA history. The Lakers set the NBA record by going 16-0 in Dec. 1971.`,source:'nba.com/history'},
  {date:'1996-12-30',imp:2,cat:'milestone',desc:`New York became the fourth NBA franchise to reach 2,000 victories, following a 98-96 home win over New Jersey. The other three NBA teams that had surpassed 2,000 victories are the Celtics, Lakers and 76ers.`,source:'nba.com/history'},
  {date:'1997-12-30',imp:2,cat:'milestone',desc:`Chicago’s Michael Jordan scored 33 points to surpass Kareem Abdul-Jabbar’s mark of 787 consecutive games with at least 10 points.`,source:'nba.com/history'},
  {date:'1997-12-30',imp:2,cat:'milestone',desc:`San Antonio’s David Robinson recorded five blocked shots to move into eighth place on the all-time chart ahead of George T. Johnson (2,082).`,source:'nba.com/history'},
  {date:'2016-12-30',imp:2,cat:'milestone',desc:`Isaiah Thomas of the Boston Celtics scores 52 points in a 117-114 win over the Miami Heat.`,source:'nba.com/history'},
  {date:'2023-12-30',imp:2,cat:'milestone',desc:`The Detroit Pistons end their record-tying 28-game losing streak with a 129-127 win vs. the Toronto Raptors. The Pistons, who hadn’t won since Oct. 28, matched the Philadelphia 76ers’ record of 28, split over the 2014-15 and 2015-16 seasons. The 28 straight losses are the most in a single NBA campaign and finished one shy of the record for the four major American and Canadian leagues, set by the Chicago Cardinals during World War II.`,source:'nba.com/history'},
  {date:'1954-12-31',imp:2,cat:'milestone',desc:`The Fort Wayne Pistons and the Minneapolis Lakers combined to attempt 127 free throws, the most ever in a regulation NBA game. Minneapolis won 103-91.`,source:'nba.com/history'},
  {date:'2016-12-31',imp:2,cat:'milestone',desc:`James Harden of the Houston Rockets scores 53 points in a 129-122 win over the New York Knicks.`,source:'nba.com/history'},

  {date:'2007-06-28',imp:2,cat:'milestone',desc:`The Seattle SuperSonics select Texas forward Kevin Durant with the No. 2 pick in the NBA draft.`,source:'hoopsrewind.app'},
  {date:'2001-10-30',imp:2,cat:'milestone',desc:`Michael Jordan returns to the NBA with the Washington Wizards after a three-year retirement, scoring 19 points in a loss to the New York Knicks.`,source:'hoopsrewind.app'},
  {date:'2002-06-26',imp:2,cat:'milestone',desc:`The Houston Rockets select Yao Ming with the No. 1 pick in the NBA draft.`,source:'hoopsrewind.app'},
  {date:'2006-06-29',imp:2,cat:'milestone',desc:`The NBA announces a new synthetic microfiber game ball for the 2006-07 season. The ball is scrapped midseason after widespread complaints from players.`,source:'hoopsrewind.app'},
  {date:'2011-07-01',imp:2,cat:'milestone',desc:`NBA owners lock out the players after the collective bargaining agreement expires. The dispute lasts 161 days and shortens the 2011-12 season to 66 games.`,source:'hoopsrewind.app'},
  {date:'2009-06-25',imp:2,cat:'milestone',desc:`The Los Angeles Clippers select Oklahoma forward Blake Griffin with the No. 1 pick in the NBA draft.`,source:'hoopsrewind.app'},
  {date:'2014-04-29',imp:2,cat:'milestone',desc:`NBA commissioner Adam Silver bans Los Angeles Clippers owner Donald Sterling for life after racist remarks on a leaked recording. Silver also fines Sterling $2.5 million and seeks a forced sale of the team.`,source:'hoopsrewind.app'},
  {date:'2010-07-08',imp:2,cat:'milestone',desc:`LeBron James announces he will join Dwyane Wade and Chris Bosh on the Miami Heat, creating Miami's new Big Three.`,source:'hoopsrewind.app'},
  {date:'2013-05-21',imp:2,cat:'milestone',desc:`Charlotte Bobcats owner Michael Jordan announces the franchise has applied to change its name back to the Hornets for the 2014-15 season.`,source:'hoopsrewind.app'},
  {date:'2008-07-02',imp:2,cat:'milestone',desc:`The Seattle SuperSonics officially relocate to Oklahoma City after a settlement with the city of Seattle. The franchise later becomes the Oklahoma City Thunder.`,source:'hoopsrewind.app'},

// ── Build real dot objects ────────────────────────────────────────────────────
const realDots = REAL_EVENTS_DATA.map((e, i) => {
  const sourceMeta = SOURCE_META[e.source] || {};
  return {
    worldX : dayOf(e.date),
    imp    : e.imp,
    cat    : e.cat,
    color  : sourceMeta.color || COLORS[e.cat] || '#c9082a',
    title  : e.title,
    desc   : e.desc,
    source : e.source,
    date   : e.date,
    hoverT : 0,
    id     : i,
    _sx    : null,   // screen position written each frame
    _sy    : null,
  };
});

let visibleRealDots = realDots.slice();

function updateSourceCounts() {
  const nbaCount = realDots.filter(d => d.source === 'nba.com/history').length;
  const hoopsCount = realDots.filter(d => d.source === 'hoopsrewind.app').length;
  document.getElementById('nba-count').textContent = nbaCount.toLocaleString('en-US');
  document.getElementById('hoops-count').textContent = hoopsCount.toLocaleString('en-US');
  document.getElementById('event-count').textContent = (nbaCount + hoopsCount).toLocaleString('en-US');
}

function updateVisibleDots() {
  const showNBA = document.getElementById('filter-nba').checked;
  const showHoops = document.getElementById('filter-hoops').checked;
  visibleRealDots = realDots.filter(d =>
    (showNBA && d.source === 'nba.com/history') ||
    (showHoops && d.source === 'hoopsrewind.app')
  );
  if (hovered && !visibleRealDots.includes(hovered)) hovered = null;
  if (fadingDot && !visibleRealDots.includes(fadingDot)) fadingDot = null;
  hidePopup();
  dirty = true;
}

// ══════════════════════════════════════════════════════════════════════════════
//  PLACEHOLDER EVENT GENERATION & DENSITY (PREFIX SUMS)
// ══════════════════════════════════════════════════════════════════════════════

const r01 = s => { const v = (Math.sin(s * 9301 + 49297) * 233280) % 1; return v < 0 ? v + 1 : v; };

// ══════════════════════════════════════════════════════════════════════════════
//  DYNAMIC BINNING
//
//  bin_width = the day range that collapses into one visual column.
//  When scale (px/day) is small, adjacent dots would overlap, so we group them.
//  The group then stacks vertically with organic height from actual event density.
// ══════════════════════════════════════════════════════════════════════════════

// ── Dot radius grows as you zoom into day-level detail ──────────────────────
function zoomedDotR() {
  // base size = DOT_R; starts growing when a single day is ~12px wide
  const growAt = 12;   // px/day threshold
  if (scale <= growAt) return DOT_R;
  return DOT_R + Math.min(16, (scale - growAt) * 0.55);
}

function stackStep() {
  const r = zoomedDotR();
  const zoomBoost = Math.max(0, scale - 18) * 0.22;
  return Math.max(DOT_STEP, r * 2 + 6 + zoomBoost);
}

function drawAxisText(text, x, y, fillStyle, strokeWidth = 4, strokeStyle = 'rgba(6,10,20,0.96)', shadowBlur = 0) {
  const label = String(text);
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  ctx.strokeStyle = strokeStyle;
  ctx.lineWidth = strokeWidth;
  if (shadowBlur > 0) {
    ctx.shadowColor = 'rgba(0,0,0,0.30)';
    ctx.shadowBlur = shadowBlur;
  }
  ctx.strokeText(label, x, y);
  ctx.fillStyle = fillStyle;
  ctx.fillText(label, x, y);
  ctx.restore();
}

function binWidth() {
  // Merge days when they'd be closer than DOT_DIAM (9px) horizontally
  return Math.max(1, Math.ceil(DOT_DIAM / scale));
}

// ══════════════════════════════════════════════════════════════════════════════
//  VIEWPORT
// ══════════════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let W, H;
let scale = 1;
let panX  = TOTAL_DAYS / 2;
let panY  = 0;

const axisY = ()   => H / 2 + panY;
const toSX  = wx   => (wx - panX) * scale + W / 2;
const toSY  = yOff => axisY() + yOff;
const toWX  = sx   => (sx - W / 2) / scale + panX;

function initViewport() {
  scale = W * 0.90 / TOTAL_DAYS;
  panX  = TOTAL_DAYS / 2;
  panY  = 0;
}

function clampViewport() {
  const minS = W * 0.52 / TOTAL_DAYS;
  const maxS = 120;
  scale = Math.max(minS, Math.min(maxS, scale));
  const hw = W / (2 * scale);
  panX = Math.max(-hw * 0.3, Math.min(TOTAL_DAYS + hw * 0.3, panX));
  panY = Math.max(-700, Math.min(700, panY));
}

// ══════════════════════════════════════════════════════════════════════════════
//  LOD — importance alpha
// ══════════════════════════════════════════════════════════════════════════════

const IMP_FADE = { 1:[0, 0.02], 2:[0.10, 0.35], 3:[0.70, 1.80] };

function impAlpha(imp) { return 1; }

// ══════════════════════════════════════════════════════════════════════════════
//  DRAW
// ══════════════════════════════════════════════════════════════════════════════

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawVignette();
  drawGrid();
  drawBins();         // ← the core: dynamic binning renders everything
  drawAxisLabels();
}

function drawVignette() {
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H) * 0.65);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(3,5,18,0.84)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawGrid() {
  const yearPx  = scale * 365;
  const monthPx = scale * 30;
  const dayPx   = scale;
  const vL = toWX(-4), vR = toWX(W + 4);
  const sd = dayToDate(Math.max(0, Math.floor(vL)));
  const ed = dayToDate(Math.min(TOTAL_DAYS, Math.ceil(vR)));
  const sY = sd.getUTCFullYear(), eY = ed.getUTCFullYear();

  ctx.save(); ctx.lineWidth = 1;

  // Decade lines — always present, clearly bright
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  for (let yr = Math.ceil(sY / 10) * 10; yr <= eY; yr += 10) {
    const sx = toSX(fy(yr));
    if (sx < -1 || sx > W + 1) continue;
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
  }

  // Year lines
  const yrA = Math.min(0.10, Math.max(0, (yearPx - 28) / 140) * 0.10);
  if (yrA > 0.002) {
    ctx.strokeStyle = `rgba(255,255,255,${yrA})`;
    for (let yr = sY; yr <= eY; yr++) {
      if (yr % 10 === 0) continue;
      const sx = toSX(fy(yr));
      if (sx < -1 || sx > W + 1) continue;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
    }
  }

  // Month lines
  const moA = Math.min(0.07, Math.max(0, (monthPx - 12) / 70) * 0.07);
  if (moA > 0.002) {
    ctx.strokeStyle = `rgba(255,255,255,${moA})`;
    let yr = sY, mo = sd.getUTCMonth();
    for (let i = 0; i < 500; i++) {
      const d = fm(yr, mo);
      if (d > vR) break;
      const sx = toSX(d);
      if (sx >= -1 && sx <= W + 1) { ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke(); }
      mo++; if (mo > 11) { mo = 0; yr++; }
    }
  }

  // Day lines
  const dayA = Math.min(0.06, Math.max(0, (dayPx - 8) / 50) * 0.06);
  if (dayA > 0.002) {
    ctx.strokeStyle = `rgba(255,255,255,${dayA})`;
    for (let d = Math.max(0, Math.floor(vL)); d <= Math.min(TOTAL_DAYS, Math.ceil(vR)); d++) {
      const sx = toSX(d);
      if (sx < -1 || sx > W + 1) continue;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
    }
  }

  // Axis line
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
  const ay = axisY();
  ctx.beginPath(); ctx.moveTo(0, ay); ctx.lineTo(W, ay); ctx.stroke();

  ctx.restore();
}

// ══════════════════════════════════════════════════════════════════════════════
//  DRAW BINS — the heart of the system
//
//  For each visible bin:
//    1. Sum real events + placeholder events in the bin's day range
//    2. Real events occupy the innermost (lowest) slots — most visible
//    3. Placeholder events fill outer slots, compressed via power curve
//    4. Columns grow taller in denser eras — naturally, from actual data
// ══════════════════════════════════════════════════════════════════════════════

function drawBins() {
  const bw   = binWidth();
  const ay   = axisY();

  // Clear screen-position cache
  for (const d of realDots) { d._sx = null; d._sy = null; }

  const r0    = zoomedDotR();   // base radius grows with zoom
  const vL    = toWX(-r0 - 2);
  const vR    = toWX(W + r0 + 2);
  const firstBin = Math.floor(Math.max(0, vL) / bw);
  const lastBin  = Math.ceil(Math.min(TOTAL_DAYS, vR) / bw);

  for (let b = firstBin; b <= lastBin; b++) {
    const d0 = b * bw;
    const d1 = Math.min(TOTAL_DAYS, (b + 1) * bw - 1);
    if (d0 > TOTAL_DAYS) break;

    const sx = toSX((d0 + d1) / 2);
    if (sx < -r0 - 2 || sx > W + r0 + 2) continue;

    // Collect real events in this bin, innermost (imp 1) first
    const binReal = [];
    for (const dot of visibleRealDots) {
      if (dot.worldX >= d0 && dot.worldX <= d1) binReal.push(dot);
    }
    binReal.sort((a, b_) => a.imp - b_.imp);

    // Draw each real event
    for (let i = 0; i < binReal.length; i++) {
      const dot  = binReal[i];
      const row  = Math.floor(i / 2);
      const sign = (i % 2 === 0) ? -1 : 1;
      const yOff = sign * (row + 0.5) * stackStep();
      const sy   = ay + yOff;

      if (sy < -r0 - 2 || sy > H + r0 + 2) continue;

      // Record for hover detection
      dot._sx = sx;
      dot._sy = sy;

      const lod   = impAlpha(dot.imp);
      if (lod < 0.02) continue;

      const r     = r0 + dot.hoverT * 27;
      const alpha = lod * (0.85 + 0.15 * dot.hoverT);

      ctx.save();
      if (dot.hoverT > 0.02) {
        ctx.shadowColor = dot.color;
        ctx.shadowBlur  = 5 + 25 * dot.hoverT;
      }
      ctx.globalAlpha = alpha;
      ctx.fillStyle   = dot.color;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

// ══════════════════════════════════════════════════════════════════════════════
//  HOVER LABEL
// ══════════════════════════════════════════════════════════════════════════════

function drawHoverLabel(d) {
  // no-op — popup is handled via HTML overlay
}

// ══════════════════════════════════════════════════════════════════════════════
//  AXIS LABELS
// ══════════════════════════════════════════════════════════════════════════════

function drawAxisLabels() {
  const ay      = axisY();
  const yearPx  = scale * 365;
  const monthPx = scale * 30;
  const dayPx   = scale;
  const vL = toWX(-10), vR = toWX(W + 10);
  const clampedL = Math.max(0, Math.floor(vL));
  const clampedR = Math.min(TOTAL_DAYS, Math.ceil(vR));
  const sd = dayToDate(clampedL);
  const ed = dayToDate(clampedR);
  const sY = sd.getUTCFullYear(), eY = ed.getUTCFullYear();

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  // Fixed bottom band for years so they always remain visible.
  const decSz = Math.max(12, Math.min(34, yearPx * 0.055));
  const decA  = Math.min(0.96, 0.60 + yearPx * 0.0012);
  const yrFade = Math.min(1, Math.max(0, (yearPx - 28) / 48));
  const yrSz = Math.max(10, Math.min(22, yearPx * 0.044));
  const bottomBandH = Math.max(70, decSz + (yrFade > 0.02 ? yrSz + 20 : 0) + 24);
  const bottomBandTop = H - bottomBandH;

  const bottomFade = ctx.createLinearGradient(0, bottomBandTop, 0, H);
  bottomFade.addColorStop(0, 'rgba(6,10,20,0.00)');
  bottomFade.addColorStop(0.22, 'rgba(6,10,20,0.34)');
  bottomFade.addColorStop(1, 'rgba(6,10,20,0.94)');
  ctx.fillStyle = bottomFade;
  ctx.fillRect(0, bottomBandTop, W, bottomBandH);

  const decadeY = H - 16;
  const yearY   = decadeY - decSz - 10;

  // Decade labels anchored to the bottom of the screen.
  ctx.font = `${decSz}px "DM Mono", monospace`;
  for (let yr = Math.ceil(sY / 10) * 10; yr <= eY; yr += 10) {
    const d0 = fy(yr), d1 = fy(yr + 1) - 1;
    const cx = toSX((d0 + Math.min(TOTAL_DAYS, d1)) / 2);
    if (cx < 38 || cx > W - 38) continue;
    const tx = toSX(d0);
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.20)';
    ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(tx, bottomBandTop + 8); ctx.lineTo(tx, bottomBandTop + 24); ctx.stroke();
    ctx.restore();
    drawAxisText(yr, cx, decadeY, `rgba(255,255,255,${decA})`, 6, 'rgba(6,10,20,0.98)', 8);
  }

  // Individual year labels on a separate row above the decades.
  if (yrFade > 0.02) {
    ctx.font = `${yrSz}px "DM Mono", monospace`;
    for (let yr = sY; yr <= eY; yr++) {
      if (yr % 10 === 0) continue;
      const d0 = fy(yr), d1 = fy(yr + 1) - 1;
      const cx = toSX((d0 + Math.min(TOTAL_DAYS, d1)) / 2);
      if (cx < 28 || cx > W - 28) continue;
      drawAxisText(yr, cx, yearY, `rgba(255,255,255,${0.78 * yrFade})`, 4.5, 'rgba(6,10,20,0.98)', 5);
    }
  }

  // Months and days stay on separate rows so they never overlap.
  const moFade = Math.min(1, Math.max(0, (monthPx - 24) / 42));
  const dayFade = Math.min(1, Math.max(0, (dayPx - 20) / 26));
  const moSz = Math.max(9, Math.min(16, monthPx * 0.30));
  const daySz = Math.max(10, Math.min(18, dayPx * 0.17));
  const safeBottom = bottomBandTop - 10;

  let placeBelowAxis = ay + moSz + (dayFade > 0.02 ? daySz + 30 : 16) < safeBottom;
  let monthY = null;
  let dayY = null;

  if (moFade > 0.02) {
    if (placeBelowAxis) {
      monthY = Math.min(ay + moSz + 14, safeBottom - (dayFade > 0.02 ? daySz + 16 : 0));
    } else {
      if (dayFade > 0.02) {
        dayY = Math.max(26, ay - 12);
        monthY = Math.max(16, dayY - daySz - 14);
      } else {
        monthY = Math.max(16, ay - 12);
      }
    }
  }

  if (dayFade > 0.02) {
    if (placeBelowAxis) {
      if (monthY === null) monthY = Math.min(ay + moSz + 14, safeBottom - daySz - 16);
      dayY = monthY + daySz + 14;
    } else {
      if (dayY === null) dayY = Math.max(26, ay - 12);
      if (monthY === null) monthY = Math.max(16, dayY - daySz - 14);
    }
  }

  // Month labels
  if (moFade > 0.02 && monthY !== null) {
    ctx.font = `${moSz}px "DM Mono", monospace`;
    let yr = sY, mo = sd.getUTCMonth();
    for (let i = 0; i < 500; i++) {
      const d0 = fm(yr, mo), d1 = fm(yr, mo + 1) - 1;
      if (d0 > vR) break;
      const cx = toSX((d0 + Math.min(TOTAL_DAYS, d1)) / 2);
      if (cx > 28 && cx < W - 28) {
        drawAxisText(MOS[mo], cx, monthY, `rgba(255,255,255,${0.60 * moFade})`, 3.5, 'rgba(6,10,20,0.96)', 3);
      }
      mo++; if (mo > 11) { mo = 0; yr++; }
    }
  }

  // Day labels
  if (dayFade > 0.02 && dayY !== null) {
    ctx.font = `${daySz}px "DM Mono", monospace`;
    const tickAlpha = 0.12 + dayFade * 0.24;
    for (let d = Math.max(0, Math.floor(vL)); d <= Math.min(TOTAL_DAYS, Math.ceil(vR)); d++) {
      const dt  = dayToDate(d);
      const dom = dt.getUTCDate();
      const sx  = toSX(d + 0.5);
      if (sx <= 18 || sx >= W - 18) continue;
      ctx.save();
      ctx.strokeStyle = `rgba(255,255,255,${tickAlpha})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      if (placeBelowAxis) {
        ctx.moveTo(sx, ay + 1); ctx.lineTo(sx, ay + 8);
      } else {
        ctx.moveTo(sx, ay - 1); ctx.lineTo(sx, ay - 8);
      }
      ctx.stroke();
      ctx.restore();
      drawAxisText(dom, sx, dayY, `rgba(255,255,255,${0.84 * dayFade})`, 4, 'rgba(6,10,20,0.98)', 3);
    }
  }

  ctx.restore();
}

// ══════════════════════════════════════════════════════════════════════════════
//  HOVER DETECTION & ANIMATION
// ══════════════════════════════════════════════════════════════════════════════

let hovered   = null;
let fadingDot = null;
let dirty     = true;

function findNearest(mx, my) {
  const HIT2 = 22 * 22;
  let best = null, bd = HIT2;
  for (const d of visibleRealDots) {
    if (d._sx === null) continue;         // not rendered this frame
    if (impAlpha(d.imp) < 0.06) continue; // below LOD threshold — not hoverable
    const dx = d._sx - mx, dy = d._sy - my;
    const dd = dx * dx + dy * dy;
    if (dd < bd) { bd = dd; best = d; }
  }
  return best;
}

let lastTime = 0;
function tick(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05); lastTime = now;
  let nd = dirty;

  const anim = (d, tgt) => {
    const p = d.hoverT;
    d.hoverT = Math.max(0, Math.min(1, d.hoverT + (tgt - d.hoverT) * 11 * dt));
    if (Math.abs(d.hoverT - p) > 0.0005) nd = true;
  };

  if (hovered)   anim(hovered, 1);
  if (fadingDot) { anim(fadingDot, 0); if (fadingDot.hoverT <= 0.001) { fadingDot.hoverT = 0; fadingDot = null; } }

  if (nd) { draw(); dirty = false; }
  requestAnimationFrame(tick);
}

// ══════════════════════════════════════════════════════════════════════════════
//  INPUT
// ══════════════════════════════════════════════════════════════════════════════

let isDragging = false, dragSX, dragSY, dragPX, dragPY;

const popup     = document.getElementById('popup');
const popupDate = document.getElementById('popup-date');
const popupDesc = document.getElementById('popup-desc');
const popupSource = document.getElementById('popup-source');
const popupSourceLink = document.getElementById('popup-source-link');
const popupStem = document.getElementById('popup-stem');

let popupTimer = null;


const MOBILE_BREAKPOINT = 760;
const headerEl = document.getElementById('header');
const headerSubEl = headerEl.querySelector('.h-sub');
const vpEl = document.getElementById('vp');
const hintEl = document.getElementById('hint');

const DESKTOP_COPY = {
  headerSub: 'Scroll to zoom · Drag to pan · 1894-Present',
  hint: 'Scroll to dive in · Drag to explore'
};

const MOBILE_COPY = {
  headerSub: 'Pinch to zoom · Drag to pan',
  hint: 'Pinch to zoom · Drag to explore · Tap a dot'
};

let suppressMouseUntil = 0;
let touchMode = null;
let touchMoved = false;
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;
let pinchStartDist = 0;
let pinchStartScale = 1;
let pinchAnchorWX = 0;
let pinchStartMidX = 0;
let pinchStartMidY = 0;
let pinchStartPanY = 0;

function isMobileLayout() {
  return window.matchMedia(`(max-width: ${MOBILE_BREAKPOINT}px)`).matches;
}

function applyResponsiveChrome() {
  const mobile = isMobileLayout();
  const copy = mobile ? MOBILE_COPY : DESKTOP_COPY;
  headerSubEl.textContent = copy.headerSub;
  hintEl.textContent = copy.hint;

  if (mobile) {
    vpEl.style.left = '12px';
    vpEl.style.right = '12px';
    vpEl.style.top = `${Math.round(headerEl.offsetTop + headerEl.offsetHeight + 10)}px`;
  } else {
    vpEl.style.left = 'auto';
    vpEl.style.right = '38px';
    vpEl.style.top = '24px';
  }
}

function setActiveDot(dot, showNow = false) {
  if (hovered && hovered !== dot) {
    if (fadingDot && fadingDot !== hovered) fadingDot.hoverT = 0;
    fadingDot = hovered;
  }
  hovered = dot;
  dirty = true;
  if (dot && showNow) showPopup(dot);
  if (!dot) hidePopup();
}

function touchDistance(t0, t1) {
  return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
}

function touchMidpoint(t0, t1) {
  return {
    x: (t0.clientX + t1.clientX) / 2,
    y: (t0.clientY + t1.clientY) / 2,
  };
}

function sourceToUrl(source) {
  if (!source) return '#';
  if (SOURCE_META[source]?.url) return SOURCE_META[source].url;
  return /^https?:\/\//i.test(source) ? source : `https://${source}`;
}

function showPopup(d) {
  const sx = d._sx, sy = d._sy;
  const r  = DOT_R + d.hoverT * 27;
  const col = d.color;

  const dateFmt = parseISODateUTC(d.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  popupDate.textContent  = dateFmt;
  popupDate.style.color  = col;
  popupDesc.textContent  = d.desc;
  popupSource.style.display = d.source ? 'block' : 'none';
  popupSourceLink.textContent = d.source || '';
  popupSourceLink.href = sourceToUrl(d.source);

  // Position: prefer above, fall back below
  const PW = Math.min(360, W - 16), PH = popup.offsetHeight || 140;
  const MARGIN = 14;

  let cardX = sx - PW / 2;
  let cardY = sy - r - MARGIN - PH;
  let stemTop = false; // stem goes down from card bottom to dot

  if (cardY < 8) {
    // Not enough room above — place below
    cardY = sy + r + MARGIN;
    stemTop = true; // stem goes up from card top to dot
  }

  // Clamp horizontally
  cardX = Math.max(8, Math.min(W - PW - 8, cardX));

  popup.style.left   = cardX + 'px';
  popup.style.top    = cardY + 'px';
  popup.style.width  = PW + 'px';

  // Connector stem
  const stemX  = sx - cardX;   // x within popup space
  const stemLen = MARGIN + r;
  popupStem.style.left   = Math.max(4, Math.min(PW - 4, stemX)) + 'px';
  popupStem.style.height = stemLen + 'px';

  if (stemTop) {
    popupStem.style.top    = (-stemLen) + 'px';
    popupStem.style.bottom = 'auto';
  } else {
    popupStem.style.bottom = (-stemLen) + 'px';
    popupStem.style.top    = 'auto';
  }

  popup.classList.add('visible');
}

function hidePopup() {
  clearTimeout(popupTimer);
  popup.classList.remove('visible');
}

function updateHover(mx, my) {
  if (isDragging) return;
  const found = findNearest(mx, my);
  if (found !== hovered) {
    if (hovered) { if (fadingDot && fadingDot !== hovered) fadingDot.hoverT = 0; fadingDot = hovered; }
    hovered = found; dirty = true;
    canvas.style.cursor = found ? 'pointer' : 'grab';
    if (found) {
      clearTimeout(popupTimer);
      popupTimer = setTimeout(() => { if (hovered) showPopup(hovered); }, 350);
    }
    else hidePopup();
  } else if (found && found._sx !== null) {
    showPopup(found); // reposition as zoom changes
  }
}


canvas.addEventListener('touchstart', e => {
  suppressMouseUntil = Date.now() + 800;
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchMode = 'pan';
    touchMoved = false;
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = Date.now();
    dragSX = t.clientX;
    dragSY = t.clientY;
    dragPX = panX;
    dragPY = panY;
    isDragging = true;
    hidePopup();
  } else if (e.touches.length >= 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    const mid = touchMidpoint(t0, t1);
    touchMode = 'pinch';
    touchMoved = true;
    isDragging = false;
    pinchStartDist = Math.max(1, touchDistance(t0, t1));
    pinchStartScale = scale;
    pinchStartMidX = mid.x;
    pinchStartMidY = mid.y;
    pinchAnchorWX = toWX(mid.x);
    pinchStartPanY = panY;
    if (hovered) {
      if (fadingDot && fadingDot !== hovered) fadingDot.hoverT = 0;
      fadingDot = hovered;
      hovered = null;
    }
    dirty = true;
    hidePopup();
  }
  hintEl.classList.add('gone');
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  suppressMouseUntil = Date.now() + 800;
  if (e.touches.length === 1 && touchMode === 'pan') {
    const t = e.touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) touchMoved = true;
    panX = dragPX - (t.clientX - dragSX) / scale;
    panY = dragPY + (t.clientY - dragSY);
    clampViewport();
    dirty = true;
    hidePopup();
  } else if (e.touches.length >= 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    const mid = touchMidpoint(t0, t1);
    const nextScale = pinchStartScale * (touchDistance(t0, t1) / Math.max(1, pinchStartDist));
    scale = nextScale;
    clampViewport();
    panX = pinchAnchorWX - (mid.x - W / 2) / scale;
    panY = pinchStartPanY + (mid.y - pinchStartMidY);
    clampViewport();
    dirty = true;
    hidePopup();
  }
  hintEl.classList.add('gone');
}, { passive: true });

canvas.addEventListener('touchend', e => {
  suppressMouseUntil = Date.now() + 800;

  if (touchMode === 'pan' && e.touches.length === 0) {
    const dt = Date.now() - touchStartTime;
    isDragging = false;
    if (!touchMoved && dt < 280) {
      const t = e.changedTouches[0];
      const found = findNearest(t.clientX, t.clientY);
      if (found) {
        setActiveDot(found);
        showPopup(found);
      } else {
        setActiveDot(null);
      }
    }
  }

  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchMode = 'pan';
    touchMoved = false;
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = Date.now();
    dragSX = t.clientX;
    dragSY = t.clientY;
    dragPX = panX;
    dragPY = panY;
    isDragging = true;
  } else if (e.touches.length >= 2) {
    const t0 = e.touches[0], t1 = e.touches[1];
    const mid = touchMidpoint(t0, t1);
    touchMode = 'pinch';
    pinchStartDist = Math.max(1, touchDistance(t0, t1));
    pinchStartScale = scale;
    pinchStartMidX = mid.x;
    pinchStartMidY = mid.y;
    pinchAnchorWX = toWX(mid.x);
    pinchStartPanY = panY;
    isDragging = false;
  } else {
    touchMode = null;
    isDragging = false;
  }
}, { passive: true });

canvas.addEventListener('touchcancel', () => {
  suppressMouseUntil = Date.now() + 800;
  touchMode = null;
  isDragging = false;
}, { passive: true });

canvas.addEventListener('mousemove', e => {
  if (Date.now() < suppressMouseUntil) return;
  if (isDragging) {
    panX = dragPX - (e.clientX - dragSX) / scale;
    panY = dragPY + (e.clientY - dragSY);
    clampViewport(); dirty = true;
  } else updateHover(e.clientX, e.clientY);
});

canvas.addEventListener('mousedown', e => {
  if (Date.now() < suppressMouseUntil) return;
  isDragging = true; dragSX = e.clientX; dragSY = e.clientY; dragPX = panX; dragPY = panY;
  canvas.classList.add('dragging');
  if (hovered) { fadingDot = hovered; hovered = null; dirty = true; }
  hidePopup();
});

window.addEventListener('mouseup', () => {
  if (Date.now() < suppressMouseUntil) return;
  if (isDragging) { isDragging = false; canvas.classList.remove('dragging'); dirty = true; }
});

canvas.addEventListener('mouseleave', () => {
  if (Date.now() < suppressMouseUntil) return;
  if (hovered) { fadingDot = hovered; hovered = null; dirty = true; }
  canvas.style.cursor = 'grab';
  hidePopup();
});

canvas.addEventListener('wheel', e => {
  if (Date.now() < suppressMouseUntil) return;
  e.preventDefault();
  const factor = Math.exp(-e.deltaY / (e.deltaMode === 0 ? 500 : 15000));
  const wx     = toWX(e.clientX);
  scale *= factor;
  clampViewport();
  panX = wx - (e.clientX - W / 2) / scale;
  clampViewport();
  dirty = true;
  if (hovered) {
    hovered.hoverT = 0;
    if (fadingDot && fadingDot !== hovered) fadingDot.hoverT = 0;
    fadingDot = null;
    hovered = null;
    hidePopup();
  }
  document.getElementById('hint').classList.add('gone');
}, { passive: false });

const filterNBAEl = document.getElementById('filter-nba');
const filterHoopsEl = document.getElementById('filter-hoops');

function onFilterToggle(changedEl) {
  if (!filterNBAEl.checked && !filterHoopsEl.checked) {
    changedEl.checked = true;
    return;
  }
  updateVisibleDots();
}

filterNBAEl.addEventListener('change', () => onFilterToggle(filterNBAEl));
filterHoopsEl.addEventListener('change', () => onFilterToggle(filterHoopsEl));

window.addEventListener('resize', () => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  clampViewport();
  applyResponsiveChrome();
  dirty = true;
});

// ══════════════════════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════════════════════

document.fonts.ready.then(() => {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initViewport();
  clampViewport();
  updateSourceCounts();
  updateVisibleDots();
  applyResponsiveChrome();
  requestAnimationFrame(tick);
  setTimeout(() => document.getElementById('hint').classList.add('gone'), 5000);
});
</script>
