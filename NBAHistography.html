  {date:'1976-05-23',imp:2,cat:'milestone',desc:`Boston center Dave Cowens dominated the opener of the NBA Finals against Phoenix with a 25-point, 21-rebound performance as the Celtics defeated the Suns, 98-87. Boston eventually took its 13th NBA title in six games.`,source:'nba.com/history'},
  {date:'1978-05-23',imp:2,cat:'milestone',desc:`Portland center Bill Walton was named the NBA’s MVP for the 1977-78 season. Walton led his club to a 50-10 record before succumbing to multiple foot injuries, playing in 58 games and averaging 18.9 ppg and 13.2 rpg.`,source:'nba.com/history'},
  {date:'1982-05-23',imp:2,cat:'milestone',desc:`The Philadelphia 76ers, after leading Boston three games to one only to have the Celtics draw even, invaded Boston Garden and came away with a 120-106 win in Game 7 of the Eastern Conference Finals. “Beat L.A!” was the chant that resounded through Boston Garden late in the game. Although the Sixers were beating their beloved team, Boston fans wanted anyone to beat the Los Angeles Lakers. It didn’t happen, though, as the Lakers beat the Sixers in six games for the NBA title.`,source:'nba.com/history'},
  {date:'2002-05-23',imp:2,cat:'milestone',desc:`The NBDL, now known as the NBA G League, established new league offices in Greenville, S.C.`,source:'nba.com/history'},
  {date:'1979-05-24',imp:2,cat:'milestone',desc:`Hall of Fame guard Tracy McGrady is born in Bartow, Fla. McGrady was a two-time scoring champion, a seven-time All-Star and a seven-time All-NBA player.`,source:'nba.com/history'},
  {date:'1999-05-24',imp:2,cat:'milestone',desc:`Orlando Magic head coach and Hall of Famer Chuck Daly resigns from his position. The 68-year-old Daly made his debut as an NBA head coach in the 1981-82 season, coaching the Cleveland Cavaliers for 41 games as an interim replacement. Daly later won two NBA championships with the Detroit Pistons and led the “Dream Team” to gold in the 1992 Olympic Summer Games.`,source:'nba.com/history'},
  {date:'2000-05-24',imp:2,cat:'milestone',desc:`Isiah Thomas, one of the 50 Greatest Players in NBA History and the leader of the Detroit Pistons’ championship teams in 1989 and 1990, and Bob McAdoo, one of the greatest scoring forwards ever in the NBA, were among six individuals elected to the Naismith Memorial Basketball Hall of Fame.`,source:'nba.com/history'},
  {date:'1975-05-25',imp:2,cat:'milestone',desc:`Golden State beat Washington 96-95 to complete a sweep of the NBA Finals, one of only six title sweeps. The others were by Boston (1959), Milwaukee (1971), Philadelphia (1983), Detroit (1989) and the Los Angeles Lakers (2002).`,source:'nba.com/history'},
  {date:'1992-05-25',imp:2,cat:'milestone',desc:`Danny Biasone, who was credited with introducing the 24-second shot clock to the NBA for the 1954-55 season, died in Syracuse at the age of 83. Biasone arrived at 24 seconds by dividing 2,880 seconds, the total playing time, by 120, the approximate number of shots he figured two teams took in a game.`,source:'nba.com/history'},
  {date:'1993-05-25',imp:2,cat:'milestone',desc:`Charles Barkley, acquired by the Phoenix Suns in June of 1992, won the Maurice Podoloff Trophy as the 1993 NBA Most Valuable Player. Barkley, who helped lead the Phoenix Suns to a franchise and NBA-best 62-20 record during the 1992-93 season, averaged 25.6 points, 12.2 rebounds and 5.1 assists in 76 games.`,source:'nba.com/history'},
  {date:'1998-05-25',imp:2,cat:'milestone',desc:`Reggie Miller uses some crafty off-the-ball movement to get open and then drills a 3-pointer over Michael Jordan with :00.4 seconds left to give the Indiana Pacers a 96-93 win against the Chicago Bulls in Game 4 of the Eastern Conference finals.`,source:'nba.com/history'},
  {date:'2002-05-25',imp:2,cat:'milestone',desc:`Paul Pierce outscores the New Jersey Nets 19-16 in the fourth quarter to help the Boston Celtics erase a 21-point deficit in Game 3 of the Eastern Conference Finals. The 94-90 victory remains the biggest comeback in NBA Playoff history.`,source:'nba.com/history'},
  {date:'2017-05-25',imp:2,cat:'milestone',desc:`A deep 3-pointer from the left wing with 2:40 left in the third quarter gives LeBron James the postseason’s all-time scoring title. James accomplished the feat in Game 5 of the 2017 Eastern Conference finals, as the Cavs won 135-102 to reach a third straight NBA Finals. James’ shot moved him to 5,989 career playoff points, passing Michael Jordan (5,987), who held the record for 19 years. James reached the record in his 212th game, while Jordan played in 179 playoff games.`,source:'nba.com/history'},
  {date:'2019-05-25',imp:2,cat:'milestone',desc:`Behind 27 points and 17 rebounds from Kawhi Leonard, the Toronto Raptors drop the Milwaukee Bucks in Game 6 of the Eastern Conference finals to clinch their first trip to The Finals. The Raptors went on a game-changing 26-3 run in the late third quarter that fueled their comeback win that clinched the series.`,source:'nba.com/history'},
  {date:'1987-05-26',imp:2,cat:'milestone',desc:`Boston’s Larry Bird stole an inbounds pass from Detroit’s Isiah Thomas and fed over his shoulder to a cutting Dennis Johnson for the winning basket as the Celtics pulled out an improbable 108-107 win over Detroit in Game 5 of the Eastern Conference Finals.`,source:'nba.com/history'},
  {date:'1999-05-26',imp:2,cat:'milestone',desc:`“The Bill Russell Tribute” is held at the FleetCenter in Boston in a ceremony to salute the Hall of Famer. The ceremony was hosted by entertainer Bill Cosby and featured a star-studded lineup of celebrities and sports legends.`,source:'nba.com/history'},
  {date:'1999-05-26',imp:2,cat:'milestone',desc:`Toronto’s Vince Carter, winner of 95.8% of the votes, is named the 1998-99 NBA Rookie of the Year. He averaged 18.3 points, 5.7 rebounds, 3.0 assists, 1.54 blocked shots, and 1.10 steals while shooting .450 from the field in 1998-99`,source:'nba.com/history'},
  {date:'2015-05-26',imp:2,cat:'milestone',desc:`The Cleveland Cavaliers defeat the Atlanta Hawks 118-88 in the Eastern Conference Finals for a 4-0 series win.`,source:'nba.com/history'},
  {date:'1973-05-27',imp:2,cat:'milestone',desc:`The Bucks finished the year with 14 straight victories to end the season, one off the league record of 15 straight wins to end the season established by the Rochester Royals in 1950.`,source:'nba.com/history'},
  {date:'1981-05-27',imp:2,cat:'milestone',desc:`Julius Erving of the Philadelphia 76ers was named the NBA’s Most Valuable Player, making him the only player to win MVP honors in both the NBA and the ABA.`,source:'nba.com/history'},
  {date:'1982-05-27',imp:2,cat:'milestone',desc:`The Los Angeles Lakers, despite an 11-day layoff between playoff series, beat Philadelphia 124-117 in Game 1 of the NBA Finals for their ninth consecutive victory, at the time an NBA record for consecutive wins during one postseason.`,source:'nba.com/history'},
  {date:'1985-05-27',imp:2,cat:'milestone',desc:`Scott Wedman sank four three-point field goals without a miss and shot 11-for-11 overall from the field, both NBA Finals records, as Boston routed the Los Angeles Lakers 148-114 in Game 1. Boston’s 148 points and 62 field goals remain NBA Finals records.`,source:'nba.com/history'},
  {date:'1988-05-27',imp:2,cat:'milestone',desc:`Red McCombs purchased the Spurs for $47 million, becoming the first principal owner of the franchise.`,source:'nba.com/history'},
  {date:'1991-05-27',imp:2,cat:'milestone',desc:`The Chicago Bulls defeat the Detroit Pistons in Game 4 to clinch the franchise’s first trip to The Finals.`,source:'nba.com/history'},
  {date:'2013-05-27',imp:2,cat:'milestone',desc:`The San Antonio Spurs defeat the Memphis Grizzlies 93-86 in the West finals, winning the series 4-0.`,source:'nba.com/history'},
  {date:'1938-05-28',imp:2,cat:'milestone',desc:`Jerry West is born in Chelyan, WVa.`,source:'nba.com/history'},
  {date:'1978-05-28',imp:2,cat:'milestone',desc:`Dennis Johnson of Seattle blocked seven shots in a 93-92 win over Washington in Game 3 of the NBA Finals. The seven blocks are the most ever by a guard in an NBA Finals game.`,source:'nba.com/history'},
  {date:'1986-05-28',imp:2,cat:'milestone',desc:`Boston forward Larry Bird won his third consecutive Maurice Podoloff Trophy as the NBA’s Most Valuable Player. Bird joined Bill Russell and Wilt Chamberlain as the only players to win three consecutive NBA MVP awards.`,source:'nba.com/history'},
  {date:'1989-05-28',imp:2,cat:'milestone',desc:`The Los Angeles Lakers beat Phoenix 122-117 to complete a sweep of the Western Conference Finals. It was the Lakers’ 11th consecutive win of the 1989 Playoffs and their third straight series sweep. However, the injury-riddled Lakers were swept by Detroit in the 1989 NBA Finals.`,source:'nba.com/history'},
  {date:'1992-05-28',imp:2,cat:'milestone',desc:`Portland’s Terry Porter, despite only shooting 1-for-6 from three-point range in the Trail Blazers’ series-clinching 105-97 win over Utah in Game 6 of the Western Conference Finals, set an NBA Playoff record (for a six-game series), by connecting on 18 three-pointers (in 34 attempts) for the series.`,source:'nba.com/history'},
  {date:'2016-05-28',imp:2,cat:'milestone',desc:`Golden State’s Klay Thompson sinks an NBA playoff-record 11 3-pointers to power the Warriors’ 108-101 comeback win against the Oklahoma City Thunder in Game 6 of the Western Conference finals. Thompson and the Warriors would go on to win Game 7 to reach their second straight trip to The Finals.`,source:'nba.com/history'},
  {date:'1995-05-29',imp:2,cat:'milestone',desc:`Rik Smits of Indiana swished a foul line jumper with no time left on the clock to lead the host Pacers to a 94-93 win over Orlando in Game 4 of the Eastern Conference Finals. Prior to Smits’ game-winning shot, the lead had changed hands three times over the final 13.3 seconds, with Indiana’s Reggie Miller and Orlando’s Brian Shaw and Anfernee Hardaway all nailing three-point field goals.`,source:'nba.com/history'},
  {date:'1997-05-29',imp:2,cat:'milestone',desc:`John Stockton of the Jazz nailed a 3-pointer as time expired to lift Utah to a 103-100 win against the Houston Rockets in Game 6 of the Western Conference finals. That victory gave the Jazz the series and lifted the franchise to its first NBA Finals appearance.`,source:'nba.com/history'},
  {date:'2023-05-29',imp:2,cat:'milestone',desc:`The Miami Heat defeat the Boston Celtics, 103-84, in Game 7 of the Eastern Conference Finals. In doing so, the Heat become the first Play-In Tournament team to reach the NBA Finals. Additionally, Miami is the first No. 8-seeded team to reach The Finals since the New York Knicks in 1999.`,source:'nba.com/history'},
  {date:'1976-05-30',imp:2,cat:'milestone',desc:`Phoenix rookie center Alvan Adams scored 33 points and grabbed 14 rebounds to lead the Suns to a 105-98 Game 3 victory over Boston in the NBA Finals.`,source:'nba.com/history'},
  {date:'2012-05-30',imp:2,cat:'milestone',desc:`Hall of Famer Jack Twyman, know for his off-court assist to Maurice Stokes, dies at the age of 78.`,source:'nba.com/history'},
  {date:'1983-05-31',imp:2,cat:'milestone',desc:`“Fo’ Fo’ Fo’,” declared Moses Malone predicting that the 1983 Philadelphia 76ers, who had dominated the regular season with a 65-17 record, would sweep their three rounds in the 1983 NBA Playoffs. They came close but the Milwaukee Bucks spoiled Malone’s prediction by winning Game 4 of the Eastern Conference Finals 100-94. Otherwise Philadelphia was perfect, sweeping New York, beating the Bucks in five and then sweeping the Lakers in the Finals. Their 12-1 record and .923 winning percentage stood as the best in playoff history until the Lakers went 15-1 (.938) in 2001. The 76ers commemorated Malone’s prediction, with one slight alteration, on their championship rings: “Fo’ Fi’ Fo’.”`,source:'nba.com/history'},
  {date:'1984-05-31',imp:2,cat:'milestone',desc:`Gerald Henderson of the Boston Celtics stole a crosscourt pass by Los Angeles’ James Worthy and laid the ball in with 13 seconds left in regulation to send Game 2 of the 1984 NBA Finals into overtime. The Celtics, who had dropped Game 1 and would lose Game 3, managed to pull out a 124-121 overtime win in Game 2 and eventually won the series in seven games.`,source:'nba.com/history'},
  {date:'1991-05-31',imp:2,cat:'milestone',desc:`The New York Knicks named Pat Riley head coach.`,source:'nba.com/history'},
  {date:'1999-05-31',imp:2,cat:'milestone',desc:`San Antonio Spurs forward Sean Elliot tip-toes the sideline before knocking down the game-winning 3-pointer, delivering the Spurs a “Memorial Day Miracle” in Game 2 of the Western Conference finals.`,source:'nba.com/history'},
  {date:'2007-05-31',imp:2,cat:'milestone',desc:`Cleveland Cavaliers forward LeBron James scored the team’s final 25 points in a double-overtime win against the Detroit Pistons in Game 5 of the Eastern Conference finals.`,source:'nba.com/history'},
  {date:'1936-08-01',imp:2,cat:'milestone',desc:`Twenty-two nations competed in the first basketball competition in the Olympics at the Games of the 11th Olympiad in Berlin.`,source:'nba.com/history'},
  {date:'1973-08-01',imp:2,cat:'milestone',desc:`Julius Erving was traded by the Virginia Squires with Willie Sojourner to the New York Nets for George Carter, draft rights to Kermit Washington and cash.`,source:'nba.com/history'},
  {date:'2014-08-01',imp:2,cat:'milestone',desc:`Paul George suffers a gruesome compound fracture of his lower right leg in a Team USA scrimmage.`,source:'nba.com/history'},
  {date:'2005-08-02',imp:2,cat:'milestone',desc:`The largest trade in NBA history is completed, as five teams combine to swap 13 players. This deal brings Antoine Walker and Jason Williams to the Miami Heat and leads to Miami’s first ever championship that same season.`,source:'nba.com/history'},
  {date:'1949-08-03',imp:2,cat:'milestone',desc:`The Basketball Association of America (BAA) merged with the National Basketball League (NBL) to form the NBA. The BAA included the Boston Celtics, Minneapolis Lakers (later LA Lakers), New York Knicks, Philadelphia Warriors (later Golden State Warriors), and the Rochester Royals (later Sacramento Kings). The NBL included the Syracuse Nationals (later Philadelphia 76ers) and the Tri-Cities Blackhawks (later Atlanta Hawks).`,source:'nba.com/history'},
  {date:'2000-08-03',imp:2,cat:'milestone',desc:`The Orlando Magic acquire then five-time All-Star forward Grant Hill from the Detroit Pistons via a sign-and-trade deal for Chucky Atkins and Ben Wallace. Hill would be dogged by ankle injuries during his time in Orlando while Wallace would become a four-time All-Star, four-time Defensive Player of the Year and help Detroit to two NBA Finals (and one championship) during his time there.`,source:'nba.com/history'},
  {date:'2012-08-04',imp:2,cat:'milestone',desc:`Four-time All-Star Arnie Risen, a member of the Hall of Fame, dies at the age of 87.`,source:'nba.com/history'},
  {date:'2002-08-05',imp:2,cat:'milestone',desc:`Legendary Los Angeles Lakers broadcaster Chick Hearn, who called 3,338 consecutive Lakers games, dies at the age of 83.`,source:'nba.com/history'},
  {date:'1962-08-06',imp:2,cat:'milestone',desc:`The Philadelphia franchise’s name was changed from the Nationals to the 76ers.`,source:'nba.com/history'},
  {date:'2016-08-06',imp:2,cat:'milestone',desc:`Paul George returns to Team USA for the Rio Olympics after rehabbing a serious leg injury suffered two years earlier in an Olympic practice.`,source:'nba.com/history'},
  {date:'1988-08-07',imp:2,cat:'milestone',desc:`The Atlanta Hawks begin a 13-day tour of the Soviet Union.`,source:'nba.com/history'},
  {date:'1992-08-07',imp:2,cat:'milestone',desc:`The Orlando Magic sign No. 1 draft pick Shaquille O’Neal.`,source:'nba.com/history'},
  {date:'1996-08-07',imp:2,cat:'milestone',desc:`Val Ackerman was named President of the Women’s National Basketball Association.`,source:'nba.com/history'},
  {date:'2000-08-07',imp:2,cat:'milestone',desc:`The Los Angeles Lakers announced the retirement of Executive Vice President of Basketball Operations Jerry West, named Mitch Kupchak to succeed West in that position and promoted Kurt Rambis to Assistant General Manager.`,source:'nba.com/history'},
  {date:'1992-08-08',imp:2,cat:'milestone',desc:`The USA Olympic Men’s Basketball Team, featuring NBA stars for the first time, won the Gold Medal at the Barcelona Olympics and were known as the “Dream Team.”`,source:'nba.com/history'},
  {date:'1928-08-09',imp:2,cat:'milestone',desc:`Bob Cousy is born in New York City.`,source:'nba.com/history'},
  {date:'2006-08-09',imp:2,cat:'milestone',desc:`The Commonwealth of Massachusetts declares basketball its official sport.`,source:'nba.com/history'},
  {date:'1920-08-10',imp:2,cat:'milestone',desc:`Red Holzman is born in Brooklyn, New York.`,source:'nba.com/history'},
  {date:'2012-08-10',imp:2,cat:'milestone',desc:`Dwight Howard is traded from the Orlando Magic to the Los Angeles Lakers as part of a four-team swap that included the Philadelphia 76ers and Denver Nuggets.`,source:'nba.com/history'},
  {date:'2024-08-10',imp:2,cat:'milestone',desc:`The USA Olympic Men’s Basketball team defeats France, 98-87, in the gold medal game to clinch the fifth consecutive gold medal for the U.S. Stephen Curry shines in the final 2:43 of the game, nailing four 3-pointers — including one with 1:19 left over two defenders that sealed the win. LeBron James was named MVP of the 2024 Paris Olympics.`,source:'nba.com/history'},
  {date:'1959-08-14',imp:2,cat:'milestone',desc:`Earvin “Magic” Johnson is born in Lansing, Michigan.`,source:'nba.com/history'},
  {date:'1994-08-14',imp:2,cat:'milestone',desc:`The USA basketball team, Dream Team II, defeats Russia 137-91 to win the gold medal in the World Championship of Basketball in Toronto, Canada. Shaquille O’Neal, who averaged 18 points per game, is named the tournament’s MVP.`,source:'nba.com/history'},
  {date:'2020-08-15',imp:2,cat:'milestone',desc:`Damian Lillard scored 31 points, CJ McCollum scored 29 and the Portland Trail Blazers beat the Memphis Grizzlies 126-122 in the Play-In Game to clinch the NBA’s final playoff spot. The Play-In Game was added to the restarted season because of the coronavirus pandemic. Portland finished eighth in the West, Memphis was ninth, and the Grizzlies needed to sweep a two-game matchup to advance.`,source:'nba.com/history'},
  {date:'2020-08-17',imp:2,cat:'milestone',desc:`In a 135-125 overtime loss to the Denver Nuggets in Game 1 of the first round, Utah Jazz guard Donovan Mitchell scores 57 points. That total broke the Jazz’s single-game playoff scoring mark (Karl Malone, 50 points in 2000 vs. Seattle) and were the third-most points scored in an NBA playoff game, trailing only Michael Jordan (63) and Elgin Baylor (61).`,source:'nba.com/history'},
  {date:'1992-08-18',imp:2,cat:'milestone',desc:`Boston Celtics forward Larry Bird announced his retirement from the NBA after 13 seasons. Bird joined the Celtics management as a special assistant to Celtics Senior Executive Vice President Dave Gavitt.`,source:'nba.com/history'},
  {date:'1936-08-21',imp:2,cat:'milestone',desc:`Wilt Chamberlain was born in Philadelphia.`,source:'nba.com/history'},
  {date:'2006-08-23',imp:2,cat:'milestone',desc:`Carmelo Anthony sets the U.S. national team individual scoring record in an international game with 35 points against Italy in the FIBA World Championship tournament. This record was previously held by Kenny Anderson, who scored 34 points in a 1990 game.`,source:'nba.com/history'},
  {date:'2014-08-23',imp:2,cat:'milestone',desc:`Kevin Love is traded from the Minnesota Timberwolves to the Cleveland Cavaliers.`,source:'nba.com/history'},
  {date:'2020-08-23',imp:2,cat:'milestone',desc:`Dallas’ Luka Doncic sinks a step-back 3-pointer at the buzzer to cap the Mavericks’ comeback win in Game 4 of their first round series against the LA Clippers. In the 135-133 series-tying win for Dallas, Doncic finished with 43 points, 17 rebounds and 13 assists for his second straight triple-double in the series.`,source:'nba.com/history'},
  {date:'2020-08-23',imp:2,cat:'milestone',desc:`Utah’s Donovan Mitchell and Denver’s Jamal Murray made NBA history in the first game in NBA postseason history in which opposing players scored 50 points each. Mitchell finished with 51 points on 15-for-27 shooting (and 17-for-18 on free throws) in a 129-127 Jazz win in Game 4. Murray finished with 50 points (18-31 FG, 9-15 3-point FG) and 11 rebounds. While the Jazz took a 3-1 series lead with the win, the Nuggets ended up rallying to win the series in Game 7.`,source:'nba.com/history'},
  {date:'2008-08-24',imp:2,cat:'milestone',desc:`The USA basketball team — the “Redeem Team” — drops Spain in a closer than the score indicates final, 118-107, to bring the gold back to US basketball after a disappointing bronze medal showing in 2004. Team USA was led by Kobe Bryant, LeBron James and Dwyane Wade.`,source:'nba.com/history'},
  {date:'2003-08-25',imp:2,cat:'milestone',desc:`Allen Iverson scores 28 points in 23 minutes, setting a new USA Olympic Qualifying single game record for scoring. His performance helps Team USA annihilate Canada, 111-71, in the FIBA Americas Olympic Qualifying Tournament.`,source:'nba.com/history'},
  {date:'1965-08-25',imp:2,cat:'milestone',desc:`Boston Celtics center Bill Russell signed a contract as the NBA’s highest paid player, making one dollar more than arch-rival Wilt Chamberlain.`,source:'nba.com/history'},
  {date:'2004-08-26',imp:2,cat:'milestone',desc:`Stephon Marbury scores a Team USA Olympic-record 31 points in a game against Spain at the Athens Olympics.`,source:'nba.com/history'},
  {date:'1999-08-27',imp:2,cat:'milestone',desc:`In what was then the largest trade in NBA history, 11 players changed teams. The Vancouver Grizzlies traded the rights to G Steve Francis and F Tony Massenburg to the Houston Rockets for G Michael Dickerson, F-C Othella Harrington, F Antoine Carr, G Brent Price, Houston’s first-round draft pick in 2000, 2001 or 2002, and the Orlando Magic’s 2000 second-round draft pick. Orlando traded F Don MacLean to Houston, and received G Lee Mayberry, F Makhtar Ndiaye, G Rodrick Rhodes and F Michael Smith from Vancouver.`,source:'nba.com/history'},
  {date:'2004-08-27',imp:2,cat:'milestone',desc:`The USA basketball team loses to Argentina, 89-81, dropping USA basketball from gold medal contention for the first time since NBA players were allowed to participate in the Summer Olympic games.`,source:'nba.com/history'},
  {date:'2013-08-27',imp:2,cat:'milestone',desc:`Two-time All-Star and Hall-of-Famer Zelmo Beaty dies at the age of 2013.`,source:'nba.com/history'},
  {date:'2004-08-28',imp:2,cat:'milestone',desc:`The USA basketball team defeats Lithuania, 104-96, to capture the bronze medal in the 2004 Summer Olympics.`,source:'nba.com/history'},
  {date:'1997-08-30',imp:2,cat:'milestone',desc:`The Houston Comets defeated the New York Liberty, 65-51, becoming the first WNBA Champions. Regular-season MVP Cynthia Cooper, the leading scorer with 25 points, was named the Championship MVP.`,source:'nba.com/history'},
  {date:'2017-08-30',imp:2,cat:'milestone',desc:`Cleveland Cavaliers guard Kyrie Irving is traded to the Boston Celtics for Isaiah Thomas, Jae Crowder, Ante Zizic and two future draft picks.`,source:'nba.com/history'},
  {date:'1986-10-01',imp:2,cat:'milestone',desc:`Several NBA stars and other members of the league’s family gathered in New York for the taping of a special series of anti-drug public service announcements entitled “Don’t Foul Out.”`,source:'nba.com/history'},
  {date:'1999-10-01',imp:2,cat:'milestone',desc:`Boston Celtics legend Kevin McHale, former Cleveland Cavaliers president and COO Wayne Embry and late Fort Wayne and Detroit Pistons owner Fred Zollner lead a class of five basketball immortals who are enshrined into the Naismith Memorial Basketball Hall of Fame in Springfield, Massachusetts.`,source:'nba.com/history'},
  {date:'1999-10-01',imp:2,cat:'milestone',desc:`Boston Celtics legend and Hall of Famer Bill Russell, who led the franchise to 11 NBA Championships in his 13 seasons from 1956 until 1969, is the subject of ESPN’s SportsCentury series. Russell was selected by a distinguished panel of 48 journalists, historians, observers and administrators as #18 on the list of the greatest North American athletes of the 20th Century.`,source:'nba.com/history'},
  {date:'2002-10-01',imp:2,cat:'milestone',desc:`Wang Zhizhi signs a contract with the Los Angeles Clippers, resulting in Wang becoming the first player from the People’s Republic of China to play in the National Basketball Association.`,source:'nba.com/history'},
  {date:'1974-10-03',imp:2,cat:'milestone',desc:`Jerry West of the Los Angeles Lakers, dubbed “Mr. Clutch” for his performances on the court, retired after playing 14 seasons in the NBA. West scored 25,192 points during his career, along with averaging 29.1 ppg in 153 playoff games.`,source:'nba.com/history'},
  {date:'2005-10-03',imp:2,cat:'milestone',desc:`Following the fallout and a bevy of suspensions from the Indiana Pacers-Detroit Pistons altercation, Pacer Ron Artest is reinstated.`,source:'nba.com/history'},
  {date:'1950-10-05',imp:2,cat:'milestone',desc:`Drawing lots out of a hat for three members of the defunct Chicago Stags franchise, Boston Celtics owner Walter Brown and Coach Red Auerbach ended up with what they thought was the booby prize, Bob Cousy. The $8,500 price tag for Cousy paid dividends of six NBA Championships for Boston.`,source:'nba.com/history'},
  {date:'1993-10-06',imp:2,cat:'milestone',desc:`Michael Jordan of the Chicago Bulls announced his retirement from the NBA at a news conference in Deerfield, IL. Jordan’s retirement after nine seasons came less than four months after he helped lead the Bulls to their third consecutive NBA Championship with a six-game victory over Phoenix in the 1993 NBA Finals. His nine-year totals included 21,541 career points, seven straight league scoring titles (1987-93), an NBA record-high career scoring average (32.3 ppg), and three regular season and three NBA Finals MVP awards. Jordan announced his return to the NBA on March 18, 1995 and 24 hours later played in a game against Indiana at Market Square Arena, scoring 19 points in the Bulls’ 103-96 overtime loss.`,source:'nba.com/history'},
  {date:'1998-10-06',imp:2,cat:'milestone',desc:`The NBA announced that all 114 preseason games for this year have been canceled because of the stalled collective bargaining negotiations with the National Basketball Players Association.`,source:'nba.com/history'},
  {date:'2015-10-07',imp:2,cat:'milestone',desc:`Harry “The Horse” Gallatin, a member of the Naismith Memorial Hall of Fame and a 7-time All-Star, dies at age 88.`,source:'nba.com/history'},
  {date:'1975-10-08',imp:2,cat:'milestone',desc:`The San Antonio Spurs, then members of the ABA, defeated the NBA’s Atlanta Hawks 109-107 in the first basketball game ever played in the Louisiana Superdome.`,source:'nba.com/history'},
  {date:'1999-10-08',imp:2,cat:'milestone',desc:`Los Angeles Lakers Co-Owner/Vice President Earvin “Magic” Johnson, the legendary point guard who directed the great Showtime Lakers of the 1980s, is the subject of ESPN’s SportsCentury series. Johnson was selected by a distinguished panel of 48 journalists, historians, observers and administrators as #17 on the list of the greatest North American athletes of the 20th Century.`,source:'nba.com/history'},
  {date:'2002-10-08',imp:2,cat:'milestone',desc:`The NBA officially opens an office in Beijing, China.`,source:'nba.com/history'},
  {date:'1993-10-09',imp:2,cat:'milestone',desc:`The first 10 players on the USA Basketball Dream Team that would compete at the 1994 World Championship of Basketball in Canada were named: Dominique Wilkins, Joe Dumars, Mark Price, Derrick Coleman, Tim Hardaway, Larry Johnson, Alonzo Mourning, Shawn Kemp, Dan Majerle and Steve Smith.`,source:'nba.com/history'},
  {date:'2001-10-09',imp:2,cat:'milestone',desc:`Milwaukee coach George Karl was named coach of USA Basketball’s 2002 World Championship team that would compete in the FIBA World Championship for Men, beginning Aug. 29 in Indianapolis.`,source:'nba.com/history'},
  {date:'1972-10-10',imp:2,cat:'milestone',desc:`Bob McAdoo made his debut for the Buffalo Braves at home against Atlanta. The Hawks won 120-109.`,source:'nba.com/history'},
  {date:'1980-10-10',imp:2,cat:'milestone',desc:`Kevin McHale made his debut for the Boston Celtics against Cleveland. Boston won 130-103.`,source:'nba.com/history'},
  {date:'2000-10-10',imp:2,cat:'milestone',desc:`Dick Klein, who founded the Chicago Bulls in 1965, died in his sleep in Greenville, S.C. at age 80.`,source:'nba.com/history'},
  {date:'1980-10-11',imp:2,cat:'milestone',desc:`The Dallas Mavericks opened their first season in the NBA with a 103-92 victory at home against interstate rival San Antonio.`,source:'nba.com/history'},
  {date:'2002-10-11',imp:2,cat:'milestone',desc:`The Miami Heat and the Minnesota Timberwolves played the first preseason game in the Dominican Republic at the Palacio de los Deportes in Santo Domingo. It marked the 19th time the NBA held a game in Latin America.`,source:'nba.com/history'},
  {date:'2008-10-11',imp:2,cat:'milestone',desc:`In a preseason match-up, Denver beats the Phoenix, 77-72, at the Indian Wells (California) Tennis Garden. The game is noteworthy because it is the first NBA game played outdoors in three decades.`,source:'nba.com/history'},
  {date:'1979-10-12',imp:2,cat:'milestone',desc:`Chris Ford of the Boston Celtics scored the first 3-point basket in NBA history with 3:48 left in the first quarter of a 114-106 victory over Houston at Boston Garden. This game also marked the debut of Boston rookie Larry Bird.`,source:'nba.com/history'},
  {date:'1979-10-12',imp:2,cat:'milestone',desc:`Magic Johnson made his debut for the Los Angeles Lakers at the San Diego Clippers. The Lakers won 103-102.`,source:'nba.com/history'},
  {date:'1979-10-12',imp:2,cat:'milestone',desc:`Larry Bird made his debut for the Boston Celtics in a 114-106 win against the Houston Rockets.`,source:'nba.com/history'},
  {date:'1989-10-12',imp:2,cat:'milestone',desc:`The NBA joined USA Basketball, the national governing body for the sport in the United States.`,source:'nba.com/history'},
  {date:'1999-10-12',imp:2,cat:'milestone',desc:`NBA legend Wilt Chamberlain passed away at his home in Bel-Air, California at the age of 63. A 13-time NBA All-Star, first-ballot Hall of Famer and holder of numerous records, many of which will never be broken, Chamberlain arrived in the NBA in 1959 out of the University of Kansas (1955-58), after a one-year stint with the Harlem Globetrotters (1958-59). In his first season with the Philadelphia Warriors, Chamberlain astonished the professional basketball world by averaging an NBA rookie record 37.6 points and 27.0 rebounds on his way to capturing the NBA MVP and NBA Rookie of the Year Awards following the 1959-60 season.`,source:'nba.com/history'},
  {date:'1967-10-13',imp:2,cat:'milestone',desc:`The Seattle SuperSonics dropped a 144-116 decision to the San Francisco Warriors in their first NBA game.`,source:'nba.com/history'},
  {date:'1967-10-13',imp:2,cat:'milestone',desc:`The first ABA game was played with the Oakland Oaks beating the Anaheim Amigos, 132-129. The game introduced the red, white and blue ball and used the 3-point field goal.`,source:'nba.com/history'},
  {date:'1970-10-13',imp:2,cat:'milestone',desc:`Calvin Murphy made his debut for the San Diego Rockets at Chicago. The Bulls won 111-96.`,source:'nba.com/history'},
  {date:'1970-10-13',imp:2,cat:'milestone',desc:`Dave Cowens made his debut for the Boston Celtics at New York. The Knicks won 114-107.`,source:'nba.com/history'},
  {date:'1979-10-13',imp:2,cat:'milestone',desc:`Golden State lost a 102-96 overtime decision to Chicago. The Warriors went on to lose their next nine overtime games as well, setting the NBA record for consecutive overtime losses with 10.`,source:'nba.com/history'},
  {date:'1998-10-13',imp:2,cat:'milestone',desc:`The NBA announced that it has canceled the first two weeks of the 1998-99 season because of the stalled collective bargaining negotiations with the National Basketball Players Association. The cancellation included all games originally scheduled to be played through November 16.`,source:'nba.com/history'},
  {date:'2000-10-13',imp:2,cat:'milestone',desc:`Isiah Thomas, Bob McAdoo and 24-second shot clock innovator Danny Biasone are enshrined in the Naismith Memorial Basketball Hall of Fame in Springfield, Massachusetts.`,source:'nba.com/history'},
  {date:'1970-10-14',imp:2,cat:'milestone',desc:`Bob Lanier made his debut for the Detroit Pistons at the Seattle SuperSonics. The Pistons won 123-117.`,source:'nba.com/history'},
  {date:'1970-10-14',imp:2,cat:'milestone',desc:`Nate Archibald made his debut for the Cincinnati Royals at home against New York. The Knicks won 128-104.`,source:'nba.com/history'},
  {date:'1987-10-14',imp:2,cat:'milestone',desc:`Chicago Bulls sign first-round pick and future Hall of Famer Scottie Pippen.`,source:'nba.com/history'},
  {date:'2002-10-14',imp:2,cat:'milestone',desc:`Houston defeats Sacramento, 88-86, in an NBA preseason game. The game is remarkable because it is played in Shanghai, China, the first time two NBA clubs met in China.`,source:'nba.com/history'},
  {date:'1965-10-15',imp:2,cat:'milestone',desc:`Rick Barry made his debut game for the San Francisco Warriors at home against the Los Angeles Lakers. The Warriors won 122-115.`,source:'nba.com/history'},
  {date:'1966-10-15',imp:2,cat:'milestone',desc:`Bill Russell became the NBA’s first black head coach when he was designated as player-coach of the Boston Celtics. In his coaching debut he led the Celtics to a 121-113 win over the San Francisco Warriors at Boston Garden. Russell, who coached Boston for three seasons, led the Celtics to a pair of NBA titles in 1968 and 1969.`,source:'nba.com/history'},
  {date:'1966-10-15',imp:2,cat:'milestone',desc:`Dave Bing made his debut for the Detroit Pistons at Cincinnati. The Royals won 103-99.`,source:'nba.com/history'},
  {date:'1966-10-15',imp:2,cat:'milestone',desc:`Matt Guokas Jr. played in his first game for the Philadelphia 76ers, marking the first time a father-son combination had competed in the NBA. Matt Sr. played with Philadelphia in the 1940s, and at the time of his son’s debut, was a sportscaster for the 76ers.`,source:'nba.com/history'},
  {date:'1970-10-15',imp:2,cat:'milestone',desc:`Dan Issel made his debut for the Kentucky Colonels of the ABA at Indiana. The Pacers won 127-95.`,source:'nba.com/history'},
  {date:'1971-10-15',imp:2,cat:'milestone',desc:`Julius Erving made his debut for the Virginia Squires of the ABA at the Carolina Cougars. The Squires won 118-114.`,source:'nba.com/history'},
  {date:'1962-10-16',imp:2,cat:'milestone',desc:`Dave DeBusschere made his debut for the Detroit Pistons against Los Angeles during a neutral site contest in New York. The Lakers won 122-106.`,source:'nba.com/history'},
  {date:'1963-10-16',imp:2,cat:'milestone',desc:`Jerry Lucas made his debut for the Cincinnati Royals at the St. Louis Hawks. The Royals won 112-93.`,source:'nba.com/history'},
  {date:'1965-10-16',imp:2,cat:'milestone',desc:`Billy Cunningham made his debut for the Philadelphia 76ers at the Baltimore Bullets. The 76ers won 133-101.`,source:'nba.com/history'},
  {date:'1968-10-16',imp:2,cat:'milestone',desc:`The Milwaukee Bucks made their debut with a 89-84 loss to the Chicago Bulls before a Milwaukee Arena crowd of 8,467.`,source:'nba.com/history'},
  {date:'1968-10-16',imp:2,cat:'milestone',desc:`Wes Unseld made his debut for the Baltimore Bullets at home against the Detroit Pistons. The Bullets won 124-116.`,source:'nba.com/history'},
  {date:'1970-10-16',imp:2,cat:'milestone',desc:`The Portland Trail Blazers defeated fellow expansion club Cleveland 115-112 to pick up their first victory in the NBA.`,source:'nba.com/history'},
  {date:'1971-10-16',imp:2,cat:'milestone',desc:`Artis Gilmore made his debut for the Kentucky Colonels of the ABA at home against the New York Nets. The Colonels won 107-98.`,source:'nba.com/history'},
  {date:'1999-10-16',imp:2,cat:'milestone',desc:`After a scare in the opening game the previous day, the San Antonio Spurs flexed their muscles in Milan, Italy and continued the NBA’s domination of the McDonald’s Championship. With Tim Duncan leading the way, the Spurs rolled to a 103-68 rout of Vasco da Gama of Brazil in the final of the biennial international tournament at the FilaForum. Duncan earned the Drazen Petrovic Trophy as the tournament MVP with a 32-point, 18-rebound performance. Duncan had 20 of his points in the first half when the Spurs built a 56-36 lead. After seeing its lead cut to 79-66, San Antonio outscored the Brazilian team, 24-2 in the fourth quarter. David Robinson had 16 points and Avery Johnson added 14 for the Spurs.`,source:'nba.com/history'},
  {date:'1964-10-17',imp:2,cat:'milestone',desc:`Willis Reed made his debut for the New York Knicks at home against Los Angeles. The Lakers won 113-109.`,source:'nba.com/history'},
  {date:'1968-10-17',imp:2,cat:'milestone',desc:`Elvin Hayes made his debut for the San Diego Rockets at home against the Seattle SuperSonics. The Rockets won 128-110.`,source:'nba.com/history'},
  {date:'1970-10-17',imp:2,cat:'milestone',desc:`Pete Maravich made his debut for the Atlanta Hawks at home against Milwaukee. The Bucks won 107-98.`,source:'nba.com/history'},
  {date:'2005-10-17',imp:2,cat:'milestone',desc:`The NBA issues a Dress Code Memo/policy applicable to all NBA players.`,source:'nba.com/history'},
  {date:'2017-10-17',imp:2,cat:'milestone',desc:`Jayson Tatum made his debut for the Boston Celtics in a 102-99 loss to the Cleveland Cavaliers.`,source:'nba.com/history'},
  {date:'2018-10-17',imp:2,cat:'milestone',desc:`Trae Young made his debut for the Atlanta Hawks in a 126-107 loss to the New York Knicks.`,source:'nba.com/history'},
  {date:'2018-10-17',imp:2,cat:'milestone',desc:`Luka Doncic made his debut for the Dallas Mavericks in a 121-100 loss to the Phoenix Suns.`,source:'nba.com/history'},
  {date:'1967-10-18',imp:2,cat:'milestone',desc:`Earl Monroe made his debut for the Baltimore Bullets at home against the New York Knicks. The Bullets won 121-98.`,source:'nba.com/history'},
  {date:'1968-10-18',imp:2,cat:'milestone',desc:`Jack Ramsay made his NBA coaching debut for the Philadelphia 76ers at home against the Los Angeles Lakers. The 76ers won 114-96.`,source:'nba.com/history'},
  {date:'1969-10-18',imp:2,cat:'milestone',desc:`Kareem Abdul-Jabbar made his debut for the Milwaukee Bucks at home against the Detroit Pistons. The Bucks won 119-110.`,source:'nba.com/history'},
  {date:'1969-10-18',imp:2,cat:'milestone',desc:`NBA All-Star guard Lenny Wilkens made his NBA coaching debut for the Seattle SuperSonics at New York. The Knicks won 126-101.`,source:'nba.com/history'},
  {date:'1974-10-18',imp:2,cat:'milestone',desc:`Chicago center Nate Thurmond, in his first game with the Bulls, recorded the NBA’s first quadruple-double, with 22 points, 14 rebounds, 13 assists and 12 blocks in the Bulls’ 120-115 overtime win over Atlanta at Chicago Stadium. Alvin Robertson, Hakeem Olajuwon and David Robinson are the only other NBA players to have recorded quadruple-doubles in an NBA game.`,source:'nba.com/history'},
  {date:'1974-10-18',imp:2,cat:'milestone',desc:`Moses Malone made his debut for the Utah Stars of the ABA at New York. The Nets won 105-89.`,source:'nba.com/history'},
  {date:'1974-10-18',imp:2,cat:'milestone',desc:`Bill Walton made his debut for the Portland Trail Blazers against Cleveland. Portland won 131-129.`,source:'nba.com/history'},
  {date:'1989-10-18',imp:2,cat:'milestone',desc:`A crowd of 35,156, the largest ever to attend an NBA preseason game, turned out at the Hubert H. Humphrey Metrodome for the debut of the Minnesota Timberwolves. But the Los Angeles Lakers, a franchise originally located in Minneapolis, won the game 100-90.`,source:'nba.com/history'},
  {date:'1993-10-18',imp:2,cat:'milestone',desc:`NBA Commissioner David J. Stern and the Secretary General of the International Basketball Federation, Boris Stankovic, jointly announced that the Most Valuable Player award for the McDonald’s Championship would be named the Drazen Petrovic Trophy, honoring the late New Jersey Nets star killed in a car accident in Germany on June 7, 1993.`,source:'nba.com/history'},
  {date:'1994-10-18',imp:2,cat:'milestone',desc:`A sellout crowd of 15,324 at the Palais Omnisports de Bercy in Paris, France watched Golden State defeat Charlotte 132-116, behind Chris Mullin’s game-high 25 points The game in Paris was one of 11 NBA games played outside the United States during the 1994 preseason.`,source:'nba.com/history'},
  {date:'1997-10-18',imp:2,cat:'milestone',desc:`Chicago’s Michael Jordan is named MVP of the 1997 McDonald’s Championship in Paris.`,source:'nba.com/history'},
  {date:'2002-10-18',imp:2,cat:'milestone',desc:`The San Antonio Spurs, who had called the Alamodome home since 1993, opened their new home, the The SBC Center, with an exhibiion versus the New York Knicks.`,source:'nba.com/history'},
  {date:'2012-10-18',imp:2,cat:'milestone',desc:`Slater Martin, a seven-time All-Star playmaking guard, dies at the age of 86.`,source:'nba.com/history'},
  {date:'2017-10-18',imp:2,cat:'milestone',desc:`Donovan Mitchell makes his debut with the Utah Jazz in a 106-96 win against the Denver Nuggets.`,source:'nba.com/history'},
  {date:'2017-10-18',imp:2,cat:'milestone',desc:`Ben Simmons makes his debut with the Philadelphia 76ers in a 120-115 loss to the Washington Wizards.`,source:'nba.com/history'},
  {date:'1958-10-19',imp:2,cat:'milestone',desc:`Hal Greer made his debut for the Syracuse Nationals at home against the Detroit Pistons. The Nationals won 103-94.`,source:'nba.com/history'},
  {date:'1960-10-19',imp:2,cat:'milestone',desc:`Oscar Robertson and Jerry West made their debuts on opposing teams. The Cincinnati Royals beat the Los Angeles Lakers 140-123, as the Lakers opened their inaugural season in Los Angeles.`,source:'nba.com/history'},
  {date:'1961-10-19',imp:2,cat:'milestone',desc:`Philadelphia’s Wilt Chamberlain began a streak of 126 consecutive games with 20 or more points. The streak, which included a 100-point game against the Knicks and a seven-game span of 50 or more points per game, ended on January 19, 1963.`,source:'nba.com/history'},
  {date:'1961-10-19',imp:2,cat:'milestone',desc:`Walt Bellamy made his debut for the Chicago Packers at the New York Knicks. The Knicks won 120-103.`,source:'nba.com/history'},
  {date:'1963-10-19',imp:2,cat:'milestone',desc:`Nate Thurmond made his debut for the San Francisco Warriors at the Baltimore Bullets. The Warriors won 103-102.`,source:'nba.com/history'},
  {date:'1992-10-19',imp:2,cat:'milestone',desc:`The Chicago Bulls and Miami Heat met in a special preseason game at sold-out Miami Arena to benefit the victims of Hurricane Andrew in South Florida. Chicago won the game 111-94 with the teams raising over $500,000 for charity.`,source:'nba.com/history'},
  {date:'1999-10-19',imp:2,cat:'milestone',desc:`The Boston Celtics announced season-long plans to honor Red Auerbach for his 50 years of service to the organization. Throughout the 1999-2000 season, the Celtics used a series of events, activities and tributes to pay homage to the distinguished career of Auerbach. The 23rd annual B’nai B’rith Dinner tipped off a celebration which paid tribute to Auerbach’s impact and achievements in both Celtics and NBA history.`,source:'nba.com/history'},
  {date:'2021-10-19',imp:2,cat:'milestone',desc:`The first 25 members of the NBA’s 75th Anniversary Team are officially revealed, with the next 25 coming on Oct. 20 and Oct. 21.`,source:'nba.com/history'},
  {date:'1971-10-20',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the Philadelphia Warriors scores 57 points in a 122-115 win over the Los Angeles lakers.`,source:'nba.com/history'},
  {date:'1962-10-20',imp:2,cat:'milestone',desc:`John Havlicek made his debut for the Boston Celtics at home against the New York Knicks. The Celtics won 149-116.`,source:'nba.com/history'},
  {date:'1972-10-20',imp:2,cat:'milestone',desc:`The Buffalo Braves scored an NBA-record 58 points in the fourth quarter, but still dropped a 126-118 decision to the Celtics at Boston Garden.`,source:'nba.com/history'},
  {date:'1973-10-20',imp:2,cat:'milestone',desc:`Boston pulled down an NBA record 39 offensive rebounds in a game against the Capital Bullets at the Capital Centre, but the Celtics ended up losing the game, 96-87.`,source:'nba.com/history'},
  {date:'1976-10-20',imp:2,cat:'milestone',desc:`The Philadelphia 76ers acquired Julius Erving from the New York Nets in exchange for $3 million.`,source:'nba.com/history'},
  {date:'1967-10-21',imp:2,cat:'milestone',desc:`The expansion Seattle SuperSonics won their first NBA game, defeating San Diego in overtime, 117-110.`,source:'nba.com/history'},
  {date:'1972-10-21',imp:2,cat:'milestone',desc:`One day after setting an NBA record by scoring 58 points in the fourth quarter of a 126-118 loss at Boston, the Buffalo Braves scored an NBA record-low four points in the third quarter of a 91-63 loss to the Milwaukee Bucks at Buffalo.`,source:'nba.com/history'},
  {date:'1976-10-21',imp:2,cat:'milestone',desc:`Adrian Dantley and Alex English made their debuts against each other. Dantley’s Buffalo Braves defeated English’s Milwaukee Bucks 133-112.`,source:'nba.com/history'},
  {date:'1979-10-21',imp:2,cat:'milestone',desc:`Guard Sam Smith of the Chicago Bulls scored the first four-point play in NBA history during a 113-111 loss to the Bucks at Milwaukee.`,source:'nba.com/history'},
  {date:'1995-10-21',imp:2,cat:'milestone',desc:`The Houston Rockets defeat Buckler Bologna of Italy 126-112 in the championship game of the six-team McDonald’s Championship, in front of a sellout crowd of 10,708 at London Arena in London, England. Clyde Drexler is awarded the Drazen Petrovic Trophy as the tournament MVP after averaging 20.5 points and 8.5 assists in two games, including 25 points and 10 assists against Buckler Bologna. The Rockets, who downed Australia’s Perth Wildcats 116-72 in the tournament semifinals, are the first reigning NBA Champion to play in the McDonald’s Championship`,source:'nba.com/history'},
  {date:'2021-10-21',imp:2,cat:'milestone',desc:`The NBA’s 75th Anniversary Team is unveiled and features pioneers that helped shape, define and redefine the game. Eleven players currently playing in the NBA at the time — Giannis Antetokounmpo, Carmelo Anthony, Stephen Curry, Anthony Davis, Kevin Durant, James Harden, LeBron James, Kawhi Leonard, Damian Lillard, Chris Paul and Russell Westbrook — make the list. Additionally, all 50 players from the NBA’s 50th Anniversary Team make the 75th Anniversary Team as well as legends Dominique Wilkins and Bob McAdoo.`,source:'nba.com/history'},
  {date:'1957-10-22',imp:2,cat:'milestone',desc:`Sam Jones made his debut for the Boston Celtics at the St. Louis Hawks. The Celtics won 115-90.`,source:'nba.com/history'},
  {date:'1958-10-22',imp:2,cat:'milestone',desc:`Elgin Baylor made his debut for the Minneapolis Lakers at home against the Cincinnati Royals. The Lakers won 99-79.`,source:'nba.com/history'},
  {date:'1960-10-22',imp:2,cat:'milestone',desc:`Lenny Wilkens made his debut for the St. Louis Hawks at home against the Los Angeles Lakers. The Hawks won 112-96.`,source:'nba.com/history'},
  {date:'1976-10-22',imp:2,cat:'milestone',desc:`Robert Parish made his debut for the Golden State Warriors at home against the New York Nets. The Nets won 104-103.`,source:'nba.com/history'},
  {date:'1976-10-22',imp:2,cat:'milestone',desc:`Twin brothers Tom and Dick Van Arsdale played together in a game for the Phoenix Suns, becoming the first and only pair of twins to play for the same NBA club. The Suns ended up losing the game 111-98 to the New Orleans Jazz.`,source:'nba.com/history'},
  {date:'1976-10-22',imp:2,cat:'milestone',desc:`Julius Erving makes his NBA debut with the Philadelphia 76ers in a 121-118 loss to the San Antonio Spurs.`,source:'nba.com/history'},
  {date:'1999-10-22',imp:2,cat:'milestone',desc:`NBA legend Wilt Chamberlain, who died Oct. 12, 1999 at the age of 63, is the subject of ESPN’s SportsCentury series. Chamberlain was selected by a distinguished panel of 48 journalists, historians, observers and administrators as #13 on the list of the greatest North American athletes of the 20th Century. The charismatic Chamberlain played 14 seasons with the Warriors, 76ers and Lakers and dominated the NBA like no other player ever. He holds numerous NBA records, most notably for single-season scoring average (50.4 ppg), single-season minutes (48.5 minutes per game) and highest single-season rebound average (27.3 rpg). On March 2, 1962, Chamberlain did the unthinkable and scored 100 points in a game against the Knicks. For his career, Chamberlain averaged 30.1 points and 22.9 rebounds. Before coming to the NBA, Chamberlain played at the University of Kansas and averaged 29.9 points and 18.3 rebounds for his career.`,source:'nba.com/history'},
  {date:'2025-10-22',imp:2,cat:'milestone',desc:`Sixers rookie VJ Edgecombe finishes with 34 points in his NBA debut, the third most by any rookie in an NBA debut, trailing only Wilt Chamberlain (43 in 1959) and Frank Selvy (35 in 1954).`,source:'nba.com/history'},
  {date:'1967-10-23',imp:2,cat:'milestone',desc:`The New Jersey Americans (today the New Jersey Nets), a new ABA franchise sold to Arthur Brown, played its first game.`,source:'nba.com/history'},
  {date:'1975-10-23',imp:2,cat:'milestone',desc:`Bill Willoughby made his debut for the Atlanta Hawks, becoming the youngest player in league history at 18 years, five months and three days old.`,source:'nba.com/history'},
  {date:'1987-10-23',imp:2,cat:'milestone',desc:`The Milwaukee Bucks defeated Tracer Milan of Italy 123-111 in the opening game of the first McDonald’s Championship, held at the Milwaukee Arena. The Bucks defeated the Soviet National Team 127-100 in the championship game of the tournament, sponsored by the NBA and FIBA.`,source:'nba.com/history'},
  {date:'1993-10-23',imp:2,cat:'milestone',desc:`In the finals of the sixth McDonald’s Championship, held at the Olympiahalle in Munich, Germany, the Phoenix Suns defeated Italian League champion Buckler Bologna 112-90, as Charles Barkley led all scorers with 28 points. Barkley was awarded the Drazen Petrovic Trophy as MVP of the tournament, after scoring 52 points in two games.`,source:'nba.com/history'},
  {date:'2012-10-23',imp:2,cat:'milestone',desc:`The NBA announces that the Center position will be removed from the All-Star ballot in favor of three “undefined” frontcourt players.`,source:'nba.com/history'},
  {date:'2019-10-23',imp:2,cat:'milestone',desc:`Guard Kyrie Irving scores 50 points in his debut game with the Brooklyn Nets, setting a new record for most points scored in a debut with a new team. Despite his efforts, though, the Nets would lose in overtime to the Minnesota Timberwolves, 127-126.`,source:'nba.com/history'},
  {date:'2024-10-23',imp:2,cat:'milestone',desc:`LeBron James and Bronny James became the first father-son duo to play in the NBA together during theLos Angeles Lakers’season opener. LeBron and Bronny checked into the game together with four minutes left in the second quarter, prompting a big ovation from a home crowd aware of the enormity of the milestone. LeBron had already started the game and played 13 minutes before he teamed up with his 20-year-old son to make history.`,source:'nba.com/history'},
  {date:'1959-10-24',imp:2,cat:'milestone',desc:`Wilt Chamberlain played in his first NBA game with the Philadelphia Warriors, beginning a record streak of 1,045 consecutive games–his entire career–without a disqualification. The record was later broken by Moses Malone of Atlanta on April 19, 1991, in his 1,046th game without disqualification.`,source:'nba.com/history'},
  {date:'1993-10-24',imp:2,cat:'milestone',desc:`Before a sellout crowd of 20,808 at the Mexico City Sports Palace, the New York Knicks defeated the Houston Rockets 103-93 in a preseason matchup, led by 20 points each from Patrick Ewing and Charles Smith.`,source:'nba.com/history'},
  {date:'2019-10-24',imp:2,cat:'milestone',desc:`Atlanta Hawks forward Vince Carter checks into the game with 6 minutes, 52 seconds left against the Detroit Pistons. In doing so, he became the only NBA player to play in 22 seasons.`,source:'nba.com/history'},
  {date:'2021-10-24',imp:2,cat:'milestone',desc:`Carmelo Anthony hits a 3-pointer in the third quarter to move him past Moses Malone (27,409 points) for the No. 9 spot on the all-time scoring list. He finished with 28 points in the Los Angeles Lakers’ 121-118 win against the Memphis Grizzlies.`,source:'nba.com/history'},
  {date:'1985-10-25',imp:2,cat:'milestone',desc:`Karl Malone made his debut for the Utah Jazz at home against Houston. The Rockets won 112-108.`,source:'nba.com/history'},
  {date:'2013-10-25',imp:2,cat:'milestone',desc:`Eight-time All-Star and Hall of Famer Bill Sharman dies at the age of 87.`,source:'nba.com/history'},
  {date:'2023-10-25',imp:2,cat:'milestone',desc:`Rookie Victor Wembanyama makes his highly anticipated NBA debut for the San Antonio Spurs in a 126-119 loss to the Dallas Mavericks. Wembanyama, the No. 1 overall pick in the 2023 NBA Draft, finishes with 15 points, five rebounds, two assists and two steals.`,source:'nba.com/history'},
  {date:'1999-10-25',imp:2,cat:'milestone',desc:`The Portland Trail Blazers are named as one of only five companies across the nation to receive the Points of Light Foundation 1999 Award for Excellence in Corporate Community Service. The Blazers are the only professional sports team ever to be recognized and the first corporation to receive the award in the state of Oregon. The award honors companies which have demonstrated exceptional commitment to community service and which have very strong employee volunteer programs that target serious social problems. The other award winners are the Glaxo Wellcome Inc., Research Triangle Park, NC; LensCrafters, Cincinnati, OH; NEC Electronics Inc., Santa Clara, CA; and United Airlines, Elk Grove Township, IL.`,source:'nba.com/history'},
  {date:'2000-10-25',imp:2,cat:'milestone',desc:`The NBA announced that as a result of an arbitrator’s ruling that the Minnesota Timberwolves, forward Joe Smith and his agent entered into a secret agreement in violation of the NBA’s salary cap rules, NBA Commissioner David J. Stern directed the forfeiture of Minnesota’s next five first-round draft picks, fined the team $3.5 million and voided all contracts between Smith and the Timberwolves. On December 8, the NBA restored Minnesota’s first round draft pick in 2003.`,source:'nba.com/history'},
  {date:'2012-10-25',imp:2,cat:'milestone',desc:`Commissioner David Stern formally announces his intention to retire on February 1, 2014. The date will mark exactly 30 years since Stern took over the position in 1984.`,source:'nba.com/history'},
  {date:'1976-10-26',imp:2,cat:'milestone',desc:`The Indiana Pacers won their first NBA game with a 120-90 home victory over Seattle. The Pacers entered the league from the ABA, along with the San Antonio Spurs, Denver Nuggets and New York Nets.`,source:'nba.com/history'},
  {date:'1984-10-26',imp:2,cat:'milestone',desc:`Charles Barkley made his debut for the Philadelphia 76ers at home against the Cleveland Cavaliers. The 76ers won 111-101.`,source:'nba.com/history'},
  {date:'1984-10-26',imp:2,cat:'milestone',desc:`John Stockton made his debut for the Utah Jazz at Seattle. The SuperSonics won 102-94.`,source:'nba.com/history'},
  {date:'1984-10-26',imp:2,cat:'milestone',desc:`Michael Jordan made his debut for the Chicago Bulls at home against the Washington Bullets. The Bulls won 109-93.`,source:'nba.com/history'},
  {date:'1985-10-26',imp:2,cat:'milestone',desc:`Patrick Ewing made his debut for the New York Knicks at home against Philadelphia. The 76ers won 99-89.`,source:'nba.com/history'},
  {date:'2016-10-26',imp:2,cat:'milestone',desc:`Joel Embiid made his debut for the Philadelphia 76ers in a 103-97 loss to the Oklahoma City Thunder.`,source:'nba.com/history'},
  {date:'1956-10-27',imp:2,cat:'milestone',desc:`Tom Heinsohn made his debut for the Boston Celtics at the New York Knicks. The Celtics won 115-112.`,source:'nba.com/history'},
  {date:'1984-10-27',imp:2,cat:'milestone',desc:`Hakeem Olajuwon (then known as Akeem) made his debut for the Houston Rockets at the Dallas Mavericks. The Rockets won 122-111. Additionally, Olajuwon’s future teammate on the Rockets’ 1994 championship team, Otis Thorpe, also made his debut for the Kansas City Kings. The Kings lost that game, 140-119, to the Portland Trail Blazers.`,source:'nba.com/history'},
  {date:'1992-10-27',imp:2,cat:'milestone',desc:`The Houston Rockets defeated the Dallas Mavericks 104-102 in a preseason game held in Mexico City, before a crowd of 19,527 at the Mexico City Sports Palace. It was the first NBA game ever played in Latin America.`,source:'nba.com/history'},
  {date:'2010-10-27',imp:2,cat:'milestone',desc:`Rookies DeMarcus Cousins (Sacramento Kings), Paul George (Indiana Pacers), Blake Griffin (LA Clippers) and Gordon Hayward (Utah Jazz) all make their NBA debuts. They four players combined for 18 All-Star appearances (seven of which by George) and only Cousins won his debut — a 117-116 decision against the Minnesota Timberwolves.`,source:'nba.com/history'},
  {date:'1967-10-28',imp:2,cat:'milestone',desc:`Walt Frazier made his debut for the New York Knicks vs. Detroit. The Pistons won 111-98.`,source:'nba.com/history'},
  {date:'1973-10-28',imp:2,cat:'milestone',desc:`Seven-foot center Elmore Smith of the Los Angeles Lakers blocked an NBA-record 17 shots in the Lakers’ 111-98 home victory over Portland.`,source:'nba.com/history'},
  {date:'1983-10-28',imp:2,cat:'milestone',desc:`Clyde Drexler made his debut for the Portland Trail Blazers against the San Diego Clippers. Portland won 117-93.`,source:'nba.com/history'},
  {date:'1998-10-28',imp:2,cat:'milestone',desc:`The NBA announced that it has canceled all games through November 30 and indefinitely postponed the entire 1998-99 season because of the stalled collective bargaining negotiations with the National Basketball Players Association.`,source:'nba.com/history'},
  {date:'1999-10-28',imp:2,cat:'milestone',desc:`Jayson Williams of the New Jersey Nets donates over $2 million to his alma mater, St. John’s, in the name of his former college coach, Lou Carnesecca. Although the exact amount was not revealed, it was believed to be in the neighborhood of the $2.5 million donation that Portland Trail Blazers guard Steve Smith made to his alma mater, Michigan State, a few years ago. The amount was the largest donation ever to St. John’s by a professional athlete. Williams said that he wanted to do something to honor Carnesecca, who he looked to as a mentor and a role model.`,source:'nba.com/history'},
  {date:'2003-10-28',imp:2,cat:'milestone',desc:`Dwyane Wade made his debut for the Miami Heat against the Philadelphia 76ers. Miami lost 89-74.`,source:'nba.com/history'},
  {date:'2006-10-28',imp:2,cat:'milestone',desc:`Legendary Boston Celtics coach, general manager and president Red Auerbach dies of a heart attack at the age of 89.`,source:'nba.com/history'},
  {date:'2008-10-28',imp:2,cat:'milestone',desc:`Derrick Rose made his debut for the Chicago Bulls against the Milwaukee Bucks. Chicago won 108-95.`,source:'nba.com/history'},
  {date:'2009-10-28',imp:2,cat:'milestone',desc:`Stephen Curry made his debut for the Golden State Warriors against the Houston Rockets. Golden State lost 108-107.`,source:'nba.com/history'},
  {date:'2009-10-28',imp:2,cat:'milestone',desc:`DeMar DeRozan made his debut for the Toronto Raptors against the Cleveland Cavaliers. Toronto won 101-91.`,source:'nba.com/history'},
  {date:'2009-10-28',imp:2,cat:'milestone',desc:`James Harden made his debut for the Oklahoma City Thunder against the Sacramento Kings. Oklahoma City won 102-89.`,source:'nba.com/history'},
  {date:'2010-10-28',imp:2,cat:'milestone',desc:`John Wall made his debut for the Washington Wizards against the Orlando Magic. Orlando won 112-83.`,source:'nba.com/history'},
  {date:'2015-10-28',imp:2,cat:'milestone',desc:`Rookies Devin Booker (Phoenix Suns), Nikola Jokic (Denver Nuggets), Kristaps Porzingis (New York Knicks), D’Angelo Russell (Los Angeles Lakers) and Karl-Anthony Towns (Minnesota Timberwolves) all make their NBA debuts. Only Towns, Jokic and Porzingis would get wins on that day.`,source:'nba.com/history'},
  {date:'2016-10-28',imp:2,cat:'milestone',desc:`Russell Westbrook scores 51 points in an 113-11- win over the Phoenix Suns.`,source:'nba.com/history'},
  {date:'1961-10-29',imp:2,cat:'milestone',desc:`Oscar Robertson handed out a franchise-record 22 assists during Cincinnati’s 139-132 win over visiting Syracuse. The “Big O” went on to average a triple-double (30.8 ppg, 12.5 rpg and 11.4 apg) for the Royals during the 1961-62 season, becoming the first NBA player to average double figures in assists.`,source:'nba.com/history'},
  {date:'1977-10-29',imp:2,cat:'milestone',desc:`Boston Celtics standout John Havlicek became the second player in NBA history to connect on 10,000 career field goals, reaching the milestone in a 103-98 loss at Cleveland.`,source:'nba.com/history'},
  {date:'1982-10-29',imp:2,cat:'milestone',desc:`Dominique Wilkins made his debut for the Atlanta Hawks at Detroit. The Pistons won 94-86.`,source:'nba.com/history'},
  {date:'1982-10-29',imp:2,cat:'milestone',desc:`James Worthy made his debut for the Los Angeles Lakers against Golden State. The Warriors won 132-117.`,source:'nba.com/history'},
  {date:'1994-10-29',imp:2,cat:'milestone',desc:`On the second day of the two-day “NBA Challenge” in Mexico City, a sellout crowd of 21,268 at the Palacio de los Deportes (Sports Palace) watched Seattle defeat San Antonio 124-95 in the championship game. Shawn Kemp led Seattle with 29 points and 10 rebounds. In the third place game, Houston defeated the LA Clippers, 111-103.`,source:'nba.com/history'},
  {date:'1996-10-29',imp:2,cat:'milestone',desc:`In conjunction with the NBA’s 50th anniversary celebration, the list of The 50 Greatest Players in NBA History was announced. It included: Kareem Abdul-Jabbar, Nate Archibald, Paul Arizin, Charles Barkley, Rick Barry, Elgin Baylor, Dave Bing, Larry Bird, Wilt Chamberlain, Bob Cousy, Dave Cowens, Billy Cunningham, Dave DeBusschere, Clyde Drexler, Julius Erving, Patrick Ewing, Walt Frazier, George Gervin, Hal Greer, John Havlicek, Elvin Hayes, Earvin Johnson, Sam Jones, Michael Jordan, Jerry Lucas, Karl Malone, Moses Malone, Pete Maravich, Kevin McHale, George Mikan, Earl Monroe, Shaquille O’Neal, Hakeem Olajuwon, Robert Parish, Bob Pettit, Scottie Pippen, Willis Reed, Oscar Robertson, David Robinson, Bill Russell, Dolph Schayes, Bill Sharman, John Stockton, Isiah Thomas, Nate Thurmond, Wes Unseld, Bill Walton, Jerry West, Lenny Wilkens, and James Worthy`,source:'nba.com/history'},
  {date:'2001-10-29',imp:2,cat:'milestone',desc:`The now-defunct Fayetteville Patriots won the top selection in the NBDL’s Inaugural Draft Lottery.`,source:'nba.com/history'},
  {date:'2003-10-29',imp:2,cat:'milestone',desc:`LeBron James made his NBA debut against the Sacramento Kings on the road, tallying 25 points, nine assists and six rebounds in the Cleveland Cavaliers’ 106-92 loss.`,source:'nba.com/history'},
  {date:'2003-10-29',imp:2,cat:'milestone',desc:`Chris Bosh made his NBA debut against the New Jersey Nets in the Toronto Raptors’ 90-87 victory.`,source:'nba.com/history'},
  {date:'2003-10-29',imp:2,cat:'milestone',desc:`Carmelo Anthony made his debut for the Denver Nuggets in an 80-72 win against the San Antonio Spurs.`,source:'nba.com/history'},
  {date:'2008-10-29',imp:2,cat:'milestone',desc:`Russell Westbrook made his debut for the Oklahoma City Thunder against the Milwaukee Bucks. Oklahoma City lost 98-87.`,source:'nba.com/history'},
  {date:'2008-10-29',imp:2,cat:'milestone',desc:`Kevin Love made his debut for the Minnesota Timberwolves against the Sacramento Kings. Minnesota won 98-96.`,source:'nba.com/history'},
  {date:'2010-10-29',imp:2,cat:'milestone',desc:`Boston Celtics point guard Rajon Rondo records one of the most impressive triple-doubles in franchise history with 10 points, 10 rebounds and 24 assists in a 105-101 win over the New York Knicks. The 24 assists were the most in a game since 1996.`,source:'nba.com/history'},
  {date:'2018-10-29',imp:2,cat:'milestone',desc:`Klay Thompson of the Golden State Warriors sets an NBA single-game record with 14 made 3-pointers in a 149-124 win over the Chicago Bulls. Thompson broke the mark set by Warriors teammate Stephen Curry (13) in a win over the New Orleans Pelicans on Nov. 7, 2016.`,source:'nba.com/history'},
  {date:'2018-10-29',imp:2,cat:'milestone',desc:`Nuggets star Nikola Jokić matches an NBA record with his fourth straight triple-double to open a season with 21 points, 12 rebounds and 10 assists in a 122-88 win vs. New Orleans. Jokić joined Oscar Robertson (1961-62) and Russell Westbrook (2020-21) as the only players to begin a season with four consecutive triple-doubles.`,source:'nba.com/history'},
  {date:'1953-10-30',imp:2,cat:'milestone',desc:`Red Holzman made his NBA coaching debut for the Milwaukee Hawks at home against the Minneapolis Lakers. The Hawks won 69-59. This game also marked the debut of Minneapolis’ Clyde Lovellette.`,source:'nba.com/history'},
  {date:'1954-10-30',imp:2,cat:'milestone',desc:`Bob Pettit made his debut for the Milwaukee Hawks at home against Ft. Wayne. The Pistons won 91-72.`,source:'nba.com/history'},
  {date:'1954-10-30',imp:2,cat:'milestone',desc:`Frank Ramsey made his debut for the Boston Celtics at Rochester. The Royals won 98-95.`,source:'nba.com/history'},
  {date:'1954-10-30',imp:2,cat:'milestone',desc:`The NBA adopted the use of the 24-second clock (the brainchild of Danny Biasone, owner of the Syracuse Nationals) and a limit of six team fouls per quarter, in an attempt to speed up play and eliminate stalling and deliberate fouls.`,source:'nba.com/history'},
  {date:'1980-10-30',imp:2,cat:'milestone',desc:`The NBA announced its 35th Anniversary All-Time Team–Kareem Abdul-Jabbar, Elgin Baylor, Wilt Chamberlain, Bob Cousy, Julius Erving, John Havlicek, George Mikan, Bob Pettit, Oscar Robertson, Bill Russell and Jerry West. Russell was voted the greatest player of all time, Red Auerbach of the Celtics the greatest coach and the 1966-67 Philadelphia 76ers the greatest team ever.`,source:'nba.com/history'},
  {date:'1981-10-30',imp:2,cat:'milestone',desc:`Chuck Daly made his NBA coaching debut for the Cleveland Cavaliers at Philadelphia. The 76ers won 128-104.`,source:'nba.com/history'},
  {date:'1981-10-30',imp:2,cat:'milestone',desc:`Isiah Thomas made his debut for the Detroit Pistons at home against the Milwaukee Bucks. The Pistons won 118-113.`,source:'nba.com/history'},
  {date:'1981-10-30',imp:2,cat:'milestone',desc:`Pat Riley made his NBA coaching debut for the Los Angeles Lakers at home against Houston. The Rockets won 113-112 in double-overtime.`,source:'nba.com/history'},
  {date:'1993-10-30',imp:2,cat:'milestone',desc:`In the first preseason game between two NBA teams ever played in Europe, the Orlando Magic, behind 14 fourth-quarter points from Dennis Scott, defeated the Atlanta Hawks 120-95 before a sold-out crowd of 9,483 at Wembley Arena in the opening of the two-game NBA London Games series.`,source:'nba.com/history'},
  {date:'1996-10-30',imp:2,cat:'milestone',desc:`The WNBA announced the cities of the eight teams that would compete in the WNBA’s inaugural season — Charlotte, Cleveland, Houston and New York in the Eastern Conference and Los Angeles, Phoenix, Sacramento and Utah in the Western Conference.`,source:'nba.com/history'},
  {date:'2001-10-30',imp:2,cat:'milestone',desc:`John Stockton stepped onto the floor with the Jazz on Opening Night, beginning his 18th season with the same team, establishing the longest tenure with one organization. Stockton had been tied with Hakeem Olajuwon, whose 17 consecutive seasons with the Houston Rockets ended when he joined the Toronto Raptors during the offseason.`,source:'nba.com/history'},
  {date:'2001-10-30',imp:2,cat:'milestone',desc:`Tony Parker makes his NBA debut for the San Antonio Spurs in a 109-98 win against the LA Clippers.`,source:'nba.com/history'},
  {date:'2002-10-30',imp:2,cat:'milestone',desc:`Amar’e Stoudemire makes his NBA debut for the Phoenix Suns in an 86-73 loss to the Seattle SuperSonics.`,source:'nba.com/history'},
  {date:'2002-10-30',imp:2,cat:'milestone',desc:`Yao Ming makes his NBA debut for the Houston Rockets in a 91-82 loss to the Indiana Pacers.`,source:'nba.com/history'},
  {date:'2002-10-30',imp:2,cat:'milestone',desc:`On what Mayor Ray Nagin proclaimed as “Teal Day” in the city of New Orleans, the NBA returned to the Big Easy tonight as the Hornets defeated the Utah Jazz 100-75.`,source:'nba.com/history'},
  {date:'2013-10-30',imp:2,cat:'milestone',desc:`Giannis Antetokounmpo makes his NBA debut for the Milwaukee Bucks in a 90-83 loss to the New York Knicks.`,source:'nba.com/history'},
  {date:'2023-10-30',imp:2,cat:'milestone',desc:`Chris Paul comes off the bench for the first time in 1,366 career games in the Golden State Warriors’ 106-95 win against the Houston Rockets. Since the NBA began tracking starts in 1982, no player had appeared in more games and started them all than Paul had before his streak ended. Including playoffs, Paul started the first 1,365 games of his career.`,source:'nba.com/history'},
  {date:'1950-10-31',imp:2,cat:'milestone',desc:`Earl Lloyd became the first black player to compete in the NBA, playing for the Washington Capitols in a 78-70 road loss to the Rochester Royals.`,source:'nba.com/history'},
  {date:'1969-10-31',imp:2,cat:'milestone',desc:`The Seattle SuperSonics defeated the Cincinnati Royals 129-121, giving Lenny Wilkens, the NBA’s all-time winningest coach, his first coaching victory.`,source:'nba.com/history'},
  {date:'1997-10-31',imp:2,cat:'milestone',desc:`Tim Duncan makes his NBA debut in the San Antonio Spurs’ 107-96 win against the Denver Nuggets.`,source:'nba.com/history'},
  {date:'1997-10-31',imp:2,cat:'milestone',desc:`Tracy McGrady makes his NBA debut in the Toronto Raptors’ 114-101 loss to the Miami Heat.`,source:'nba.com/history'},
  {date:'1997-10-31',imp:2,cat:'milestone',desc:`Chauncey Billups makes his NBA debut in the Boston Celtics’ 92-85 win against the Chicago Bulls.`,source:'nba.com/history'},
  {date:'2012-10-31',imp:2,cat:'milestone',desc:`Damian Lillard makes his NBA debut in the Portland Trail Blazers’ 116-106 win against the Los Angeles Lakers.`,source:'nba.com/history'},
  {date:'2012-10-31',imp:2,cat:'milestone',desc:`Anthony Davis makes his NBA debut in the New Orleans Hornets’ 99-95 loss to the San Antonio Spurs.`,source:'nba.com/history'},
  {date:'2015-10-31',imp:2,cat:'milestone',desc:`Stephen Curry of the Golden State Warriors scores 53 points in a 134-120 win over the New Orleans Pelicans.`,source:'nba.com/history'},
  {date:'2018-10-31',imp:2,cat:'milestone',desc:`Derrick Rose of the Minnesota Timberwolves career-high 50 points in a 128-125 win over the Utah Jazz.`,source:'nba.com/history'},
  {date:'1946-11-01',imp:2,cat:'milestone',desc:`The New York Knicks defeated the Toronto Huskies 68-66 in the first NBA game, which was played in Toronto. Any fan taller than Toronto’s 6-8 center George Nostrand got in free.`,source:'nba.com/history'},
  {date:'1949-11-01',imp:2,cat:'milestone',desc:`Dick McGuire made his debut for the New York Knicks at the Chicago Stags. The Knicks won in overtime 89-87.`,source:'nba.com/history'},
  {date:'1949-11-01',imp:2,cat:'milestone',desc:`Ed Macauley made his debut for the St. Louis Bombers against the Tri-City Blackhawks. The Bombers won 72-51.`,source:'nba.com/history'},
  {date:'1950-11-01',imp:2,cat:'milestone',desc:`Bill Sharman made his debut for the Washington Capitols at home against the Indianapolis Olympians. The Capitols won 100-84.`,source:'nba.com/history'},
  {date:'1950-11-01',imp:2,cat:'milestone',desc:`Bob Cousy made his debut for the Boston Celtics at Ft. Wayne. The Pistons won 107-84.`,source:'nba.com/history'},
  {date:'1986-11-01',imp:2,cat:'milestone',desc:`Brad Daugherty makes his NBA debut for the Cleveland Cavaliers in a 113-106 win against the Washington Bullets.`,source:'nba.com/history'},
  {date:'1991-11-01',imp:2,cat:'milestone',desc:`Dikembe Mutombo makes his NBA debut in the Denver Nuggets’ 108-105 loss to the Golden State Warriors.`,source:'nba.com/history'},
  {date:'1996-11-01',imp:2,cat:'milestone',desc:`Fifty years to the day that the first NBA game was played in Toronto between teams from New York and Toronto, the New York Knicks defeated the Toronto Raptors 107-99.`,source:'nba.com/history'},
  {date:'1996-11-01',imp:2,cat:'milestone',desc:`Ray Allen and Allen Iverson make their NBA debuts for the Milwaukee Bucks and Philadelphia 76ers, respectively. The Bucks won the game 111-103.`,source:'nba.com/history'},
  {date:'1996-11-01',imp:2,cat:'milestone',desc:`Steve Nash makes his NBA debut for the Phoenix Suns in their 96-82 loss to the Los Angeles Lakers.`,source:'nba.com/history'},
  {date:'1996-11-01',imp:2,cat:'milestone',desc:`Ben Wallace makes his NBA debut for the Washington Wizards in a 96-92 loss to the Orlando Magic.`,source:'nba.com/history'},
  {date:'2000-11-01',imp:2,cat:'milestone',desc:`Pat Riley became only the second coach in NBA history to amass 1,000 regular season victories when the Miami Heat opened the season with a 105-79 victory over the Orlando Magic. Riley joined Lenny Wilkens as the only two coaches to achieve the mark.`,source:'nba.com/history'},
  {date:'2001-11-01',imp:2,cat:'milestone',desc:`With the No. 1 selection in the inaugural NBDL Draft (known today as the NBA G League), the Fayetteville Patriots selected Chris Andersen, a 6-foot-10 power forward from Blinn (Texas) Community College.`,source:'nba.com/history'},
  {date:'2001-11-01',imp:2,cat:'milestone',desc:`Pau Gasol makes his NBA debut for the Memphis Grizzlies in a 90-80 loss to the Detroit Pistons.`,source:'nba.com/history'},
  {date:'2005-11-01',imp:2,cat:'milestone',desc:`Chris Paul makes his NBA debut for the New Orleans Hornets in a 93-67 win against the Sacramento Kings.`,source:'nba.com/history'},
  {date:'2006-11-01',imp:2,cat:'milestone',desc:`Kyle Lowry makes his NBA debut for the Memphis Grizzlies in a 118-117 loss to the New York Knicks.`,source:'nba.com/history'},
  {date:'2016-11-01',imp:2,cat:'milestone',desc:`Vince Carter becomes the 24th player in NBA history to score 24,000 career points.`,source:'nba.com/history'},
  {date:'1946-11-02',imp:2,cat:'milestone',desc:`Red Auerbach made his professional coaching debut for the Washington Capitols in a 50-33 road win over the Detroit Falcons.`,source:'nba.com/history'},
  {date:'1949-11-02',imp:2,cat:'milestone',desc:`Slater Martin and Vern Mikkelsen made their debuts for the Minneapolis Lakers at the Philadelphia Warriors. The Lakers won 81-69.`,source:'nba.com/history'},
  {date:'1990-11-02',imp:2,cat:'milestone',desc:`The Golden State Warriors registered a 162-158 win over the Denver Nuggets at McNichols Arena, with the 320 points setting an NBA record for the most points scored by two teams in a non-overtime game.`,source:'nba.com/history'},
  {date:'1990-11-02',imp:2,cat:'milestone',desc:`The Phoenix Suns defeated the Utah Jazz 119-96 at the Tokyo Metropolitan Gymnasium in Japan in the first regular season game played outside North America by any major professional sports league. The teams also met the next night in Tokyo, with the Jazz winning 102-101.`,source:'nba.com/history'},
  {date:'1996-11-02',imp:2,cat:'milestone',desc:`The Heat’s Pat Riley became the eighth coach to win 800 games in Miami’s 97-95 win at Indiana. Riley accomplished this feat two weeks shy of his 15th coaching anniversary — quicker than any coach in NBA history.`,source:'nba.com/history'},
  {date:'1999-11-02',imp:2,cat:'milestone',desc:`NBA.com tipped off the 1999-2000 season at 7 p.m. (ET) with a seven-hour, live simulcast of the debut of NBA.com TV, the league’s new 24-hour television network. NBA.com also offered for the first time free Japanese-language audio broadcasts of the 1999 NBA Japan Games, featuring the Minnesota Timberwolves and the Sacramento Kings in two regular season games at the Tokyo Dome, Nov. 6 and 7. Produced at NBA Entertainment’s facility in Secaucus, N.J., NBA.com TV combines real-time statistics, scores, and news from NBA.com with live studio-based programming, real-time “look-ins” of NBA games, game highlights, vintage NBA games, NBA videos and special programming from the award-winning archives of NBA`,source:'nba.com/history'},
  {date:'1999-11-02',imp:2,cat:'milestone',desc:`LA Clippers rookie Lamar Odom scored 30 points in his NBA debut, a 104-92 loss to Seattle.`,source:'nba.com/history'},
  {date:'2005-11-02',imp:2,cat:'milestone',desc:`Los Angeles Lakers center Andrew Bynum becomes the youngest player ever to play in a regular season NBA game at 18 years, six days, breaking Jermaine O’Neal’s 10-year old record by 46 days.`,source:'nba.com/history'},
  {date:'2013-11-02',imp:2,cat:'milestone',desc:`Four-time NBA All-Star Walt Bellamy , a Hall of Famer, dies at the age of 74.`,source:'nba.com/history'},
  {date:'1948-11-03',imp:2,cat:'milestone',desc:`The Washington Capitols beat the Philadelphia Warriors 77-70, to win the first of 15 consecutive games to start the season, the best start in NBA history. The mark stood for 45 years before it was tied by the 1993-94 Houston Rockets.`,source:'nba.com/history'},
  {date:'1949-11-03',imp:2,cat:'milestone',desc:`Dolph Schayes makes his NBA debut for the Syracuse Nationals in their 78-58 win against the Denver Nuggets.`,source:'nba.com/history'},
  {date:'1951-11-03',imp:2,cat:'milestone',desc:`Neil Johnston made his debut for the Philadelphia Warriors at home against the Ft. Wayne Pistons. The Warriors won 70-69.`,source:'nba.com/history'},
  {date:'1956-11-03',imp:2,cat:'milestone',desc:`Cliff Hagan made his debut for the St. Louis Hawks at home against Syracuse. The Nationals won 75-73.`,source:'nba.com/history'},
  {date:'1962-11-03',imp:2,cat:'milestone',desc:`Wilt Chamberlain of the San Francisco Warriors scored 72 points at the Los Angeles Lakers, the fourth-highest point total in NBA history.`,source:'nba.com/history'},
  {date:'1982-11-03',imp:2,cat:'milestone',desc:`Randy Smith played in his 845th consecutive game, passing Johnny “Red” Kerr as the NBA’s All-time Iron Man. Smith would go on to play in 906 consecutive games, a streak which concluded on March 13, 1983. A.C. Green of the Dallas Mavericks broke Smith’s record when he played in his 907th consecutive game on Nov. 20, 1997.`,source:'nba.com/history'},
  {date:'1989-11-03',imp:2,cat:'milestone',desc:`Nineteen years after their inaugural home game, the Portland Trail Blazers retired Bill Walton’s jersey number 32.`,source:'nba.com/history'},
